plugins {
    id 'com.android.application'
}

android {
    namespace 'es.pokemon100.app'
    compileSdk 34

    defaultConfig {
        applicationId 'es.pokemon100.app'
        minSdk 24
        targetSdk 34
        // El número de versión crece con cada compilación de GitHub Actions para que se instale encima.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        // La clave de firma NO está en el repositorio: GitHub Actions la crea desde los secretos del repositorio
        // (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
        // Con la misma clave, cada versión nueva se instala encima de la anterior y conserva los datos.
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin secretos de firma se usa la clave de depuración (vale para probar; para actualizar hay que desinstalar).
            signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
