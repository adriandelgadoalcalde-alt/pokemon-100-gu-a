name: App Android (WebView a pantalla completa)
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar la clave de firma (secreto del repositorio, si existe)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pokemon100.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pokemon100.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin el secreto ANDROID_KEYSTORE_BASE64 el APK se firma con una clave de depuración."
          fi
      - name: Compilar y firmar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Comprobar la firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" Pokemon100.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon100-apk
          path: Pokemon100.apk
      - name: Publicar en la release «app-android»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: App Android (pantalla completa)
          body: |
            App Android que abre la guía Pokémon 100 % a pantalla completa.
            Descarga **Pokemon100.apk**, ábrelo en el móvil y permite instalar apps de este origen.
            Cada versión nueva se instala encima de la anterior y conserva tus datos.
          files: Pokemon100.apk
          make_latest: true
