name: Quality and save safety
on:
  pull_request:
  push:
    branches: [main, feat/save-evidence-engine]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: test-results/
  pkhex-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts
      - run: bash scripts/prepare-pkhex.sh
      - run: dotnet run --project pkhex-extractor/Tests/Pokemon.SaveAudit.Tests.csproj --configuration Release -- .cache/synthetic
      - run: node scripts/compare-pkhex.cjs .cache/synthetic
      - run: node scripts/test-extractor-cli.cjs .cache/synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-api-smoke-only
          path: |
            .cache/synthetic/api-smoke.json
            .cache/synthetic/container-smoke.json
