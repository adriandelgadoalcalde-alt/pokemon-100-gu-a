name: Quality and save safety
on:
  pull_request:
  push:
    branches: [main, feat/save-evidence-engine]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/update-public-coverage.py --check
      - run: python3 scripts/update-medal-names.py --check
      - run: python3 scripts/update-kalos-dex.py --check
      - run: python3 scripts/update-hoenn-dex.py --check
      - run: python3 scripts/update-alola-item-names.py --check
      - run: python3 scripts/update-alola-dex.py --check
      - run: bash scripts/prepare-pret.sh
      - run: bash scripts/prepare-pkhex.sh
      - run: python3 -I scripts/derive-gen3-semantics.py --check
      - run: python3 -I scripts/derive-event-pack.py gen4 --check
      - run: python3 -I scripts/derive-event-pack.py gen12 --check
      - run: python3 -I scripts/derive-pkhex-pack.py --check
      - run: npm run audit
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Use Ubuntu archive over HTTPS
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - run: npm run test:updates
        env:
          POKEMON_BROWSER: ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          POKEMON_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots-${{ matrix.browser }}
          path: test-results/
  pkhex-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci --ignore-scripts
      - run: bash scripts/prepare-pkhex.sh
      - run: dotnet run --project pkhex-extractor/Tests/Pokemon.SaveAudit.Tests.csproj --configuration Release -- .cache/synthetic
      - run: node scripts/compare-pkhex.cjs .cache/synthetic
      - run: node scripts/test-extractor-cli.cjs .cache/synthetic
      - run: python3 scripts/fetch-public-saves.py .cache/public-corpus
      - run: node scripts/validate-public-saves.cjs .cache/public-corpus
      - name: Use Ubuntu archive over HTTPS
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - run: node tests/core-browser.cjs .cache/public-corpus
      - run: node tests/core-browser.cjs .cache/public-corpus
        env:
          POKEMON_BROWSER: webkit
      - run: node tests/gen3-core-parity.cjs .cache/public-corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-and-public-save-regression
          path: |
            .cache/synthetic/api-smoke.json
            .cache/synthetic/container-smoke.json
            .cache/public-corpus/report.json
            .cache/public-corpus/browser-*-report.json
