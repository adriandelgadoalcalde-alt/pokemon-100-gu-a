lla Valor) te da el diploma.","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), el mismo director del Hotel Gran Lago.","phase":6,"order":605},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (sin singulares), el director del Hotel Gran Lago te da el Amuleto Iris.","phase":6,"order":610},{"id":"final-boss-cynthia","label":"Vencer a Cintia en las revanchas de la Liga de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de entrar en el Hall de la Fama. Dónde: Liga Pokémon de Sinnoh. Paso a paso: 1) Consigue la Pokédex Nacional: el Alto Mando sube de nivel y Cintia pasa a usar su equipo de revancha (niveles 74 a 78, con Garchomp a 78). 2) Vuelve a la Liga, vence a los cuatro miembros del Alto Mando y luego a Cintia. 3) Para sus equipos más fuertes, vence esa revancha y captura a Heatran: a partir de entonces las revanchas suben de nivel (Cintia, 84 a 88) y añaden Pokémon de la Pokédex Nacional. 4) Vuelve a la Liga y gana de nuevo a todos, Cintia incluida. Consejo: su Garchomp es el núcleo del equipo; lleva ataques de tipo Hielo o Hada y algo que resista Terremoto. Fuente: WikiDex «Cintia» y «Liga Pokémon (Sinnoh)»; Serebii «Elite Four» de Diamante Brillante y Perla Reluciente.","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto en la piscina del Hotel Gran Lago: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon. Dónde: piscina del Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor. Paso a paso: 1) Termina la Liga Pokémon. 2) Ve al Hotel Gran Lago y entra en la zona de la piscina: allí está Morimoto. 3) Háblale para combatir; su equipo es de nivel 63 a 65: Spiritomb, Ambipom, Hippowdon, Vaporeon, Jolteon y Flareon. 4) La primera victoria te da el Amuleto Oval, que aumenta la probabilidad de encontrar huevos en la guardería. 5) Puedes repetir el combate una vez al día. Consejo: Spiritomb lleva Baya Zidra y Mismo Destino; un Pokémon de tipo Hada fuerte encaja bien contra él, y conviene no dejarlo para el final con tu último Pokémon. Fuente: WikiDex «Shigeki Morimoto», «Amuleto Oval» y «Hotel Gran Lago».","phase":3,"order":390},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza (fin de la historia del Equipo Galaxia). Dónde: Lago Agudeza (Caverna Agudeza) (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza (al norte de Ciudad Puntaneva). Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza: visita la Caverna Veraz del Lago Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj y usa Mal de Ojo o la Master Ball. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza. Dónde: Lago Valor (Caverna Valor) (nivel 50). Cómo: Caverna Valor, en el Lago Valor (Surf). Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en la Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (4) (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (03) (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (6) (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-484","label":"Registrar a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columnas Lanza (2) (nivel 47). Cómo: Columna Lanza: tras vencer a los comandantes y a Helio, Palkia aparece. Consejo: Palkia nivel 47. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Un Superconcurso rango Maestro (sin categoría especial)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por ganar un Superconcurso de rango Maestro en cualquier categoría (Sala de Concursos de Ciudad Corazón).","phase":6,"order":620},{"id":"card-3","label":"100 variantes de estatua en Gran Subsuelo","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por colocar 100 variantes de estatua en tu base secreta del Gran Subsuelo (las estatuas se excavan en las paredes del Subsuelo).","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: después de la Liga, cuando la ficha de entrenador llega a sus cinco estrellas (color negro). Dónde: cualquier Centro Pokémon de Sinnoh. Paso a paso: 1) Sube estrellas en la ficha de entrenador; cada una se gana con un logro y en cualquier orden: completar la Liga Pokémon, ganar una Gala Superconcurso de nivel experto de cualquier categoría, completar la Pokédex Nacional (482 Pokémon, sin contar los singulares y algunos legendarios), conseguir 100 victorias en la Torre Batalla y conseguir 100 estatuas diferentes en las Grutas del Subsuelo. 2) Consulta la ficha de entrenador: cambia a bronce, plata, oro y negro con las estrellas. 3) Con las cinco, entra en un Centro Pokémon: la enfermera Joy se sorprende al ver tu ficha y desde entonces cura a tu equipo sin decir nada (salvo si detecta Pokérus). Consejo: la Torre Batalla y las estatuas del Subsuelo son lo más largo; empieza por ellas tras la Liga. Fuente: WikiDex «Ficha de entrenador».","phase":6,"order":690},{"id":"event-0","label":"Darkrai, Shaymin y Arceus: eventos/objetos y partidas compatibles según requisitos","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Darkrai (Isla Lunanueva, Carné Socio), Shaymin (Paraíso Flor, Carta de Oak) y Arceus (Columnas Lanza, Flauta Azur) piden objetos de evento o tener partidas de Espada/Escudo y Leyendas Arceus en la consola. Con Pokekeep: Añade el objeto clave del evento (Carné Socio, Carta de Oak o Flauta Azur) para jugarlo, o el singular legal desde la Librería.","phase":7,"order":700}],"ARCEUS":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar solicitudes y la investigación final del Pokémon Alfa","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras los créditos: encomiendas de las tablas (Heatran, Cresselia, Regigigas…), peticiones finales (Giratina, avatares de Hisui con Enamorus) e investigación de Arceus.","phase":2,"order":200},{"id":"battle0","label":"Derrotar a Volus y superar desafíos de combate posteriores","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras los créditos, la encomienda final con Volus en el Templo de Sinnoh: véncelo a él y a Giratina.","phase":3,"order":300},{"id":"items0","label":"Tabla de Arceus y objetos únicos del conflicto Dialga/Palkia","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Las tablas de Arceus se consiguen en las encomiendas posteriores a los créditos; las placas de cada señor y los objetos de Dialga/Palkia, durante la historia.","phase":1,"order":120},{"id":"pokedex","label":"Completar la Pokédex de Hisui y alcanzar las condiciones de Arceus","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Registra todas las especies de la Pokédex de Hisui y completa sus tareas de investigación; con todo capturado, Arceus te espera en el Templo de Sinnoh.","phase":5,"order":500},{"id":"pokemon-483","label":"Registrar a Dialga en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":483,"auto":null,"how":"Cuándo: Encomienda 17 de la historia (si apoyas al Clan Diamante) o la 18. Dónde: Templo de Sinnoh (nivel 65). Cómo: Templo de Sinnoh, en el Monte Corona. Consejo: Dialga nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"pokemon-484","label":"Registrar a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Encomienda 17 de la historia (si apoyas al Clan Perla) o la 18. Dónde: Templo de Sinnoh (nivel 65). Cómo: Templo de Sinnoh, en el Monte Corona. Consejo: Palkia nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Tras los créditos: petición 91. Dónde: Cueva Retorno (nivel 70). Cómo: Cueva Retorno, en la Ladera Corona. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Tras los créditos: encomienda «La tabla de la isla escupefuego». Dónde: Altar Domo Lava (nivel 70). Cómo: Altar Domo Lava, en el Litoral Cobalto. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Tras los créditos: encomienda 24. Dónde: Templo Puntaneva (nivel 70). Cómo: Templo Puntaneva, en la Tundra Alba. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":222},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Tras los créditos: encomienda «La tabla de la Arena de la Luna». Dónde: Arena de la Luna (nivel 70); Ladera Corona (nivel 70). Cómo: Arena de la Luna, en la Ladera Corona. Consejo: Cresselia nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":221},{"id":"pokemon-905","label":"Registrar a Enamorus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":905,"auto":null,"how":"Cuándo: Tras capturar a Tornadus, Thundurus y Landorus (petición 94: Los avatares de Hisui). Dónde: Ciénaga Bermeja (nivel 70); Pantanal Carmesí (nivel 70); Ladera Derrumbe (nivel 70). Cómo: Ciénaga Bermeja, en el Pantanal Carmesí. Consejo: Enamorus nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-493","label":"Registrar a Arceus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":493,"auto":null,"how":"Cuándo: Con todas las especies de la Pokédex de Hisui capturadas. Dónde: Templo de Sinnoh (nivel 75). Cómo: Templo de Sinnoh: combate contra Arceus en la encomienda final. Consejo: Arceus nivel 75. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":290},{"id":"medal-type","label":"Rango 10★ de investigación (60.000 puntos)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: a lo largo de toda la partida; el rango 10★ suele llegar al final de la historia o después. Dónde: Villa Jubileo (Sede Galaxia) y los campamentos de cada zona. Paso a paso: 1) Completa tareas de investigación de la Pokédex: capturar, derrotar, ver movimientos, dar comida, evolucionar… Cada tarea da 10 puntos, las marcadas en rojo dan 20 y una entrada completa (nivel de investigación 10) da 100. 2) Habla con el profesor Lavender en un campamento para que evalúe tus avances y sume los puntos. 3) Cuando tengas puntos suficientes, habla con Selena en Villa Jubileo para ascender de rango. 4) El rango 9★ pide 30.000 puntos y el 10★, 60.000. Desde el 7★ ya te obedecen los Pokémon de cualquier nivel. Consejo: las entradas fáciles de subir a nivel 10 (Pokémon comunes con tareas sencillas) son la forma más rápida de sumar puntos. Fuente: Serebii «Pokédex Rank»; WikiDex «Selena».","phase":6,"order":600},{"id":"recognition-2","label":"Amuleto Iris al completar la Pokédex de Hisui (Villa Jubileo)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con todas las especies de la Pokédex de Hisui capturadas y sus entradas al menos al nivel 10 de investigación (Phione, Manaphy y Arceus incluidos; Darkrai y Shaymin no cuentan), el profesor Lavender te da el Amuleto Iris en la Sede Galaxia de Villa Jubileo.","phase":6,"order":610},{"id":"event-0","label":"Manaphy, Phione, Shaymin y Darkrai: requisitos particulares y datos de otras partidas cuando corresponda","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Manaphy y Phione están en el juego; Shaymin y Darkrai piden tener partidas guardadas de Espada/Escudo y de Diamante Brillante/Perla Reluciente en la consola. Con Pokekeep: Añade Shaymin o Darkrai legales desde la Librería si no tienes esas partidas.","phase":7,"order":700},{"id":"wisps","label":"Reunir los 107 fuegos fatuos de Spiritomb","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que Alma te encarga la petición 22, «Volutas de luz nocturna», durante la historia. Dónde: Alma está en Villa Jubileo; las 107 volutas están repartidas por Villa Jubileo, la Pradera Obsidiana, el Pantanal Carmesí, la Costa Cobalto, la Ladera Corona y la Tundra Alba. Paso a paso: 1) Habla con Alma para aceptar la petición. 2) Recorre cada zona y toca las volutas (se ven mejor de noche, a veces en lugares poco obvios). 3) Vuelve con Alma para recoger sus premios: con 5, 10, 20 y después cada 10 hasta 100. 4) Con las 107, ve de noche a las Ruinas de la Niebla del Pantanal Carmesí: Alma te da la última y, al acercarte a la Piedra Espíritu, aparece Spiritomb de nivel 60 para combatir y capturarlo. Consejo: usa una lista de ubicaciones por zona y comprueba en el mapa cuántas llevas en cada una. Fuente: WikiDex «Lista de peticiones de Leyendas Pokémon: Arceus»; Serebii «Spiritomb Wisps».","fact":"collection.la.wisps","phase":4,"order":420},{"id":"unown","label":"Capturar las 28 formas de Unown","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Encuentra los 28 Unown repartidos por Hisui (petición «Unown misteriosos»): cada uno en un lugar concreto, algunos de noche o con Poké Ride.","phase":4,"order":410},{"id":"requests","label":"Completar las 122 peticiones de Hisui (94 del juego base y 28 del Despertar de la versión 1.1)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: desde el principio de la historia hasta después de los créditos; las peticiones 95 a 122 llegan con la actualización gratuita «El despertar de Hisui» (versión 1.1). Dónde: Villa Jubileo (pizarra de Lavender en la Sede Galaxia y vecinos del pueblo) y los campamentos de cada zona. Paso a paso: 1) Actualiza el juego a la versión 1.1 o posterior. 2) Revisa la lista de peticiones en el menú para ver las pendientes y quién las da. 3) Habla con cada vecino o miembro del Equipo Galaxia que tenga una petición y cumple el encargo (capturar o enseñar un Pokémon, entregar objetos, combatir…). 4) Entrega cada una para cobrar la recompensa. 5) Termina las 94 del juego base y las 28 de «El despertar de Hisui», que incluyen las vías solitarias de Fero (108-122). Consejo: muchas peticiones se desbloquean al avanzar en la historia o al completar otra anterior; si falta alguna, avanza la trama. Fuente: WikiDex «Lista de peticiones de Leyendas Pokémon: Arceus».","phase":2,"order":210},{"id":"ingo","label":"Superar las 15 vías solitarias de Fero en el Dojo de Villa Jubileo (peticiones 108-122)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras instalar la actualización gratuita «El despertar de Hisui» (versión 1.1). Dónde: dojo de Villa Jubileo, donde están Garret, de la división de seguridad, y Fero. Paso a paso: 1) Habla con Garret para recibir las peticiones de vía solitaria (108 a 122). 2) Para cada petición, lleva en el equipo solo el Pokémon indicado: Bidoof, Eevee, Wormadam, Abra, Blissey, Sneasel, Rotom, Bastiodon, Roselia, Magikarp, Roserade, Kleavor, Lilligant, Wurmple y Kricketot. 3) Habla con Fero para empezar la vía solitaria. 4) Gana con ese único Pokémon y vuelve a Garret para entregar la petición: cada una da una Semilla dominio y 10 Caramelos Experiencia S. Consejo: algunos rivales son muy duros para un solo Pokémon (en la de Magikarp, por ejemplo, un Electrode de Hisui de nivel 50 usa Explosión); súbelo de nivel y usa las Semillas dominio para que domine movimientos. Fuente: WikiDex «Lista de peticiones de Leyendas Pokémon: Arceus»; Serebii «Ingo's Battles».","phase":3,"order":310}],"SCARLET":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar Área Cero, revanchas y el contenido de las dos expansiones","category":"Postgame","tier":0,"species":null,"auto":null,"how":"La historia de Paldea acaba en el Área Cero (Travesía de la victoria, Senda legendaria y Vía Stardust deben estar hechas; la última historia, Camino a casa, baja al Área Cero). Después: Gran Pugna Académica (repetible), revanchas de líderes y, con los DLC, La máscara turquesa (Noroteo) y El disco índigo (Academia Arándano), en ese orden, más el epílogo de Pecharunt.","phase":2,"order":200},{"id":"battle0","label":"Ganar la Gran Pugna Académica (se desbloquea tras la historia de Paldea)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras acabar la historia, vuelve a vencer a los ocho líderes de gimnasio (revanchas) y habla con la recepcionista del estadio de la Academia: es un torneo de eliminación en combates individuales contra alumnos, profesores, líderes y el Alto Mando, con Mencía en la final. Si pierdes, puedes reintentarlo. Cómo lo sabe la guía: al ganarla por primera vez te llama Cinio («Enhorabuena por salir victorioso en la Gran Pugna Académica») y te pide investigar teraincursiones; esa misión deja en la partida el sondeo de 4★ (FSYS_RAID_DIFFICTLTY4_SURVEY), y la siguiente el de 6★ y su desbloqueo. Cualquiera de ellos prueba la victoria (textos del juego y scripts Lua; Serebii «Tera Raid Battles»). Si ganaste y aún no te ha llamado, la guía no puede confirmarlo hasta la llamada.","phase":3,"order":300},{"id":"items0","label":"Recuperar las máscaras Cimiento, Fuente y Horno de Ogerpon (La máscara turquesa)","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «La máscara turquesa» (primera parte de «El tesoro oculto del Área Cero»). Dónde: Noroteo. Paso a paso: 1) Avanza la historia hasta el enfrentamiento en la Gruta del Pavor: los compatrones Okidogi, Munkidori y Fezandipiti huyen con las máscaras de Ogerpon. 2) Pregunta en Villa Versui por su paradero y búscalos en el orden que quieras, con la ayuda de Corin: Okidogi enorme en el Elíseo Baldío (Máscara Cimiento), Munkidori enorme en la Laguna Glicina (Máscara Fuente) y Fezandipiti enorme junto a la Cueva Aguafría (Máscara Horno). 3) Vence a cada uno: al huir deja caer su máscara y Ogerpon la recoge. 4) Con las tres, vuelve a la villa y completa la historia: Ogerpon te reta usando todas sus máscaras y después puedes capturarlo. 5) Si Ogerpon lleva equipada una máscara, cambia de tipo: Cimiento, Roca; Fuente, Agua; Horno, Fuego (además de Planta). Consejo: Ogerpon sin otra máscara equipada mantiene su forma Máscara Turquesa. Fuente: WikiDex, guía «En busca de las máscaras» y «Ogerpon».","phase":1,"order":150},{"id":"pokedex","label":"Completar Pokédex de Paldea, Noroteo y Arándano cuando corresponda","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Paldea (y, con los DLC, la de Noroteo y la de Arándano). Con la de Paldea completa, el director Clavel te da el diploma en la Academia; las de los DLC tienen el suyo. Con Pokekeep: Las exclusivas de la otra edición, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"pokemon-1001","label":"Registrar a Wo-Chien en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1001,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Área 1 (Sur) (nivel 60). Cómo: Arranca las 8 estacas del sello morado: Área 3 del sur, Área 4 del sur, tres en el Área 5 del sur, Área 1 del sur y dos en el Área 1 del este. Luego abre el Santuario Mustiarbor (Área 1 del sur). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Wo-Chien nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-1002","label":"Registrar a Chien-Pao en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1002,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Área 1 (Oeste) (1) (nivel 60). Cómo: Arranca las 8 estacas del sello naranja: Ciudad Cántara, cuatro en el Área 1 del oeste, Área 2 del sur, Área 6 del sur y Área 4 del sur. Luego abre el Santuario Glaceratio (Área 1 del oeste). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Chien-Pao nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-1003","label":"Registrar a Ting-Lu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1003,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Alameda Socarrada (nivel 60). Cómo: Arranca las 8 estacas del sello verde: Alameda Socarrada, cuatro en el Lago Cazola, dos en el Área 2 del oeste y una en el Área 3 del oeste. Luego abre el Santuario Detriterra (Alameda Socarrada). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Ting-Lu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-1004","label":"Registrar a Chi-Yu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1004,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Área 2 (Norte) (nivel 60). Cómo: Arranca las 8 estacas del sello azul: Sierra Napada, tres en el Área 1 del norte, tres en el Área 2 del norte y una en el Área 2 del este. Luego abre el Santuario Devastigneus (Área 2 del norte). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Chi-Yu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-1007","label":"Registrar a Koraidon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1007,"auto":null,"how":"Cuándo: Tras los créditos de la historia. Dónde: Sendero de Cahíz (nivel 68); Área Cero (5) (nivel 72). Cómo: Durante el combate final en el Laboratorio Cero se une a ti; tras los créditos, un segundo Koraidon aparece en el Área Cero para capturarlo. Consejo: Koraidon nivel 72. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":200},{"id":"pokemon-1017","label":"Registrar a Ogerpon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1017,"auto":null,"how":"Cuándo: Historia de La máscara turquesa (DLC). Dónde: Gruta del Pavor (nivel 70); Gruta del Pavor (nivel 20). Cómo: Gruta del Pavor, en el monte de Noroteo: el combate final del DLC. Consejo: Ogerpon nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-1024","label":"Registrar a Terapagos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1024,"auto":null,"how":"Cuándo: Final de El disco índigo (DLC). Dónde: Caverna Abisal Cero (2) (nivel 85). Cómo: Caverna Abisal Cero, bajo el Área Cero: combate final del DLC. Consejo: Terapagos nivel 85. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"dlc-ogerpon","label":"Completar La máscara turquesa y las misiones de Ogerpon","category":"Postgame","tier":0,"species":null,"auto":null,"how":"La máscara turquesa: viaje escolar a Noroteo; sigue la historia de Ogerpon, recupera las máscaras de los Leales y vence a Ogerpon en la Gruta del Pavor.","phase":2,"order":230},{"id":"dlc-terapagos","label":"Completar El disco índigo y las misiones de Terapagos","category":"Postgame","tier":0,"species":null,"auto":null,"how":"El disco índigo: intercambio con la Academia Arándano; vence al Alto Mando y al campeón de la Liga Arándano y baja a la Caverna Abisal Cero con Terapagos.","phase":2,"order":250},{"id":"pecharunt","label":"Completar epílogo de Pecharunt activado con Baya Meloc singular","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Epílogo Misterio Mochi: tras El disco índigo, recibe la Baya Meloc singular (Regalo Misterioso) y llévala a Noroteo; al final se captura Pecharunt. Con Pokekeep: Si no tienes la Baya Meloc singular, añádela a la mochila (objeto clave) para activar el epílogo.","phase":2,"order":260},{"id":"diploma-regional","label":"Diploma de la Pokédex de Paldea (director Clavel, al completarla)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tengas capturadas todas las especies de la Pokédex de Paldea, normalmente después de la historia. Dónde: Academia Naranja (Escarlata) o Academia Uva (Púrpura), en Ciudad Meseta: el laboratorio de Biología de Cinio y el director Clavel. Paso a paso: 1) Registra como capturadas las 400 especies de la Pokédex de Paldea. 2) Ve al laboratorio de Biología y habla con Cinio: te felicita y te da el Amuleto Iris. 3) El director Clavel te entrega el diploma de la Pokédex de Paldea. 4) Las Pokédex de Noroteo («La máscara turquesa») y de la Academia Arándano («El disco índigo») se completan aparte; al completar la de Arándano, el director Mirtilo te da el Amuleto Emblema. Consejo: las exclusivas de la otra versión llegan por intercambio en línea o por teraincursiones con otros jugadores. Fuente: WikiDex, guía de Escarlata y Púrpura «Camino a casa» y «Amuleto Emblema».","phase":6,"order":612},{"id":"medal-type","label":"Amuleto Iris: 400 Pokémon capturados en la Pokédex de Paldea (Cinio, laboratorio de Biología de la Academia)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: poco a poco durante toda la partida; el último premio, con la Pokédex de Paldea completa. Dónde: laboratorio de Biología de la Academia Naranja (Escarlata) o de la Academia Uva (Púrpura), en Ciudad Meseta, con Cinio. Paso a paso: 1) Captura Pokémon y vuelve a hablar con Cinio al llegar a cada hito. 2) Con 30 entradas te da la MT057 (Falso tortazo); con 100, 20 Ultra Balls; con 200, 20 Veloz Balls. 3) Completa las 400 especies de la Pokédex de Paldea, incluidas las exclusivas de la otra versión. 4) Habla con Cinio: te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor; el director Clavel te da además el diploma. Consejo: las especies que evolucionan por intercambio o con objeto se registran al evolucionarlas, sin tener que encontrarlas en estado salvaje. Fuente: WikiDex, guía de Escarlata y Púrpura «Camino a casa» y «Amuleto Iris».","phase":6,"order":617},{"id":"event-0","label":"Pecharunt: epílogo del DLC y Regalo Misterioso exigido para activarlo","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"El epílogo de Pecharunt necesita la Baya Meloc singular, que solo llegó por Regalo Misterioso. Con Pokekeep: Añade la Baya Meloc singular a la mochila para activar el epílogo, o Pecharunt legal desde la Librería.","phase":7,"order":700},{"id":"pokemon-1014","label":"Registrar a Okidogi en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1014,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Elíseo Baldío (nivel 70). Cómo: Elíseo Baldío, al noroeste de Noroteo. Consejo: Okidogi nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-1015","label":"Registrar a Munkidori en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1015,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Pradera Glicina (nivel 70). Cómo: Pradera Glicina, junto a la Laguna Glicina. Consejo: Munkidori nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":236},{"id":"pokemon-1016","label":"Registrar a Fezandipiti en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1016,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Monte Ogro (1) (nivel 70). Cómo: Monte Ogro, junto al acceso a la Cueva Aguafría. Consejo: Fezandipiti nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":237},{"id":"ogre-oustin","label":"Superar «Ogre Oustin'» (el minijuego de los ogros de Noroteo) en difícil (10 fases)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: en el DLC «La máscara turquesa» (primera parte de «El tesoro oculto del Área Cero»). Dónde: Centro cultural de Noroteo, en Villa Versui. Paso a paso: 1) Habla en el centro cultural para jugar al Juego del Cazaogros; se puede jugar solo o en grupo. 2) Hay tres dificultades: fácil (3 niveles), normal (6) y difícil (10). 3) En cada nivel tienes 120 segundos: revienta los ogros de cuatro colores para sacar bayas y llévalas a las peanas del color correspondiente hasta llenar lo que piden los marcadores; puedes cargar hasta 30 bayas, y con Koraidon o Miraidon ahuyentas a los Skwovet, Greedent, Munchlax y Snorlax que intentan robarlas. 4) Supera por primera vez los 10 niveles del difícil: recibes un Munchlax variocolor con el Emblema Astucia, además de los mochis de cada nivel. Consejo: la primera partida ya te da el Amuleto Experiencia; en grupo es más fácil llenar las peanas. Fuente: WikiDex «Juego del Cazaogros».","phase":2,"order":235},{"id":"flying-trial","label":"Superar el vuelo contrarreloj de Nerina en sus cuatro niveles (El disco índigo)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»), como prueba de Nerina; el recorrido más difícil, tras la historia. Dónde: Plaza Escarpada, en el Área Escarpada del Biodomo de la Academia Arándano. Paso a paso: 1) Habla con Nerina para hacer su prueba del Alto Mando: un vuelo contrarreloj con Koraidon o Miraidon atravesando aros. 2) Supéralo para poder retarla. 3) Después puedes repetir el vuelo en sus recorridos: fácil (50 PA la primera vez), normal (100 PA) y difícil (200 PA). 4) Tras vencer a Cass y capturar a Terapagos, habla con Nerina en la Sala del Club de la Liga: con el difícil superado, te abre el recorrido más difícil (500 PA la primera vez). Supera los cuatro. Consejo: el contador baja sin parar y cada aro suma segundos (los pequeños azules más que los grandes naranjas); aprende el recorrido antes de ir a por el tiempo. Fuente: WikiDex «Plaza Escarpada» y «Punto arándano»; Serebii «Flying Time Trial».","phase":2,"order":255},{"id":"perrin","label":"Fotos de Gama: los Pokémon paradoja del Área Cero","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: en el DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»), tras haber terminado la historia de Gama y Ursaluna Luna Carmesí en «La máscara turquesa». Dónde: Biodomo de la Academia Arándano, donde ahora trabaja Gama, y el Área Cero de Paldea. Paso a paso: 1) Busca a Gama en el Biodomo: te dirá que tiene pistas de unos Pokémon misteriosos. 2) Registra 200 Pokémon en la Pokédex de Arándano y vuelve a hablarle: te enseña fotos con pistas de dónde están los nuevos Pokémon paradoja. 3) Ve al Área Cero y búscalos en los lugares de las fotos: Electrofuria y Flamariete en Escarlata, Ferrotesta y Ferromole en Púrpura (nivel 75). 4) Captúralos y vuelve a enseñárselos a Gama. Consejo: si Gama no aparece, comprueba que terminaste su historia de «La máscara turquesa». Fuente: Serebii «Perrin & The Paradox Pokémon»; WikiDex, guía «El misterio de la Luna Carmesí».","phase":2,"order":262},{"id":"blueberry-league","label":"Vencer al Alto Mando y al campeón de la Liga Arándano","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»). Dónde: Academia Arándano (Sala del Club de la Liga) y su Biodomo, donde está cada miembro del Alto Mando. Paso a paso: 1) Inscríbete en la Liga Arándano. 2) Busca a los cuatro miembros del Alto Mando en el orden que quieras: Denis (Fuego), Nerina (Acero), Aroa (Hada) y Levi (Dragón). 3) Supera la prueba de cada uno y después gánale el combate: con Denis, cocinar un bocadillo extrapicante; con Nerina, el vuelo contrarreloj; con Aroa, un cuestionario sobre Pokémon; con Levi, los Combates Biodómicos. 4) Con los cuatro vencidos, te enfrentas al campeón de la Liga Arándano, Cass. 5) Gánale para convertirte en el nuevo campeón. Consejo: los combates contra el Alto Mando son dobles; prepara un equipo pensado para ese formato. Fuente: WikiDex «Liga Arándano» y guía de Escarlata y Púrpura «Liga Arándano».","phase":3,"order":320}],"VIOLET":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","la ria. Dónde: Área 1 (Oeste) (1) (nivel 60). Cómo: Arranca las 8 estacas del sello naranja: Ciudad Cántara, cuatro en el Área 1 del oeste, Área 2 del sur, Área 6 del sur y Área 4 del sur. Luego abre el Santuario Glaceratio (Área 1 del oeste). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Chien-Pao nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-1003","label":"Registrar a Ting-Lu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1003,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Alameda Socarrada (nivel 60). Cómo: Arranca las 8 estacas del sello verde: Alameda Socarrada, cuatro en el Lago Cazola, dos en el Área 2 del oeste y una en el Área 3 del oeste. Luego abre el Santuario Detriterra (Alameda Socarrada). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Ting-Lu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-1004","label":"Registrar a Chi-Yu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1004,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Área 2 (Norte) (nivel 60). Cómo: Arranca las 8 estacas del sello azul: Sierra Napada, tres en el Área 1 del norte, tres en el Área 2 del norte y una en el Área 2 del este. Luego abre el Santuario Devastigneus (Área 2 del norte). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Chi-Yu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-1008","label":"Registrar a Miraidon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1008,"auto":null,"how":"Cuándo: Tras los créditos de la historia. Dónde: Sendero de Cahíz (nivel 68); Área Cero (5) (nivel 72). Cómo: Durante el combate final en el Laboratorio Cero se une a ti; tras los créditos, un segundo Miraidon aparece en el Área Cero para capturarlo. Consejo: Miraidon nivel 72. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":200},{"id":"pokemon-1017","label":"Registrar a Ogerpon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1017,"auto":null,"how":"Cuándo: Historia de La máscara turquesa (DLC). Dónde: Gruta del Pavor (nivel 70); Gruta del Pavor (nivel 20). Cómo: Gruta del Pavor, en el monte de Noroteo: el combate final del DLC. Consejo: Ogerpon nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-1024","label":"Registrar a Terapagos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1024,"auto":null,"how":"Cuándo: Final de El disco índigo (DLC). Dónde: Caverna Abisal Cero (2) (nivel 85). Cómo: Caverna Abisal Cero, bajo el Área Cero: combate final del DLC. Consejo: Terapagos nivel 85. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"dlc-ogerpon","label":"Completar La máscara turquesa y las misiones de Ogerpon","category":"Postgame","tier":0,"species":null,"auto":null,"how":"La máscara turquesa: viaje escolar a Noroteo; sigue la historia de Ogerpon, recupera las máscaras de los Leales y vence a Ogerpon en la Gruta del Pavor.","phase":2,"order":230},{"id":"dlc-terapagos","label":"Completar El disco índigo y las misiones de Terapagos","category":"Postgame","tier":0,"species":null,"auto":null,"how":"El disco índigo: intercambio con la Academia Arándano; vence al Alto Mando y al campeón de la Liga Arándano y baja a la Caverna Abisal Cero con Terapagos.","phase":2,"order":250},{"id":"pecharunt","label":"Completar epílogo de Pecharunt activado con Baya Meloc singular","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Epílogo Misterio Mochi: tras El disco índigo, recibe la Baya Meloc singular (Regalo Misterioso) y llévala a Noroteo; al final se captura Pecharunt. Con Pokekeep: Si no tienes la Baya Meloc singular, añádela a la mochila (objeto clave) para activar el epílogo.","phase":2,"order":260},{"id":"diploma-regional","label":"Diploma de la Pokédex de Paldea (director Clavel, al completarla)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tengas capturadas todas las especies de la Pokédex de Paldea, normalmente después de la historia. Dónde: Academia Naranja (Escarlata) o Academia Uva (Púrpura), en Ciudad Meseta: el laboratorio de Biología de Cinio y el director Clavel. Paso a paso: 1) Registra como capturadas las 400 especies de la Pokédex de Paldea. 2) Ve al laboratorio de Biología y habla con Cinio: te felicita y te da el Amuleto Iris. 3) El director Clavel te entrega el diploma de la Pokédex de Paldea. 4) Las Pokédex de Noroteo («La máscara turquesa») y de la Academia Arándano («El disco índigo») se completan aparte; al completar la de Arándano, el director Mirtilo te da el Amuleto Emblema. Consejo: las exclusivas de la otra versión llegan por intercambio en línea o por teraincursiones con otros jugadores. Fuente: WikiDex, guía de Escarlata y Púrpura «Camino a casa» y «Amuleto Emblema».","phase":6,"order":612},{"id":"medal-type","label":"Amuleto Iris: 400 Pokémon capturados en la Pokédex de Paldea (Cinio, laboratorio de Biología de la Academia)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: poco a poco durante toda la partida; el último premio, con la Pokédex de Paldea completa. Dónde: laboratorio de Biología de la Academia Naranja (Escarlata) o de la Academia Uva (Púrpura), en Ciudad Meseta, con Cinio. Paso a paso: 1) Captura Pokémon y vuelve a hablar con Cinio al llegar a cada hito. 2) Con 30 entradas te da la MT057 (Falso tortazo); con 100, 20 Ultra Balls; con 200, 20 Veloz Balls. 3) Completa las 400 especies de la Pokédex de Paldea, incluidas las exclusivas de la otra versión. 4) Habla con Cinio: te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor; el director Clavel te da además el diploma. Consejo: las especies que evolucionan por intercambio o con objeto se registran al evolucionarlas, sin tener que encontrarlas en estado salvaje. Fuente: WikiDex, guía de Escarlata y Púrpura «Camino a casa» y «Amuleto Iris».","phase":6,"order":617},{"id":"event-0","label":"Pecharunt: epílogo del DLC y Regalo Misterioso exigido para activarlo","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"El epílogo de Pecharunt necesita la Baya Meloc singular, que solo llegó por Regalo Misterioso. Con Pokekeep: Añade la Baya Meloc singular a la mochila para activar el epílogo, o Pecharunt legal desde la Librería.","phase":7,"order":700},{"id":"pokemon-1014","label":"Registrar a Okidogi en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1014,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Elíseo Baldío (nivel 70). Cómo: Elíseo Baldío, al noroeste de Noroteo. Consejo: Okidogi nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-1015","label":"Registrar a Munkidori en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1015,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Pradera Glicina (nivel 70). Cómo: Pradera Glicina, junto a la Laguna Glicina. Consejo: Munkidori nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":236},{"id":"pokemon-1016","label":"Registrar a Fezandipiti en la Pokédex de esta partida (DLC La máscara turquesa)","category":"Legendarios","tier":1,"species":1016,"auto":null,"how":"Cuándo: Tras completar la historia de La máscara turquesa. Dónde: Monte Ogro (1) (nivel 70). Cómo: Monte Ogro, junto al acceso a la Cueva Aguafría. Consejo: Fezandipiti nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":237},{"id":"ogre-oustin","label":"Superar «Ogre Oustin'» (el minijuego de los ogros de Noroteo) en difícil (10 fases)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: en el DLC «La máscara turquesa» (primera parte de «El tesoro oculto del Área Cero»). Dónde: Centro cultural de Noroteo, en Villa Versui. Paso a paso: 1) Habla en el centro cultural para jugar al Juego del Cazaogros; se puede jugar solo o en grupo. 2) Hay tres dificultades: fácil (3 niveles), normal (6) y difícil (10). 3) En cada nivel tienes 120 segundos: revienta los ogros de cuatro colores para sacar bayas y llévalas a las peanas del color correspondiente hasta llenar lo que piden los marcadores; puedes cargar hasta 30 bayas, y con Koraidon o Miraidon ahuyentas a los Skwovet, Greedent, Munchlax y Snorlax que intentan robarlas. 4) Supera por primera vez los 10 niveles del difícil: recibes un Munchlax variocolor con el Emblema Astucia, además de los mochis de cada nivel. Consejo: la primera partida ya te da el Amuleto Experiencia; en grupo es más fácil llenar las peanas. Fuente: WikiDex «Juego del Cazaogros».","phase":2,"order":235},{"id":"flying-trial","label":"Superar el vuelo contrarreloj de Nerina en sus cuatro niveles (El disco índigo)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»), como prueba de Nerina; el recorrido más difícil, tras la historia. Dónde: Plaza Escarpada, en el Área Escarpada del Biodomo de la Academia Arándano. Paso a paso: 1) Habla con Nerina para hacer su prueba del Alto Mando: un vuelo contrarreloj con Koraidon o Miraidon atravesando aros. 2) Supéralo para poder retarla. 3) Después puedes repetir el vuelo en sus recorridos: fácil (50 PA la primera vez), normal (100 PA) y difícil (200 PA). 4) Tras vencer a Cass y capturar a Terapagos, habla con Nerina en la Sala del Club de la Liga: con el difícil superado, te abre el recorrido más difícil (500 PA la primera vez). Supera los cuatro. Consejo: el contador baja sin parar y cada aro suma segundos (los pequeños azules más que los grandes naranjas); aprende el recorrido antes de ir a por el tiempo. Fuente: WikiDex «Plaza Escarpada» y «Punto arándano»; Serebii «Flying Time Trial».","phase":2,"order":255},{"id":"perrin","label":"Fotos de Gama: los Pokémon paradoja del Área Cero","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: en el DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»), tras haber terminado la historia de Gama y Ursaluna Luna Carmesí en «La máscara turquesa». Dónde: Biodomo de la Academia Arándano, donde ahora trabaja Gama, y el Área Cero de Paldea. Paso a paso: 1) Busca a Gama en el Biodomo: te dirá que tiene pistas de unos Pokémon misteriosos. 2) Registra 200 Pokémon en la Pokédex de Arándano y vuelve a hablarle: te enseña fotos con pistas de dónde están los nuevos Pokémon paradoja. 3) Ve al Área Cero y búscalos en los lugares de las fotos: Electrofuria y Flamariete en Escarlata, Ferrotesta y Ferromole en Púrpura (nivel 75). 4) Captúralos y vuelve a enseñárselos a Gama. Consejo: si Gama no aparece, comprueba que terminaste su historia de «La máscara turquesa». Fuente: Serebii «Perrin & The Paradox Pokémon»; WikiDex, guía «El misterio de la Luna Carmesí».","phase":2,"order":262},{"id":"blueberry-league","label":"Vencer al Alto Mando y al campeón de la Liga Arándano","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «El disco índigo» (segunda parte de «El tesoro oculto del Área Cero»). Dónde: Academia Arándano (Sala del Club de la Liga) y su Biodomo, donde está cada miembro del Alto Mando. Paso a paso: 1) Inscríbete en la Liga Arándano. 2) Busca a los cuatro miembros del Alto Mando en el orden que quieras: Denis (Fuego), Nerina (Acero), Aroa (Hada) y Levi (Dragón). 3) Supera la prueba de cada uno y después gánale el combate: con Denis, cocinar un bocadillo extrapicante; con Nerina, el vuelo contrarreloj; con Aroa, un cuestionario sobre Pokémon; con Levi, los Combates Biodómicos. 4) Con los cuatro vencidos, te enfrentas al campeón de la Liga Arándano, Cass. 5) Gánale para convertirte en el nuevo campeón. Consejo: los combates contra el Alto Mando son dobles; prepara un equipo pensado para ese formato. Fuente: WikiDex «Liga Arándano» y guía de Escarlata y Púrpura «Liga Arándano».","phase":3,"order":320}],"ZA":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Superar misiones principales 38–42, Juegos Z-A Infinitos y la historia de Megadimensión si está adquirida","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la historia: misiones principales 38-42 (Zygarde), los Juegos Z-A infinitos y, con el DLC, Megadimensión.","phase":2,"order":200},{"id":"battle0","label":"Juegos Z-A infinitos: superar los 15 combates de recompensa y vencer a tu rival (Floette flor eterna de A. Z.)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de terminar la historia principal y ver los créditos. Dónde: Ciudad Luminalia; zonas de combate nocturnas y sede de Quastelar S. A. Paso a paso: 1) Tras la historia, el deseo pedido a Quastelar S. A. convierte los Juegos Z-A en los Juegos Z-A infinitos: hay tres zonas de combate nocturnas y los Cupones Desafío sirven para combates de recompensa. 2) Gana combates en las zonas de combate para reunir puntos y Cupones Desafío. 3) Disputa los combates de recompensa; tras 15 de ellos te toca combatir contra Urbi o Muni (tu rival, según el personaje que elijas). 4) Al ganarle, tras la escena en Quastelar S. A., recibes el Floette flor eterna de A. Z. (nivel 72) junto con su megapiedra, la Floettita. Consejo: sube a tu equipo a nivel 70 o más antes de ese combate. Fuente: WikiDex «Juegos Z-A» y «Floette de A. Z.»; Serebii «Gift Pokémon» de Leyendas Pokémon: Z-A.","phase":3,"order":300},{"id":"mega-stones","label":"Reunir las 64 megapiedras del juego base que se consiguen jugando","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: durante toda la partida; varias solo después de la historia principal. Dónde: Ciudad Luminalia (sede de Quastelar S. A., Boutique de la Piedra) y donde aparezcan megaevoluciones descontroladas. Paso a paso: 1) Recoge megaesquirlas por la ciudad y las zonas salvajes. 2) Canjéalas en la sede de Quastelar S. A.: la oferta crece al subir de rango en los Juegos Z-A. 3) Compra en la Boutique de la Piedra las megapiedras que vende. 4) Calma las megaevoluciones descontroladas para ganar su megapiedra. 5) Completa las misiones secundarias que dan megapiedras. Casi todas se consiguen jugando; las excepciones son la Chesnaughtita, la Delphoxita, la Greninjanita, la Sceptilita, la Blazikenita y la Swampertita (rangos de combates clasificatorios en línea) y la Diancita y la Mewtwoita X e Y (regalo misterioso). Consejo: revisa la tienda de Quastelar tras cada ascenso de rango. Fuente: WikiDex «Megapiedra»; Serebii «Mega Stones» de Leyendas Pokémon: Z-A.","phase":4,"order":400},{"id":"mega-stones-dlc","label":"Reunir las 17 megapiedras de Megadimensión que se consiguen jugando (DLC)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: tras terminar la historia principal y comprar el contenido descargable Megadimensión de Leyendas Pokémon: Z-A. Dónde: Luminalia Dimensional y sus zonas, además de Ciudad Luminalia. Paso a paso: 1) Empieza la historia de Megadimensión; los Pokémon salvajes de Luminalia Dimensional superan el nivel 100. 2) Avanza su historia: muchas megapiedras nuevas se ganan calmando megaevoluciones descontroladas en Luminalia Dimensional (por ejemplo, la Chimechita). 3) Completa las misiones secundarias del DLC que dan megapiedras: la 139 (Raichunita X e Y), la 141 (Crabominablita) y la 197 (Lucarita Z). 4) Reúne las que se consiguen jugando: Raichunita X e Y, Chimechita, Absolita Z, Staraptorita, Lucarita Z, Heatranita, Darkrainita, Golurkita, Meowsticita, Crabominablita, Golisopodita, Magearnita, Zeraoranita, Scovillainita, Glimmoranita y Tatsugirita. La Garchompita Z (regalo misterioso) y la Baxcaliburita (combates clasificatorios en línea) no se consiguen así. Consejo: si alguna no aparece, revisa las misiones secundarias pendientes del DLC. Fuente: WikiDex «Megapiedra» y «Megadimensión»; Serebii «Mega Stones».","phase":4,"order":410},{"id":"mega-stones-special","label":"Megapiedras de combates clasificatorios y de regalo misterioso (opcional)","category":"Coleccionables","tier":2,"species":null,"auto":null,"how":"Sceptilita, Blazikenita, Swampertita, Chesnaughtita, Delphoxita, Greninjanita y Baxcaliburita solo se ganaban subiendo de rango en los combates clasificatorios en línea de cada temporada; Diancita, Mewtwoita X, Mewtwoita Y y Garchompita Z llegaron por regalo misterioso. Dependen de temporadas y distribuciones, así que no cuentan para el cierre base. Fuente: WikiDex «Megapiedra» y la lista de megapiedras de PKHeX (ItemStorage9ZA). Con Pokekeep: pestaña SAV, botón «Objetos»: añade las megapiedras que te falten (Pokekeep solo deja poner las que PKHeX admite en Leyendas Z-A) y guarda.","phase":4,"order":420},{"id":"pokedex","label":"Completar Pokédex de Luminalia y extensiones disponibles","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Luminalia (y la de Megadimensión con el DLC). Con Pokekeep: Las exclusivas o de evento, añ ex «Amuleto Iris» y «Tareas de Melia».","phase":6,"order":617},{"id":"event-0","label":"Diancie y otros encuentros de regalo: comprobar evento y disponibilidad","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Diancie y otros regalos llegaron por evento o por la historia del DLC. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Megadimensión: legendarios y singulares de Luminalia Dimensional","category":"Evento histórico","tier":1,"species":null,"auto":null,"how":"Con la expansión Megadimensión, tras la historia principal: ayuda a Anya con su dónut y ve al Canal Saison para entrar por primera vez en Luminalia Dimensional; desde entonces Hoopa abre portales con los dónuts de Anya. Sigue la historia de la expansión: completa misiones en las zonas dimensionales para ganar puntos, vence a los Pokémon megaevolucionados descontrolados y a Darkrai en la Isla Lunanueva de Pesadilla, y busca después a Rayquaza para Anya. Los lugares dimensionales tienen a Heatran (Averno Abrasador), Groudon (Tierra del Ocaso), Kyogre (Mar del Albor) y Rayquaza (Gran Pilar Celeste). Las zonas ??? de 5 estrellas traen a Cobalion, Terrakion, Virizion, Latios, Latias y Meloetta; Keldeo aparece tras capturar a los otros tres espadachines místicos. Fuente: WikiDex «Luminalia Dimensional». Se acredita cuando los doce están registrados en la Pokédex de la partida.","phase":2,"order":275},{"id":"side-missions","label":"Completar todas las misiones secundarias","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: desde el principio de la historia hasta después de los créditos; las del contenido descargable Megadimensión, tras empezarlo. Dónde: toda Ciudad Luminalia y, en el DLC, Luminalia Dimensional. Paso a paso: 1) Busca personajes con el icono de misión en el mapa; muchas aparecen al avanzar en la historia o al completar otras. 2) Acepta y cumple cada una (enseñar o capturar Pokémon, combatir, encontrar ob function gen3Panel(g,e,full){
 if(!e)return '';
 const a=e.field&&globalThis.PokemonGen3Guide?PokemonGen3Guide.analyze(e.field,g.id,e.caught):globalThis.PokemonEventGuide?.analyze(e,g.id);if(!a){const l=e.location;return l&&l.name?`<section class="panel" id="gen3-where"><span class="eyebrow">Leído del guardado</span><h3>Dónde estás ahora</h3><p><b>${esc(l.name)}</b>${l.detail?` <span class="small muted">(${esc(l.detail)})</span>`:''}${l.precision==='region'?' <span class="small muted">(región; el guardado no indica el lugar exacto)</span>':''}</p><p class="small muted">La historia de esta edición aún no se interpreta desde el guardado; sigue la ruta recomendada de abajo.</p></section>`:'';}
 if(a.mismatch)return '<div class="notice">La lectura de campo pertenece a otra familia de ediciones; no se usa para esta.</div>';
 const loc=a.location,label={completado:'Completado',perdido:'Ya no disponible',"en curso":'En curso',pendiente:'Pendiente',legado:'Evento de legado',calculado:'Calculado'};
 const mon=m=>esc((m.egg?'Huevo':PokemonSpecies.name(m.species)||'Pokémon')+(m.where==='caja'||m.box?' · caja '+m.box+', posición '+m.slot:' · equipo, posición '+m.slot));
 const where=`<section class="panel" id="gen3-where"><span class="eyebrow">Leído del guardado</span><h3>${loc?'Dónde estás ahora':'Situación de la partida'}</h3>${loc?`<p><b>${esc(loc.name||'Zona sin nombre en el mapa')}</b>${loc.detail?` <span class="small muted">(${esc(loc.detail)})</span>`:''}${loc.precision==='region'?' <span class="small muted">(región; el guardado no indica el lugar exacto)</span>':Number.isFinite(loc.x)&&Number.isFinite(loc.y)?` <span class="small muted">(${/^(ZONE|FIELD)_/.test(loc.map||'')?'zona '+esc(String(loc.mapId)):esc(loc.map||'')}, posición ${loc.x}, ${loc.y})</span>`:''}</p>`:'<p class="small muted">La posición del jugador aún no se interpreta en esta edición; el resto procede de sus banderas y variables.</p>'}${a.storyPartial?(a.story.next?'<p>El Salón de la Fama aún no consta; sigue el recorrido de la historia desde tu última medalla.</p>':'<p>El Salón de la Fama consta en el guardado: el recorrido pasa al postgame.</p>'):a.story.next?`<p>Siguiente hito de la historia: <b>${esc(a.story.next.label)}</b>. <a href="#" data-view="mission">Ver el recorrido</a></p>`:a.story.rows.length&&a.story.rows.every(r=>r.state!=='pending')?'<p>La historia principal consta como terminada en las banderas del guardado.</p>':'<p class="small muted">El avance de la historia de esta edición aún no se interpreta desde el guardado; sigue la ruta recomendada.</p>'}<p class="small muted">${a.integrity?`Copia activa ${a.integrity.activeSlot+1} de ${a.integrity.copies}, checksums válidos. `:''}Significado de los datos del guardado: ${esc(a.confidence||'documentado en el código del juego (pret)')}. Aún sin comparación antes/después con partidas propias.</p></section>`;
 if(!full){const open=a.secrets.filter(x=>['pendiente','en curso'].includes(x.status));return where+(open.length?`<div class="notice"><b>Secretos pendientes según el guardado:</b> ${open.map(x=>esc(x.title)).join(' · ')}. <a href="#" data-view="diagnostic">Ver pasos</a></div>`:'');}
 const story=`<section class="panel"><h3>Historia según las banderas</h3>${a.story.rows.map(r=>`<div class="step"><span style="min-width:22px">${r.state==='pending'?'○':'●'}</span><span>${esc(r.label)} <span class="small muted">· ${r.state==='direct'?(r.badgesAtLeast!==undefined?'medallas registradas':'dato activo en el guardado'):r.state==='derived'?'deducido: hay un hito posterior':r.set===null?'sin lectura':'pendiente'}</span></span></div>`).join('')}</section>`;
 const secret=x=>{let body='';
  if(x.mirage){const m=x.mirage;body=`<p>${m.visibleToday.length?'<b>Hoy la isla es visible</b> gracias a: '+m.visibleToday.map(mon).join(', '):m.fromBoxToday.length?'<b>Hoy aparecería</b> si pasas al equipo: '+m.fromBoxToday.map(mon).join(', '):'Hoy no la hace aparecer ningún Pokémon de tu equipo ni de tus cajas.'}</p>${m.upcoming.length?`<p>Próximos días de juego en que algún Pokémon tuyo la hace aparecer:</p><ul>${m.upcoming.map(u=>`<li>Dentro de ${u.day} día${u.day===1?'':'s'}: ${u.mons.map(mon).join(', ')}</li>`).join('')}</ul>`:`<p class="muted">Ningún Pokémon tuyo coincide en los próximos ${m.horizon} días.</p>`}<p class="small muted">El valor cambia una vez por cada día de juego que el reloj procesa al cargar. Cuenta los días desde el último que registró el guardado.</p>`;}
  else body=`<p class="small"><b>Qué acredita el guardado:</b> ${esc(x.meaning||'')}${x.progress?.length?' · '+x.progress.map(p=>(p.set?'✔ ':'○ ')+esc(p.label)).join(' · '):''}${x.lost?.length?' · Ya no se puede repetir en esta partida.':''}${x.species?.some(sp=>sp.caught===true)?' · Pokédex: '+x.species.filter(sp=>sp.caught).map(sp=>esc(PokemonSpecies.name(sp.id))).join(', ')+' registrado.':''}</p>${x.weather?`<p><b>Clima anómalo guardado ahora mismo:</b> ${esc(x.weather)}</p>`:''}`;
  return `<details class="panel" ${['pendiente','en curso','calculado'].includes(x.status)?'open':''}><summary><b>${esc(x.title)}</b> · ${esc(label[x.status]||x.status)} · <span class="muted">${esc(x.place)}</span></summary><p class="small muted">${esc(x.category)}${x.legacy?' · '+esc(x.legacy):''}</p><p><b>Requisitos:</b> ${esc(x.requires)}</p><ol>${x.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${x.mission?`<p><button class="btn" data-goto="${esc(g.id+'-'+x.mission)}">Ver el recorrido completo de la misión</button></p>`:''}${body}</details>`;};
 return where+story+`<section><h3>Secretos y eventos (${a.secrets.filter(x=>x.status==='completado').length}/${a.secrets.filter(x=>x.status!=='calculado').length} completados)</h3>${a.secrets.map(secret).join('')}</section>`;
}

 return `<div class="grid"><div class="metric"><strong>${e.caughtCount}</strong><small>Capturados según Pokédex</small></div><div class="metric"><strong>${e.seenCount}</strong><small>Vistos según Pokédex</small></div><div class="metric"><strong>${e.badgesTotal??'—'}</strong><small>Medallas registradas</small></div></div><div class="panel"><span class="eyebrow">Evidencia importada · ${esc(g.name)}</span><h2>${esc(e.trainer||'Entrenador')} · ${esc(formatTime(e.playtime))}</h2><p class="muted">Liga: ${e.gameClear===true?'registrada':e.gameClear===false?'no registrada':(e.field&&globalThis.PokemonGen3Guide?.analyze(e.field,g.id,e.caught)?.story?.rows?.slice(-1)[0]?.set===true)?'bandera del Salón de la Fama activa (documentada en código)':(e.field&&globalThis.PokemonGen3Guide?.analyze(e.field,g.id,e.caught)?.story?.rows?.slice(-1)[0]?.set===false)?'bandera del Salón de la Fama inactiva':'sin lectura disponible'} · Pokédex Nacional: ${e.nationalDex===true?'desbloqueada':e.nationalDex===false?'no desbloqueada':'sin lectura disponible'} · Formato ${esc(e.format||'sin dato')}</p><p class="muted">Estos datos son registros actuales y no certifican el origen ni la secuencia de captura.</p>${e.editionIdentification==='selected-in-atlas'?'<p class="muted">El archivo identifica una familia: la edición concreta es la que seleccionaste en el Atlas.</p>':''}<div class="actions" style="margin-top:14px"><button class="btn primary" data-read-save>Actualizar guardado</button><button class="btn" id="diag-import-inline">Importar nuevo diagnóstico</button></div></div>${gen3Panel(g,e,true)}${completion?`<section class="panel" id="dex-completion"><h3>Especies exigidas por los reconocimientos de esta edición</h3>${Object.entries(completion).map(([key,dex])=>`<h4>${key==='kanto'?'Kanto':key==='kalos'?'Kalos':key==='hoenn'?'Hoenn':({alola:'Alola',melemele:'Melemele',akala:'Akala',ulaula:'Ula-Ula',poni:'Poni'}[key]||'Nacional')}: ${dex.registered}/${dex.required} ${dex.field==='seen'?'vistas':'registradas'}</h4>${dex.missing.length?`<details><summary>Ver ${dex.missing.length} especies pendientes</summary><p class="small" style="overflow-wrap:anywhere">${dex.missing.map(id=>'#'+String(id).padStart(3,'0')+' '+esc(PokemonSpecies.name(id)||'')).join(' · ')}</p></details>`:'<p>Lista exigida registrada por completo.</p>'}`).join('')}<p class="muted">Se compara la lista exacta del juego; las especies de evento excluidas no sustituyen una que falte. Esto acredita el registro, no sus encuentros originales ni la recogida de premios.</p></section>`:''}<div class="panel"><h3>Legendarios registrados en el diagnóstico</h3>${names.length?names.map(([id,name])=>`<div class="step"><span style="min-width:26px;color:var(--gold)">#${id}</span><label>${esc(name)} — <b>${e.caught.includes(+id)?'capturado':'solo visto'}</b></label></div>`).join(''):'<p class="muted">No constan legendarios entre las especies analizadas.</p>'}</div>${PokemonMedalBook.render(e,esc)}${PokemonOrasStones.render(g.id,e,esc)}${PokemonAlolaInventory.render(e,esc)}${PokemonPassport.render(e,esc)}${e.progressSignals?.length?`<section class="panel"><h3>Señales documentadas de progreso</h3>${e.progressSignals.map(s=>`<p><b>${esc(s.label)}:</b> ${s.value===true?'activo':s.value===false?'inactivo':'sin lectura disponible'}</p>`).join('')}<p class="muted">Proceden de campos documentados del juego. Falta el contraste controlado del evento; no certifican todas las escenas ni una cronología histórica.</p></section>`:''}${(e.unparsed?.length||e.warnings?.length)?`<section class="panel"><h3>Alcance de esta lectura</h3>${[...(e.warnings||[]),...(e.unparsed||[])].map(message=>`<p class="muted">${esc(message)}</p>`).join('')}</section>`:''}${importantItems?`<section class="panel"><h3>Objetos clave relevantes presentes</h3>${importantItems.length?importantItems.map(i=>`<p>${esc(itemNames[i.id])} · ${i.count}</p>`).join(''):'<p class="muted">No constan estos objetos en la bolsa actual.</p>'}<p class="muted">La posesión actual no acredita una entrega histórica ni las escenas anteriores.</p></section>`:''}<div class="notice"><b>Regla de seguridad:</b> haber registrado un legendario en la Pokédex no implica haber completado su ruta original, puzles o evento. La guía evita sugerir capturar de nuevo las especies acreditadas, pero deja abiertas las verificaciones de historia.</div>`;
}
function render(){masteryCache.clear();masteryAutoCache.clear();missionProofCache.clear();document.title='Pokémon 100 % · '+game(store.game).name;el.innerHTML=`<div class="layout">${nav()}<main class="main">${topNav()}${store.profileNotice?'<div class="notice">Se ha cambiado el perfil de partida. Las marcas anteriores se conservan por separado y se recuperan al volver a importar su guardado o diagnóstico. La exportación incluye los perfiles archivados.</div>':''}${store.storageWarning?'<div class="notice" role="alert">El navegador no ha podido guardar los últimos cambios. Siguen en memoria: usa «Exportar JSON» antes de cerrar.</div>':''}${store.recoveryWarning?'<div class="notice">No se pudo recuperar todo el progreso anterior. La copia original disponible se conserva en la exportación para recuperarla. Usa «Exportar JSON» antes de continuar.</div>':''}${view==='coverage'?coverage():view==='catalog'?catalog():view==='history'?history():view==='dossier'?dossier():view==='mastery'?mastery():view==='diagnostic'?diagnostic():missions()}${questionsDialog()}<p class="footer">Fuentes generales: Bulbapedia (serie principal y tarjetas), Serebii. Uso local: el progreso queda en este navegador; exporta JSON para cambiar de dispositivo. Los guardados se analizan localmente. El Atlas añade el motor ampliado para otros formatos. <a href="./engine/NOTICE.md">Licencia y fuentes del motor local</a>.</p></main></div><input id="file-import" type="file" hidden accept=".json,application/json"><input id="file-diagnosis" type="file" hidden accept=".json,application/json"><input id="file-save" type="file" hidden multiple>`; wire();}
function wire(){
 PokemonMedalBook.wire(el);
 PokemonOrasStones.wire(el);
 document.querySelectorAll('[data-read-save],#btn-save').forEach(b=>b.onclick=()=>document.getElementById('file-save').click());
 const rawInput=document.getElementById('file-save');if(rawInput)rawInput.onchange=e=>importSaveFiles(e.target.files);

 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.answer.split('|');setAnswer(store.game,kind,id,b.dataset.value);store.history.unshift({at:new Date().toISOString(),game:store.game,id:kind+':'+id,label:'Respuesta del test de la partida: '+id,value:b.dataset.value==='si'});save();render();});
 const later=document.getElementById('preguntas-luego');if(later)later.onclick=()=>{questionsDismissed.add(store.game+'|'+(PokemonDiagnosis.profile(evidenceFor(game(store.game)))||''));render();};
 document.querySelectorAll('[data-master]').forEach(b=>b.onchange=()=>{store.masterChecks=store.masterChecks||{};const k=store.game+':'+b.dataset.master;if(b.checked)store.masterChecks[k]=true;else delete store.masterChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,label:'Maestría: '+(masteryGoals(game(store.game)).find(x=>x.id===b.dataset.master)?.label||k),value:b.checked});save();render();});
 const mNext=document.getElementById('btn-mastery-next');if(mNext)mNext.onclick=()=>{const g=game(store.game);const o=masteryOrdered(masteryGoals(g)).filter(x=>x.tier<=1).find(x=>!masteryProof(x,g)&&!store.masterChecks?.[g.id+':'+x.id]);if(o){const target=document.getElementById('master-'+o.id);target?.scrollIntoView({behavior:'smooth',block:'center'});}else alert('El núcleo prioritario está confirmado; revisa objetivos históricos adicionales y premios en el juego.');};
 const mImport=document.getElementById('mastery-import');if(mImport)mImport.onclick=()=>document.getElementById('file-diagnosis')?.click();
 document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{store.goalChecks=store.goalChecks||{};const k=store.game+':'+b.dataset.goal;if(b.checked)store.goalChecks[k]=true;else delete store.goalChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,step:0,label:'Expediente: '+goalsFor(game(store.game))[Number(b.dataset.goal)][1],value:b.checked});save();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{genFilter=+b.dataset.gen;render()});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{store.game=b.dataset.game;genFilter=game(store.game).generation;view='mission';textFilter='';pending=false;save();render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const id=b.dataset.check,i=+b.dataset.idx,val=b.checked;setCheck(id,i,val)});$('#btn-export').onclick=exportData;$('#btn-import').onclick=()=>$('#file-import').click();$('#btn-diagnosis').onclick=()=>$('#file-diagnosis').click();const db=$('#diag-import-inline');if(db)db.onclick=()=>$('#file-diagnosis').click();$('#file-diagnosis').onchange=e=>importDiagnosis(e.target.files[0]);$('#file-import').onchange=e=>importData(e.target.files[0]);const search=$('#search');if(search)search.oninput=e=>{textFilter=e.target.value;const pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)};const p=$('#pending');if(p)p.onchange=e=>{pending=e.target.checked;render()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.focus);if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}});const mobileGen=$('#mobile-gen');if(mobileGen)mobileGen.onchange=e=>{genFilter=+e.target.value;store.game=CATALOG.games.find(g=>g.generation===genFilter).id;save();render()};const mobileGame=$('#mobile-game');if(mobileGame)mobileGame.onchange=e=>{store.game=e.target.value;genFilter=game(store.game).generation;save();render()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
