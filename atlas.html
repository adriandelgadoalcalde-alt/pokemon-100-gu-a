id":"ZA-08","section":"Postgame y 100%","verified":"base"}],"variant":[],"readSave":false,"coverage":"ruta base estructurada; auditoría detallada pendiente"}],"sources":["https://bulbapedia.bulbagarden.net/wiki/Core_series","https://bulbapedia.bulbagarden.net/wiki/Trainer_Card_level","https://www.serebii.net/"],"disclaimer":"Cobertura estructural de generaciones I–IX. No equivale a una auditoría certificada de todos los eventos, entrenadores u objetos. Los guardados no se infieren para ediciones aún no compatibles."};
const KEY='pokemon-atlas9-progress-v1';
const el=document.getElementById('app');
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let store={checks:{},history:[],game:'SOULSILVER'};
try {const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed?.checks&&typeof parsed.checks==='object')store={...store,...parsed}}} catch(e){}
if(!CATALOG.games.some(g=>g.id===store.game))store.game='SOULSILVER';
let genFilter=4,view='mission',textFilter='',pending=false;
const game=id=>CATALOG.games.find(g=>g.id===id)||CATALOG.games[0];
const checked=(id,i)=>!!store.checks[id+'-'+i];
const missionDone=m=>m.steps.every((_,i)=>checked(m.id,i));
const count=g=>g.missions.reduce((n,m)=>n+m.steps.filter((_,i)=>checked(m.id,i)).length,0);
const total=g=>g.missions.reduce((n,m)=>n+m.steps.length,0);
const pct=g=>Math.round(count(g)/Math.max(1,total(g))*100);
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){alert('No se pudo guardar en este navegador; exporta una copia JSON.')}}
function setCheck(id,i,val){const k=id+'-'+i;if(val)store.checks[k]=true;else delete store.checks[k]; const m=CATALOG.games.flatMap(g=>g.missions).find(m=>m.id===id);store.history.unshift({at:new Date().toISOString(),game:store.game,id,step:i,label:m?.title||id,value:val});store.history=store.history.slice(0,3000);save();render(); const t=document.querySelector('[data-mid="'+id+'"]');if(t)t.open=true;}
function exportData(){const blob=new Blob([JSON.stringify({...store,format:'pokemon-atlas-9-v1'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokemon-atlas-9-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data.checks||typeof data.checks!=='object'||Array.isArray(data.checks))throw Error('Archivo incompatible');store={...store,checks:data.checks,history:Array.isArray(data.history)?data.history:[],game:game(data.game).id};genFilter=game(store.game).generation;save();render();alert('Progreso importado correctamente.')}catch(e){alert('No se pudo importar el archivo: '+e.message)}}
function topNav(){const g=game(store.game);return `<div class="toolbar"><div><div class="eyebrow">Archivo Maestro · Atlas de nueve generaciones</div><h1>${view==='history'?'Cronología de progreso':view==='catalog'?'Todas las ediciones':esc(g.name)}</h1><p class="muted">${view==='mission'?'Generación '+g.generation+' · '+g.region+' · '+g.platform:'Recorrido de los juegos principales, con seguimiento independiente por edición'}</p></div><div class="actions"><button class="btn" id="btn-export">↓ Exportar JSON</button><button class="btn" id="btn-import">↑ Importar JSON</button><a class="btn" href="./index.html">↗ Guía clásica / lector SAV</a></div></div>`}
function nav(){return `<aside class="side"><div class="brand"><span class="ball"></span><span><strong>Pokémon 100 %</strong><small>Atlas · Generaciones I–IX</small></span></div><div class="mobile-head"><select id="mobile-gen">${Array.from({length:9},(_,i)=>`<option value="${i+1}" ${genFilter===i+1?'selected':''}>Generación ${i+1}</option>`).join('')}</select><select id="mobile-game">${CATALOG.games.filter(g=>g.generation===genFilter).map(g=>`<option value="${g.id}" ${store.game===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="label">Explorar</div><button data-view="catalog" class="${view==='catalog'?'active':''}">▦ Las 9 generaciones</button><button data-view="mission" class="${view==='mission'?'active':''}">☑ Mi guía actual</button><button data-view="history" class="${view==='history'?'active':''}">◷ Cronología</button><button data-view="dossier" class="${view==='dossier'?'active':''}">★ Expediente 100 %</button><div class="game-list"><div class="label">Juegos de la generación ${genFilter}</div>${CATALOG.games.filter(g=>g.generation===genFilter).map(g=>`<button data-game="${g.id}" class="${store.game===g.id?'current':''}">${esc(g.name)} · ${pct(g)}%</button>`).join('')}</div><div class="side-links"><div class="label">Aplicación anterior</div><a class="btn" style="width:100%;font-size:12px" href="./index.html">Lector de guardados v8 ↗</a></div></aside>`}
function catalog(){return `<div class="notice">Incluye 39 ediciones de la serie principal, remakes y sus expansiones como capítulos de cada juego. La cobertura nueva es una <b>ruta base estructurada</b>, no una certificación completa de cada evento o entrenador. Las seis ediciones con lector comprobado siguen en la guía clásica.</div><div class="gen-tabs">${Array.from({length:9},(_,i)=>`<button class="btn ${genFilter===i+1?'primary':''}" data-gen="${i+1}">Gen ${i+1}</button>`).join('')}</div><div class="game-grid">${CATALOG.games.filter(g=>g.generation===genFilter).map(g=>`<button class="game ${store.game===g.id?'active':''}" data-game="${g.id}"><strong>${esc(g.name)}</strong><small>${g.missions.length} misiones · ${pct(g)}% marcado</small><div class="progress"><span style="width:${pct(g)}%"></span></div></button>`).join('')}</div><div class="panel"><h3>Qué significa 100 %</h3><p class="muted">Las marcas de esta página son el progreso que confirmas tú. No acreditan por sí solas la tarjeta, el pasaporte o el registro de Pokémon. La certificación requiere pruebas específicas en el guardado o en pantallas del juego.</p></div>`}
function missions(){const g=game(store.game);const next=g.missions.find(m=>!missionDone(m));const display=g.missions.filter(m=>(!pending||!missionDone(m))&&(!textFilter||(m.title+' '+m.steps.join(' ')+' '+m.caution).toLowerCase().includes(textFilter.toLowerCase())));return `<div class="grid"><div class="metric"><strong>${g.missions.filter(missionDone).length}/${g.missions.length}</strong><small>Misiones marcadas</small></div><div class="metric"><strong>${count(g)}/${total(g)}</strong><small>Pasos marcados</small></div><div class="metric"><strong>${pct(g)}%</strong><small>Progreso manual</small></div></div><div class="notice"><b>Edición: ${esc(g.name)}</b>${g.variant.length?' · Legendario/elemento distintivo: '+esc(g.variant.join(' · ')):''}<br>${esc(g.coverage)}. Las tareas no se completan automáticamente por una captura en Pokédex.</div>${next?`<div class="panel"><span class="eyebrow">Siguiente objetivo no confirmado</span><h2>${esc(next.title)}</h2><p class="muted">${esc(next.steps[0])}</p><button class="btn primary" data-focus="${next.id}" style="margin-top:12px">Ir a esta misión ↓</button></div>`:'<div class="panel">Has marcado todas las instrucciones de esta ruta. Comprueba ahora las recompensas oficiales y los objetivos adicionales del juego.</div>'}<div class="filters"><input type="search" id="search" value="${esc(textFilter)}" placeholder="Buscar misión, objeto o requisito"><label class="filterline"><input type="checkbox" id="pending" ${pending?'checked':''}> Solo pendientes</label></div><p class="small">${display.length} de ${g.missions.length} misiones visibles. Cada casilla es independiente; abre una misión para ver sus pasos.</p>${display.map(m=>`<details class="card" data-mid="${m.id}" id="${m.id}"><summary><span class="count">${m.steps.filter((_,i)=>checked(m.id,i)).length}/${m.steps.length}</span><span class="t"><strong>${esc(m.title)}</strong><small>${esc(m.section)}${missionDone(m)?' · completada manualmente':''}</small></span></summary><section>${m.steps.map((step,i)=>`<div class="step"><input id="${m.id}-${i}" data-check="${m.id}" data-idx="${i}" type="checkbox" ${checked(m.id,i)?'checked':''}><label for="${m.id}-${i}">${esc(step)}</label></div>`).join('')}<div class="warn"><b>Antes de darla por cerrada:</b> ${esc(m.caution)}</div><p class="small" style="margin-top:10px">Fuente de evidencia: confirmación manual. No equivale a un flag verificado de PKHeX.</p></section></details>`).join('')||'<div class="notice">No hay misiones para los filtros seleccionados.</div>'}`}
function history(){const list=store.history.filter(h=>h.game===store.game);return `<div class="notice">Cronología de acciones que has registrado en este Atlas. El historial original dentro de cada cartucho no se reconstruye a partir de estas casillas.</div><div class="panel">${list.length?list.slice(0,300).map(h=>`<div class="history-item"><small>${esc(new Date(h.at).toLocaleString('es-ES'))}</small><p><b>${esc(h.label)}</b> · paso ${h.step+1} · ${h.value?'marcado':'desmarcado'}</p></div>`).join(''):'Todavía no has marcado pasos en esta edición.'}</div>`}

const V91_GOALS={
1:['Ocho medallas y Liga','Pokédex con intercambios y exclusivos','Legendarios y fósiles','Objetos únicos y MT','Entrenadores y zonas opcionales','Distribuciones históricas'],
2:['Johto y Kanto: dieciséis medallas y Rojo','Pokédex y especies por edición','Bestias, legendarios y regalos','Instalaciones de combate','Eventos semanales y objetos','Eventos históricos'],
3:['Liga y postgame','Pokédex regional y Nacional','Legendarios y regalos','Frente Batalla si existe','Concursos, cintas y otros extras','Eventos de distribución'],
4:['Liga y postgame','Pokédex Nacional','Legendarios y regalos','Frente Batalla o Torre Batalla','Actividades únicas por edición','Máximo nivel de tarjeta'],
5:['Historia, Liga y postgame','Pokédex regional y Nacional','Legendarios y eventos','Instalaciones y retos de combate','Medallero si es una secuela','Máximo nivel de tarjeta'],
6:['Liga y episodios posteriores','Pokédex de la edición','Legendarios y distribuciones','Instalaciones de combate','Colecciones y extras','Máximo nivel de tarjeta'],
7:['Historia principal y postgame','Pokédex regional y variantes','Legendarios o ultracriaturas','Árbol de Combate si existe','Pegatinas y colecciones si existen','Pasaporte u otros reconocimientos'],
8:['Historia y postgame','Pokédex regional','Legendarios y regalos','Retos avanzados','DLC si se ha adquirido','Recompensas de completismo'],
9:['Todas las tramas y postgame','Pokédex correspondiente','Legendarios y encuentros únicos','Retos y revanchas','Expansiones si se han adquirido','Recompensas de completismo']
};
const V91_EXTRAS={SOULSILVER:['Tarjeta negra de cinco estrellas','Ruinas Alfa: 28 Unown y cámaras secretas'],HEARTGOLD:['Tarjeta negra de cinco estrellas','Ruinas Alfa: 28 Unown y cámaras secretas'],BLACK2:['Las 255 medallas de Teselia'],WHITE2:['Las 255 medallas de Teselia'],ULTRASUN:['Quince sellos del Pasaporte','Cien pegatinas dominantes'],ULTRAMOON:['Quince sellos del Pasaporte','Cien pegatinas dominantes'],SCARLET:['El disco índigo y La máscara turquesa si se han adquirido'],VIOLET:['El disco índigo y La máscara turquesa si se han adquirido']};
function dossier(){const g=game(store.game),arr=[...V91_GOALS[g.generation],...(V91_EXTRAS[g.id]||[])],done=store.dossierChecks||{},n=arr.filter((_,i)=>done[g.id+':'+i]).length;return '<section class="panel"><span class="eyebrow">Expediente de completismo</span><h2>'+n+' de '+arr.length+' comprobaciones declaradas</h2><p class="muted">Este expediente se verifica manualmente y es independiente de la ruta de misiones. No certifica el 100 % absoluto ni sustituye un lector de guardados.</p><div class="progress"><span style="width:'+Math.round(100*n/arr.length)+'%"></span></div></section><section class="panel" style="margin-top:15px"><h3>Objetivos de '+esc(g.name)+'</h3>'+arr.map((s,i)=>'<div class="step"><input type="checkbox" data-v91-goal="'+i+'" id="v91-'+i+'" '+(done[g.id+':'+i]?'checked':'')+'><label for="v91-'+i+'">'+esc(s)+'</label></div>').join('')+'</section><div class="notice">La guía base cubre las nueve generaciones, pero los lectores de guardado y la auditoría completa de eventos siguen siendo parciales. Para partidas de SoulSilver, Negro/Blanco 2, Y, Rubí Omega y Ultrasol, consulta el lector de la guía principal. <a href="./index.html">Abrir lector</a></div>'}
function render(){document.title='Pokémon 100 % · '+game(store.game).name;el.innerHTML=`<div class="layout">${nav()}<main class="main">${topNav()}${view==='catalog'?catalog():view==='history'?history():view==='dossier'?dossier():missions()}<p class="footer">Fuentes generales: Bulbapedia (serie principal y tarjetas), Serebii. Uso local: el progreso queda en este navegador; exporta JSON para cambiar de dispositivo. Los archivos SAV se analizan únicamente desde la guía clásica compatible.</p></main></div><input id="file-import" type="file" accept=".json,application/json">`; wire();}
function wire(){document.querySelectorAll('[data-v91-goal]').forEach(b=>b.onchange=()=>{store.dossierChecks=store.dossierChecks||{};const k=store.game+':'+b.dataset.v91Goal;if(b.checked)store.dossierChecks[k]=true;else delete store.dossierChecks[k];save();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{genFilter=+b.dataset.gen;render()});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{store.game=b.dataset.game;genFilter=game(store.game).generation;view='mission';textFilter='';pending=false;save();render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const id=b.dataset.check,i=+b.dataset.idx,val=b.checked;setCheck(id,i,val)});$('#btn-export').onclick=exportData;$('#btn-import').onclick=()=>$('#file-import').click();$('#file-import').onchange=e=>importData(e.target.files[0]);const search=$('#search');if(search)search.oninput=e=>{textFilter=e.target.value;const pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)};const p=$('#pending');if(p)p.onchange=e=>{pending=e.target.checked;render()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.focus);if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}});const mobileGen=$('#mobile-gen');if(mobileGen)mobileGen.onchange=e=>{genFilter=+e.target.value;store.game=CATALOG.games.find(g=>g.generation===genFilter).id;save();render()};const mobileGame=$('#mobile-game');if(mobileGame)mobileGame.onchange=e=>{store.game=e.target.value;genFilter=game(store.game).generation;save();render()}}
render();
</script></body></html>
