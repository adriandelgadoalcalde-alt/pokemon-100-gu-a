bii limita la revancha a la primavera, así que si en verano no está, vuelve en primavera. Dónde: su casa de Pueblo Arenisca (la de Catleya, a la izquierda del Centro Pokémon). Paso a paso: 1) Termina la historia. 2) Ve a Pueblo Arenisca en primavera y entra en la casa. 3) Habla con Cintia y acepta el combate individual seis contra seis. Su equipo: Spiritomb, Milotic, Eelektross, Braviary y Lucario a nivel 75 y Garchomp a nivel 77. 4) Puedes repetir el combate una vez al día. Consejo: su Spiritomb usa Doble Equipo; derríbalo rápido con ataques fuertes que no fallen, y lleva algo de tipo Hielo o Dragón para Garchomp. Fuente: WikiDex «Cintia» y «Pueblo Arenisca»; Serebii «Sinnoh Champion Cynthia & Designer Morimoto».","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Porcelana (tras el Alto Mando)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: solo después de vencer al Alto Mando, es decir, al terminar la historia. Dónde: Torre de Game Freak, primer edificio a la derecha de la Calle Porcelana de Ciudad Porcelana; las oficinas están en el piso 21 (así figura en la versión española). Paso a paso: 1) Termina la historia principal. 2) Ve a Ciudad Porcelana, entra en la Torre de Game Freak y sube en ascensor a las oficinas. 3) Habla con Morimoto (inspirado en Shigeki Morimoto, de Game Freak) y acepta su combate. Su equipo incluye Liepard, Simipour, Simisear, Simisage y Swoobat a nivel 76. 4) Puedes volver a combatir con él una vez al día. Consejo: en la misma planta está el director del juego, que entrega los diplomas de la Pokédex; aprovecha la visita. Fuente: WikiDex «Game Freak» y «Torre de Game Freak»; Serebii «Sinnoh Champion Cynthia & Designer Morimoto».","phase":3,"order":390},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Después del Hall de la Fama; es el primero de los tres Espadachines Místicos. Dónde: Estancia Orientación (nivel 42). Cómo: Estancia Orientación, dentro de la Cueva Loza (Surf y Fuerza). Consejo: Cobalion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion. Dónde: Cámara de Pruebas (nivel 42). Cómo: Cámara de Pruebas, en la Calle Victoria. Consejo: Terrakion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion y a Terrakion. Dónde: Claro Filosofía (nivel 42). Cómo: Claro Filosofía, en el Bosque Azulejo. Consejo: Virizion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Boquete Gigante (nivel 75). Cómo: Boquete Gigante (Ruta 22, con Surf): cruza el bosque interior hasta la cueva del fondo. Consejo: Kyurem nivel 75: el más fuerte de la edición. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-644","label":"Registrar a Zekrom en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":644,"auto":null,"how":"Cuándo: Final de la historia, en el Castillo de N. Dónde: Palacio de N (nivel 50); Torre Duodraco (nivel 50). Cómo: Antes del combate contra N en su palacio, el Orbe Oscuro (te lo da Aloe en Ciudad Esmalte tras el Castillo Ancestral) despierta a Zekrom: hay que capturarlo para seguir. Si tienes el equipo y las cajas llenos, aparece después en la Torre Duodraco. Consejo: Zekrom nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Vencer a Ghechis y Equipo Plasma","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Ghechis y al Equipo Plasma en el Castillo de N: llega al terminar la historia.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Todos los complementos del Musical Pokémon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: desde que llegas a Ciudad Mayólica y entras por primera vez en el Teatro Musical; los últimos complementos llegan tras muchas actuaciones. Dónde: el Teatro Musical de Ciudad Mayólica, además de la Ruta 5 y Ciudad Caolín. Paso a paso: 1) Entra en el teatro: el dueño te regala el Neceser, donde se guardan los complementos. 2) Actúa con un Pokémon vestido; al acabar, habla con el público que te espera en la recepción: te regalan complementos, más cuanto mejor actúes, y algunos solo tras ciertos tipos de musical. 3) El dueño, arriba, da la Corona al ganar 5 musicales, el Cinturón Campeón al ganar 10, la Tiara al actuar con un amigo y la Tarta de Plástico el día de tu cumpleaños. 4) Vence al Cantautor Marcio de la Ruta 5 por la Guitarra Eléctrica, y en la casa oeste de Ciudad Caolín un hombre da, uno por día, Gorro Rojo, Bolsa Grande, Barba Tupida y Caja de Regalo. 5) Sigue hasta reunir los 100. Consejo: viste al Pokémon con complementos del estilo del musical elegido. Lo que dependía de musicales del Pokémon Global Link, ya cerrado, se consigue hoy con Pokekeep. Fuente: WikiDex «Complemento» y «Musical Pokémon».","phase":6,"order":620},{"id":"card-3","label":"Todos los poderes regalo del Nexárbol (Zona Nexo)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: desde que tienes el C-Gear; es un objetivo largo. Dónde: la Zona Nexo, a la que se entra con el C-Gear. Paso a paso: 1) En Negro/Blanco las misiones del Nexárbol se hacen en el mundo de otro jugador, conectado por comunicación inalámbrica: combates, esconder objetos, ayudar curando o vender un objeto. 2) Cada misión cumplida sube en 1 el nivel negro del Nexárbol en Pokémon Negro o el nivel blanco en Pokémon Blanco; según WikiDex, al completar las seis misiones sube 6 el otro nivel. 3) Cada nivel desbloquea poderes regalo nuevos, que se usan gastando regalosferas. 4) Son 33 poderes en Negro/Blanco; para tenerlos todos el Nexárbol necesita nivel 30 tanto en el nivel negro como en el blanco (por ejemplo, Captura +++ pide los dos a 30). Consejo: completar las seis misiones de cada tanda ayuda a subir también el otro nivel; necesitarás a alguien con otra consola para entrar en su mundo. Fuente: WikiDex «Nexárbol» y «Ficha de entrenador»; Serebii «Entralink - Pass Powers».","phase":6,"order":630},{"id":"card-4","label":"Derrotar a Fero y Caril en Súper Individual y Súper Doble del Metro Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Fero y Caril (Jefes de Metro) en el Súper Individual y en el Súper Doble del Metro Batalla, en sus rachas de 49 victorias.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando la ficha de entrenador alcanza su último nivel (no tiene estrellas: cambia de color; en Negro/Blanco empieza en verde y en Negro 2/Blanco 2 en azul). Dónde: cualquier Centro Pokémon de Teselia. Paso a paso: 1) Cumple los cinco logros de la ficha. En Negro/Blanco: superar la Liga Pokémon, completar la Pokédex Nacional (sin los singulares), reunir todos los complementos del Musical, lograr 49 victorias seguidas en el Super Metro Individual y en el Super Metro Doble del Metro Batalla y llevar el Nexárbol a nivel 30 tanto en el nivel negro como en el blanco. En Negro 2/Blanco 2: superar la Liga, completar la Pokédex Nacional (sin los singulares), completar todas las películas de los Estudios Cinematográficos Pokéwood, completar el Torneo Campeones del Pokémon World Tournament y el mismo nivel 30 del Nexárbol. 2) Con la ficha al máximo, pide a la Enfermera Joy que cure a tu equipo. 3) Lo curará sin decir nada, salvo si detecta Pokérus. Consejo: consulta la ficha desde el menú para ver su color actual. Fuente: WikiDex «Ficha de entrenador»; Serebii «The Trainer Card».","phase":6,"order":690},{"id":"event-0","label":"Victini, Keldeo, Meloetta y Genesect: eventos o distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Victini (Isla Libertad, con el Pase Libertad), Keldeo, Meloetta y Genesect solo llegaron por eventos (Meloetta y Genesect con historia propia en Negro 2/Blanco 2). Con Pokekeep: Añade el Pase Libertad (objeto clave) para jugar el evento de Victini, o los singulares legales desde la Librería.","phase":7,"order":700},{"id":"pokemon-641","label":"Registrar a Tornadus en la Pokédex de esta partida (exclusivo de Negro: por intercambio)","category":"Legendarios","tier":1,"species":641,"auto":null,"how":"Cuándo: Exclusivo de Negro. Cómo: Solo por intercambio desde Negro. Consejo: Hace falta para Landorus. Con Pokekeep: Añádelo legal desde la Librería (origen de la otra edición). Se acredita con el registro en la Pokédex de la partida.","phase":7,"order":720},{"id":"pokemon-642","label":"Registrar a Thundurus en la Pokédex de esta partida (vaga por Teselia en Blanco)","category":"Legendarios","tier":1,"species":642,"auto":null,"how":"Cuándo: Con las 8 medallas: la recepcionista del acceso a la Ruta 10 avisa de un clima extraño en la Ruta 7. Dónde: errante por la región (nivel 40). Cómo: Ve a la casa de la anciana de la Ruta 7; Thundurus aparece y empieza a vagar por Teselia. Síguelo con el mapa del Navegador C-Gear. Consejo: Thundurus nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-645","label":"Registrar a Landorus en la Pokédex de esta partida (en el Santuario Abundancia con Tornadus y Thundurus en el equipo)","category":"Legendarios","tier":1,"species":645,"auto":null,"how":"Cuándo: Con Tornadus y Thundurus en el equipo (uno de ellos intercambiado desde la otra edición). Dónde: Santuario Abundancia (nivel 70). Cómo: Santuario Abundancia (Ruta 14). Consejo: Landorus nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260}],"BLACK2":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, personajes y nuevas zonas de Teselia","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Negro/Blanco: tras la Liga se abre el este de Teselia (Ciudad Caolín y rutas 14-18), con Cintia, los Espadachines y Kyurem. Negro 2/Blanco 2: tras la Liga, Torre Duodraco, Ruinas Subterráneas (Regis), Nexárbol y Cintia en Pueblo Arenisca.","phase":2,"order":200},{"id":"battle0","label":"Superar Metro Batalla y sus rangos importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Metro Batalla (Ciudad Mayólica): líneas Individual, Doble y Múltiple. Los Jefes de Metro (Fero y Caril) aparecen en la victoria 21 de las líneas normales; ganarles abre la línea Súper, donde vuelven en la victoria 49.","phase":3,"order":300},{"id":"items0","label":"Objetos clave de acceso a ruinas, cuevas y escenas legendarias","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Para las escenas legendarias: Orbe Oscuro (Negro 2) u Orbe Claro (Blanco 2), que te da N en el Palacio de N tras vencerle (entrada desde la Calle Victoria tras la Liga), para la Torre Duodraco, Pluma Lunar (Villa Horroris), Piedra Magma (Ruta 18) y las Claves del Teselia Link (Hierro e Iceberg) para las Ruinas Subterráneas.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Teselia (director del juego, oficinas de Game Freak, Calle Porcelana de Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto completes la Pokédex de Teselia (diploma regional) y, tras la Liga, la Nacional (segundo diploma). Dónde: Torre de Game Freak, primer edificio a la derecha de la Calle Porcelana de Ciudad Porcelana; las oficinas están en el piso 21 (así figura en la versión española). Paso a paso: 1) Captura todos los Pokémon de la Pokédex de Teselia; para los diplomas no hace falta tener los singulares. 2) Sube en ascensor a las oficinas y habla con el director del juego: te da el diploma de Teselia. 3) Repite con la Pokédex Nacional capturada (sin los singulares) para el segundo diploma. 4) Los diplomas aparecen en tu habitación de Pueblo Arcilla, junto a la televisión. Consejo: en la misma planta está Morimoto, que acepta un combate al día tras vencer al Alto Mando; en Negro 2/Blanco 2 también Nishino. Fuente: WikiDex «Game Freak», «Torre de Game Freak», «Pokédex» y «Pueblo Arcilla».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), habla con el director del juego en el Game Freak de Ciudad Porcelana.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: Pokédex de Teselia capturada (Profesora Encina)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando hayas capturado toda la Pokédex de Teselia. Dónde: laboratorio de la Profesora Encina en Pueblo Arcilla. Paso a paso: 1) Captura los 296 Pokémon de la Pokédex de Teselia de Negro 2/Blanco 2; no hace falta tener a los singulares Victini, Meloetta, Keldeo ni Genesect. 2) Ve a Pueblo Arcilla y habla con la Profesora Encina en su laboratorio para que evalúe tu Pokédex. 3) Te entrega el Amuleto Oval, que hace más fácil que aparezcan huevos en la guardería. Consejo: con solo ver los 296 ya consigues un premio previo de la Profesora Encina, el permiso para ir a la Reserva Natural; el Amuleto Oval exige capturarlos. Para los exclusivos de la otra edición, recurre a los intercambios. Fuente: WikiDex «Amuleto Oval» y «Pueblo Arcilla»; Serebii «Pokédex Completion».","phase":6,"order":613},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (Profesora Encina, vía Carrasco)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, con la Pokédex Nacional capturada. Dónde: Pueblo Arcilla, donde están Carrasco Encina y la Profesora Encina. Paso a paso: 1) Consigue la Pokédex Nacional: Carrasco la actualiza en tu casa después de que derrotes a la campeona Iris. 2) Captura todos los Pokémon de la Pokédex Nacional, salvo los singulares (por ejemplo Mew, Celebi, Jirachi, Arceus o Victini). 3) Ve a Pueblo Arcilla y habla con Carrasco: te dirá que su hija tiene un regalo para ti. 4) La Profesora Encina te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor, tanto salvajes como por crianza. Consejo: para los Pokémon de generaciones anteriores usa el Pokétransfer desde Diamante, Perla, Platino, Oro HeartGold y Plata SoulSilver. Fuente: WikiDex «Amuleto Iris» y «Pokédex Nacional»; Serebii «Pokédex Completion».","phase":6,"order":616},{"id":"final-boss-cynthia","label":"Vencer a Cintia en su casa de Pueblo Arenisca tras la Liga","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de entrar en el Hall de la Fama, en primavera o en verano (ella dice que el resto del año está en Sinnoh). Dónde: su casa de Pueblo Arenisca, la de Catleya, a la izquierda del Centro Pokémon; además participa en el Pokémon World Tournament, al sur de Ciudad Fayenza. Paso a paso: 1) Termina la historia y vence a la campeona Iris. 2) Espera a que el mes corresponda a primavera o verano. 3) Ve a Pueblo Arenisca, entra en la casa y habla con Cintia para combatir: Spiritomb, Milotic, Togekiss, Lucario y Glaceon a nivel 76 y Garchomp a nivel 78. 4) Puedes volver a combatir con ella una vez al día. 5) También puedes encontrarla en el Torneo Campeones del Pokémon World Tournament, con equipos a nivel 50; allí su primer Pokémon siempre es Garchomp. Consejo: lleva respuestas para Garchomp (tipo Hielo o Dragón) y ataques que no fallen contra Spiritomb, que usa Doble Equipo. Fuente: WikiDex «Cintia», «Pueblo Arenisca» y «Pokémon World Tournament»; Serebii «Strong Trainers».","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto y a Nishino en las oficinas de Game Freak de Ciudad Porcelana","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: Nishino combate desde antes de la Liga y cambia de equipo tras vencer al Alto Mando. Para Morimoto, WikiDex «Torre de Game Freak» recoge también un combate previo a la Liga, pero WikiDex «Game Freak» y Serebii lo sitúan tras ella; si no te reta, termina la historia. Cada uno acepta un combate al día. Dónde: Torre de Game Freak, en la Calle Porcelana de Ciudad Porcelana; oficinas en el piso 21 (versión española). Paso a paso: 1) Sube en ascensor a las oficinas. 2) Antes de la Liga, Nishino usa un Clefairy a nivel 16, y el combate previo de Morimoto es con Pansage, Pansear y Panpour a nivel 14. 3) Tras entrar en el Hall de la Fama vuelve: los dos llevan equipos a nivel 76 (Nishino con Clefable, Wigglytuff y Azumarill, entre otros; Morimoto con Liepard y los tres monos), o a nivel 78 en el Modo Reto. 4) Repite cada día si quieres. Consejo: en la misma sala está el director del juego, que entrega los diplomas de la Pokédex. Fuente: WikiDex «Game Freak» y «Torre de Game Freak»; Serebii «Strong Trainers».","phase":3,"order":390},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 13 (nivel 45); Ruta 13 (nivel 65). Cómo: Ruta 13, en un claro al que se llega por la playa. Consejo: Cobalion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 22 (nivel 45); Ruta 22 (nivel 65). Cómo: Ruta 22. Consejo: Terrakion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 11 (nivel 45); Ruta 11 (nivel 65). Cómo: Ruta 11. Consejo: Virizion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Después de capturar a Zekrom en la Torre Duodraco. Dónde: Boquete Gigante (nivel 70). Cómo: Boquete Gigante, en la cueva del fondo. Consejo: Kyurem nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":265},{"id":"pokemon-644","label":"Registrar a Zekrom en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":644,"auto":null,"how":"Cuándo: Después del Hall de la Fama: entra en el Palacio de N desde la Calle Victoria, vence a N y a su Zekrom y te da el Orbe Oscuro. Dónde: Torre Duodraco (nivel 70). Cómo: Lleva el Orbe Oscuro a lo alto de la Torre Duodraco para invocar a Zekrom. Consejo: Zekrom nivel 70; captúralo antes de Kyurem. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Solar de los Sueños (nivel 68). Cómo: Solar de los Sueños (al lado de Ciudad Esmalte), en la zona del fondo. Consejo: Latios nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"medals","label":"Conseguir las 255 medallas del Medallero","category":"Reconocimiento","tier":2,"species":null,"auto":null,"how":"El Medallero de Ciudad Gres (sala de la Liga de Medallas) registra 255 medallas de cinco tipos: Avance (historia), Aventura, Batalla, Conexión y Especiales. Ve a por ellas en este orden: las de Avance salen solas con la historia; las de Aventura y Batalla, jugando (pesca, bici, cajas, evoluciones, instalaciones de combate); cada vez que el señor de la Liga de Medallas te llama, recoge las nuevas y sube de rango. Las de Conexión que exigían Pokémon Global Link, la GTS, los combates aleatorios por Wi-Fi, Pokémon Dream Radar o eventos ya no se pueden ganar jugando porque esos servicios cerraron. El bloque del Medallero guarda cada medalla y su fecha. Con Pokekeep: abre la partida, pestaña SAV, botón «Insignias» (Editor de Insignias): marca las que falten una a una o pulsa «Dar todas», y después «Guardar»; finalmente exporta la partida.","phase":6,"order":680},{"id":"pwt","label":"Completar el Torneo Campeones del Pokémon World Tournament","category":"Combates","tier":0,"species":null,"auto":null,"how":"Pokémon World Tournament (junto a Ciudad Fayenza, tras la Liga): gana el Torneo Campeones contra los campeones de todas las regiones.","phase":3,"order":310},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Todas las películas requeridas de Estudios Cinematográficos Pokéwood","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por terminar las películas exigidas de Estudios Cinematográficos Pokéwood (Ciudad Hormigón): rueda cada película siguiendo el guion hasta el final bueno.","phase":6,"order":620},{"id":"card-3","label":"Torneo Campeones de PWT","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Pokémon World Tournament (junto a Ciudad Fayenza): gana los torneos regionales para desbloquear el Torneo Campeones y gánalo.","phase":6,"order":630},{"id":"card-4","label":"Nexárbol a nivel 30 en negro y en blanco (Zona Nexo)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por subir el Nexárbol a nivel 30 tanto en el Bosque Blanco como en la Ciudad Negra (Zona Nexo, misiones y visitas).","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando la ficha de entrenador alcanza su último nivel (no tiene estrellas: cambia de color; en Negro/Blanco empieza en verde y en Negro 2/Blanco 2 en azul). Dónde: cualquier Centro Pokémon de Teselia. Paso a paso: 1) Cumple los cinco logros de la ficha. En Negro/Blanco: superar la Liga Pokémon, completar la Pokédex Nacional (sin los singulares), reunir todos los complementos del Musical, lograr 49 victorias seguidas en el Super Metro Individual y en el Super Metro Doble del Metro Batalla y llevar el Nexárbol a nivel 30 tanto en el nivel negro como en el blanco. En Negro 2/Blanco 2: superar la Liga, completar la Pokédex Nacional (sin los singulares), completar todas las películas de los Estudios Cinematográficos Pokéwood, completar el Torneo Campeones del Pokémon World Tournament y el mismo nivel 30 del Nexárbol. 2) Con la ficha al máximo, pide a la Enfermera Joy que cure a tu equipo. 3) Lo curará sin decir nada, salvo si detecta Pokérus. Consejo: consulta la ficha desde el menú para ver su color actual. Fuente: WikiDex «Ficha de entrenador»; Serebii «The Trainer Card».","phase":6,"order":690},{"id":"event-0","label":"Victini, Keldeo, Meloetta y Genesect: eventos o distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Victini (Isla Libertad, con el Pase Libertad), Keldeo, Meloetta y Genesect solo llegaron por eventos (Meloetta y Genesect con historia propia en Negro 2/Blanco 2). Con Pokekeep: Añade el Pase Libertad (objeto clave) para jugar el evento de Victini, o los singulares legales desde la Librería.","phase":7,"order":700},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida (tras el final, desde la Cueva Psique (Ruta 20): ante el Museo de Ciudad Esmalte, en un punto concreto)","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras entrar en la Cueva Psique (Ruta 20, junto a Pueblo Ocre). Dónde: Ciudad Esmalte (nivel 65). Cómo: Uxie aparece en un punto concreto delante del Museo de Ciudad Esmalte. Consejo: Uxie nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida (en la cima de la Torre de los Cielos, en un punto concreto)","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras entrar en la Cueva Psique. Dónde: Torre de los Cielos (nivel 65). Cómo: En la cima de la Torre de los Cielos, en un punto concreto. Consejo: Mesprit nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":221},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida (en el lado izquierdo de la Ruta 23, en un punto concreto)","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras entrar en la Cueva Psique. Dónde: Ruta 23 (nivel 65). Cómo: En el lado izquierdo de la Ruta 23, en un punto concreto. Consejo: Azelf nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":222},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida (Ruinas Subterráneas del Túnel Yakón: 6 pasos abajo y 9 a la derecha desde el centro y pulsa abajo)","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Sala Pico Roca (nivel 65). Cómo: Activa la Clave Pico Roca en el sistema de claves (Teselia Link) y entra en las Ruinas Subterráneas del Túnel Yakón: desde el centro, 6 pasos abajo y 9 a la derecha, y pulsa abajo para abrir la Sala Pico Roca. Consejo: Regirock nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida (con la llave de Registeel del Teselia Link («Iron Key» en inglés) en las mismas ruinas)","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Con la Clave Hierro activada en el Teselia Link (llave de Registeel). Dónde: Sala Hierro (nivel 65). Cómo: Ruinas Subterráneas, Sala Hierro. Consejo: Registeel nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida (con la llave de Regice («Iceberg Key»), que puede enviarte un amigo con Blanco 2)","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Con la Clave Iceberg, que hay que recibir de un amigo con Blanco 2. Dónde: Sala Iceberg (nivel 65). Cómo: Ruinas Subterráneas, Sala Iceberg. Consejo: Regice nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":232},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida (sótano del Monte Tuerca, con Regirock, Regice y Registeel en el equipo)","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo. Dónde: Monte Tuerca (nivel 68). Cómo: Sótano del Monte Tuerca. Consejo: Regigigas nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida (Pluma Lunar del puzle de Villa Horroris, llevada al Puente Progreso)","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Después del Hall de la Fama: resuelve el puzle de las casas de Villa Horroris (Ruta 13) para recibir la Pluma Lunar. Dónde: Puente Progreso (nivel 68). Cómo: Lleva la Pluma Lunar al Puente Progreso; Cresselia aparece en el centro. Consejo: Cresselia nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida (Montaña Reversia con la Piedra Magma de la Ruta 18)","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Después del Hall de la Fama: recoge la Piedra Magma en la Ruta 18. Dónde: Montaña Reversia (nivel 68). Cómo: Llévala a la Montaña Reversia; Heatran aparece en la sala del fondo. Consejo: Heatran nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"black-tower","label":"Llegar a la 10.ª zona del Rascacielos Negro (medalla «Ático Rascacielos»)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras entrar en el Hall de la Fama y volver a vencer a Mirto en Pueblo Ocre; después aparece Guayo y te manda al Rascacielos Negro. Solo en Pokémon Negro 2. Dónde: Rascacielos Negro, en Ciudad Negra. Paso a paso: 1) Vence a Iris en la Liga y luego a Mirto en Pueblo Ocre. 2) En el Rascacielos Negro habla con la recepcionista. Tiene 10 zonas: en cada una busca al Entrenador guardián, que tiene la llave de la compuerta, y vence después al Entrenador Jefe que espera tras ella. 3) Al acabar la zona 5 recibes la Clave Torre y la medalla «Mitad Rascacielos». 4) Las zonas 6 a 10 son más largas y sus Pokémon empiezan a nivel 65; en la última te espera Guayo, el nieto de Mirto. Al llegar a la 10.ª zona obtienes la medalla «Ático Rascacielos». 5) Tras vencerlo, Guayo te espera en casa de Mirto, en Pueblo Ocre, y te regala un Gible variocolor. Consejo: los entrenadores dan pistas para encontrar al guardián; si te retiras, pierdes el dinero ganado en el desafío. Fuente: WikiDex «Rascacielos Negro».","phase":3,"order":340}],"WHITE2":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, personajes y nuevas zonas de Teselia","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Negro/Blanco: tras la Liga se abre el este de Teselia (Ciudad Caolín y rutas 14-18), con Cintia, los Espadachines y Kyurem. Negro 2/Blanco 2: tras la Liga, Torre Duodraco, Ruinas Subterráneas (Regis), Nexárbol y Cintia en Pueblo Arenisca.","phase":2,"order":200},{"id":"battle0","label":"Superar Metro Batalla y sus rangos importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Metro Batalla (Ciudad Mayólica): líneas Individual, Doble y Múltiple. Los Jefes de Metro (Fero y Caril) aparecen en la victoria 21 de las líneas normales; ganarles abre la línea Súper, donde vuelven en la victoria 49.","phase":3,"order":300},{"id":"items0","label":"Objetos clave de acceso a ruinas, cuevas y escenas legendarias","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Para las escenas legendarias: Orbe Oscuro (Negro 2) u Orbe Claro (Blanco 2), que te da N en el Palacio de N tras vencerle (entrada desde la Calle Victoria tras la Liga), para la Torre Duodraco, Pluma Lunar (Villa Horroris), Piedra Magma (Ruta 18) y las Claves del Teselia Link (Hierro e Iceberg) para las Ruinas Subterráneas.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Teselia (director del juego, oficinas de Game Freak, Calle Porcelana de Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto completes la Pokédex de Teselia (diploma regional) y, tras la Liga, la Nacional (segundo diploma). Dónde: Torre de Game Freak, primer edificio a la derecha de la Calle Porcelana de Ciudad Porcelana; las oficinas están en el piso 21 (así figura en la versión española). Paso a paso: 1) Captura todos los Pokémon de la Pokédex de Teselia; para los diplomas no hace falta tener los singulares. 2) Sube en ascensor a las oficinas y habla con el director del juego: te da el diploma de Teselia. 3) Repite con la Pokédex Nacional capturada (sin los singulares) para el segundo diploma. 4) Los diplomas aparecen en tu habitación de Pueblo Arcilla, junto a la televisión. Consejo: en la misma planta está Morimoto, que acepta un combate al día tras vencer al Alto Mando; en Negro 2/Blanco 2 también Nishino. Fuente: WikiDex «Game Freak», «Torre de Game Freak», «Pokédex» y «Pueblo Arcilla».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), habla con el director del juego en el Game Freak de Ciudad Porcelana.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: Pokédex de Teselia capturada (Profesora Encina)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando hayas capturado toda la Pokédex de Teselia. Dónde: laboratorio de la Profesora Encina en Pueblo Arcilla. Paso a paso: 1) Captura los 296 Pokémon de la Pokédex de Teselia de Negro 2/Blanco 2; no hace falta tener a los singulares Victini, Meloetta, Keldeo ni Genesect. 2) Ve a Pueblo Arcilla y habla con la Profesora Encina en su laboratorio para que evalúe tu Pokédex. 3) Te entrega el Amuleto Oval, que hace más fácil que aparezcan huevos en la guardería. Consejo: con solo ver los 296 ya consigues un premio previo de la Profesora Encina, el permiso para ir a la Reserva Natural; el Amuleto Oval exige capturarlos. Para los exclusivos de la otra edición, recurre a los intercambios. Fuente: WikiDex «Amuleto Oval» y «Pueblo Arcilla»; Serebii «Pokédex Completion».","phase":6,"order":613},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (Profesora Encina, vía Carrasco)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, con la Pokédex Nacional capturada. Dónde: Pueblo Arcilla, donde están Carrasco Encina y la Profesora Encina. Paso a paso: 1) Consigue la Pokédex Nacional: Carrasco la actualiza en tu casa después de que derrotes a la campeona Iris. 2) Captura todos los Pokémon de la Pokédex Nacional, salvo los singulares (por ejemplo Mew, Celebi, Jirachi, Arceus o Victini). 3) Ve a Pueblo Arcilla y habla con Carrasco: te dirá que su hija tiene un regalo para ti. 4) La Profesora Encina te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor, tanto salvajes como por crianza. Consejo: para los Pokémon de generaciones anteriores usa el Pokétransfer desde Diamante, Perla, Platino, Oro HeartGold y Plata SoulSilver. Fuente: WikiDex «Amuleto Iris» y «Pokédex Nacional»; Serebii «Pokédex Completion».","phase":6,"order":616},{"id":"final-boss-cynthia","label":"Vencer a Cintia en su casa de Pueblo Arenisca tras la Liga","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de entrar en el Hall de la Fama, en primavera o en verano (ella dice que el resto del año está en Sinnoh). Dónde: su casa de Pueblo Arenisca, la de Catleya, a la izquierda del Centro Pokémon; además participa en el Pokémon World Tournament, al sur de Ciudad Fayenza. Paso a paso: 1) Termina la historia y vence a la campeona Iris. 2) Espera a que el mes corresponda a primavera o verano. 3) Ve a Pueblo Arenisca, entra en la casa y habla con Cintia para combatir: Spiritomb, Milotic, Togekiss, Lucario y Glaceon a nivel 76 y Garchomp a nivel 78. 4) Puedes volver a combatir con ella una vez al día. 5) También puedes encontrarla en el Torneo Campeones del Pokémon World Tournament, con equipos a nivel 50; allí su primer Pokémon siempre es Garchomp. Consejo: lleva respuestas para Garchomp (tipo Hielo o Dragón) y ataques que no fallen contra Spiritomb, que usa Doble Equipo. Fuente: WikiDex «Cintia», «Pueblo Arenisca» y «Pokémon World Tournament»; Serebii «Strong Trainers».","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto y a Nishino en las oficinas de Game Freak de Ciudad Porcelana","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: Nishino combate desde antes de la Liga y cambia de equipo tras vencer al Alto Mando. Para Morimoto, WikiDex «Torre de Game Freak» recoge también un combate previo a la Liga, pero WikiDex «Game Freak» y Serebii lo sitúan tras ella; si no te reta, termina la historia. Cada uno acepta un combate al día. Dónde: Torre de Game Freak, en la Calle Porcelana de Ciudad Porcelana; oficinas en el piso 21 (versión española). Paso a paso: 1) Sube en ascensor a las oficinas. 2) Antes de la Liga, Nishino usa un Clefairy a nivel 16, y el combate previo de Morimoto es con Pansage, Pansear y Panpour a nivel 14. 3) Tras entrar en el Hall de la Fama vuelve: los dos llevan equipos a nivel 76 (Nishino con Clefable, Wigglytuff y Azumarill, entre otros; Morimoto con Liepard y los tres monos), o a nivel 78 en el Modo Reto. 4) Repite cada día si quieres. Consejo: en la misma sala está el director del juego, que entrega los diplomas de la Pokédex. Fuente: WikiDex «Game Freak» y «Torre de Game Freak»; Serebii «Strong Trainers».","phase":3,"order":390},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 13 (nivel 45); Ruta 13 (nivel 65). Cómo: Ruta 13, en un claro al que se llega por la playa. Consejo: Cobalion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 22 (nivel 45); Ruta 22 (nivel 65). Cómo: Ruta 22. Consejo: Terrakion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Ruta 11 (nivel 45); Ruta 11 (nivel 65). Cómo: Ruta 11. Consejo: Virizion nivel 45. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Después de capturar a Reshiram en la Torre Duodraco. Dónde: Boquete Gigante (nivel 70). Cómo: Boquete Gigante, en la cueva del fondo. Consejo: Kyurem nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":265},{"id":"pokemon-643","label":"Registrar a Reshiram en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":643,"auto":null,"how":"Cuándo: Después del Hall de la Fama: entra en el Palacio de N desde la Calle Victoria, vence a N y a su Reshiram y te da el Orbe Claro. Dónde: Torre Duodraco (nivel 70). Cómo: Lleva el Orbe Claro a lo alto de la Torre Duodraco para invocar a Reshiram. Consejo: Reshiram nivel 70; captúralo antes de Kyurem. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Solar de los Sueños (nivel 68). Cómo: Solar de los Sueños, en la zona del fondo. Consejo: Latias nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"medals","label":"Conseguir las 255 medallas del Medallero","category":"Reconocimiento","tier":2,"species":null,"auto":null,"how":"El Medallero de Ciudad Gres (sala de la Liga de Medallas) registra 255 medallas de cinco tipos: Avance (historia), Aventura, Batalla, Conexión y Especiales. Ve a por ellas en este orden: las de Avance salen solas con la historia; las de Aventura y Batalla, jugando (pesca, bici, cajas, evoluciones, instalaciones de combate); cada vez que el señor de la Liga de Medallas te llama, recoge las nuevas y sube de rango. Las de Conexión que exigían Pokémon Global Link, la GTS, los combates aleatorios por Wi-Fi, Pokémon Dream Radar o eventos ya no se pueden ganar jugando porque esos servicios cerraron. El bloque del Medallero guarda cada medalla y su fecha. Con Pokekeep: abre la partida, pestaña SAV, botón «Insignias» (Editor de Insignias): marca las que falten una a una o pulsa «Dar todas», y después «Guardar»; finalmente exporta la partida.","phase":6,"order":680},{"id":"pwt","label":"Completar el Torneo Campeones del Pokémon World Tournament","category":"Combates","tier":0,"species":null,"auto":null,"how":"Pokémon World Tournament (junto a Ciudad Fayenza, tras la Liga): gana el Torneo Campeones contra los campeones de todas las regiones.","phase":3,"order":310},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Todas las películas requeridas de Estudios Cinematográficos Pokéwood","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por terminar las películas exigidas de Estudios Cinematográficos Pokéwood (Ciudad Hormigón): rueda cada película siguiendo el guion hasta el final bueno.","phase":6,"order":620},{"id":"card-3","label":"Torneo Campeones de PWT","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Pokémon World Tournament (junto a Ciudad Fayenza): gana los torneos regionales para desbloquear el Torneo Campeones y gánalo.","phase":6,"order":630},{"id":"card-4","label":"Nexárbol a nivel 30 en negro y en blanco (Zona Nexo)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por subir el Nexárbol a nivel 30 tanto en el Bosque Blanco como en la Ciudad Negra (Zona Nexo, misiones y visitas).","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando la ficha de entrenador alcanza su último nivel (no tiene estrellas: cambia de color; en Negro/Blanco empieza en verde y en Negro 2/Blanco 2 en azul). Dónde: cualquier Centro Pokémon de Teselia. Paso a paso: 1) Cumple los cinco logros de la ficha. En Negro/Blanco: superar la Liga Pokémon, completar la Pokédex Nacional (sin los singulares), reunir todos los complementos del Musical, lograr 49 victorias seguidas en el Super Metro Individual y en el Super Metro Doble del Metro Batalla y llevar el Nexárbol a nivel 30 tanto en el nivel negro como en el blanco. En Negro 2/Blanco 2: superar la Liga, completar la Pokédex Nacional (sin los singulares), completar todas las películas de los Estudios Cinematográficos Pokéwood, completar el Torneo Campeones del Pokémon World Tournament y el mismo nivel 30 del Nexárbol. 2) Con la ficha al máximo, pide a la Enfermera Joy que cure a tu equipo. 3) Lo curará sin decir nada, salvo si detecta Pokérus. Consejo: consulta la ficha desde el menú para ver su color actual. Fuente: WikiDex «Ficha de entrenador»; Serebii «The Trainer Card».","phase":6,"order":690},{"id":"event-0","label":"Victini, Keldeo, Meloetta y Genesect: eventos o distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Victini (Isla Libertad, con el Pase Libertad), Keldeo, Meloetta y Genesect solo llegaron por eventos (Meloetta y Genesect con historia propia en Negro 2/Blanco 2). Con Pokekeep: Añade el Pase Libertad (objeto clave) para jugar el evento de Victini, o los singulares legales desde la Librería.","phase":7,"order":700},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida (tras el final, desde la Cueva Psique (Ruta 20): ante el Museo de Ciudad Esmalte, en un punto concreto)","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras entrar en la Cueva Psique (Ruta 20, junto a Pueblo Ocre). Dónde: Ciudad Esmalte (nivel 65). Cómo: Uxie aparece en un punto concreto delante del Museo de Ciudad Esmalte. Consejo: Uxie nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida (en la cima de la Torre de los Cielos, en un punto concreto)","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras entrar en la Cueva Psique. Dónde: Torre de los Cielos (nivel 65). Cómo: En la cima de la Torre de los Cielos, en un punto concreto. Consejo: Mesprit nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":221},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida (en el lado izquierdo de la Ruta 23, en un punto concreto)","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras entrar en la Cueva Psique. Dónde: Ruta 23 (nivel 65). Cómo: En el lado izquierdo de la Ruta 23, en un punto concreto. Consejo: Azelf nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":222},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida (Ruinas Subterráneas del Túnel Yakón: 6 pasos abajo y 9 a la derecha desde el centro y pulsa abajo)","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Sala Pico Roca (nivel 65). Cómo: Activa la Clave Pico Roca en el sistema de claves (Teselia Link) y entra en las Ruinas Subterráneas del Túnel Yakón: desde el centro, 6 pasos abajo y 9 a la derecha, y pulsa abajo para abrir la Sala Pico Roca. Consejo: Regirock nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida (con la llave de Regice del Teselia Link («Iceberg Key» en inglés) en las mismas ruinas)","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Con la Clave Iceberg activada en el Teselia Link (llave de Regice). Dónde: Sala Iceberg (nivel 65). Cómo: Ruinas Subterráneas, Sala Iceberg. Consejo: Regice nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida (con la llave de Registeel («Iron Key»), que puede enviarte un amigo con Negro 2)","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Con la Clave Hierro, que hay que recibir de un amigo con Negro 2. Dónde: Sala Hierro (nivel 65). Cómo: Ruinas Subterráneas, Sala Hierro. Consejo: Registeel nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":232},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida (sótano del Monte Tuerca, con Regirock, Regice y Registeel en el equipo)","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo. Dónde: Monte Tuerca (nivel 68). Cómo: Sótano del Monte Tuerca. Consejo: Regigigas nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida (Pluma Lunar del puzle de Villa Horroris, llevada al Puente Progreso)","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Después del Hall de la Fama: resuelve el puzle de las casas de Villa Horroris (Ruta 13) para recibir la Pluma Lunar. Dónde: Puente Progreso (nivel 68). Cómo: Lleva la Pluma Lunar al Puente Progreso; Cresselia aparece en el centro. Consejo: Cresselia nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida (Montaña Reversia con la Piedra Magma de la Ruta 18)","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Después del Hall de la Fama: recoge la Piedra Magma en la Ruta 18. Dónde: Montaña Reversia (nivel 68). Cómo: Llévala a la Montaña Reversia; Heatran aparece en la sala del fondo. Consejo: Heatran nivel 68. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"treehollow","label":"Llegar a la 10.ª zona del Cavernogal Blanco (medalla «Cavernogal Abismal»)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras vencer a Iris en la Liga Pokémon y después a Mirto en Pueblo Ocre, que te abre el Cavernogal Blanco. Solo en Pokémon Blanco 2. Dónde: Cavernogal Blanco, bajo el gran nogal del Bosque Blanco. Paso a paso: 1) Vence a Iris en la Liga y luego a Mirto en Pueblo Ocre. 2) Entra en el Cavernogal Blanco: tiene 10 zonas repartidas en 19 plantas subterráneas; en cada una busca al Entrenador guardián, que tiene la llave de la compuerta, y vence al Entrenador Jefe de la zona. 3) Al acabar la zona 5 recibes la Clave Torre y la medalla «Cavernogal Profundo». 4) Sigue hasta la zona 10, donde te espera Guayo, el nieto de Mirto; al llegar a ella obtienes la medalla «Cavernogal Abismal». 5) Tras vencerlo, Guayo vuelve a Pueblo Ocre y allí te regala un Dratini variocolor de nivel 1 con Repartir Experiencia. Consejo: algunos entrenadores dan pistas sobre quién tiene la llave; habla con ellos antes de recorrer la zona entera. Fuente: WikiDex «Cavernogal Blanco» y «Rascacielos Negro».","phase":3,"order":340}],"X":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar el capítulo de Handsome (los seis episodios posteriores a la Liga)","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Cuándo: tras vencer a Dianta en la Liga y cumplir lo que pide WikiDex: recibir del Profesor Ciprés el abono del TMV en la estación de Ciudad Luminalia, ir en tren a Ciudad Batik, combatir al menos una vez en la Mansión Batalla, vencer allí a tu rival, hablar con Ciprés en Ciudad Fluxus y mejorar el Megaaro tocando su reloj de sol. Dónde: Handsome & Cía., en Ciudad Luminalia, en una calle estrecha entre la Plaza Roja y el Bulevar Norte. Paso a paso: 1) Entra en Ciudad Luminalia por uno de sus accesos (no volando): recibirás una llamada en el Holomisor que te pide pasar por Handsome & Cía. 2) Allí Handsome te propone ser su socio. 3) Resuelve los seis capítulos, que transcurren por toda Ciudad Luminalia: conocerás a Matière y a la misteriosa Esprit, y en el quinto aparece Malva del Alto Mando. 4) Cada capítulo empieza al volver al despacho o con una llamada. 5) El epílogo acaba al cerrarse el sexto capítulo. Consejo: si la llamada no llega, revisa que hayas mejorado el Megaaro en Ciudad Fluxus. Fuente: WikiDex «Looker & Cía./Handsome & Cía.»; Serebii «Looker Bureau».","phase":2,"order":200},{"id":"battle0","label":"Vencer a una Dama del Combate en racha de 50 en Mansión Batalla","category":"Combates","tier":1,"species":null,"auto":null,"how":"Mansión Batalla de Ciudad Batik (tras la Liga; se llega en el tren TMV desde Ciudad Luminalia; en ROZA está en el Resort Batalla): Individual, Doble, Triple, Rotatoria y Múltiple. Hay que vencer a una Dama del Combate en la 50.ª batalla consecutiva (en Super).","phase":3,"order":300},{"id":"items0","label":"Mega-Aro y mejoras necesarias para megapiedras y encuentros","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Mega-Aro: te lo da Corelia en la Torre Maestra de Ciudad Yantra, tras vencerla con el Lucario que te regala; las megapiedras van llegando por la historia y por la posliga (tienda y rutas de noche, con el Amuleto Iris la búsqueda es más fácil).","phase":0,"order":500},{"id":"pokedex","label":"Ver todas las especies requeridas de la Pokédex de Kalos","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Ve todas las especies de las tres Pokédex de Kalos (Central, Costa y Montaña). Las exclusivas de la otra edición basta con verlas en combate o intercambio. Con Pokekeep: Las que te falten por intercambio, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diplomas de las Pokédex de Kalos Centro, Costa y Montaña y de Kalos completa (director del juego, Hotel de Ciudad Témpera)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto completes cada Pokédex de zona (Kalos Centro, Costa y Montaña), las tres juntas y, tras la Liga, la Nacional. Dónde: Hotel Témpera, en Ciudad Témpera; el director del juego está en la última habitación del pasillo. Paso a paso: 1) Completa la Pokédex de Kalos Centro. WikiDex no es coherente: en «Game Freak» basta con verlos, y en «Pokédex» se exige capturarlos salvo los singulares; si no te lo da al verlos, captúralos. 2) Ve al hotel y habla con el director: te da el diploma de esa Pokédex. 3) Haz lo mismo con Kalos Costa y Kalos Montaña. 4) Con las tres completas, recibe el diploma regional de Kalos. 5) Con la Pokédex Nacional completa (sin los singulares) recibes el último diploma. 6) Los diplomas se envían solos a tu habitación. Consejo: el Safari Amistad de Ciudad Batik ayuda a completar la Pokédex. Fuente: WikiDex «Game Freak», «Ciudad Témpera», «Hoteles de Kalos» y «Pokédex».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Ciudad Témpera)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), habla con el director del juego en el lugar que indica el título del objetivo.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: ver toda la Pokédex de Kalos (Profesor Ciprés)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto hayas visto todos los Pokémon de las tres Pokédex de Kalos. Dónde: laboratorio del Profesor Ciprés, en el Bulevar Sur de Ciudad Luminalia. Paso a paso: 1) Registra como vistos todos los Pokémon de Kalos Centro, Kalos Costa y Kalos Montaña. No hacen falta Articuno, Zapdos, Moltres, Diancie, Hoopa ni Volcanion. 2) Ve al laboratorio de Ciudad Luminalia y habla con el Profesor Ciprés para que evalúe tu Pokédex. 3) Te entrega el Amuleto Oval, que hace más fácil encontrar huevos en la guardería. Consejo: basta con verlos, no con capturarlos: los combates contra entrenadores y los intercambios registran muchos Pokémon como vistos. Fuente: WikiDex «Amuleto Oval» y «Laboratorio del profesor Ciprés».","phase":6,"order":613},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (Profesor Ciprés)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (sin singulares de evento), habla con el profesor Ciprés en su laboratorio de Ciudad Luminalia: te da el Amuleto Iris.","phase":6,"order":610},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Después de vencer al Alto Mando. Dónde: Mazmorra Rara (nivel 70). Cómo: Mazmorra Rara: se llega surfeando desde la Aldea Pokémon (Ruta 20). Consejo: Mewtwo nivel 70; lleva la Master Ball si la conservas. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Cueva Desenlace (nivel 70). Cómo: Cueva Desenlace (Ruta 18) nde: Handsome & Cía., en Ciudad Luminalia, en una calle estrecha entre la Plaza Roja y el Bulevar Norte. Paso a paso: 1) Entra en Ciudad Luminalia por uno de sus accesos (no volando): recibirás una llamada en el Holomisor que te pide pasar por Handsome & Cía. 2) Allí Handsome te propone ser su socio. 3) Resuelve los seis capítulos, que transcurren por toda Ciudad Luminalia: conocerás a Matière y a la misteriosa Esprit, y en el quinto aparece Malva del Alto Mando. 4) Cada capítulo empieza al volver al despacho o con una llamada. 5) El epílogo acaba al cerrarse el sexto capítulo. Consejo: si la llamada no llega, revisa que hayas mejorado el Megaaro en Ciudad Fluxus. Fuente: WikiDex «Looker & Cía./Handsome & Cía.»; Serebii «Looker Bureau».","phase":2,"order":200},{"id":"battle0","label":"Vencer a una Dama del Combate en racha de 50 en Mansión Batalla","category":"Combates","tier":1,"species":null,"auto":null,"how":"Mansión Batalla de Ciudad Batik (tras la Liga; se llega en el tren TMV desde Ciudad Luminalia; en ROZA está en el Resort Batalla): Individual, Doble, Triple, Rotatoria y Múltiple. Hay que vencer a una Dama del Combate en la 50.ª batalla consecutiva (en Super).","phase":3,"order":300},{"id":"items0","label":"Mega-Aro y mejoras necesarias para megapiedras y encuentros","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Mega-Aro: te lo da Corelia en la Torre Maestra de Ciudad Yantra, tras vencerla con el Lucario que te regala; las megapiedras van llegando por la historia y por la posliga (tienda y rutas de noche, con el Amuleto Iris la búsqueda es más fácil).","phase":0,"order":500},{"id":"pokedex","label":"Ver todas las especies requeridas de la Pokédex de Kalos","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Ve todas las especies de las tres Pokédex de Kalos (Central, Costa y Montaña). Las exclusivas de la otra edición basta con verlas en combate o intercambio. Con Pokekeep: Las que te falten por intercambio, añádelas legal tegory":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"final-boss","label":"Vencer a Máximo con su equipo reforzado al volver a la Liga de Hoenn","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: la segunda vez (y las siguientes) que desafías la Liga Pokémon, es decir, tras haberte proclamado campeón una vez. Dónde: Liga Pokémon de Hoenn, en Ciudad Colosalia. Paso a paso: 1) Gana la Liga por primera vez. 2) Vuelve a Ciudad Colosalia y desafía de nuevo al Alto Mando. 3) Vence a Máximo con su equipo reforzado: Skarmory, Claydol, Aggron, Carbink y Aerodactyl a nivel 77 y Metagross a nivel 79, que megaevoluciona. Todos sus Pokémon tienen al menos una inmunidad de tipo. 4) Tras derrotarlo por segunda vez te entrega la Metagrossita. Consejo: Mega-Metagross puede barrerte; lleva ataques potentes de tipo Fuego o Tierra y algún Pokémon rápido. Fuente: WikiDex «Steven Stone/Máximo Peñas» y «Metagrossita».","phase":3,"order":390},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (equipo de Game Freak, Motel Aguacala de Ciudad Calagua)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Hoenn completa, habla con el equipo de Game Freak en el Motel Aguacala (Ciudad Calagua).","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (Motel Aguacala)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin los singulares de evento; Deoxys sí cuenta), habla con el equipo de Game Freak en el Motel Aguacala de Ciudad Calagua.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: ver toda la Pokédex de Hoenn (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto hayas visto todos los Pokémon de la Pokédex de Hoenn. Dónde: laboratorio del Profesor Abedul, en Villa Raíz. Paso a paso: 1) Registra como vistos todos los Pokémon de la Pokédex de Hoenn. No hacen falta Jirachi ni Deoxys. 2) Ve a Villa Raíz y habla con el Profesor Abedul en su laboratorio para que evalúe tu Pokédex. 3) Te entrega el Amuleto Oval, que hace más fácil que aparezca un huevo en la guardería. Consejo: basta con verlos: el DexNav, los combates contra entrenadores y los intercambios registran Pokémon como vistos sin necesidad de capturarlos. Fuente: WikiDex «Amuleto Oval» y «Pueblo Raíz Chica/Villa Raíz».","phase":6,"order":613},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada, Deoxys incluido (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (Deoxys incluido, sin el resto de singulares de evento), el profesor Abedul te da el Amuleto Iris en su laboratorio de Villa Raíz.","phase":6,"order":610},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo; antes o después de la Liga. Dónde: Ruinas del Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) y lee el braille. Regirock está en las Ruinas del Desierto (Ruta 111): usa Golpe Roca en el centro de la sala. Consejo: Regirock nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":205},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105): espera dentro sin moverte hasta que se abra la puerta. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":206},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): ponte en el centro y usa Vuelo. Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":207},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Durante el Episodio Delta (posliga). Dónde: Pilar Celeste (nivel 70). Cómo: En la cima del Pilar Celeste, tras despertarlo con Zinnia. Es obligatorio para seguir el episodio. Consejo: Rayquaza nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Durante la historia, antes de la octava medalla. Dónde: Cueva Ancestral (nivel 45). Cómo: Cueva Ancestral de Arrecípolis: tras la regresión primigenia de Groudon, enfréntate a él al fondo. Consejo: Groudon nivel 45; si lo debilitas, vuelve tras la Liga. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-386","label":"Registrar a Deoxys en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":386,"auto":null,"how":"Cuándo: Al terminar el Episodio Delta. Dónde: Pilar Celeste (nivel 80). Cómo: Vuelve con Rayquaza (megaevolucionado) al espacio y de nuevo a la cima del Pilar Celeste: Deoxys te espera. Consejo: Deoxys nivel 80. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Durante la historia, al cruzar el mar de la Ruta 118. Dónde: Isla del Sur (nivel 30). Cómo: El otro Pokémon eón te lleva a la Isla del Sur; tras vencer al equipo villano, este se une a tu equipo (regalo). Después te da la Flauta Eón para volar. Consejo: Nivel 30, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Ver todas las especies requeridas de la Pokédex de Hoenn","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por haber visto todas las especies de la Pokédex de Hoenn. Las de la otra edición cuentan si las ves en combate o intercambio; el Pokénav (DexNav) ayuda a encontrar las que faltan.","phase":6,"order":610},{"id":"card-2","label":"Derrotar a una Dama del Combate en la 50.ª batalla consecutiva de Mansión Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a una Dama del Combate en la 50.ª batalla consecutiva de la Mansión Batalla.","phase":6,"order":620},{"id":"event-0","label":"Mew, Deoxys o Jirachi mediante distribuciones o islas de evento disponibles según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew (Isla Suprema, Mapa Viejo de Esmeralda), Deoxys (Isla Origen, Ori-Ticket de Rojo Fuego/Verde Hoja y Esmeralda) y Jirachi (disco de bonificación / Pokémon Channel) solo llegaron por eventos. En Rubí Omega/Zafiro Alfa, Deoxys sí está en el juego (Episodio Delta). Con Pokekeep: Añade el objeto de evento (Mapa Viejo o Ori-Ticket) y activa su bandera para jugar el evento, o añade el singular legal desde la Librería.","phase":7,"order":700},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida (Cueva Insular de día, con Regirock, Regice y Registeel en el equipo y Regice con mote y un objeto helado)","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: De día, tras capturar o vencer a Groudon/Kyogre y con Regirock, Regice y Registeel en el equipo. Dónde: Cueva Insular (nivel 50). Cómo: Cueva Insular (Ruta 105). Regice debe tener mote y llevar un Porcehelado, una Bola de Nieve o un Antiderretir. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-250","label":"Registrar a Ho-Oh en la Pokédex de esta partida (Malvamar: lleva el escáner del sótano al capitán de Ciudad Portual, que te da el Cascabel Claro; tócalo en la cubierta)","category":"Legendarios","tier":1,"species":250,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Malvamar (nivel 50). Cómo: Malvamar: lleva el escáner del sót
