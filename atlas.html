function masteryGoals(g){return MASTER_DATA[g.id]||[];}
function masteryProof(goal,g){
 const e=evidenceFor(g);
 if(!e)return null;
 if(goal.auto==='gameClear' && e.gameClear===true)return 'Hall de la Fama / fin registrado en el guardado';
 if(Number.isInteger(goal.species) && e.caught.includes(goal.species))return 'Especie registrada en la Pokédex del guardado';
 return null;
}

 ${!e?'<div class="notice">No hay diagnóstico importado para esta edición. Puedes continuar marcando logros comprobados o exportar el diagnóstico desde el lector de guardados. <button class="btn" id="mastery-import">Importar diagnóstico JSON</button></div>':`<div class="notice"><strong>Datos de partida:</strong> ${esc(e.trainer||'Entrenador')} · ${e.caughtCount} capturados · ${e.badgesTotal??'—'} medallas · Liga ${e.gameClear?'registrada':'sin prueba en este diagnóstico'}. El guardado no demuestra todos los objetivos del expediente.</div>`}

function catalog(){return `<div class="notice">Incluye 39 variantes de la serie principal y remakes, con expansiones agrupadas por edición. La generación se refiere a la clasificación de la serie, no a la región donde transcurre. La cobertura nueva es una <b>ruta base estructurada</b>, no una certificación completa de cada evento o entrenador. Las seis ediciones con lector comprobado siguen en la guía clásica.</div><div class="gen-tabs">${Array.from({length:9},(_,i)=>`<button class="btn ${genFilter===i+1?'primary':''}" data-gen="${i+1}">Gen ${i+1}</button>`).join('')}</div><div class="game-grid">${CATALOG.games.filter(g=>g.generation===genFilter).map(g=>`<button class="game ${store.game===g.id?'active':''}" data-game="${g.id}"><strong>${esc(g.name)}</strong><small>${g.missions.length} misiones · ${pct(g)}% marcado</small><div class="progress"><span style="width:${pct(g)}%"></span></div></button>`).join('')}</div><div class="panel"><h3>Nuevo: Maestría 100 %</h3><p class="muted">Abre «🎯 Maestría 100 %» para comprobar los requisitos importantes de tu edición. Las casillas del Atlas son distintas de los premios y las pruebas que puede leer un guardado.</p></div><div class="panel"><h3>Qué significa 100 %</h3><p class="muted">Las marcas de esta página son el progreso que confirmas tú. No acreditan por sí solas la tarjeta, el pasaporte o el registro de Pokémon. La certificación requiere pruebas específicas en el guardado o en pantallas del juego.</p></div>`}
function missions(){const g=game(store.game);const next=g.missions.find(m=>!missionDone(m)&&evidenceState(m,g)?.status!=='capturado')||g.missions.find(m=>!missionDone(m));const display=g.missions.filter(m=>(!pending||!missionDone(m))&&(!textFilter||(m.title+' '+m.steps.join(' ')+' '+m.caution).toLowerCase().includes(textFilter.toLowerCase())));return `<div class="grid"><div class="metric"><strong>${g.missions.filter(missionDone).length}/${g.missions.length}</strong><small>Misiones marcadas</small></div><div class="metric"><strong>${count(g)}/${total(g)}</strong><small>Pasos marcados</small></div><div class="metric"><strong>${pct(g)}%</strong><small>Progreso manual</small></div></div><div class="notice"><b>Edición: ${esc(g.name)}</b>${g.variant.length?' · Legendario/elemento distintivo: '+esc(g.variant.join(' · ')):''}<br>${esc(g.coverage)}. Las tareas no se completan automáticamente por una captura en Pokédex.</div>${evidenceFor(g)?`<div class="notice"><b>Partida importada:</b> ${esc(evidenceFor(g).trainer||'Entrenador sin nombre')} · ${evidenceFor(g).caughtCount} capturados · <a href="#" data-view="diagnostic">Abrir diagnóstico</a>. Las misiones con capturas acreditadas se identificarán, pero no se cerrarán solas.</div>`:''}${next?`<div class="panel"><span class="eyebrow">Siguiente objetivo no confirmado</span><h2>${esc(next.title)}</h2><p class="muted">${esc(next.steps[0])}</p><button class="btn primary" data-focus="${next.id}" style="margin-top:12px">Ir a esta misión ↓</button></div>`:'<div class="panel">Has marcado todas las instrucciones de esta ruta. Comprueba ahora las recompensas oficiales y los objetivos adicionales del juego.</div>'}<div class="filters"><input type="search" id="search" value="${esc(textFilter)}" placeholder="Buscar misión, objeto o requisito"><label class="filterline"><input type="checkbox" id="pending" ${pending?'checked':''}> Solo pendientes</label></div><p class="small">${display.length} de ${g.missions.length} misiones visibles. Cada casilla es independiente; abre una misión para ver sus pasos.</p>${display.map(m=>`<details class="card" data-mid="${m.id}" id="${m.id}"><summary><span class="count">${m.steps.filter((_,i)=>checked(m.id,i)).length}/${m.steps.length}</span><span class="t"><strong>${esc(m.title)}</strong><small>${esc(m.section)}${m.verified==='referencia'?' · ruta contrastada':m.verified==='revisión guiada'?' · detalles ampliados':' · recorrido introductorio'}${missionDone(m)?' · completada manualmente':''}${evidenceState(m,g)?.status==='capturado'?' · ✓ captura registrada':evidenceState(m,g)?.status==='visto'?' · ◉ visto':''}</small></span></summary><section>${m.steps.map((step,i)=>`<div class="step"><input id="${m.id}-${i}" data-check="${m.id}" data-idx="${i}" type="checkbox" ${checked(m.id,i)?'checked':''}><label for="${m.id}-${i}">${esc(step)}</label></div>`).join('')}${evidenceState(m,g)?`<div class="notice"><b>Pokédex: ${esc(evidenceState(m,g).label)}</b> · ${esc(evidenceState(m,g).status)}. Esto no demuestra que el encuentro específico se haya completado en su ubicación.</div>`:''}<div class="warn"><b>Antes de darla por cerrada:</b> ${esc(m.caution)}</div>${m.source?`<p class="small"><a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">Consultar guía de referencia ↗</a></p>`:''}<p class="small" style="margin-top:10px">Fuente de progreso: confirmación manual. No equivale a un indicador verificado de PKHeX.</p></section></details>`).join('')||'<div class="notice">No hay misiones para los filtros seleccionados.</div>'}`}
function history(){const list=store.history.filter(h=>h.game===store.game);return `<div class="notice">Cronología de acciones que has registrado en este Atlas. El historial original dentro de cada cartucho no se reconstruye a partir de estas casillas.</div><div class="panel">${list.length?list.slice(0,300).map(h=>`<div class="history-item"><small>${esc(new Date(h.at).toLocaleString('es-ES'))}</small><p><b>${esc(h.label)}</b> · ${String(h.id||'').includes(':')?'objetivo de expediente':'paso '+(h.step+1)} · ${h.value?'marcado':'desmarcado'}</p></div>`).join(''):'Todavía no has marcado pasos en esta edición.'}</div>`}

const DOSSIER={
  1:[['Historia','Conseguir las ocho medallas y entrar en el Hall de la Fama'],['Pokédex','Completar las entradas capturables, revisando exclusivos de versión e intercambios'],['Capturas únicas','Revisar legendarios, fósil escogido, premios únicos y los tres iniciales'],['Entrenadores','Recorrer rutas y derrotar a los entrenadores accesibles'],['Objetos','Verificar MT, objetos únicos y zonas ocultas'],['Histórico','Registrar métodos de intercambio o distribuciones que ya no están operativas']],
  2:[['Historia','Completar Johto y Kanto, 16 medallas y vencer a Rojo'],['Pokédex','Completar Pokédex de Johto y Nacional según edición y conectividad'],['Capturas únicas','Revisar bestias errantes, aves, Lugia, Ho-Oh y Celebi por evento'],['Desafíos','Revisar Torre Batalla y contenido de postgame de la edición'],['Objetos','Revisar MO, objetos únicos, regalos y eventos semanales'],['Histórico','Separar eventos originales de restauraciones no oficiales']],
  3:[['Historia','Ocho medallas, Liga y final de la historia correspondiente'],['Pokédex','Completar Pokédex regional y Nacional con intercambios pertinentes'],['Capturas únicas','Legendarios, fósiles y regalos disponibles según edición'],['Combate','Revisar Frente Batalla u otra instalación disponible'],['Coleccionables','Concursos, bases secretas, cintas y recompensas propias de la edición'],['Histórico','Documentar eventos de distribución y conectividad original']],
  4:[['Historia','Liga, postgame y enfrentamientos únicos disponibles'],['Pokédex','Completar Pokédex Nacional y exclusivas mediante intercambios'],['Capturas únicas','Legendarios, eventos y regalos únicos'],['Combate','Frente Batalla / Torre Batalla según edición'],['Coleccionables','Concursos, Pokéathlon, hojas brillantes, subsuelo y otros retos según edición'],['Reconocimiento','Conseguir máximo nivel de tarjeta de entrenador en esta edición']],
  5:[['Historia','Completar historia principal, postgame y segunda Liga si corresponde'],['Pokédex','Revisar Pokédex regional y Nacional'],['Capturas únicas','Legendarios, regalos y encuentros especiales por versión'],['Combate','Instalaciones de combate y retos exclusivos'],['Coleccionables','Medallas de Teselia en las secuelas cuando proceda'],['Reconocimiento','Verificar todos los hitos oficiales de la tarjeta']],
  6:[['Historia','Superar Liga y episodios posteriores de la edición'],['Pokédex','Completar Pokédex regional y Nacional aplicable'],['Capturas únicas','Legendarios y eventos por edición, incluidos métodos históricos'],['Combate','Instalaciones de combate y sus recompensas'],['Coleccionables','Concursos, bases secretas y otros retos exclusivos cuando existan'],['Reconocimiento','Conseguir el máximo nivel de tarjeta correspondiente']],
  7:[['Historia','Completar el desafío insular y episodios posteriores, o la Liga de Kanto de Let’s Go'],['Pokédex','Completar Pokédex aplicable y variantes'],['Capturas únicas','Ultraumbrales / ultracriaturas / legendarios o especiales por edición'],['Combate','Árbol de Combate y otras pruebas cuando correspondan'],['Coleccionables','Pegatinas dominantes, fotos, títulos y regalos según edición'],['Reconocimiento','Verificar sellos del Pasaporte o logros equivalentes según juego']],
  8:[['Historia','Superar Liga o historia principal y completar el postgame'],['Pokédex','Completar Pokédex regional y de expansiones disponibles'],['Capturas únicas','Legendarios, míticos y encuentros únicos por edición'],['Combate','Instalaciones, torneos y desafíos repetibles'],['Coleccionables','DLC, misiones opcionales y colecciones específicas'],['Reconocimiento','Verificar recompensas oficiales, sin aplicar estrellas de juegos anteriores']],
  9:[['Historia','Completar todas las rutas de historia y el postgame de la edición'],['Pokédex','Completar Pokédex y variantes conforme a esta edición'],['Capturas únicas','Legendarios, encuentros especiales y regalos disponibles'],['Combate','Revisar desafíos avanzados, revanchas y recompensas'],['Coleccionables','Contenido adicional y DLC que corresponda, no asumido'],['Histórico','Separar contenido obtenible actualmente de eventos temporales']],
};
const EXTRAS={
 'SOULSILVER':[['Reconocimiento','Tarjeta negra de cinco estrellas'],['Puzles','Cuatro cámaras y 28 Unown en Ruinas Alfa'],['Histórico','Revisar Celebi, Ruinas Sinjoh y Piedra Enigma']],
 'HEARTGOLD':[['Reconocimiento','Tarjeta negra de cinco estrellas'],['Puzles','Cuatro cámaras y 28 Unown en Ruinas Alfa']],
 'BLACK2':[['Coleccionables','Medallero de 255 medallas y fechas'],['Combate','Pokémon World Tournament y Árbol Nexo'],['Reconocimiento','Tarjeta del máximo nivel']],
 'WHITE2':[['Coleccionables','Medallero de 255 medallas y fechas'],['Combate','Pokémon World Tournament y Árbol Nexo'],['Reconocimiento','Tarjeta del máximo nivel']],
 'ULTRASUN':[['Reconocimiento','Quince sellos del Pasaporte'],['Coleccionables','Cien pegatinas dominantes']],
 'ULTRAMOON':[['Reconocimiento','Quince sellos del Pasaporte'],['Coleccionables','Cien pegatinas dominantes']],
 'SCARLET':[['Contenido adicional','Completar La máscara turquesa y El disco índigo si están adquiridos']],
 'VIOLET':[['Contenido adicional','Completar La máscara turquesa y El disco índigo si están adquiridos']],
 'SWORD':[['Contenido adicional','Completar Isla de la Armadura y Nieves de la Corona si están adquiridos']],
 'SHIELD':[['Contenido adicional','Completar Isla de la Armadura y Nieves de la Corona si están adquiridos']],
 'ZA':[['Contenido adicional','Revisar contenido de Mega Dimension según disponibilidad']],
};
const READER_GAMES=new Set(['SOULSILVER','BLACK2','WHITE2','Y','OMEGARUBY','ULTRASUN']);
const goalsFor=g=>[...DOSSIER[g.generation],...(EXTRAS[g.id]||[])];
function dossier(){
 const g=game(store.game),goals=goalsFor(g),manual=store.goalChecks||{},completed=goals.filter((_,i)=>manual[g.id+':'+i]).length;
 const reader=READER_GAMES.has(g.id)?'Existe lector específico en la guía clásica, pero su exactitud varía según los indicadores.':'Todavía NO existe lector validado para los guardados de esta edición.';
 return `<div class="panel"><span class="eyebrow">Expediente de completismo · ${esc(g.name)}</span><h2>${completed} / ${goals.length} objetivos declarados</h2><p class="muted">No son estrellas ni certificados automáticos. Solo se marca lo que has comprobado; las condiciones oficiales varían por edición.</p><div class="progress"><span style="width:${Math.round(completed/goals.length*100)}%"></span></div></div><div class="notice"><strong>Lectura de partida:</strong> ${esc(reader)} ${READER_GAMES.has(g.id)?'<a href="./index.html">Abrir lector de guardados ↗</a>':''}<br><strong>Fuentes para contrastar:</strong> <a href="https://bulbapedia.bulbagarden.net/wiki/Core_series" target="_blank" rel="noreferrer">Serie principal</a> y <a href="https://bulbapedia.bulbagarden.net/wiki/Trainer_Card_level" target="_blank" rel="noreferrer">Tarjetas</a>.</div><div class="panel"><h3>Comprobaciones independientes</h3>${goals.map(([group,label],i)=>`<div class="step"><input type="checkbox" id="goal-${i}" data-goal="${i}" ${manual[g.id+':'+i]?'checked':''}><label for="goal-${i}"><small class="muted">${esc(group)}</small><br>${esc(label)}</label></div>`).join('')}</div><div class="notice">Una casilla significa «lo he comprobado», no «la aplicación lo ha leído de mi guardado». Esta lista es una auditoría orientativa; completar todos sus puntos no acredita el 100 % absoluto del juego.</div>`;
}

function diagnostic(){
 const g=game(store.game),e=evidenceFor(g);
 if(!e)return `<div class="panel"><h2>Importa evidencia de tu partida</h2><p class="muted">El Atlas no interpreta archivos .sav directamente. Para evitar errores, abre el lector clásico, carga tu .sav o main, exporta su diagnóstico JSON y vuelve aquí para importarlo. Las capturas se usarán como evidencias, sin cerrar rutas ni alterar tus marcas.</p><div class="actions" style="margin-top:14px"><a class="btn primary" href="./index.html">1. Abrir lector SAV</a><button class="btn" id="diag-import-inline">2. Importar diagnóstico JSON</button></div></div>`;
 const names=Object.entries(LEGEND_NAMES).filter(([id])=>e.caught.includes(+id)||e.seen.includes(+id));
 return `<div class="grid"><div class="metric"><strong>${e.caughtCount}</strong><small>Capturados según Pokédex</small></div><div class="metric"><strong>${e.seenCount}</strong><small>Vistos según Pokédex</small></div><div class="metric"><strong>${e.badgesTotal??'—'}</strong><small>Medallas registradas</small></div></div><div class="panel"><span class="eyebrow">Evidencia importada · ${esc(g.name)}</span><h2>${esc(e.trainer||'Entrenador')} · ${esc(formatTime(e.playtime))}</h2><p class="muted">Liga: ${e.gameClear?'registrada':'no acreditada'} · Pokédex Nacional: ${e.nationalDex?'desbloqueada':'no acreditada'} · Formato ${esc(e.format)}</p><p class="muted">Estos datos son registros actuales y no certifican el origen ni la secuencia de captura.</p><div class="actions" style="margin-top:14px"><a class="btn primary" href="./index.html">Actualizar SAV en lector</a><button class="btn" id="diag-import-inline">Importar nuevo diagnóstico</button></div></div><div class="panel"><h3>Legendarios registrados en el diagnóstico</h3>${names.length?names.map(([id,name])=>`<div class="step"><span style="min-width:26px;color:var(--gold)">#${id}</span><label>${esc(name)} — <b>${e.caught.includes(+id)?'capturado':'solo visto'}</b></label></div>`).join(''):'<p class="muted">No constan legendarios entre las especies analizadas.</p>'}</div><div class="notice"><b>Regla de seguridad:</b> haber registrado un legendario en la Pokédex no implica haber completado su ruta original, puzles o evento. La guía evita sugerir capturar de nuevo las especies acreditadas, pero deja abiertas las verificaciones de historia.</div>`;
}
function render(){document.title='Pokémon 100 % · '+game(store.game).name;el.innerHTML=`<div class="layout">${nav()}<main class="main">${topNav()}${view==='catalog'?catalog():view==='history'?history():view==='dossier'?dossier():view==='mastery'?mastery():view==='diagnostic'?diagnostic():missions()}<p class="footer">Fuentes generales: Bulbapedia (serie principal y tarjetas), Serebii. Uso local: el progreso queda en este navegador; exporta JSON para cambiar de dispositivo. Los archivos SAV se analizan únicamente desde la guía clásica compatible.</p></main></div><input id="file-import" type="file" hidden accept=".json,application/json"><input id="file-diagnosis" type="file" hidden accept=".json,application/json">`; wire();}
function wire(){
 document.querySelectorAll('[data-master]').forEach(b=>b.onchange=()=>{store.masterChecks=store.masterChecks||{};const k=store.game+':'+b.dataset.master;if(b.checked)store.masterChecks[k]=true;else delete store.masterChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,label:'Maestría: '+(masteryGoals(game(store.game)).find(x=>x.id===b.dataset.master)?.label||k),value:b.checked});save();render();});
 const mNext=document.getElementById('btn-mastery-next');if(mNext)mNext.onclick=()=>{const g=game(store.game);const o=masteryGoals(g).filter(x=>x.tier<=1).find(x=>!masteryProof(x,g)&&!store.masterChecks?.[g.id+':'+x.id]);if(o){const target=document.getElementById('master-'+o.id);target?.scrollIntoView({behavior:'smooth',block:'center'});}else alert('El núcleo prioritario está confirmado; revisa objetivos históricos adicionales y premios en el juego.');};
 const mImport=document.getElementById('mastery-import');if(mImport)mImport.onclick=()=>document.getElementById('file-diagnosis')?.click();
 document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{store.goalChecks=store.goalChecks||{};const k=store.game+':'+b.dataset.goal;if(b.checked)store.goalChecks[k]=true;else delete store.goalChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,step:0,label:'Expediente: '+goalsFor(game(store.game))[Number(b.dataset.goal)][1],value:b.checked});save();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{genFilter=+b.dataset.gen;render()});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{store.game=b.dataset.game;genFilter=game(store.game).generation;view='mission';textFilter='';pending=false;save();render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const id=b.dataset.check,i=+b.dataset.idx,val=b.checked;setCheck(id,i,val)});$('#btn-export').onclick=exportData;$('#btn-import').onclick=()=>$('#file-import').click();$('#btn-diagnosis').onclick=()=>$('#file-diagnosis').click();const db=$('#diag-import-inline');if(db)db.onclick=()=>$('#file-diagnosis').click();$('#file-diagnosis').onchange=e=>importDiagnosis(e.target.files[0]);$('#file-import').onchange=e=>importData(e.target.files[0]);const search=$('#search');if(search)search.oninput=e=>{textFilter=e.target.value;const pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)};const p=$('#pending');if(p)p.onchange=e=>{pending=e.target.checked;render()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.focus);if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}});const mobileGen=$('#mobile-gen');if(mobileGen)mobileGen.onchange=e=>{genFilter=+e.target.value;store.game=CATALOG.games.find(g=>g.generation===genFilter).id;save();render()};const mobileGame=$('#mobile-game');if(mobileGame)mobileGame.onchange=e=>{store.game=e.target.value;genFilter=game(store.game).generation;save();render()}}
render();
</script></body></html>
