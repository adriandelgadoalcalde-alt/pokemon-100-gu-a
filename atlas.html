":"Inicio en Teselia","steps":["Recibe tu inicial y Pokédex, aprende los combates básicos y desbloquea primeras rutas.","Comprueba primera medalla cuando corresponda."],"caution":"Blanco/Negro 2 comienza en Ciudad Engobe y tiene otra historia.","id":"BLACK-01","section":"Historia","verified":"base"},{"title":"Primeros gimnasios y rival","steps":["Recorre rutas iniciales, vence a los primeros líderes y completa los encuentros del rival.","Comprueba medallas y objetos habilitadores."],"caution":"Los líderes cambian entre BN y BN2.","id":"BLACK-02","section":"Historia","verified":"base"},{"title":"Ciudad Porcelana y Equipo Plasma","steps":["Cruza Puente Saeta o avanza desde Ciudad Porcelana según edición; investiga al Equipo Plasma.","Confirma continuidad de historia y accesos urbanos."],"caution":"En BN2 aparecen Team Plasma reformado y dos líderes diferentes.","id":"BLACK-03","section":"Historia","verified":"base"},{"title":"Desierto y Ciudad Mayólica","steps":["Explora Zona Desierto, participa en las instalaciones disponibles y vence a Camila.","Obtén la medalla y acceso al siguiente puente o ruta."],"caution":"Algunos objetos de desierto se liberan en postgame.","id":"BLACK-04","section":"Historia","verified":"base"},{"title":"Ciudad Fayenza","steps":["Resuelve incidente del equipo, vence a Yakón y alcanza el siguiente tramo.","Verifica la quinta medalla."],"caution":"En BN2 hay torneo Pokémon World Tournament cercano.","id":"BLACK-05","section":"Historia","verified":"base"},{"title":"Ciudad Loza y Monte Tuerca","steps":["Explora Torre de los Cielos o Cueva Electrorroca según punto de historia y derrota a Gerania.","Confirma sexta medalla y nuevas rutas abiertas."],"caution":"El itinerario en BN2 utiliza rutas distintas.","id":"BLACK-06","section":"Historia","verified":"base"},{"title":"Ciudad Teja y legendarios dragón","steps":["Recorre tramo oriental, alcanza Teja y participa en la revelación del Pokémon legendario.","Obtén séptima medalla y activa progreso del equipo."],"caution":"Iris y Lirio cambian entre ediciones.","id":"BLACK-07","section":"Historia","verified":"base"},{"title":"Octava medalla: Ciudad Caolín","steps":["Completa los incidentes de Torre Duodraco y Castillo Ancestral y avanza por Ciudad Teja hacia Ciudad Caolín. Supera su gimnasio de tipo Dragón frente a Lirio.","Comprueba las ocho medallas y prepara el acceso a Ruta 10 y Calle Victoria; el desenlace de N y Ghechis ocurre después del primer Alto Mando."],"caution":"El orden de Negro/Blanco es distinto del de sus secuelas. Esta medalla no resuelve todavía la historia del Equipo Plasma.","id":"BLACK-08","section":"Historia","verified":"revisión guiada","source":"https://www.serebii.net/blackwhite/gyms.shtml","contentRevision":"edition-routes-2026-11-09"},{"title":"Primer Alto Mando, N y Ghechis","steps":["Cruza Calle Victoria y derrota a los cuatro miembros del Alto Mando. En esta primera visita la historia continúa en el castillo de N; no hay combate por el título contra Mirto.","En el castillo afronta el encuentro con Reshiram, después N y Ghechis. Tras los créditos, vuelve a preparar una Liga completa para enfrentarte a Mirto en el postgame."],"caution":"Los créditos del primer desenlace y vencer al Campeón Mirto son hitos separados. Un indicador de Liga no reconstruye por sí solo todos estos combates.","id":"BLACK-09","section":"Historia","verified":"revisión guiada","source":"https://www.serebii.net/blackwhite/plasma.shtml","contentRevision":"edition-routes-2026-11-09"},{"title":"Teselia postgame","steps":["Explora zonas orientales, capturas especiales, villas, torres y entrenadores veteranos.","Revisa nuevos encuentros y objetos únicos."],"caution":"En BN2 hay Estudios Cinematográficos Pokéwood, PWT, Calle Victoria distinta y Bosque Blanco/Ciudad Negra.","id":"BLACK-10","section":"Postgame y 100%","verified":"base"},{"title":"Tarjeta, Musical y Metro Batalla","steps":["Desglosa los requisitos de tarjeta de Negro/Blanco: final principal, Pokédex Nacio  Pueblo Ocre y la Ruta 20; ayuda a encontrar al Herdier en Rancho Ocre.","Regresa a Ciudad Engobe y desafía a Cheren en la Escuela de Entrenadores.","Comprueba que tienes la Medalla Base antes de viajar al este."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-01","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Hormigón: Hiedra y Pokéwood","steps":["Cruza la Ruta 20 y llega a Ciudad Hormigón.","Visita el Complejo Hormigón para entrenar y reunir objetos antes del gimnasio.","Derrota a Hiedra (tipo Veneno) y recibe la Medalla Ponzoña.","Completa la introducción de Estudios Cinematográficos Pokéwood y avanza la secuencia del Equipo Plasma para acceder al barco hacia Porcelana."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-02","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Porcelana: cloacas y Camus","steps":["Desembarca en Ciudad Porcelana y busca a tu rival.","Entra con él en las Cloacas Porcelana para investigar al Equipo Plasma.","Regresa al gimnasio y vence a Camus (tipo Bicho).","Confirma la Medalla Élitro y continúa por la Ruta 4 hacia Mayólica."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-03","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Avenida Unión, desierto y Mayólica","steps":["En la Ruta 4 encuentra a Acromo y activa el paso hacia el norte.","Cruza Avenida Unión y decide si explorar de forma opcional el Desierto y Castillo Ancestral.","En Ciudad Mayólica completa el acceso al nuevo gimnasio y vence a Camila (tipo Eléctrico).","Comprueba la Medalla Voltio y avanza por la Ruta 5."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-04","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Fayenza y Torneo Mundial","steps":["Cruza el Puente de Fayenza y visita la ciudad.","Vence a Yakón en el gimnasio de tipo Tierra y confirma la Medalla Temblor.","Completa el torneo inicial obligatorio del Pokémon World Tournament.","Investiga el Fragata Plasma con tu rival y después dirígete hacia la Ruta 6."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-05","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Cueva Electrorroca y Ciudad Loza","steps":["En la Ruta 6 obtiene Surf de Cheren durante la historia.","Cruza la Cueva Electrorroca, recogiendo objetos y evitando confundir desvíos con la ruta obligatoria.","En Ciudad Loza visita la Torre de los Cielos cuando corresponda a la historia.","Derrota a Gerania en el gimnasio de tipo Volador y recibe la Medalla Jet."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-06","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Pueblo Chamota, Montaña Reversia y Pueblo Arenisca","steps":["Tras la medalla de Loza, viaja en avión con Gerania a Pueblo Chamota.","Cruza Montaña Reversia con Bel hacia Pueblo Arenisca.","Sigue por la Ruta 13, Pueblo Ladrillo, Rutas 12 y 11, y Puente Villa hasta Ciudad Caolín.","Si tomas desvíos a zonas antiguas de Teselia, comprueba que no son todavía obligatorios."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-07","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Caolín, Ciudad Marga y Fragata Plasma","steps":["Vence a Lirio en Ciudad Caolín (tipo Dragón) y consigue la Medalla Leyenda.","Resuelve el ataque del Equipo Plasma a Ciudad Caolín y la trama de los Punta ADN.","Viaja mediante el Túnel Submarino hacia Ciudad Marga y derrota a Ciprián (tipo Agua) para la Medalla Ola.","Recorre las Rutas 22 y 21, la Cueva Costera y la Fragata Plasma; resuelve el episodio de Kyurem en el Boquete Gigante antes de la Liga."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-08","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Calle Victoria, Alto Mando y Campeona Iris","steps":["Cruza la Ruta 23 y la Calle Victoria; prepara un equipo versátil.","Derrota al Alto Mando: Anís, Lotto, Catleya y Aza; puedes escoger el orden.","Vence a la campeona Iris y entra en el Hall de la Fama.","Tras los créditos, comprueba los nuevos accesos del postgame."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-09","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Postgame de Teselia: regiones y encuentros","steps":["Explora la parte oriental de Teselia y las rutas que se abren tras la Liga.","Visita el Castillo de N y las zonas de regreso a Teselia original.","Revisa las Caverna Abisal, rutas opcionales, cuevas y sus objetos únicos.","Identifica qué legendarios son exclusivos de Negro 2 o Blanco 2 y cuáles requieren intercambio."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-10","section":"Postgame y 100%","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Medallero, Pokédex y tarjeta de entrenador","steps":["Revisa las 255 medallas posibles en la Caja Medallas; no confundas número de insignias con estrellas de tarjeta.","Completa las Pokédex de Teselia y Nacional según los requisitos de la edición.","Verifica los objetivos independientes de combate y colecciones de tarjeta.","Conserva una prueba del registro del juego, no solo un porcentaje de misiones."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-11","section":"Postgame y 100%","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Medallero de Teselia (255)","steps":["Revisa las cinco categorías de medallas y sus requisitos dentro de Caja Medallas.","Confirma 255/255 y fechas si el guardado las registra."],"caution":"No confundas medallero con tarjeta de cinco logros.","id":"BLACK2-E01","section":"Especiales de edición","verified":"edition"},{"title":"Pokéwood y Campeonato PWT","steps":["Completa películas de Estudios Cinematográficos Pokéwood y gana Torneo de Campeones del PWT.","Comprueba ambos reconocimientos separados."],"caution":"Requisitos de la tarjeta de BN2.","id":"BLACK2-E02","section":"Especiales de edición","verified":"edition"},{"id":"BLACK2-N1","title":"Escondrijos del Nexo Teselia y recuerdos","steps":["Tras avanzar en la historia, investiga el Nexo Teselia desde el menú principal.","El Enlace Recuerdo necesita datos de Negro/Blanco original para mostrar recuerdos y desbloquear determinadas consecuencias.","Comprueba qué escenas y Pokémon del entrenador N están disponibles en tu partida.","No marques el objetivo si solo has visto las escenas por vídeo."],"section":"Postgame y 100%","caution":"Verificar desbloqueos de la edición concreta y la existencia de conectividad histórica cuando sea necesaria.","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"id":"BLACK2-N2","title":"Ciudades exclusivas, claves y Regi","steps":["Identifica si juegas Negro 2 o Blanco 2 antes de planificar capturas.","Comprueba Ciudad Negra/Bosque Blanco y los desbloqueos del Rascacielos Negro/Cavernogal Blanco correspondientes.","Revisa los sistemas de claves y los encuentros de Regirock, Regice o Registeel asociados a llaves y versiones.","Distingue intercambios, claves enviadas y restauraciones mediante editor de guardado."],"section":"Postgame y 100%","caution":"Verificar desbloqueos de la edición concreta y la existencia de conectividad histórica cuando sea necesaria.","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"id":"BLACK2-N3","title":"Reserva Natural y Pokédex de Teselia","steps":["Consulta los criterios de finalización de la Pokédex de Teselia con la profesora Encina.","Cuando obtengas el permiso, viaja a la Reserva Natural mediante el aeropuerto de Ciudad Loza.","Captura o registra el Haxorus variocolor especial si quieres incluir todos los premios únicos.","Verifica la condición mediante el permiso obtenido y el registro del encuentro, no solo por tener un Haxorus variocolor."],"section":"Postgame y 100%","caution":"Ver l juego antes de dar la ruta por terminada. Si requiere evento antiguo o DLC, verifica la disponibilidad.","verified":"revisión guiada"}],"variant":[],"readSave":false,"coverage":"ruta base estructurada; auditoría detallada pendiente","mainStoryLastMission":"ARCEUS-07"},{"id":"SCARLET","name":"Escarlata","generation":9,"region":"Paldea","platform":"Switch / Switch 2","family":"paldea","missions":[{"title":"Introducción y Academia","steps":["Elige inicial, conoce a Mencía, Damián y Noa; entra en la Academia.","Confirma apertura de búsqueda del tesoro."],"caution":"Escarlata y Púrpura tienen paradojas y legendarios opuestos.","id":"SCARLET-01","section":"Historia","verified":"base"},{"title":"Travesía de la victoria","steps":["Recorre ocho gimnasios y completa sus pruebas individuales según el orden que elijas.","Confirma las ocho medallas y nivel de obediencia."],"caution":"El mundo es abierto y los niveles no escalan contigo.","id":"SCARLET-02","section":"Historia","verified":"base"},{"title":"Senda legendaria","steps":["Derrota a los cinco dominantes con Damián y recupera las funciones de Koraidon/Miraidon.","Comprueba las habilidades de montura."],"caution":"El orden es flexible, pero sus niveles no escalan.","id":"SCARLET-03","section":"Historia","verified":"base"},{"title":"Vía Stardust","steps":["Derrota a las cinco bases de Team Star y completa la identidad del jefe.","Comprueba los cinco emblemas y resolución de la historia."],"caution":"Los retos exigen modo Enviar Pokémon.","id":"SCARLET-04","section":"Historia","verified":"base"},{"title":"Liga y evaluación final","steps":["Completa evaluación de la Liga, Alto Mando y combate contra Ságita.","Verifica condición Campeón."],"caution":"Revisa respuestas de la entrevista y prepara equipo.","id":"SCARLET-05","section":"Historia","verified":"base"},{"title":"Finales de las tres rutas","steps":["Termina los combates de Mencía, Damián y Cassiopeia y abre acceso a Área Cero.","Confirma las tres líneas terminadas."]  con 249 Pokémon capturados (todos salvo Mew y Celebi). Dónde: Ciudad Azulona (Kanto), Mansión Azulona, 3.ª planta (oficina de GAME FREAK). Paso a paso: 1) Completa la Pokédex Nacional: además de Johto y Kanto, trae por intercambio las exclusivas de la otra edición y lo que solo se consigue en Rojo, Azul o Amarillo (por ejemplo, los iniciales de Kanto, que en Oro, Plata y Cristal solo llegan intercambiándolos). 2) Revisa que en la Pokédex constan como capturados los 251 salvo Mew y Celebi. 3) Viaja a Ciudad Azulona, entra en la Mansión Azulona y sube a la 3.ª planta. 4) Habla con el diseñador del juego para recibir el diploma. Consejo: después, el artista gráfico de la misma sala te ofrece imprimir el diploma con la Game Boy Printer. Fuente: WikiDex «Edificio Azulona»; decompilación de pret (pokecrystal, CeladonMansion3F).","phase":6,"order":617},{"id":"event-0","label":"Celebi: evento histórico; en Cristal puede depender de edición/servicio","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Celebi solo llegó por eventos (en Cristal japonés, con el GS Ball del servicio móvil; en HGSS, llevando un Celebi de evento al santuario del Encinar se juega la historia con Giovanni). Con Pokekeep: Añade el Celebi de evento legal desde la Librería. En Cristal, también puedes activar el evento del GS Ball (bandera del GS Ball en la partida) y llevar el GS Ball al santuario del Encinar.","phase":7,"order":700},{"id":"collect-unown","label":"Registrar las 26 formas de Unown (Ruinas Alfa)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que llegas a Ciudad Malva, al principio de la aventura; algunas cámaras necesitan Surf. Dónde: Ruinas Alfa (entre Ciudad Malva, la Ruta 32 y la Ruta 36), su sala interior y el centro de investigación de las ruinas. Paso a paso: 1) Entra en la cámara de Kabuto (encima del centro de investigación) y resuelve el puzle deslizante: aparecen los Unown de la A a la K. 2) Captura tres Unown en la sala inferior; al salir, un científico te lleva al centro de investigación y añade el modo Unown a tu Pokédex. 3) Resuelve los otros puzles para abrir más letras: Omanyte (L a R; se llega por la Cueva Unión con Surf y Fuerza), Aerodactyl (S a W; con Surf) y Ho-Oh (X, Y y Z; por la Cueva Unión con Surf). 4) Captura hasta tener las 26 formas; solo cuenta capturarlas, no verlas. Consejo: en Cristal, las paredes ocultas de las cámaras se abren usando una Cuerda Huida (Kabuto), llevando una Piedra Agua (Omanyte), usando Destello (Aerodactyl) y con Ho-Oh como primer Pokémon del equipo (Ho-Oh). Fuente: WikiDex «Ruinas Alfa»; Serebii «Ruins of Alph».","phase":4,"order":400}],"CRYSTAL":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Superar ocho gimnasios de Kanto y vencer a Rojo en Monte Plateado","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga de Johto viajas a Kanto (S.S. Aqua desde Ciudad Olivo): gana las 8 medallas de Kanto (la Central Energía se arregla devolviendo la Pieza robada de Ciudad Celeste), habla con Oak para el permiso del Monte Plateado y vence a Rojo en su cima.","phase":2,"order":200},{"id":"battle1","label":"Superar un desafío completo de la Torre Batalla (7 entrenadores seguidos)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto llegas a Ciudad Olivo; no hace falta haber pasado la Liga. Dónde: Torre Batalla, al norte de la Ruta 40 (al oeste de Ciudad Olivo). Paso a paso: 1) Prepara tres Pokémon ) — 50 victorias seguidas para la estrella. Esmeralda: Frente Batalla, con sus 7 instalaciones y los símbolos de plata y oro de cada As. Rubí Omega/Zafiro Alfa: Mansión Batalla (Resort Batalla), donde la estrella pide vencer a una Dama del Combate en la 50.ª.","phase":3,"order":300},{"id":"battle1","label":"Concursos Pokémon y sus recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (diseñador del juego, Motel Aguacala de Ciudad Calagua, tras la Liga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras entrar en el Hall de la Fama, que es cuando el diseñador aparece en el motel. Dónde: Ciudad Calagua, Motel Aguacala (oficina de GAME FREAK). Paso a paso: 1) Completa la Pokédex de Hoenn: los 200 que el juego exige capturados, todos salvo Jirachi y Deoxys. Atrapa las exclusivas de tu edición o consíguelas por intercambio, y no olvides los Pokémon de un solo encuentro (legendarios, Pokémon fijos y fósiles). 2) Comprueba en el modo Hoenn de la Pokédex que figuran como capturados. 3) Ve al Motel Aguacala y habla con el diseñador del juego, que te entrega el diploma. Consejo: Jirachi y Deoxys solo llegaban por eventos; no los necesitas para este diploma. Fuente: WikiDex «Motel Aguacala»; WikiDex «Ficha de entrenador»; decompilación de pret (pokeruby y pokeemerald).","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el Hall de la Fama y con la Pokédex Nacional en tu poder. Dónde: Ciudad Calagua, Motel Aguacala; el mismo diseñador del juego. Paso a paso: 1) Registra como capturadas 380 especies: todas salvo Mew, Celebi, Jirachi y Deoxys; por un error del juego tampoco comprueba a Chikorita, y a Treecko no lo vuelve a comprobar (ya cuenta en la de Hoenn). 2) Lugia y Ho-Oh sí son obligatorios: no se capturan en Rubí ni Zafiro, así que hay que traerlos por intercambio desde otro juego. 3) El resto de Kanto y Johto tráelo por intercambio desde Rojo Fuego/Verde Hoja, Esmeralda, Colosseum o XD, o críalo en la Guardería. 4) Habla con el diseñador del juego: con la Pokédex Nacional completa, el diploma que te enseña es el de la Nacional. Consejo: cuenta especie a especie en la Pokédex; el total puede incluir Pokémon que el juego no exige. Fuente: decompilación de pret (pokeruby, CompletedNationalPokedex); WikiDex «Motel Aguacala».","phase":6,"order":615},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo (MO08, de Máximo en Algaria); se puede antes o después de la Liga. Dónde: Ruinas Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) con Wailord y Relicanth en el equipo (en Esmeralda, Relicanth primero y Wailord último). Luego, en las Ruinas del Desierto (Ruta 111), sigue las instrucciones en braille de la pared. Consejo: Regirock nivel 40: lleva Pokémon para debilitarlo y muchas Ultra Balls. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada (igual que Regirock). Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105). En Rubí/Zafiro rodea la sala pegado a la pared; en Esmeralda espera dos minutos dentro sin moverte. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada y tener Vuelo. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): colócate en el centro de la sala y usa Vuelo (MO02). Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Pilar Celeste (nivel 70). Cómo: Pilar Celeste (Ruta 131): necesitas la Bici Carrera para cruzar el suelo frágil de los pisos superiores. Consejo: Rayquaza nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Durante la historia, antes de la octava medalla: tras el despertar de Groudon en Arrecípolis. Dónde: Cueva Ancestral (nivel 45). Cómo: Entra en la Cueva Ancestral de Arrecípolis con Buceo (MO08); Groudon espera al fondo. Consejo: Groudon nivel 45. Si lo debilitas no reaparece: guarda antes de entrar. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":150},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Solo con el Ticket Eón (distribución de evento). Dónde: Isla del Sur (nivel 50). Cómo: Con el Ticket Eón, el barco de Portual lleva a la Isla del Sur, donde espera Latias. Consejo: Latias nivel 50. Sin el ticket no se puede en esta edición. Con Pokekeep: En la mochila, añade el objeto clave Ticket Eón y activa la bandera de su evento (Pokekeep, editor de objetos y de banderas); luego habla con el marinero del puerto de Portual. Se acredita con el registro en la Pokédex de la partida.","phase":7,"order":710},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Después del Hall de la Fama: tu madre te pregunta por la tele y Latios empieza a vagar por Hoenn. Dónde: errante por la región (nivel 40). Cómo: Es errante: cambia de ruta al cambiar de zona y huye en el primer turno. Usa la Pokédex (zona) para seguirlo y atrápalo con la Master Ball o retenlo con Mal de Ojo o Bloqueo. Consejo: Latios nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex de Hoenn (excluidos Jirachi y Deoxys)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex de Hoenn completa (sin Jirachi ni Deoxys): la misma condición que el diploma del Motel Aguacala.","phase":6,"order":610},{"id":"card-2","label":"Cinco cuadros del Museo de Ciudad Calagua","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por exponer los cinco cuadros de rango Maestro (una por categoría) en el Museo de Ciudad Calagua: gana los cinco Concursos rango Maestro.","phase":6,"order":620},{"id":"card-3","label":"50 victorias consecutivas en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 50 victorias seguidas en la Torre Batalla (en barco desde Portual, tras la Liga), en cualquiera de sus dos niveles.","phase":6,"order":630},{"id":"event-0","label":"Mew, Deoxys o Jirachi mediante distribuciones o islas de evento disponibles según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew (Isla Suprema, Mapa Viejo de Esmeralda), Deoxys (Isla Origen, Ori-Ticket de Rojo Fuego/Verde Hoja y Esmeralda) y Jirachi (disco de bonificación / Pokémon Channel) solo llegaron por eventos. En Rubí Omega/Zafiro Alfa, Deoxys sí está en el juego (Episodio Delta). Con Pokekeep: Añade el objeto de evento (Mapa Viejo o Ori-Ticket) y activa su bandera para jugar el evento, o añade el singular legal desde la Librería.","phase":7,"order":700},{"id":"trick-house","label":"Superar los ocho retos de la Casa Treta (Ruta 110)","category":"Puzles","tier":1,"species":null,"auto":null,"how":"Cuándo: el primer reto, en cuanto llegas a la Ruta 110 con Corte; los siguientes se abren con las medallas: el 2.º con la Medalla Dinamo, el 3.º con la Calor, el 4.º con la Equilibrio, el 5.º con la Pluma, el 6.º con la Mente, el 7.º con la Lluvia y el 8.º tras ganar la Liga. Dónde: Casa Treta, en la Ruta 110 (entre Ciudad Portual y Ciudad Malvalona). Paso a paso: 1) Entra y busca al Maestro Treta, que se esconde en la primera sala (cambia de escondite en cada reto; desde el 4.º ya no hay destello que lo delate). 2) Pasa a la sala del reto. 3) Recorre el laberinto con la MO que haga falta (Corte en el 1.º, Golpe Roca en el 3.º, Fuerza en el 4.º), lee el manuscrito con el código y llega a la puerta. 4) En la sala final el Maestro Treta te da el premio. 5) Vuelve tras cada medalla y repite hasta superar los ocho. Consejo: el último premio es una tienda para la base secreta: roja en Rubí, azul en Zafiro; en Esmeralda eliges una. Fuente: WikiDex «Casa Treta»; Serebii «Trick House».","phase":2,"order":190}],"SAPPHIRE":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Resolver los encuentros legendarios y el contenido posterior a la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Hall de la Fama: Rayquaza en el Pilar Celeste, Latios/Latias errante, los Regis (Cámara Sellada) y, en Esmeralda, Kyogre/Groudon por el Instituto Meteorológico y el Frente Batalla. En Rubí Omega/Zafiro Alfa, el Episodio Delta (Rayquaza y Deoxys) y los parajes espejismo.","phase":2,"order":200},{"id":"battle0","label":"Completar las instalaciones de combate de esta edición","category":"Combates","tier":1,"species":null,"auto":null,"how":"Rubí/Zafiro: Torre Batalla (en barco desde Portual tras la Liga) — 50 victorias seguidas para la estrella. Esmeralda: Frente Batalla, con sus 7 instalaciones y los símbolos de plata y oro de cada As. Rubí Omega/Zafiro Alfa: Mansión Batalla (Resort Batalla), donde la estrella pide vencer a una Dama del Combate en la 50.ª.","phase":3,"order":300},{"id":"battle1","label":"Concursos Pokémon y sus recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (diseñador del juego, Motel Aguacala de Ciudad Calagua, tras la Liga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras entrar en el Hall de la Fama, que es cuando el diseñador aparece en el motel. Dónde: Ciudad Calagua, Motel Aguacala (oficina de GAME FREAK). Paso a paso: 1) Completa la Pokédex de Hoenn: los 200 que el juego exige capturados, todos salvo Jirachi y Deoxys. Atrapa las exclusivas de tu edición o consíguelas por intercambio, y no olvides los Pokémon de un solo encuentro (legendarios, Pokémon fijos y fósiles). 2) Comprueba en el modo Hoenn de la Pokédex que figuran como capturados. 3) Ve al Motel Aguacala y habla con el diseñador del juego, que te entrega el diploma. Consejo: Jirachi y Deoxys solo llegaban por eventos; no los necesitas para este diploma. Fuente: WikiDex «Motel Aguacala»; WikiDex «Ficha de entrenador»; decompilación de pret (pokeruby y pokeemerald).","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el Hall de la Fama y con la Pokédex Nacional en tu poder. Dónde: Ciudad Calagua, Motel Aguacala; el mismo diseñador del juego. Paso a paso: 1) Registra como capturadas 380 especies: todas salvo Mew, Celebi, Jirachi y Deoxys; por un error del juego tampoco comprueba a Chikorita, y a Treecko no lo vuelve a comprobar (ya cuenta en la de Hoenn). 2) Lugia y Ho-Oh sí son obligatorios: no se capturan en Rubí ni Zafiro, así que hay que traerlos por intercambio desde otro juego. 3) El resto de Kanto y Johto tráelo por intercambio desde Rojo Fuego/Verde Hoja, Esmeralda, Colosseum o XD, o críalo en la Guardería. 4) Habla con el diseñador del juego: con la Pokédex Nacional completa, el diploma que te enseña es el de la Nacional. Consejo: cuenta especie a especie en la Pokédex; el total puede incluir Pokémon que el juego no exige. Fuente: decompilación de pret (pokeruby, CompletedNationalPokedex); WikiDex «Motel Aguacala».","phase":6,"order":615},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"s nsíguelas por intercambio, y no olvides los Pokémon de un solo encuentro (legendarios, Pokémon fijos y fósiles). 2) Comprueba en el modo Hoenn de la Pokédex que figuran como capturados. 3) Ve al Motel Aguacala y habla con el diseñador del juego, que te entrega el diploma. Consejo: Jirachi y Deoxys solo llegaban por eventos; no los necesitas para este diploma. Fuente: WikiDex «Motel Aguacala»; WikiDex «Ficha de entrenador»; decompilación de pret (pokeruby y pokeemerald).","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el Hall de la Fama, con la Pokédex Nacional. Dónde: Ciudad Calagua, Motel Aguacala; el mismo diseñador del juego. Paso a paso: 1) Registra como capturadas todas las especies salvo Mew, Lugia, Ho-Oh, Celebi, Jirachi y Deoxys (en Esmeralda, Lugia y Ho-Oh no hacen falta). 2) Las especies de Kanto y Johto que no aparecen en Hoenn tráelas por intercambio desde Rojo Fuego/Verde Hoja, Colosseum o XD, o críalas en la Guardería. 3) Repasa la Pokédex especie a especie. 4) Habla con el diseñador del juego (necesitas también la Pokédex de Hoenn completa): con la Nacional completa, el diploma que te enseña es el de la Pokédex Nacional. Consejo: Mew, Celebi, Jirachi y Deoxys solo llegaban por eventos; no los necesitas. Fuente: decompilación de pret (pokeemerald, HasAllMons y Motel Aguacala); WikiDex «Motel Aguacala».","phase":6,"order":615},{"id":"final-boss","label":"Vencer a Máximo en la Cascada Meteoro tras la Liga (el rival más fuerte de Esmeralda)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después del Hall de la Fama, cuando Máximo aparece en la cueva. Dónde: Cascada Meteoro, en la sala más profunda (sala de Máximo), a la que se llega con Surf y Cascada. Paso a paso: 1) Lleva Surf y Cascada en algún miembro del equipo. 2) Entra en la Cascada Meteoro y avanza hasta la parte más profunda, subiendo la cascada con Cascada. 3) Habla con Máximo y acepta el combate. 4) Vence a su equipo: Skarmory, Claydol, Aggron, Cradily, Armaldo y Metagross, de nivel 75 a 78. Consejo: Claydol, Aggron y Metagross llevan Terremoto; Agua y Tierra son muy eficaces contra Aggron, y Fuego contra Skarmory y Metagross. Fuente: WikiDex «Máximo Peñas»; WikiDex «Cascada Meteoro».","phase":3,"order":390},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo (MO08, de Máximo en Algaria); se puede antes o después de la Liga. Dónde: Ruinas Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) con Wailord y Relicanth en el equipo (en Esmeralda, Relicanth primero y Wailord último). Luego, en las Ruinas del Desierto (Ruta 111), sigue las instrucciones en braille de la pared. Consejo: Regirock nivel 40: lleva Pokémon para debilitarlo y muchas Ultra Balls. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada (igual que Regirock). Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105). En Rubí/Zafiro rodea la sala pegado a la pared; en Esmeralda espera dos minutos dentro sin moverte. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada y tener Vuelo. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): colócate en el centro de la sala y usa Vuelo (MO02). Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Durante la historia, tras calmar a Groudon y Kyogre en Arrecípolis (antes de la octava medalla o en cualquier momento después). Dónde: Pilar Celeste (nivel 70). Cómo: Vuelve a la cima del Pilar Celeste (Ruta 131) con la Bici Carrera para los suelos frágiles. Consejo: Rayquaza nivel 70: captúralo antes de los eventos de Kyogre y Groudon de la posliga, que lo piden. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":175},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Después del Hall de la Fama y de capturar o vencer a Rayquaza. Dónde: Cueva Marina (nivel 70). Cómo: En el Instituto Meteorológico (Ruta 119) un científico avisa de lluvias intensas: busca la ruta con lluvia y bucea hasta la Cueva Marina (rutas 105-108 y 124-129). Consejo: Kyogre nivel 70. La cueva cambia de sitio cada día. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Después del Hall de la Fama y de capturar o vencer a Rayquaza. Dónde: Cueva Terrena (nivel 70). Cómo: El Instituto Meteorológico avisa de una sequía: busca la ruta soleada y la Cueva Terrena (rutas 114-120). Consejo: Groudon nivel 70. La cueva cambia de sitio cada día. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Después del Hall de la Fama (el que no elegiste con tu madre, solo con el Ticket Eón). Dónde: errante por la región (nivel 40); Isla del Sur (nivel 50). Cómo: Respuesta roja a tu madre = Latias errante. Si elegiste azul, Latias solo está en la Isla del Sur con el Ticket Eón (evento). Consejo: Nivel 40 errante o 50 en la Isla del Sur. Con Pokekeep: Si el de la Isla del Sur es el que te falta, añade el Ticket Eón y activa su bandera de evento; o añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Después del Hall de la Fama: tu madre pregunta de qué color era el Pokémon de la tele. Dónde: errante por la región (nivel 40); Isla del Sur (nivel 50). Cómo: Si respondes azul vaga Latios; si respondes rojo, Latias. El elegido es errante y huye: síguelo con la Pokédex. Consejo: Nivel 40. El otro de los dos solo con el Ticket Eón (Isla del Sur, nivel 50). Con Pokekeep: Si el de la Isla del Sur es el que te falta, añade el Ticket Eón y activa su bandera de evento; o añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Hoenn (excluidos Jirachi y Deoxys)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex de Hoenn completa (sin Jirachi ni Deoxys): la misma condición que el diploma del Motel Aguacala.","phase":6,"order":610},{"id":"card-2","label":"Cinco cuadros de concursos rango Maestro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por los cinco cuadros de rango Maestro: gana el Concurso Maestro en las cinco categorías.","phase":6,"order":620},{"id":"card-3","label":"Todos los símbolos de oro del Frente Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por los siete símbolos de oro del Frente Batalla: vence por segunda vez a cada As (Torre, Fábrica, Palacio, Cúpula, Pirámide, Sala y Tubo) en sus rachas.","phase":6,"order":630},{"id":"event-0","label":"Mew, Deoxys o Jirachi mediante distribuciones o islas de evento disponibles según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew (Isla Suprema, Mapa Viejo de Esmeralda), Deoxys (Isla Origen, Ori-Ticket de Rojo Fuego/Verde Hoja y Esmeralda) y Jirachi (disco de bonificación / Pokémon Channel) solo llegaron por eventos. En Rubí Omega/Zafiro Alfa, Deoxys sí está en el juego (Episodio Delta). Con Pokekeep: Añade el objeto de evento (Mapa Viejo o Ori-Ticket) y activa su bandera para jugar el evento, o añade el singular legal desde la Librería.","phase":7,"order":700},{"id":"trick-house","label":"Superar los ocho retos de la Casa Treta (Ruta 110)","category":"Puzles","tier":1,"species":null,"auto":null,"how":"Cuándo: el primer reto, en cuanto llegas a la Ruta 110 con Corte; los siguientes se abren con las medallas: el 2.º con la Medalla Dinamo, el 3.º con la Calor, el 4.º con la Equilibrio, el 5.º con la Pluma, el 6.º con la Mente, el 7.º con la Lluvia y el 8.º tras ganar la Liga. Dónde: Casa Treta, en la Ruta 110 (entre Ciudad Portual y Ciudad Malvalona). Paso a paso: 1) Entra y busca al Maestro Treta, que se esconde en la primera sala (cambia de escondite en cada reto; desde el 4.º ya no hay destello que lo delate). 2) Pasa a la sala del reto. 3) Recorre el laberinto con la MO que haga falta (Corte en el 1.º, Golpe Roca en el 3.º, Fuerza en el 4.º), lee el manuscrito con el código y llega a la puerta. 4) En la sala final el Maestro Treta te da el premio. 5) Vuelve tras cada medalla y repite hasta superar los ocho. Consejo: el último premio es una tienda para la base secreta: roja en Rubí, azul en Zafiro; en Esmeralda eliges una. Fuente: WikiDex «Casa Treta»; Serebii «Trick House».","phase":2,"order":190},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta de oro: te llama por tu nombre y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: al final de la partida, con las cuatro estrellas de la Ficha de Entrenador (ficha de oro). Dónde: cualquier Centro Pokémon. Paso a paso: 1) Consigue las cuatro estrellas: entrar en el Hall de la Fama; completar la Pokédex de Hoenn (200, sin Jirachi ni Deoxys); ganar en nivel Experto los concursos de las cinco categorías y conseguir sus cuadros para el museo de Ciudad Calagua; y ganar los símbolos de oro de todas las instalaciones del Frente Batalla. 2) Comprueba en la Ficha de Entrenador que es de oro. 3) Habla con la enfermera de un Centro Pokémon: la primera vez se sorprende al ver tu ficha de oro; desde entonces te llama por tu nombre y cura a tu equipo sin preguntar. Consejo: los símbolos de oro del Frente Batalla son lo más largo; deja esa estrella para el final. Fuente: WikiDex «Ficha de entrenador»; decompilación de pret (pokeemerald, pkmn_center_nurse).","phase":6,"order":690}],"FIRERED":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Explorar Cueva Celeste y concluir la actividad posterior a la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Hall de la Fama se abre la Cueva Celeste (al noroeste de Ciudad Celeste, con Surf), con Mewtwo al fondo. En Rojo Fuego/Verde Hoja la posliga sigue en Archi7: recupera el Rubí (Mt. Ascuas, Isla Prima) y el Zafiro (Isla Exta) para activar la máquina de la Red; Oak te da la Pokédex Nacional y se abren las islas 6 y 7.","phase":2,"order":200},{"id":"battle0","label":"Revancha frente al Campeón y combates importantes disponibles","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras el Hall de la Fama puedes volver a la Meseta Añil y repetir el Alto Mando y el combate contra el campeón (tu rival); en Rojo Fuego/Verde Hoja, con la Pokédex Nacional, sus equipos suben de nivel. En Rojo Fuego/Verde Hoja hay además la Torre Desafío (Isla Sétima) y las revanchas con el Buscapelea.","phase":3,"order":300},{"id":"items0","label":"Visor Silph, Poké Flauta y MO necesarias para todas las rutas","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Se consiguen durante la historia, en este orden: MO01 Corte (S.S. Anne, Ciudad Carmín), MO05 Destello (ayudante de Oak en la Ruta 2, con 10 especies), Poké Flauta (Mr. Fuji, Pueblo Lavanda, tras rescatarlo de la Torre Pokémon con el Visor Silph del Casino Rocket de Ciudad Azulona), MO02 Vuelo (casa de la Ruta 16), MO03 Surf (Zona Safari), MO04 Fuerza (guarda de la Zona Safari, con el Diente de Oro). Sin la Poké Flauta no se despierta a los Snorlax de las rutas 12 y 16.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Kanto y recompensas de Oak","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Kanto (150; Mew no cuenta). Las exclusivas de la otra edición y las evoluciones por intercambio solo por intercambio. El ayudante de Oak o el propio Oak te premian según los registros; con la Pokédex completa, el diseñador del juego (Mansión Azulona) te da el diploma. Con Pokekeep: Las especies que te falten por intercambio o de la otra edición puedes añadirlas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Kanto (diseñador del juego, Mansión Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con los 150 de Kanto capturados (Mew no hace falta), habla con el diseñador del juego en la 3.ª planta de la Mansión Azulona (Ciudad Azulona).","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el Hall de la Fama y con la Pokédex Nacional, que da el Profesor Oak. Dónde: Ciudad Azulona, Mansión Azulona, 3.ª planta (oficina de GAME FREAK). Paso a paso: 1) Registra como capturadas todas las especies salvo Mew, Lugia, Ho-Oh, Celebi, Jirachi y Deoxys. 2) Muchas especies de Johto aparecen en las islas de Archi7 tras la Pokédex Nacional; las de Hoenn llegan por intercambio desde Rubí, Zafiro, Esmeralda, Colosseum o XD (antes hay que entregar el Rubí y el Zafiro a Celio, en Isla Prima, para activar su máquina de redes). 3) Repasa la Pokédex especie a especie. 4) Sube a la 3.ª planta de la Mansión Azulona y habla con el diseñador del juego para recibir el diploma de la Pokédex Nacional. Consejo: Mew, Celebi, Jirachi y Deoxys solo llegaban por eventos, y Lugia y Ho-Oh están en la Roca Ombligo, que en la edición original de Game Boy Advance solo se abría con el Misti-ticket de un evento; no los necesitas. Fuente: WikiDex «Edificio Azulona»; WikiDex «Ficha de entrenador»; WikiDex «Roca Ombligo».","phase":6,"order":615},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Durante la historia, en cuanto tengas Surf y Fuerza. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20): mueve rocas con Fuerza para frenar las corrientes hasta el sótano más profundo. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: Durante la historia, con Surf. Dónde: Central Energía (nivel 50). Cómo: Central de Energía: entra surfeando por la Ruta 10 (al norte de Pueblo Lavanda). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":155},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Tras la medalla de Isla Canela, al viajar a Archi7 (Isla Prima). Dónde: Mt. Ascuas (nivel 50). Cómo: Monte Ascuas en Isla Prima: sube a la cima con Fuerza y Golpe Roca. Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":170},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Después del Hall de la Fama y de activar la máquina de la Red de Celio (Rubí y Zafiro entregados en Archi7). Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste, al noroeste de Ciudad Celeste (Surf). Consejo: Mewtwo nivel 70: lleva Ultra Balls y algo que lo duerma. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Kanto (sin Mew)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: en cualquier momento; lo habitual es completarla tras la Liga (Mewtwo está en la Cueva Celeste, que solo se abre tras la Liga y tras entregar el Rubí y el Zafiro a Celio). Dónde: todo Kanto; el diploma lo da el diseñador del juego en la Mansión Azulona, 3.ª planta (Ciudad Azulona). Paso a paso: 1) Captura las 150 especies de Kanto; Mew no hace falta. 2) Consigue por intercambio las exclusivas de la otra edición, el fósil que no elegiste, el Pokémon de elección única (Hitmonlee o Hitmonchan) y, criando más Eevee en la Guardería, todas sus evoluciones, más las evoluciones por intercambio (Alakazam, Machamp, Golem, Gengar). 3) No te dejes los encuentros únicos: Snorlax, Lapras, los tres pájaros legendarios y Mewtwo. 4) Repasa la lista especie a especie: no basta con que el contador marque 150. 5) Habla con el diseñador del juego para recibir el diploma; esta Pokédex también te da una estrella de la Ficha de Entrenador. Fuente: WikiDex «Ficha de entrenador»; WikiDex «Edificio Azulona»; WikiDex «Cueva Celeste».","phase":6,"order":610},{"id":"card-2","label":"Pokédex Nacional según exclusiones oficiales","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: tras el Hall de la Fama, con la Pokédex Nacional del Profesor Oak. Dónde: Kanto, las islas de Archi7 y el Centro de Redes de Isla Prima. Paso a paso: 1) Registra como capturadas 380 especies: todas salvo Mew, Lugia, Ho-Oh, Celebi, Jirachi y Deoxys. Cuenta especie a especie: el total puede incluir alguna de esas seis y no basta. 2) Atrapa las especies de Johto que aparecen en Archi7 tras la Pokédex Nacional y cría las que solo se obtienen en la Guardería. 3) Entrega el Rubí y el Zafiro a Celio en Isla Prima para activar su máquina de redes y trae por intercambio las especies de Hoenn desde Rubí, Zafiro o Esmeralda, y las de Colosseum o XD. 4) Repasa la Pokédex Nacional hasta que no falte ninguna de las 380. Consejo: Lugia y Ho-Oh no hacen falta; están en la Roca Ombligo, que en la edición original solo se abría con el Misti-ticket de un evento ya cerrado (hoy, con Pokekeep). Fuente: WikiDex «Ficha de entrenador»; WikiDex «Roca Ombligo».","phase":6,"order":620},{"id":"card-3","label":"200 saltos de Salto Pokémon y 200 bayas de Dodrio a por bayas","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: tras rescatar a Pedrita en el Bosque Baya (Isla Tera) y volver a hablar con su padre, el dueño de los Recreativos de Isla Secunda; la siguiente vez que entres, los minijuegos ya funcionan. Dónde: Isla Secunda (Archi7), Recreativos. Paso a paso: 1) Necesitas el adaptador inalámbrico de Game Boy Advance y otros jugadores con Rojo Fuego, Verde Hoja o Esmeralda. 2) Salto Pokémon (de 2 a 5 jugadores, con Pokémon de menos de 70 cm): saltad la cuerda hasta lograr 200 saltos seguidos. 3) Dodrio a por bayas: cada jugador debe llevar un Dodrio en el equipo; recoge 200 bayas o más. 4) Hacen falta los dos récords para la estrella de la Ficha de Entrenador. Consejo: quien quiera la estrella debe hacer de líder en ambos minijuegos; Salto Pokémon es el más difícil y se recomienda jugarlo con solo dos jugadores, y Dodrio a por bayas con tres. Fuente: WikiDex «Recreativos»; WikiDex «Ficha de entrenador»; WikiDex «Salto Pokémon»; WikiDex «Dodrio a por bayas».","phase":6,"order":630},{"id":"event-0","label":"Mew: distribución histórica, no encuentro normal del cartucho","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew no se encuentra en el juego normal: llegó por eventos (y por el famoso fallo de Rojo/Azul, que no cuenta como evento legal). Con Pokekeep: Añade el Mew de evento legal desde la Librería; Pokekeep conserva sus datos originales de distribución.","phase":7,"order":700},{"id":"pokemon-243","label":"Registrar a Raikou en la Pokédex de esta partida (vaga por Kanto si elegiste a Squirtle; las otras bestias, por intercambio)","category":"Legendarios","tier":1,"species":243,"auto":null,"how":"Cuándo: Tras recibir la Pokédex Nacional y si elegiste a Squirtle: Raikou vaga por Kanto. Dónde: errante por la región (nivel 50). Cómo: Es errante y huye: síguelo con la Pokédex (zona) y usa Mal de Ojo o Bloqueo. Consejo: Raikou nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida (vaga por Kanto si elegiste a Bulbasaur; las otras bestias, por intercambio)","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Tras recibir la Pokédex Nacional y si elegiste a Bulbasaur: Entei vaga por Kanto. Dónde: errante por la región (nivel 50). Cómo: Es errante y huye: síguelo con la Pokédex y usa Mal de Ojo o Bloqueo. Consejo: Entei nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida (vaga por Kanto si elegiste a Charmander; las otras bestias, por intercambio)","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras recibir la Pokédex Nacional y si elegiste a Charmander: Suicune vaga por Kanto. Dónde: errante por la región (nivel 50). Cómo: Es errante y huye: síguelo con la Pokédex y usa Mal de Ojo o Bloqueo. Consejo: Suicune nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"sevii-gems","label":"Llevar el Rubí y el Zafiro a Celio en Isla Prima","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: después del Hall de la Fama y de recibir la Pokédex Nacional del Profesor Oak. Dónde: Centro de Redes de Isla Prima (Celio), Monte Ascuas (al norte de Isla Prima), Cueva Punteada (Isla Exta) y Almacén Rocket (Prado Isla Inta). Paso a paso: 1) Habla con Celio en Isla Prima: te pide el Rubí. 2) Ve al Monte Ascuas y baja hasta lo más hondo con Fuerza y Golpe Roca para coger el Rubí; allí oyes también a unos reclutas del Team Rocket decir una contraseña del almacén. 3) Entrégaselo a Celio, que te da un pase para llegar a las islas Quarta a Sétima. 4) Ayuda a Lorelei a echar al Team Rocket de la Cueva Glaciada (Isla Quarta); el científico que tapaba la Cueva Punteada se va. Ábrela con Corte y llega al fondo: el científico te roba el Zafiro y te dice la segunda contraseña. 5) Con las dos contraseñas entra en el Almacén Rocket, vence al científico y recupera el Zafiro. 6) Llévaselo a Celio: activa la máquina de redes para intercambiar con Rubí, Zafiro y Esmeralda, imprescindible para la Pokédex Nacional. Fuente: WikiDex «Monte Ascuas»; WikiDex «Cueva Punteada»; WikiDex «Almacén Rocket».","phase":2,"order":205},{"id":"trainer-tower","label":"Superar la Torre Desafío (Isla Sétima) en sus cuatro modos","category":"Combates","tier":1,"species":null,"auto":null,"how":"Al norte de la Isla Sétima, con Surf (tras la Pokédex Nacional y abrir las islas 6 y 7): la Torre Desafío tiene cuatro modos (Individual, Doble, Eliminatorio y Mixto). Supera cada uno subiendo los pisos y venciendo al entrenador de la azotea; cuanto más rápido, mejor premio.","phase":3,"order":310}],"LEAFGREEN":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Explorar Cueva Celeste y concluir la actividad posterior a la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Hall de la Fama se abre la Cueva Celeste (al noroeste de Ciudad Celeste, con Surf), con Mewtwo al fondo. En Rojo Fuego/Verde Hoja la posliga sigue en Archi7: recupera el Rubí (Mt. Ascuas, Isla Prima) y el Zafiro (Isla Exta) para activar la máquina de la Red; Oak te da la Pokédex Nacional y se abren las islas 6 y 7.","phase":2,"order":200},{"id":"battle0","label":"Revancha frente al Campeón y combates importantes disponibles","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras el Hall de la Fama puedes volver a la Meseta Añil y repetir el Alto Mando y el combate contra el campeón (tu rival); en Rojo Fuego/Verde Hoja, con la Pokédex Nacional, sus equipos suben de nivel. En Rojo Fuego/Verde Hoja hay además la Torre Desafío (Isla Sétima) y las revanchas con el Buscapelea.","phase":3,"order":300},{"id":"items0","label":"Visor Silph, Poké Flauta y MO necesarias para todas las rutas","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Se consiguen durante la historia, en este orden: MO01 Corte (S.S. Anne, Ciudad Carmín), MO05 Destello (ayudante de Oak en la Ruta 2, con 10 especies), Poké Flauta (Mr. Fuji, Pueblo Lavanda, tras rescatarlo de la Torre Pokémon con el Visor Silph del Casino Rocket de Ciudad Azulona), MO02 Vuelo (casa de la Ruta 16), MO03 Surf (Zona Safari), MO04 Fuerza (guarda de la Zona Safari, con el Diente de Oro). Sin la Poké Flauta no se despierta a los Snorlax de las rutas 12 y 16.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Kanto y recompensas de Oak","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Kanto (150; Mew no cuenta). Las exclusivas de la otra edición y las evoluciones por intercambio solo por intercambio. El ayudante de Oak o el propio Oak te premian según los registros; con la Pokédex completa, el diseñador del juego (Mansión Azulona) te da el diploma. Con Pokekeep: Las especies que te falten por intercambio o de la otra edición puedes añadirlas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Kanto (diseñador del juego, Mansión Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":n ":260},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida (vaga por Kanto si elegiste a Bulbasaur; las otras bestias, por intercambio)","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Tras recibir la Pokédex Nacional y si elegiste a Bulbasaur: Entei vaga por Kanto. Dónde: errante por la región (nivel 50). Cómo: Es errante y huye: síguelo con la Pokédex y usa Mal de Ojo o Bloqueo. Consejo: Entei nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida (vaga por Kanto si elegiste a Charmander; las otras bestias, por intercambio)","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras recibir la Pokédex Nacional y si elegiste a Charmander: Suicune vaga por Kanto. Dónde: errante por la región (nivel 50). Cómo: Es errante y huye: síguelo con la Pokédex y usa Mal de Ojo o Bloqueo. Consejo: Suicune nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"sevii-gems","label":"Llevar el Rubí y el Zafiro a Celio en Isla Prima","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: después del Hall de la Fama y de recibir la Pokédex Nacional del Profesor Oak. Dónde: Centro de Redes de Isla Prima (Celio), Monte Ascuas (al norte de Isla Prima), Cueva Punteada (Isla Exta) y Almacén Rocket (Prado Isla Inta). Paso a paso: 1) Habla con Celio en Isla Prima: te pide el Rubí. 2) Ve al Monte Ascuas y baja hasta lo más hondo con Fuerza y Golpe Roca para coger el Rubí; allí oyes también a unos reclutas del Team Rocket decir una contraseña del almacén. 3) Entrégaselo a Celio, que te da un pase para llegar a las islas Quarta a Sétima. 4) Ayuda a Lorelei a echar al Team Rocket de la Cueva Glaciada (Isla Quarta); el científico que tapaba la Cueva Punteada se va. Ábrela con Corte y llega al fondo: el científico te roba el Zafiro y te dice la segunda contraseña. 5) Con las dos contraseñas entra en el Almacén Rocket, vence al científico y recupera el Zafiro. 6) Llévaselo a Celio: activa la máquina de redes para intercambiar con Rubí, Zafiro y Esmeralda, imprescindible para la Pokédex Nacional. Fuente: WikiDex «Monte Ascuas»; WikiDex «Cueva Punteada»; WikiDex «Almacén Rocket».","phase":2,"order":205},{"id":"trainer-tower","label":"Superar la Torre Desafío (Isla Sétima) en sus cuatro modos","category":"Combates","tier":1,"species":null,"auto":null,"how":"Al norte de la Isla Sétima, con Surf (tras la Pokédex Nacional y abrir las islas 6 y 7): la Torre Desafío tiene cuatro modos (Individual, Doble, Eliminatorio y Mixto). Supera cada uno subiendo los pisos y venciendo al entrenador de la azotea; cuanto más rápido, mejor premio.","phase":3,"order":310}],"DIAMOND":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Explorar la Zona de Combate y resolver encuentros de Sinnoh tras la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga: Pokédex Nacional (al ver todas las especies de Sinnoh, Serbal te la da), la Zona de Combate en barco desde Ciudad Puntaneva, Bulgur y Heatran en la Montaña Dura, Giratina en la Cueva Retorno y Cresselia en la Isla Plenilunio.","phase":2,"order":200},{"id":"battle1","label":"Volver a vencer al Alto Mando y a Cintia en la Liga de Sinnoh (Diamante y Perla no tienen equipos de revancha)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ser campeón; se puede repetir la Liga cuantas veces quieras. Dónde: Liga Pokémon de Sinnoh, al final de la Calle Victoria (se llega haciendo Surf por la Ruta 223 desde Ciudad Marina). Paso a paso: 1) Ten en cuenta que en Diamante y Perla no hay equipos de revancha: al volver, el Alto Mando (niveles 53-63) y Cintia (60-66) usan los mismos equipos que la primera vez; la revancha reforzada llega con Platino. 2) Prepara un equipo por encima del nivel 60 y lleva curaciones (Hiperpoción, Revivir, Restaura todo): dentro de la Liga no puedes salir a curar entre combates. 3) Vence en orden a Alecrán (bicho), Gaia (tierra), Fausto (fuego) y Delos (psíquico). 4) Termina el recorrido venciendo a Cintia para que cuente la vuelta completa. Consejo: repetir la Liga es un buen sitio para subir de nivel y ganar dinero. Fuente: WikiDex «Liga Pokémon (Sinnoh)»; WikiDex «Alecrán».","phase":3,"order":310},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Sinnoh (director del juego, Hotel Gran Lago, Orilla Valor)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto hayas visto las 150 especies de la Pokédex de Sinnoh que cuentan (basta con verlas, no hace falta capturarlas); Manaphy, el n.º 151, no cuenta. Dónde: Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor, en la casa del director del juego. Paso a paso: 1) Completa los vistos de la Pokédex de Sinnoh: combate contra entrenadores de toda la región y fíjate en los Pokémon que te ofrecen en los intercambios. 2) Al completarla, ve al laboratorio del profesor Serbal en Pueblo Arena: allí aparece el profesor Oak, que instala la Pokédex Nacional. 3) Ve al Hotel Gran Lago y entra en la casa del director del juego. 4) Habla con él: evaluará tu Pokédex y te entregará el diploma de la Pokédex de Sinnoh. Consejo: las especies que solo ves en combate contra entrenadores cuentan igual; la Liga y las revanchas contra entrenadores ayudan a completar los vistos. Fuente: WikiDex «Pokédex» (Completar la Pokédex); WikiDex «Hotel Gran Lago»; WikiDex «Profesor Oak».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en la fase final, tras tener la Pokédex Nacional. Dónde: Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor, en la casa del director del juego. Paso a paso: 1) Registra como capturadas 482 especies de la Pokédex Nacional; no cuentan Mew, Lugia, Ho-Oh, Celebi, Jirachi, Deoxys, Phione, Manaphy, Darkrai, Shaymin ni Arceus. 2) Completa lo que no se puede capturar en Diamante o Perla trayéndolo de la otra versión, de Platino, de Oro HeartGold y Plata SoulSilver por intercambio, o de los juegos de Game Boy Advance mediante el Parque Compi (Ruta 221). 3) Ve al Hotel Gran Lago y entra en la casa del director del juego. 4) Habla con él y te dará el diploma de la Pokédex Nacional; además, completar la Pokédex Nacional es una de las estrellas de la ficha de entrenador. Consejo: los exclusivos de versión y los iniciales de otras regiones son lo que más tarda; organiza los intercambios antes de empezar. Fuente: WikiDex «Pokédex» (Completar la Pokédex); WikiDex «Hotel Gran Lago»; WikiDex «Ficha de entrenador».","phase":6,"order":615},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza (fin de la historia del Equipo Galaxia). Dónde: Caverna Agudeza (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza (al norte de Ciudad Puntaneva). Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza: visita la Caverna Veraz del Lago Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj y usa Mal de Ojo o la Master Ball. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza. Dónde: Caverna Valor (nivel 50). Cómo: Caverna Valor, en el Lago Valor (Surf). Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en la Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-483","label":"Registrar a Dialga en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":483,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columna Lanza (nivel 47). Cómo: Columna Lanza: tras vencer a los comandantes y a Helio, Dialga aparece. Es obligatorio continuar. Consejo: Dialga nivel 47. Si lo debilitas, vuelve tras la Liga; guarda antes. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de
