a); enseña Danza Dragón. 4) Núcleo 4: en la comisaría de Denio, en la Ruta 17 (Ula-Ula); enseña Mil Temblores. 5) Núcleo 5: en la casa de Hela, en el Antiguo Paso de Poni (Poni); enseña Núcleo Castigo. 6) Los núcleos se distinguen de las células por su destello rojo y cuentan como piezas: con las 95 células suman las 100. Consejo: los movimientos de los núcleos se enseñan a Zygarde con el Arca. Fuente: WikiDex «Arca de Zygarde»; Serebii «Zygarde Cores & Cells».","phase":4,"order":410}],"ULTRASUN":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, incluido Rainbow Rocket cuando corresponda","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: defensa del título en la Liga, tapus en sus ruinas, Necrozma y Código Cero. En Sol/Luna, las misiones de los ultraentes con Handsome y Anabel; en Ultrasol/Ultraluna, el Episodio RR (Team Rainbow Rocket) en el Paraíso Æther y el Ultraviaje.","phase":2,"order":200},{"id":"battle0","label":"Superar el Árbol de Combate y derrotar entrenadores importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Árbol de Combate (al final de la Pendiente de Poni, tras la Liga): combates Individual, Doble y Múltiple contra entrenadores y leyendas invitadas (Rojo, Azul...). Hay sellos por 50 victorias seguidas en cada modalidad.","phase":3,"order":300},{"id":"battle1","label":"Defender el título de campeón de Alola en la Liga del Monte Lanakila","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ser campeón de Alola (en Ultrasol y Ultraluna el título se gana venciendo a Tilo tras el Alto Mando). Dónde: Liga Pokémon del Monte Lanakila (Ula-Ula). Paso a paso: 1) Vuelve a la Liga y vence otra vez al Alto Mando. 2) Al llegar a la sala del campeón aparece un retador; el primero es siempre Tilo. 3) Después el retador sale de forma aleatoria entre Tilo, el Profesor Kukui, Guzmán, Olano, Chris, Francine, Hela y José; Samina solo aparece el primer día de cada mes. 4) Gladio no está desde el principio: vuelve de Kanto para retarte cuando pasa un mes desde que capturas o derrotas a Necrozma en el Monte Lanakila. 5) Gana cada combate para sumar una defensa del título y repite el ciclo; si pierdes, esa visita no cuenta. Consejo: los retadores llevan Pokémon de nivel 68 a 70; lleva un equipo de ese nivel y objetos de curación. Fuente: WikiDex «Liga Pokémon (Alola)».","phase":3,"order":310},{"id":"items0","label":"Cristales Z, Zygarde o recursos únicos según edición","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cristales Z: uno por cada prueba y gran prueba del recorrido insular (los de tipo, en orden de la historia) y los exclusivos de Pokémon concretos por la posliga. Arca de Zygarde: Ruta 16 (Akala).","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex regional de Alola","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Alola (las cuatro islas). Cada vez que completes la sección de una isla, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala) para que selle tu pasaporte; con la de Alola completa (sin singulares) te da el diploma y el Amuleto Iris. Con Pokekeep: Las especies exclusivas de la otra edición, añádelas legales desde la Librería si no puedes intercambiarlas.","phase":5,"order":500},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Alola completa (director del juego, Iwao, oficinas de Game Freak de Ciudad Kantai)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cualquier momento, aunque en la práctica tras la Liga. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Registra como capturados los Pokémon de las Pokédex insulares (Melemele, Akala, Ula-Ula y Poni) y de la Pokédex de Alola (403 entradas). 2) No hacen falta los singulares (Magearna, Marshadow y Zeraora): son 400 Pokémon. 3) Habla con el director del juego, Iwao, en las oficinas de GAME FREAK: sella tu pasaporte por cada Pokédex insular completa. 4) Con la de Alola completa vuelve a sellarlo y te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor. Consejo: muchos Pokémon de otras regiones aparecen en los Ultraumbrales, y los exclusivos de la otra edición se consiguen por intercambio. Fuente: WikiDex «Amuleto Iris», «Game Freak» y «Lista de Pokémon según la Pokédex de Alola».","phase":6,"order":616},{"id":"final-boss","label":"Vencer a Morimoto e Iwao (combate múltiple) en las oficinas de Game Freak de Ciudad Kantai: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon por primera vez. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Entra en las oficinas de GAME FREAK y habla con Morimoto. 2) En Ultrasol y Ultraluna no combate solo: se une al director del juego, Kazumasa Iwao, y te enfrentas a los dos a la vez. 3) El combate se puede repetir una vez al día. 4) La primera victoria te da el Amuleto Oval, que aumenta la probabilidad de que aparezcan huevos en la guardería. Consejo: Morimoto saca Gengar, Dragonite y Machamp (nivel 57) e Iwao, Kecleon, Ambipom y Blissey (nivel 56); lleva movimientos que alcancen a los dos rivales y objetos de curación. Fuente: WikiDex «Amuleto oval», «Shigeki Morimoto» y «Game Freak».","phase":3,"order":390},{"id":"pokemon-785","label":"Registrar a Tapu Koko en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":785,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Guerra (nivel 60). Cómo: Entra en las Ruinas de la Guerra (Melemele) y acércate al altar del fondo. Consejo: Tapu Koko nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-786","label":"Registrar a Tapu Lele en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":786,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Vida (nivel 60). Cómo: Entra en las Ruinas de la Vida (Akala) y acércate al altar del fondo. Consejo: Tapu Lele nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-787","label":"Registrar a Tapu Bulu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":787,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Cosecha (nivel 60). Cómo: Entra en las Ruinas de la Cosecha (Ula-Ula) y acércate al altar del fondo. Consejo: Tapu Bulu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-788","label":"Registrar a Tapu Fini en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":788,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas del Tránsito (nivel 60). Cómo: Entra en las Ruinas del Tránsito (Poni) y acércate al altar del fondo. Consejo: Tapu Fini nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-789","label":"Registrar a Cosmog en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":789,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Lago Corosol (nivel 5). Cómo: Un Cosmog te espera en el Lago Corosol: se une a tu equipo. Consejo: Cosmog nivel 5, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-800","label":"Registrar a Necrozma en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":800,"auto":null,"how":"Cuándo: Después de ser campeón (tras el combate contra Ultra-Necrozma en la historia). Dónde: Monte Lanakila (nivel 65). Cómo: En la cima del Monte Lanakila. Consejo: Necrozma nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-791","label":"Registrar a Solgaleo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":791,"auto":null,"how":"Cuándo: Durante la historia, tras superar la prueba de Rika en la isla de Poni. Dónde: Lago Corosol (nivel 5); Senda Mahalo (Puente Colgante) (nivel 60). Cómo: Vuelve a la Senda Mahalo (Puente Colgante, Melemele): el legendario te espera allí. Consejo: Nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":185},{"id":"stickers","label":"Recoger las 100 dominsignias (pegatinas dominantes)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Las dominsignias son pegatinas brillantes que aparecen por el mapa a partir de la isla de Melemele: hay 17 en Melemele, 33 en Akala, 34 en Ula-Ula y 16 en Poni. Recógelas mientras avanzas cada isla y entrégalas a Gabriel Oak en la Playa de Kantai: según cuántas lleves te regala Pokémon del tamaño de un dominante, y con las 100 un Ribombee (Ultrasol) o un Kommo-o (Ultraluna). Las últimas de Poni piden haber llegado a esa isla. No son los sellos del pasaporte. Fuente: WikiDex «Dominsignia».","phase":4,"order":420},{"id":"rocket","label":"Completar el episodio Team Rainbow Rocket","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Cuándo: después de la Liga, de ver los créditos y de ayudar a la Unidad Ultra con los Ultraentes en Poni. Dónde: tu casa, la Festi Plaza y el Paraíso Æther. Paso a paso: 1) Chris aparece en tu casa muy preocupado: el Team Rainbow Rocket ha tomado la Festi Plaza. 2) Allí no puedes usar tu equipo: en la Agencia de Combate te prestan Pokémon para vencer al jefe de los reclutas; Chris recupera el control y te da un Botón Escape. 3) De vuelta en casa, las noticias muestran el ataque al Paraíso Æther; ve allí con Lylia, vence a los reclutas y, junto a ella, a Fabio en un combate doble. 4) Dentro, Lylia cura tu equipo cuando quieras. Derrota a Aquiles y a Magno (en las dos ediciones), después a Helio y a Lysson, luego a Ghechis y, por último, a Giovanni en el despacho de Samina. 5) Al salir te entregan 55 Maxipepitas como recompensa. Consejo: los jefes usan legendarios de nivel 66-67 y Giovanni tiene a Mewtwo, que megaevoluciona; llega con un equipo fuerte y curaciones. Fuente: WikiDex «Episodio Rainbow Rocket».","phase":2,"order":210},{"id":"card-0","label":"Sello 1: Entrenador Pokémon oficial","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello que se consigue al empezar la aventura, cuando el profesor Kukui te inscribe como entrenador oficial y recibes la tarjeta. No hay que hacer nada.","phase":6,"order":600},{"id":"card-1","label":"Sello 2: Gran Prueba de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Melemele: tras superar la prueba del capitán, el kahuna de la isla te espera en Pueblo Lilii para la gran prueba. Ganarla da el sello y el Cristal Z de tipo Lucha.","phase":6,"order":601},{"id":"card-2","label":"Sello 3: Gran Prueba de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Akala: supera las tres pruebas de la isla (agua, fuego y planta) y vence a la kahuna en Ciudad Konikoni. Da el sello y el Cristal Z de tipo Roca.","phase":6,"order":602},{"id":"card-3","label":"Sello 4: Gran Prueba de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Ula-Ula: supera las pruebas de la isla y vence al kahuna, que está en Pueblo Po. Da el sello y el Cristal Z de tipo Siniestro.","phase":6,"order":603},{"id":"card-4","label":"Sello 5: Gran Prueba de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Poni: supera la última prueba y vence a la kahuna de la isla. Da el sello y el Cristal Z de tipo Tierra; con ella termina el recorrido insular.","phase":6,"order":604},{"id":"card-5","label":"Sello 6: Recorrido Insular completado y Liga","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Termina el recorrido insular y conviértete en campeón de la Liga de Alola.","phase":6,"order":605},{"id":"card-6","label":"Sello 7: Pokédex de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Melemele de la Pokédex de Alola. Casi todas salen durante la historia; algunas solo de noche, con el tiempo o por evolución. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":606},{"id":"card-7","label":"Sello 8: Pokédex de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Akala. Algunas solo aparecen tras la Liga o por evolución por intercambio. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":607},{"id":"card-8","label":"Sello 9: Pokédex de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Ula-Ula. Varias son exclusivas de una edición (intercambio) o aparecen tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Doble; lleva un equipo pensado para dobles.","phase":6,"order":612},{"id":"card-13","label":"Sello 14: Pokévisor Pro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Consigue la última mejora del Pokévisor (Pokévisor Pro) haciendo fotos en los puntos de foto hasta llegar al máximo de valoraciones.","phase":6,"order":613},{"id":"card-14","label":"Sello 15: 50 victorias seguidas múltiples en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: 50 victorias seguidas en el Árbol de Combate, Múltiple (con un compañero).","phase":6,"order":614},{"id":"event-0","label":"Magearna y otros singulares: QR, entregas/eventos y requisitos de edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Magearna: se recibía tras ser campeón escaneando su código QR oficial (evento) con el escáner QR. Con Pokekeep: Añade Magearna legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Marshadow y Zeraora: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 60); Antiguo Paso de Poni (nivel 60). Cómo: Zyra te lo da en el Antiguo Paso de Poni. Consejo: Código Cero nivel 60, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Después de ser campeón (no hay células repartidas por Alola). Dónde: Ruta 16 (nivel 63); Ruta 16 (nivel 50); Gruta Desenlace (nivel 60). Cómo: Dexio te da un Zygarde al 10 % y el Arca (Ruta 16); hay otro al 50 % en la Gruta Desenlace. Con las 100 células del Arca, forma completa en el laboratorio Æther de la Ruta 16. Consejo: Zygarde 50 % nivel 63 en la Gruta Desenlace. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"zygarde-cells","label":"Reunir las 100 células y núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: tras la Liga (Ultrasol y Ultraluna; en Sol y Luna funciona distinto). Dónde: Gruta Desenlace (Poni) y laboratorio Æther de la Ruta 16 (Ula-Ula). Paso a paso: 1) En Ultrasol y Ultraluna no hay células repartidas por el mapa. 2) Captura el único Zygarde al 50 % que aparece en la Gruta Desenlace tras superar la Liga (50 piezas). 3) Ve al laboratorio de la Ruta 16: tras vencer a Dexio, él y Sina te entregan el Arca de Zygarde, que ya trae las 40 células y núcleos restantes. 4) Dexio te regala además un Zygarde al 10 % (10 piezas). 5) Con 50 + 40 + 10 tienes las 100: en la Ruta 16 puedes crear o separar Zygarde y obtener uno con la habilidad Agrupamiento, que pasa a Zygarde completo en combate. Consejo: guarda antes del combate en la Gruta Desenlace; es el único ejemplar. Fuente: WikiDex «Arca de Zygarde», «Zygarde» y «Ruta 16 (Alola)».","phase":4,"order":405},{"id":"zygarde-cores","label":"Reunir los 5 núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En USUL los cinco núcleos vienen dentro del Arca de Zygarde que te dan en la Ruta 16 tras la Liga (WikiDex «Arca de Zygarde»): no hay que buscarlos por Alola.","phase":4,"order":410},{"id":"mantine-surf","label":"Completar los cuatro recorridos del Surfeo Mantine","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que superas la gran prueba del kahuna Kaudan en Melemele; cada playa, a medida que llegas a su isla. Dónde: puestos surferos de la playa Big Wave (Melemele), la playa de Kantai (Akala), la playa de Ula-Ula y la playa de Poni. Paso a paso: 1) Habla con el Mantine del puesto surfero; el nadador junto a la tabla clasificatoria te da el tutorial. 2) Cada puesto tiene su recorrido hacia otra isla y su propia clasificatoria, cada una más exigente: el récord a batir va de 12.200 puntos en Big Wave a 58.300 en Poni. 3) Haz cada recorrido y termina con puntuación; salta olas y encadena acrobacias. Los puntos se canjean por PB, y cada primer puesto desbloquea acrobacias nuevas. 4) Si logras el primer puesto en las cuatro clasificatorias, un hombre del Club de Surf de Ciudad Kantai te regala un Pikachu que sabe Surf. Consejo: el Tornado Starmie es la acrobacia que más puntúa. Fuente: WikiDex «Surfeo Mantine».","phase":4,"order":395}],"ULTRAMOON":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, incluido Rainbow Rocket cuando corresponda","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: defensa del título en la Liga, tapus en sus ruinas, Necrozma y Código Cero. En Sol/Luna, las misiones de los ultraentes con Handsome y Anabel; en Ultrasol/Ultraluna, el Episodio RR (Team Rainbow Rocket) en el Paraíso Æther y el Ultraviaje.","phase":2,"order":200},{"id":"battle0","label":"Superar el Árbol de Combate y derrotar entrenadores importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Árbol de Combate (al final de la Pendiente de Poni, tras la Liga): combates Individual, Doble y Múltiple contra entrenadores y leyendas invitadas (Rojo, Azul...). Hay sellos por 50 victorias seguidas en cada modalidad.","phase":3,"order":300},{"id":"battle1","label":"Defender el título de campeón de Alola en la Liga del Monte Lanakila","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ser campeón de Alola (en Ultrasol y Ultraluna el título se gana venciendo a Tilo tras el Alto Mando). Dónde: Liga Pokémon del Monte Lanakila (Ula-Ula). Paso a paso: 1) Vuelve a la Liga y vence otra vez al Alto Mando. 2) Al llegar a la sala del campeón aparece un retador; el primero es siempre Tilo. 3) Después el retador sale de forma aleatoria entre Tilo, el Profesor Kukui, Guzmán, Olano, Chris, Francine, Hela y José; Samina solo aparece el primer día de cada mes. 4) Gladio no está desde el principio: vuelve de Kanto para retarte cuando pasa un mes desde que capturas o derrotas a Necrozma en el Monte Lanakila. 5) Gana cada combate para sumar una defensa del título y repite el ciclo; si pierdes, esa visita no cuenta. Consejo: los retadores llevan Pokémon de nivel 68 a 70; lleva un equipo de ese nivel y objetos de curación. Fuente: WikiDex «Liga Pokémon (Alola)».","phase":3,"order":310},{"id":"items0","label":"Cristales Z, Zygarde o recursos únicos según edición","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cristales Z: uno por cada prueba y gran prueba del recorrido insular (los de tipo, en orden de la historia) y los exclusivos de Pokémon concretos por la posliga. Arca de Zygarde: Ruta 16 (Akala).","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex regional de Alola","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Alola (las cuatro islas). Cada vez que completes la sección de una isla, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala) para que selle tu pasaporte; con la de Alola completa (sin singulares) te da el diploma y el Amuleto Iris. Con Pokekeep: Las especies exclusivas de la otra edición, añádelas legales desde la Librería si no puedes intercambiarlas.","phase":5,"order":500},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Alola completa (director del juego, Iwao, oficinas de Game Freak de Ciudad Kantai)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cualquier momento, aunque en la práctica tras la Liga. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Registra como capturados los Pokémon de las Pokédex insulares (Melemele, Akala, Ula-Ula y Poni) y de la Pokédex de Alola (403 entradas). 2) No hacen falta los singulares (Magearna, Marshadow y Zeraora): son 400 Pokémon. 3) Habla con el director del juego, Iwao, en las oficinas de GAME FREAK: sella tu pasaporte por cada Pokédex insular completa. 4) Con la de Alola completa vuelve a sellarlo y te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor. Consejo: muchos Pokémon de otras regiones aparecen en los Ultraumbrales, y los exclusivos de la otra edición se consiguen por intercambio. Fuente: WikiDex «Amuleto Iris», «Game Freak» y «Lista de Pokémon según la Pokédex de Alola».","phase":6,"order":616},{"id":"final-boss","label":"Vencer a Morimoto e Iwao (combate múltiple) en las oficinas de Game Freak de Ciudad Kantai: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon por primera vez. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Entra en las oficinas de GAME FREAK y habla con Morimoto. 2) En Ultrasol y Ultraluna no combate solo: se une al director del juego, Kazumasa Iwao, y te enfrentas a los dos a la vez. 3) El combate se puede repetir una vez al día. 4) La primera victoria te da el Amuleto Oval, que aumenta la probabilidad de que aparezcan huevos en la guardería. Consejo: Morimoto saca Gengar, Dragonite y Machamp (nivel 57) e Iwao, Kecleon, Ambipom y Blissey (nivel 56); lleva movimientos que alcancen a los dos rivales y objetos de curación. Fuente: WikiDex «Amuleto oval», «Shigeki Morimoto» y «Game Freak».","phase":3,"order":390},{"id":"pokemon-785","label":"Registrar a Tapu Koko en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":785,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Guerra (nivel 60). Cómo: Entra en las Ruinas de la Guerra (Melemele) y acércate al altar del fondo. Consejo: Tapu Koko nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-786","label":"Registrar a Tapu Lele en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":786,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Vida (nivel 60). Cómo: Entra en las Ruinas de la Vida (Akala) y acércate al altar del fondo. Consejo: Tapu Lele nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-787","label":"Registrar a Tapu Bulu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":787,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Cosecha (nivel 60). Cómo: Entra en las Ruinas de la Cosecha (Ula-Ula) y acércate al altar del fondo. Consejo: Tapu Bulu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-788","label":"Registrar a Tapu Fini en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":788,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas del Tránsito (nivel 60). Cómo: Entra en las Ruinas del Tránsito (Poni) y acércate al altar del fondo. Consejo: Tapu Fini nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-789","label":"Registrar a Cosmog en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":789,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Lago Coroluna (nivel 5). Cómo: Un Cosmog te espera en el Lago Coroluna: se une a tu equipo. Consejo: Cosmog nivel 5, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-800","label":"Registrar a Necrozma en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":800,"auto":null,"how":"Cuándo: Después de ser campeón (tras el combate contra Ultra-Necrozma en la historia). Dónde: Monte Lanakila (nivel 65). Cómo: En la cima del Monte Lanakila. Consejo: Necrozma nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-792","label":"Registrar a Lunala en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":792,"auto":null,"how":"Cuándo: Durante la historia, tras superar la prueba de Rika en la isla de Poni. Dónde: Lago Coroluna (nivel 5); Senda Mahalo (Puente Colgante) (nivel 60). Cómo: Vuelve a la Senda Mahalo (Puente Colgante, Melemele): el legendario te espera allí. Consejo: Nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":185},{"id":"stickers","label":"Recoger las 100 dominsignias (pegatinas dominantes)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Las dominsignias son pegatinas brillantes que aparecen por el mapa a partir de la isla de Melemele: hay 17 en Melemele, 33 en Akala, 34 en Ula-Ula y 16 en Poni. Recógelas mientras avanzas cada isla y entrégalas a Gabriel Oak en la Playa de Kantai: según cuántas lleves te regala Pokémon del tamaño de un dominante, y con las 100 un Ribombee (Ultrasol) o un Kommo-o (Ultraluna). Las últimas de Poni piden haber llegado a esa isla. No son los sellos del pasaporte. Fuente: WikiDex «Dominsignia».","phase":4,"order":420},{"id":"rocket","label":"Completar el episodio Team Rainbow Rocket","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Cuándo: después de la Liga, de ver los créditos y de ayudar a la Unidad Ultra con los Ultraentes en Poni. Dónde: tu casa, la Festi Plaza y el Paraíso Æther. Paso a paso: 1) Chris aparece en tu casa muy preocupado: el Team Rainbow Rocket ha tomado la Festi Plaza. 2) Allí no puedes usar tu equipo: en la Agencia de Combate te prestan Pokémon para vencer al jefe de los reclutas; Chris recupera el control y te da un Botón Escape. 3) De vuelta en casa, las noticias muestran el ataque al Paraíso Æther; ve allí con Lylia, vence a los reclutas y, junto a ella, a Fabio en un combate doble. 4) Dentro, Lylia cura tu equipo cuando quieras. Derrota a Aquiles y a Magno (en las dos ediciones), después a Helio y a Lysson, luego a Ghechis y, por último, a Giovanni en el despacho de Samina. 5) Al salir te entregan 55 Maxipepitas como recompensa. Consejo: los jefes usan legendarios de nivel 66-67 y Giovanni tiene a Mewtwo, que megaevoluciona; llega con un equipo fuerte y curaciones. Fuente: WikiDex «Episodio Rainbow Rocket».","phase":2,"order":210},{"id":"card-0","label":"Sello 1: Entrenador Pokémon oficial","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello que se consigue al empezar la aventura, cuando el profesor Kukui te inscribe como entrenador oficial y recibes la tarjeta. No hay que hacer nada.","phase":6,"order":600},{"id":"card-1","label":"Sello 2: Gran Prueba de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Melemele: tras superar la prueba del capitán, el kahuna de la isla te espera en Pueblo Lilii para la gran prueba. Ganarla da el sello y el Cristal Z de tipo Lucha.","phase":6,"order":601},{"id":"card-2","label":"Sello 3: Gran Prueba de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Akala: supera las tres pruebas de la isla (agua, fuego y planta) y vence a la kahuna en Ciudad Konikoni. Da el sello y el Cristal Z de tipo Roca.","phase":6,"order":602},{"id":"card-3","label":"Sello 4: Gran Prueba de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Ula-Ula: supera las pruebas de la isla y vence al kahuna, que está en Pueblo Po. Da el sello y el Cristal Z de tipo Siniestro.","phase":6,"order":603},{"id":"card-4","label":"Sello 5: Gran Prueba de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Poni: supera la última prueba y vence a la kahuna de la isla. Da el sello y el Cristal Z de tipo Tierra; con ella termina el recorrido insular.","phase":6,"order":604},{"id":"card-5","label":"Sello 6: Recorrido Insular completado y Liga","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Termina el recorrido insular y conviértete en campeón de la Liga de Alola.","phase":6,"order":605},{"id":"card-6","label":"Sello 7: Pokédex de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Melemele de la Pokédex de Alola. Casi todas salen durante la historia; algunas solo de noche, con el tiempo o por evolución. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":606},{"id":"card-7","label":"Sello 8: Pokédex de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Akala. Algunas solo aparecen tras la Liga o por evolución por intercambio. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":607},{"id":"card-8","label":"Sello 9: Pokédex de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Ula-Ula. Varias son exclusivas de una edición (intercambio) o aparecen tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Doble; lleva un equipo pensado para dobles.","phase":6,"order":612},{"id":"card-13","label":"Sello 14: Pokévisor Pro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Consigue la última mejora del Pokévisor (Pokévisor Pro) haciendo fotos en los puntos de foto hasta llegar al máximo de valoraciones.","phase":6,"order":613},{"id":"card-14","label":"Sello 15: 50 victorias seguidas múltiples en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: 50 victorias seguidas en el Árbol de Combate, Múltiple (con un compañero).","phase":6,"order":614},{"id":"event-0","label":"Magearna y otros singulares: QR, entregas/eventos y requisitos de edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Magearna: se recibía tras ser campeón escaneando su código QR oficial (evento) con el escáner QR. Con Pokekeep: Añade Magearna legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Marshadow y Zeraora: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 60); Antiguo Paso de Poni (nivel 60). Cómo: Zyra te lo da en el Antiguo Paso de Poni. Consejo: Código Cero nivel 60, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Después de ser campeón (no hay células repartidas por Alola). Dónde: Ruta 16 (nivel 63); Ruta 16 (nivel 50); Gruta Desenlace (nivel 60). Cómo: Dexio te da un Zygarde al 10 % y el Arca (Ruta 16); hay otro al 50 % en la Gruta Desenlace. Con las 100 células del Arca, forma completa en el laboratorio Æther de la Ruta 16. Consejo: Zygarde 50 % nivel 63 en la Gruta Desenlace. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"zygarde-cells","label":"Reunir las 100 células y núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: tras la Liga (Ultrasol y Ultraluna; en Sol y Luna funciona distinto). Dónde: Gruta Desenlace (Poni) y laboratorio Æther de la Ruta 16 (Ula-Ula). Paso a paso: 1) En Ultrasol y Ultraluna no hay células repartidas por el mapa. 2) Captura el único Zygarde al 50 % que aparece en la Gruta Desenlace tras superar la Liga (50 piezas). 3) Ve al laboratorio de la Ruta 16: tras vencer a Dexio, él y Sina te entregan el Arca de Zygarde, que ya trae las 40 células y núcleos restantes. 4) Dexio te regala además un Zygarde al 10 % (10 piezas). 5) Con 50 + 40 + 10 tienes las 100: en la Ruta 16 puedes crear o separar Zygarde y obtener uno con la habilidad Agrupamiento, que pasa a Zygarde completo en combate. Consejo: guarda antes del combate en la Gruta Desenlace; es el único ejemplar. Fuente: WikiDex «Arca de Zygarde», «Zygarde» y «Ruta 16 (Alola)».","phase":4,"order":405},{"id":"zygarde-cores","label":"Reunir los 5 núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En USUL los cinco núcleos vienen dentro del Arca de Zygarde que te dan en la Ruta 16 tras la Liga (WikiDex «Arca de Zygarde»): no hay que buscarlos por Alola.","phase":4,"order":410},{"id":"mantine-surf","label":"Completar los cuatro recorridos del Surfeo Mantine","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que superas la gran prueba del kahuna Kaudan en Melemele; cada playa, a medida que llegas a su isla. Dónde: puestos surferos de la playa Big Wave (Melemele), la playa de Kantai (Akala), la playa de Ula-Ula y la playa de Poni. Paso a paso: 1) Habla con el Mantine del puesto surfero; el nadador junto a la tabla clasificatoria te da el tutorial. 2) Cada puesto tiene su recorrido hacia otra isla y su propia clasificatoria, cada una más exigente: el récord a batir va de 12.200 puntos en Big Wave a 58.300 en Poni. 3) Haz cada recorrido y termina con puntuación; salta olas y encadena acrobacias. Los puntos se canjean por PB, y cada primer puesto desbloquea acrobacias nuevas. 4) Si logras el primer puesto en las cuatro clasificatorias, un hombre del Club de Surf de Ciudad Kantai te regala un Pikachu que sabe Surf. Consejo: el Tornado Starmie es la acrobacia que más puntúa. Fuente: WikiDex «Surfeo Mantine».","phase":4,"order":395}],"LETGOP":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Vencer a la Liga de Kanto en la revancha (equipos nuevos del Alto Mando y del campeón)","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Salón de la Fama, vuelve a la Meseta Añil y vence otra vez al Alto Mando y al campeón: en la revancha cambian sus Pokémon (WikiDex «Liga Pokémon (Kanto)»). Cómo lo sabe la guía: después de capturar a Mewtwo en la Cueva Celeste y vencer allí a Verde, Verde solo vuelve a aparecer en Ciudad Celeste cuando vences de nuevo a la Liga (WikiDex «Verde (personaje)»); la partida guarda si Verde está visible en la ciudad (bandera de desaparición FV_T03_GREEN, oculta desde la partida nueva). Si la ves allí, la revancha está ganada. Si ya la venciste en la ciudad vuelve a ocultarse y la guía no puede confirmarlo: márcalo a mano.","phase":2,"order":200},{"id":"battle0","label":"Vencer a los entrenadores Maestros Pokémon disponibles","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras ser campeón aparecen los 153 Entrenadores Maestros por todo Kanto (uno por especie): combate con un único Pokémon de su misma especie. Venciendo a todos se gana el título de gran maestro.","phase":3,"order":300},{"id":"battle1","label":"Desafiar a Rojo y otros entrenadores destacados","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras vencer al menos a 6 Entrenadores Maestros, Rojo te espera en la Meseta Añil; derrotarlo da el título de maestro del combate.","phase":3,"order":310},{"id":"items0","label":"Acceso a Cueva Celeste y objetos de captura especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Técnicas secretas del compañero (Corte Rápido, Surfeo Marino, Empuje Fuerte, Alumbrado y Vuelo Celeste) durante la historia; la Cueva Celeste se abre tras la Liga.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Kanto, incluyendo intercambios que corresponda","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Kanto (151 + Meltan y Melmetal). Meltan y Melmetal llegan desde Pokémon GO (Parque GO). Con Pokekeep: Lo que no puedas traer de GO o por intercambio, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Kanto (director del juego, Edificio Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Kanto completa, habla con el director del juego en la 3.ª planta de la Edificio Azulona (Mansión Azulona).","phase":6,"order":600},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Kanto completa (director del juego, Edificio Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Kanto completa (151 especies, más Meltan y Melmetal de Pokémon GO), el director del juego de la 3.ª planta de la Edificio Azulona (Mansión Azulona) te da el Amuleto Iris junto con el diploma.","phase":6,"order":610},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Durante la historia, con Surfeo Marino y Empuje Fuerte. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20): baja hasta la zona inferior. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: Durante la historia, cuando puedas surfear (Surfeo Marino). Dónde: Central de Energía (nivel 50). Cómo: Central de Energía (Ruta 10): Zapdos espera al fondo. Consejo: Zapdos nivel 50; es un combate largo con captura, como los legendarios del juego. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":150},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Durante la historia, camino de la Liga. Dónde: Calle Victoria (nivel 50). Cómo: Calle Victoria: Moltres está en el interior de la cueva. Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":170},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (Ciudad Celeste): baja hasta el fondo. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"medal-type","label":"Título de Gran Maestro: vencer a todos los entrenadores maestros (habla con la señora de las oficinas de GAME FREAK en Ciudad Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: después de convertirte en campeón de la Liga Pokémon de Kanto. Dónde: los entrenadores maestros están repartidos por todo Kanto (ropa roja y bocadillo con su Pokémon); el título final se recoge en las oficinas de GAME FREAK del Edificio Azulona (Ciudad Azulona). Paso a paso: 1) Busca a cada entrenador maestro: hay 153, uno por cada especie de la Pokédex de Kanto (incluidos Meltan y Melmetal). 2) La mayoría te reta a un combate de uno contra uno: solo puedes usar un Pokémon de su misma especie y nadie puede usar objetos. Al ganar recibes su título. 3) Los de legendarios, de Mew, Meltan, Melmetal y de Ditto no combaten: piden que les enseñes un ejemplar de su especie con un mínimo de PC (de 4000 a 9000 según la especie). 4) Con los 153 títulos, habla con la señora de las oficinas de GAME FREAK y te da el título de gran maestro; con ella también puedes cambiar el título que muestras. Consejo: sube los PC con caramelos antes de cada combate. Fuente: WikiDex «Entrenador maestro»; Serebii «Master Trainers».","phase":6,"order":620},{"id":"event-0","label":"Mew: regalo/distribución externa; Meltan y Melmetal mediante Pokémon GO cuando sea posible","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew llegó con la Poké Ball Plus; Meltan y Melmetal, por Pokémon GO. Con Pokekeep: Añade Mew legal desde la Librería.","phase":7,"order":700}],"LETGOE":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Vencer a la Liga de Kanto en la revancha (equipos nuevos del Alto Mando y del campeón)","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Salón de la Fama, vuelve a la Meseta Añil y vence otra vez al Alto Mando y al campeón: en la revancha cambian sus Pokémon (WikiDex «Liga Pokémon (Kanto)»). Cómo lo sabe la guía: después de capturar a Mewtwo en la Cueva Celeste y vencer allí a Verde, Verde solo vuelve a aparecer en Ciudad Celeste cuando vences de nuevo a la Liga (WikiDex «Verde (personaje)»); la partida guarda si Ve
