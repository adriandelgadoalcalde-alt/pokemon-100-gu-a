-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza (fin de la historia del Equipo Galaxia). Dónde: Caverna Agudeza (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza (al norte de Ciudad Puntaneva). Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza: visita la Caverna Veraz del Lago Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj y usa Mal de Ojo o la Master Ball. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza. Dónde: Caverna Valor (nivel 50). Cómo: Caverna Valor, en el Lago Valor (Surf). Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en la Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-484","label":"Registrar a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columna Lanza (nivel 47). Cómo: Columna Lanza: tras vencer a los comandantes y a Helio, Palkia aparece. Consejo: Palkia nivel 47. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Un Superconcurso rango Maestro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por ganar un Superconcurso de rango Maestro en cualquier categoría (Sala de Concursos de Ciudad Corazón).","phase":6,"order":620},{"id":"card-3","label":"Bandera Platino subterránea","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por conseguir la bandera de platino de tu base secreta en el Subsuelo: roba banderas de otras bases (juego en local) hasta subir de bronce a plata, oro y platino.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: al conseguir todas las estrellas de la ficha de entrenador (cinco estrellas, ficha negra). Dónde: cualquier Centro Pokémon de Sinnoh. Paso a paso: 1) Consigue las cinco estrellas, en cualquier orden: completar la Liga Pokémon; ganar un Súper Concurso de nivel experto de cualquier categoría; completar la Pokédex Nacional (482 especies); conseguir 100 victorias en la Torre Batalla (Parque Batalla, en la Zona de Combate); y lograr 50 victorias en Captura la bandera del Subsuelo. 2) Comprueba en la ficha de entrenador que tiene las cinco estrellas y es de color negro. 3) Entra en un Centro Pokémon y habla con la enfermera. 4) Al ver tu ficha cambiará su recibimiento habitual. Consejo: la ficha cambia de color con cada estrella (roja, azul, bronce, plata, oro y negra); revisa en ella qué hazañas te faltan antes de ponerte con las más largas. Fuente: WikiDex «Ficha de entrenador».","phase":6,"order":690},{"id":"event-0","label":"Darkrai, Shaymin y Arceus mediante eventos y condiciones específicas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Darkrai (Isla Lunanueva, Carné Socio), Shaymin (Paraíso Flor, Carta Oaks) y Arceus (Sala del Origen, Flauta Azur) solo llegaron por eventos. Con Pokekeep: Añade el objeto clave del evento (Carné Socio, Carta Oaks o Flauta Azur) para jugar el evento, o el singular legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Manaphy y otros singulares por conexión o transferencia según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Manaphy llegó con el Pokémon Ranger (huevo) y otros singulares por transferencia desde ediciones anteriores. Con Pokekeep: Añade el huevo de Manaphy o el singular legal desde la Librería.","phase":7,"order":710}],"PLATINUM":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Explorar la Zona de Combate y resolver encuentros de Sinnoh tras la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga: Pokédex Nacional (al ver todas las especies de Sinnoh, Serbal te la da), la Zona de Combate en barco desde Ciudad Puntaneva, Bulgur y Heatran en la Montaña Dura, Giratina en la Cueva Retorno y Cresselia en la Isla Plenilunio.","phase":2,"order":200},{"id":"battle0","label":"Superar instalaciones de combate de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Frente Batalla (tras la Liga): Torre, Fábrica, Arcade, Castillo y Sala Batalla. Vence a los cinco Ases dos veces para sus símbolos de oro.","phase":3,"order":300},{"id":"battle1","label":"Vencer al Alto Mando reforzado en la Liga de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ser campeón, obtener la Pokédex Nacional y detener a Plutón en la Montaña Dura. Dónde: Montaña Dura (Ruta 227, en la Bahía Gresca) y después la Liga Pokémon de Sinnoh, al final de la Calle Victoria. Paso a paso: 1) Completa los vistos de la Pokédex de Sinnoh y recoge la Pokédex Nacional en Pueblo Arena. 2) Viaja a la Zona de Combate y sigue la historia de la Montaña Dura: Plutón se hace con la Piedra Magma para despertar a Heatran, pero se frustran sus planes y lo arrestan. 3) Desde entonces el Alto Mando y Cintia usan sus equipos de revancha (niveles entre 65 y 78). 4) Vuelve a la Liga con curaciones de sobra y vence a Alecrán (bicho), Gaia (tierra), Fausto (fuego) y Delos (psíquico). 5) Termina venciendo a Cintia. Consejo: en el Café Revancha de la Zona de Combate puedes volver a combatir contra los líderes de gimnasio, buen entrenamiento previo. Fuente: WikiDex «Liga Pokémon (Sinnoh)»; WikiDex «Alecrán»; WikiDex «Montaña Dura».","phase":3,"order":310},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Sinnoh (director del juego, Hotel Gran Lago, Orilla Valor)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto hayas visto las 210 especies de la Pokédex de Sinnoh de Platino (basta con verlas, no hace falta capturarlas); en Platino Manaphy, el n.º 151, también cuenta. Dónde: Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor, en la casa del director del juego. Paso a paso: 1) Completa los vistos de la Pokédex de Sinnoh ampliada de Platino: combate contra entrenadores y fíjate en los Pokémon de los intercambios. 2) Para ver a Manaphy, examina el libro que hay en el despacho del dueño de la Mansión Pokémon (Ruta 212). 3) Ve al laboratorio del profesor Serbal en Pueblo Arena: aparecerá el profesor Oak, que instala la Pokédex Nacional. 4) Ve al Hotel Gran Lago, habla con el director del juego y te entregará el diploma de la Pokédex de Sinnoh. Consejo: Platino añade 59 especies a la Pokédex regional respecto a Diamante y Perla; revisa la lista antes de buscar las que te faltan. Fuente: WikiDex «Lista de Pokémon según la Pokédex de Sinnoh»; WikiDex «Manaphy»; WikiDex «Hotel Gran Lago»; Serebii «National Dex» (Platino).","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en la fase final, tras tener la Pokédex Nacional. Dónde: Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor, en la casa del director del juego. Paso a paso: 1) Registra como capturadas 482 especies de la Pokédex Nacional; no cuentan Mew, Lugia, Ho-Oh, Celebi, Jirachi, Deoxys, Phione, Manaphy, Darkrai, Shaymin ni Arceus. 2) Trae lo que Platino no tiene desde Diamante y Perla u Oro HeartGold y Plata SoulSilver por intercambio, o desde los juegos de Game Boy Advance con el Parque Compi (Ruta 221). 3) Ve al Hotel Gran Lago y entra en la casa del director del juego. 4) Te entregará el diploma de la Pokédex Nacional, y completar la Pokédex Nacional cuenta además como una de las estrellas de la ficha de entrenador. Consejo: los exclusivos de versión y los iniciales de otras regiones son lo que más tarda; organiza los intercambios antes de empezar. Fuente: WikiDex «Pokédex» (Completar la Pokédex); WikiDex «Hotel Gran Lago»; WikiDex «Ficha de entrenador».","phase":6,"order":615},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Al salir del Mundo Distorsión, habla con el profesor Serbal en Pueblo Arena. Dónde: Caverna Agudeza (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza. Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Al salir del Mundo Distorsión y hablar con Serbal: visita la Caverna Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Al salir del Mundo Distorsión y hablar con Serbal. Dónde: Caverna Valor (nivel 50). Cómo: Caverna Valor, en el Lago Valor. Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en la Zona de Combate (Pokédex Nacional). Dónde: Montaña Dura (nivel 50). Cómo: Acompaña a Bulgur por la Montaña Dura; al acabar, Heatran aparece al fondo. Consejo: Heatran r a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Tras ganar la Liga: habla con la anciana de Pueblo Caelestis y lleva la Lustresfera en la mochila. Dónde: Columna Lanza (nivel 70). Cómo: Sube a la Columna Lanza con la Lustresfera. Consejo: Palkia nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":221},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Un Superconcurso rango Maestro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por ganar un Superconcurso de rango Maestro en cualquier categoría (Sala de Concursos de Ciudad Corazón).","phase":6,"order":620},{"id":"card-3","label":"Bandera Platino subterránea","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por conseguir la bandera de platino de tu base secreta en el Subsuelo: roba banderas de otras bases (juego en local) hasta subir de bronce a plata, oro y platino.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"event-0","label":"Darkrai, Shaymin y Arceus mediante eventos y condiciones específicas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Darkrai (Isla Lunanueva, Carné Socio), Shaymin (Paraíso Flor, Carta Oaks) y Arceus (Sala del Origen, Flauta Azur) solo llegaron por eventos. Con Pokekeep: Añade el objeto clave del evento (Carné Socio, Carta Oaks o Flauta Azur) para jugar el evento, o el singular legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Manaphy y otros singulares por conexión o transferencia según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Manaphy llegó con el Pokémon Ranger (huevo) y otros singulares por transferencia desde ediciones anteriores. Con Pokekeep: Añade el huevo de Manaphy o el singular legal desde la Librería.","phase":7,"order":710},{"id":"frontier-prints","label":"Estampas de oro de los cinco Ases del Frente Batalla («Frontier Brains»)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras la Liga, con acceso a la Zona de Combate, donde está el Frente Batalla. Dónde: Frente Batalla (Zona de Combate): Torre Batalla, Fábrica Batalla, Sala Batalla, Castillo Batalla y Ruleta Batalla. Paso a paso: 1) En cada edificio, encadena victorias seguidas en combates individuales: cada As aparece como rival en una racha concreta. 2) Torre Batalla: Jericor en el combate 21 y en el 49. 3) Fábrica Batalla: Espinal en el 21 y el 49. 4) Castillo Batalla: Kokuran en el 21 y el 49. 5) Ruleta Batalla: Delila en el 21 y el 49. 6) Sala Batalla: Argenta en el combate 50 y en el 170 de la racha. 7) La primera victoria contra cada As da su estampa de plata en la Cámara lucha; la segunda, la estampa de color (de oro). Si pierdes, la racha vuelve a cero. Consejo: lleva Pokémon con objetos y movimientos pensados para nivel 50 y prepara otra estrategia para la Fábrica, donde usas Pokémon de préstamo. Fuente: WikiDex «As del Frente Batalla»; WikiDex «Frente Batalla (Sinnoh)»; WikiDex «Sala Batalla», «Castillo Batalla», «Ruleta Batalla» y «Fábrica Batalla (Sinnoh)».","phase":3,"order":330},{"id":"final-boss","label":"Vencer a Cintia con su equipo de revancha en la Liga de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de detener a Plutón en la Montaña Dura (tras ser campeón y obtener la Pokédex Nacional). Dónde: sala de la campeona de la Liga Pokémon de Sinnoh, al final de la Calle Victoria. Paso a paso: 1) Termina la historia de la Montaña Dura: en ella Plutón se hace con la Piedra Magma y acaba arrestado. 2) Desde entonces Cintia usa su equipo de revancha: los mismos Pokémon que en el primer combate de Platino (Spiritomb, Roserade, Togekiss, Lucario, Milotic y Garchomp), pero entre los niveles 74 y 78, con Garchomp al 78. 3) Prepara un equipo de nivel alto, lleva ataques de tipo hielo contra Garchomp y curaciones de sobra. 4) Vence otra vez al Alto Mando (Alecrán, Gaia, Fausto y Delos) y luego a Cintia. Consejo: tras cada victoria en la Liga, Cintia aparece en las Ruinas Caelestis de Pueblo Caelestis, donde puedes hablar con ella. Fuente: WikiDex «Cintia»; WikiDex «Liga Pokémon (Sinnoh)»; WikiDex «Montaña Dura».","phase":3,"order":390},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta de oro: te llama por tu nombre y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tu ficha de entrenador llegue a la de oro (cuatro estrellas o más). Dónde: cualquier Centro Pokémon de Sinnoh. Paso a paso: 1) Consigue estrellas cumpliendo las hazañas de la ficha: completar la Liga Pokémon, ganar un Súper Concurso de nivel experto, completar la Pokédex Nacional, ganar 100 combates seguidos en la Torre Batalla y lograr 50 victorias en Captura la bandera del Subsuelo; la ficha cambia de color con cada estrella. 2) Comprueba que ya es de oro (cuatro estrellas). 3) Entra en un Centro Pokémon y habla con la enfermera. 4) La primera vez interrumpirá su saludo al ver tu ficha, te llamará por tu nombre y te pedirá el honor de curar a tus Pokémon; desde entonces te saluda por tu nombre y te pregunta si quieres «lo de siempre». Consejo: si quieres llegar a la ficha negra (cinco estrellas), revisa en la propia ficha qué hazañas te faltan. Fuente: WikiDex «Ficha de entrenador»; pokeplatinum (script común de la enfermera).","phase":6,"order":690}],"HEARTGOLD":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Superar ocho gimnasios de Kanto y vencer a Rojo en Monte Plateado","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga de Johto viajas a Kanto (S.S. Aqua desde Ciudad Olivo): gana las 8 medallas de Kanto (la Central Energía se arregla devolviendo la Pieza robada de Ciudad Celeste), habla con Oak para el permiso del Monte Plateado y vence a Rojo en su cima.","phase":2,"order":200},{"id":"battle0","label":"Vencer al Alto Mando y a Lance con sus equipos de revancha (tras las 8 medallas de Kanto)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de tener las 16 medallas (las 8 de Johto y las 8 de Kanto). Dónde: Liga Pokémon en la Meseta Añil, al final de la Calle Victoria. Paso a paso: 1) Gana las ocho medallas de Kanto; con ellas, el Alto Mando y Lance pasan a sus equipos de revancha (niveles: Mento 58-62, Koga 60-64, Bruno 61-64, Karen 62-64 y Lance 68-75). 2) Prepara un equipo de nivel 65 o más y lleva curaciones abundantes. 3) Vence en orden a Mento (psíquico), Koga (veneno), Bruno (lucha) y Karen (siniestro). 4) Termina venciendo a Lance y su equipo de dragones. Consejo: los equipos de revancha incluyen Pokémon de Hoenn y Sinnoh (Bronzong, Toxicroak, Lucario, Weavile, Spiritomb…); lleva ataques de tipo hielo contra el Dragonite, el Garchomp, el Salamence y el Altaria de Lance. Fuente: WikiDex «Liga Pokémon (Johto)».","phase":3,"order":300},{"id":"battle1","label":"Desafío de Torre Batalla o Frente Batalla según la edición","category":"Combates","tier":1,"species":null,"auto":null,"how":"Frente Batalla (Ruta 40, tras la Liga): Torre, Fábrica, Arcade, Castillo y Sala Batalla. Vence dos veces a cada As para sus símbolos de oro; la Torre Batalla cuenta además para la estrella de la tarjeta (100 seguidas).","phase":3,"order":300},{"id":"items0","label":"Acceso al Monte Plateado, billetes y objetos de historia de ambas regiones","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"En la historia: Ticket del Barco del profesor Elm tras la Liga (S.S. Aqua a Kanto) y el Pase del Tren Magnético, que te da Imitadora en Ciudad Azafrán al devolverle el objeto perdido que encuentras en el Club de Fans de Ciudad Carmín (tras arreglar la Central Energía) y, para el Monte Plateado, las 16 medallas: con ellas el profesor Oak te deja pasar por la Ruta 28.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex Nacional aplicable a esta edición","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición (251, los singulares por evento aparte). Las exclusivas y los iniciales que no elegiste, por intercambio. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Johto (director del juego, Edificio Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: al tener registradas como capturadas todas las especies de la Pokédex de Johto salvo Mew y Celebi (254 de 256). Dónde: Ciudad Azulona, Edificio Azulona (antes llamado Mansión Azulona), en la planta de las oficinas de Game Freak. Paso a paso: 1) Captura o consigue por evolución, crianza o intercambio todas las especies de la Pokédex de Johto, menos Mew y Celebi. 2) Viaja a Ciudad Azulona, en Kanto. 3) Sube a la planta de Game Freak del Edificio Azulona y habla con el miembro del equipo que entrega los diplomas. 4) Te entregará el diploma de la Pokédex de Johto. Consejo: los exclusivos de versión (Oro HeartGold frente a Plata SoulSilver) se pueden conseguir por intercambio. Fuente: WikiDex «Edificio Azulona»; WikiDex «Pokédex»; WikiDex «Lista de Pokémon según la Pokédex de Johto».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Edificio Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en la fase final, tras tener la Pokédex Nacional. Dónde: Ciudad Azulona, Edificio Azulona (antes llamado Mansión Azulona), en la planta de las oficinas de Game Freak. Paso a paso: 1) Registra como capturadas todas las especies de la Pokédex Nacional menos Mew, Celebi, Jirachi, Deoxys, Phione, Manaphy, Darkrai, Shaymin y Arceus (484 de 493). 2) Trae lo que no se puede capturar en Oro HeartGold o Plata SoulSilver desde la otra versión, Diamante, Perla o Platino por intercambio, o desde Game Boy Advance con el Parque Compi de Ciudad Fucsia. 3) Ve al Edificio Azulona, sube a la planta de Game Freak y habla con el miembro del equipo que entrega los diplomas. 4) Te entregará el diploma de la Pokédex Nacional. Consejo: la Zona Safari de Johto permite capturar especies de otras regiones sin salir del juego. Fuente: WikiDex «Pokédex»; WikiDex «Edificio Azulona»; WikiDex «Parque Compi»; WikiDex «Zona Safari (Johto)».","phase":6,"order":615},{"id":"pokemon-243","label":"Registrar a Raikou en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":243,"auto":null,"how":"Cuándo: Durante la historia, tras la escena del sótano de la Torre Quemada (Ciudad Iris). Dónde: errante por la región (nivel 40). Cómo: Raikou vaga por las rutas de Johto: síguelo con el mapa del Pokégear y usa Mal de Ojo o la Master Ball. Consejo: Raikou nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Durante la historia, tras la escena de la Torre Quemada. Dónde: errante por la región (nivel 40). Cómo: Entei vaga por las rutas de Johto: síguelo con el mapa del Pokégear. Consejo: Entei nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":141},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras la Torre Quemada aparece varias veces; ya en Kanto, combate por fin en el Cabo Celeste (Ruta 25). Dónde: Ruta 25 (nivel 40); Torre Quemada (nivel 40). Cómo: Sigue las apariciones de Suicune con Eusine por Johto y Kanto hasta la Ruta 25, al norte de Ciudad Celeste. Consejo: Suicune nivel 40; no huye en ese combate. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-249","label":"Registrar a Lugia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":249,"auto":null,"how":"Cuándo: Ya en Kanto (posliga): el anciano de Ciudad Plateada te da el Ala Plateada. Dónde: Islas Remolino (nivel 70). Cómo: Islas Remolino (Surf, Torbellino y Cascada), en la sala más profunda. Consejo: Lugia nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-250","label":"Registrar a Ho-Oh en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":250,"auto":null,"how":"Cuándo: Durante la historia, tras recibir el Ala Arcoíris y la Campana Clara (Torre Radio). Dónde: Torre Campana (nivel 45). Cómo: Sube a la cima de la Torre Campana de Ciudad Iris. Consejo: Ho-Oh nivel 45: es obligatorio en la historia; si lo debilitas, vuelve tras el Alto Mando. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":185},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Ya en Kanto, con Surf y Fuerza. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20), en la parte más profunda. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":225},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: En Kanto, después de conseguir las 8 medallas de Kanto. Dónde: Ruta 10 (nivel 50). Cómo: Ruta 10, en la puerta de la Central de Energía (Surf). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":226},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Con las 16 medallas (acceso al Monte Plateado). Dónde: Cueva M Plateado (nivel 50). Cómo: Cueva Monte Plateado (Monte Plateado). Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Con las 16 medallas. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (al noroeste de Ciudad Celeste). Si se debilita o huyes, reaparece tras vencer de nuevo al Alto Mando. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Con las 8 medallas de Kanto, tras vencer a Rojo en el Monte Plateado y recibir el inicial de Kanto del profesor Oak: el Señor Pokémon (Ruta 30) te da la Esfera Azul. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Azul, ve a la Torre Oculta: entra por el Paso Acantilado de Ciudad Orquídea y sigue por la Ruta 47. Consejo: Kyogre nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Tras capturar a Kyogre y Groudon (el de la otra edición, intercambiado) y enseñárselos al profesor Oak en Pueblo Paleta: te da la Esfera Verde. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Verde, vuelve a la Torre Oculta (Paso Acantilado, Ciudad Orquídea / Ruta 47). Consejo: Rayquaza nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Con la Pokédex Nacional, tras hablar con Máximo al salir del Club de Fans de Pokémon de Ciudad Carmín. Dónde: errante por la región (nivel 35). Cómo: Latias vaga por las rutas de Kanto: síguelo con el mapa del Pokégear. Consejo: Latias nivel 35. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"orb-red-blue","label":"Conseguir la esfera de la Torre Oculta tras Rojo y el inicial de Oak","category":"Objetos clave","tier":0,"species":null,"auto":null,"how":"Cuándo: después de vencer a Rojo en la cima del Monte Plateado (requiere las 16 medallas) y de recibir del profesor Oak un inicial de Kanto. Dónde: Monte Plateado, Pueblo Paleta, casa del Sr. Pokémon (Ruta 30) y Torre Oculta (Ruta 47). Paso a paso: 1) Con las 16 medallas, sube al Monte Plateado y vence a Rojo. 2) Ve a Pueblo Paleta y recoge el inicial de Kanto que te ofrece el profesor Oak (Bulbasaur, Charmander o Squirtle). 3) Visita al Sr. Pokémon en su casa de la Ruta 30: en Oro HeartGold te da la esfera azul y en Plata SoulSilver la esfera roja. 4) Ve de Ciudad Orquídea al Paso Acantilado y a la Ruta 47, entra en la Cueva Acantilado y, con Surf y Treparrocas, llega a la Torre Oculta. 5) Te espera Kyogre (Oro HeartGold) o Groudon (Plata SoulSilver) a nivel 50. Consejo: si reúnes en la misma partida un Groudon y un Kyogre de Oro HeartGold o Plata SoulSilver (uno por intercambio) y hablas con el profesor Oak, te dará la esfera verde, que abre el encuentro con Rayquaza. Fuente: WikiDex «Torre Oculta»; WikiDex «Esfera roja».","phase":1,"order":190},{"id":"red-battle","label":"Derrotar a Rojo en Monte Plateado","category":"Combates","tier":0,"species":null,"auto":null,"how":"El jefe definitivo: con las 16 medallas, Oak te da permiso para la Ruta 28 y el Monte Plateado. Sube hasta la cima y vence a Rojo (equipo de nivel 80-88). Lleva Antídotos para el granizo y muchas Revivir.","phase":3,"order":320},{"id":"unown","label":"Resolver 4 cámaras secretas y registrar los 28 Unown","category":"Puzles","tier":1,"species":null,"auto":null,"how":"Ruinas Alfa (al oeste de Ciudad Malva). 1) Resuelve los cuatro puzles de piedra: Kabuto (sobre el centro de investigación), Omanyte y Ho-Oh (por la Cueva Unión con Surf y Fuerza) y Aerodactyl (bajo el centro, cruzando el lago con Surf); cada uno abre la sala de abajo y libera un grupo de letras. 2) Abre las cuatro cámaras secretas con la palabra grabada al fondo de cada sala: en la de Kabuto usa una Cuerda Huida, en la de Aerodactyl usa Destello, en la de Omanyte usa una Piedra Agua y en la de Ho-Oh entra con Ho-Oh en el equipo (posliga). 3) Habla con el investigador para que te dé el Bloc Unown y captura las 26 letras en las salas interiores. 4) Con las 26, la pared dorada revela dos formas más: captura «!» y «?» en la entrada de las ruinas, antes de bajar la escalera. Fuente: WikiDex «Ruinas Alfa». Con Pokekeep: si no tienes a Ho-Oh para la última cámara, crea uno legal con la Librería o «Legalizar automáticamente» y ponlo primero del equipo.","phase":2,"order":290},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Batir los récords de las 10 pruebas Pokéathlon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por batir los récords de las 10 pruebas del Pokéathlon (Cúpula Pokéathlon, Ruta 35): consigue una puntuación récord en cada prueba, con Pokémon de buenas estadísticas de rendimiento.","phase":6,"order":620},{"id":"card-3","label":"Coronar Pokémon con cinco hojas doradas","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por enseñar a tu vecino (Eco o Lira) un Pokémon con cinco hojas doradas: con el Pokémon acompañándote, habla con él en la hierba alta de ciertas rutas de Johto y Kanto; cada ruta da como mucho una hoja y las rutas que comparten hoja son excluyentes (dependen de la naturaleza del Pokémon; tabla en WikiDex «Hoja brillante»). Te da la Corona Dorada y el diploma.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"event-0","label":"Celebi: evento histórico; en Cristal puede depender de edición/servicio","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Celebi solo llegó por eventos (en Cristal japonés, con el GS Ball del servicio móvil; en HGSS, llevando un Celebi de evento al santuario del Encinar se juega la historia con Giovanni). Con Pokekeep: Añade el Celebi de evento legal desde la Librería. En Cristal, también puedes activar el evento del GS Ball (bandera del GS Ball en la partida) y llevar el GS Ball al santuario del Encinar.","phase":7,"order":700},{"id":"event-1","label":"En HGSS: Giovanni con Celebi y Ruinas Sinjoh con Arceus","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Dos historias que solo se juegan con un singular de evento: llevar un Celebi de evento al santuario del Encinar (viaje en el tiempo con Giovanni) y llevar un Arceus de evento a las Ruinas Alfa (Ruinas Sinjoh, donde eliges Dialga, Palkia o Giratina). Con Pokekeep: Añade el Celebi o el Arceus de evento legal desde la Librería y llévalo en el equipo; luego sigue la historia en el juego.","phase":7,"order":710},{"id":"collect-unown","label":"Registrar las 28 formas de Unown (Ruinas Alfa)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Resuelve los cuatro puzles de las Ruinas Alfa (Kabuto, Omanyte, Aerodactyl y Ho-Oh) y las salas que abren (con Destello, Fuerza y el Ala Arcoíris/Plateada según la sala). Los Unown aparecen en las cámaras; «!» y «?» salen tras registrar los otros 26.","phase":4,"order":410},{"id":"frontier-prints","label":"Estampas de oro de los cinco Ases del Frente Batalla («Frontier Brains»)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras la Liga, en cuanto tengas acceso al Frente Batalla. Dónde: Frente Batalla de Johto, al que se llega por el Acceso al Frente desde la Ruta 40 (al oeste de Ciudad Olivo): Torre Batalla, Fábrica Batalla, Sala Batalla, Castillo Batalla y Ruleta Batalla. Paso a paso: 1) En cada edificio, encadena victorias seguidas en combates individuales; cada As aparece en una racha concreta. 2) Torre Batalla: Jericor en el combate 21 y en el 49. 3) Fábrica Batalla: Espinal en el 21 y el 49. 4) Castillo Batalla: Kokuran en el 21 y el 49. 5) Ruleta Batalla: Delila en el 21 y el 49. 6) Sala Batalla: Argenta en el combate 50 y en el 170 de la racha. 7) Vencer a cada As la primera vez da su estampa de plata y la segunda, la estampa de color (de oro); si pierdes, la racha vuelve a cero. Consejo: prepara equipos pensados para nivel 50; en la Fábrica usarás Pokémon de préstamo y en la Ruleta los efectos aleatorios pueden ayudarte o perjudicarte. Fuente: WikiDex «As del Frente Batalla»; WikiDex «Frente Batalla (Sinnoh)»; WikiDex «Acceso al Frente».","phase":3,"order":330},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta de oro: te llama por tu nombre y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tu ficha de entrenador tenga cuatro estrellas o más. Dónde: cualquier Centro Pokémon de Johto o Kanto. Paso a paso: 1) Consigue estrellas cumpliendo las hazañas de la ficha: completar la Liga Pokémon, completar la Pokédex Nacional, obtener 100 victorias consecutivas en la Torre Batalla, enseñar a Eco o Lira un Pokémon con 5 hojas doradas y superar los récords del Pokéathlon; la ficha cambia de color con cada estrella. 2) Comprueba en la ficha que ya tiene cuatro estrellas. 3) Entra en un Centro Pokémon y habla con la enfermera. 4) La primera vez te reconocerá por la ficha y te llamará por tu nombre al ofrecerte curar a tus Pokémon; desde entonces te saluda siempre por tu nombre. Consejo: revisa en la propia ficha qué hazañas te faltan antes de ponerte con las más largas. Fuente: WikiDex «Ficha de entrenador»; pokeheartgold (script de la enfermera del Centro Pokémon).","phase":6,"order":690}],"SOULSILVER":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Superar ocho gimnasios de Kanto y vencer a Rojo en Monte Plateado","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga de Johto viajas a Kanto (S.S. Aqua desde Ciudad Olivo): gana las 8 medallas de Kanto (la Central Energía se arregla devolviendo la Pieza robada de Ciudad Celeste), habla con Oak para el permiso del Monte Plateado y vence a Rojo en su cima.","phase":2,"order":200},{"id":"battle0","label":"Vencer al Alto Mando y a Lance con sus equipos de revancha (tras las 8 medallas de Kanto)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de tener las 16 medallas (las 8 de Johto y las 8 de Kanto). Dónde: Liga Pokémon en la Meseta Añil, al final de la Calle Victoria. Paso a paso: 1) Gana las ocho medallas de Kanto; con ellas, el Alto Mando y Lance pasan a sus equipos de revancha (niveles: Mento 58-62, Koga 60-64, Bruno 61-64, Karen 62-64 y Lance 68-75). 2) Prepara un equipo de nivel 65 o más y lleva curaciones abundantes. 3) Vence en orden a Mento (psíquico), Koga (veneno), Bruno (lucha) y Karen (siniestro). 4) Termina venciendo a Lance y su equipo de dragones. Consejo: los equipos de revancha incluyen Pokémon de Hoenn y Sinnoh (Bronzong, Toxicroak, Lucario, Weavile, Spiritomb…); lleva ataques de tipo hielo contra el Dragonite, el Garchomp, el Salamence y el Altaria de Lance. Fuente: WikiDex «Liga Pokémon (Johto)».","phase":3,"order":300},{"id":"battle1","label":"Desafío de Torre Batalla o Frente Batalla según la edición","category":"Combates","tier":1,"species":null,"auto":null,"how":"Frente Batalla (Ruta 40, tras la Liga): Torre, Fábrica, Arcade, Castillo y Sala Batalla. Vence dos veces a cada As para sus símbolos de oro; la Torre Batalla cuenta además para la estrella de la tarjeta (100 seguidas).","phase":3,"order":300},{"id":"items0","label":"Acceso al Monte Plateado, billetes y objetos de historia de ambas regiones","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"En la historia: Ticket del Barco del profesor Elm tras la Liga (S.S. Aqua a Kanto) y el Pase del Tren Magnético, que te da Imitadora en Ciudad Azafrán al devolverle el objeto perdido que encuentras en el Club de Fans de Ciudad Carmín (tras arreglar la Central Energía) y, para el Monte Plateado, las 16 medallas: con ellas el profesor Oak te deja pasar por la Ruta 28.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex Nacional aplicable a esta edición","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición (251, los singulares por evento aparte). Las exclusivas y los iniciales que no elegiste, por intercambio. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Johto (director del juego, Edificio Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: al tener registradas como capturadas todas las especies de la Pokédex de Johto salvo Mew y Celebi (254 de 256). Dónde: Ciudad Azulona, Edificio Azulona (antes llamado Mansión Azulona), en la planta de las oficinas de Game Freak. Paso a paso: 1) Captura o consigue por evolución, crianza o intercambio todas las especies de la Pokédex de Johto, menos Mew y Celebi. 2) Viaja a Ciudad Azulona, en Kanto. 3) Sube a la planta de Game Freak del Edificio Azulona y habla con el miembro del equipo que entrega los diplomas. 4) Te entregará el diploma de la Pokédex de Johto. Consejo: los exclusivos de versión (Oro HeartGold frente a Plata SoulSilver) se pueden conseguir por intercambio. Fuente: WikiDex «Edificio Azulona»; WikiDex «Pokédex»; WikiDex «Lista de Pokémon según la Pokédex de Johto».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Edificio Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en la fase final, tras tener la Pokédex Nacional. Dónde: Ciudad Azulona, Edificio Azulona (antes llamado Mansión Azulona), en la planta de las oficinas de Game Freak. Paso a paso: 1) Registra como capturadas todas las especies de la Pokédex Nacional menos Mew, Celebi, Jirachi, Deoxys, Phione, Manaphy, Darkrai, Shaymin y Arceus (484 de 493). 2) Trae lo que no se puede capturar en Oro HeartGold o Plata SoulSilver desde la otra versión, Diamante, Perla o Platino por intercambio, o desde Game Boy Advance con el Parque Compi de Ciudad Fucsia. 3) Ve al Edificio Azulona, sube a la planta de Game Freak y habla con el miembro del equipo que entrega los diplomas. 4) Te entregará el diploma de la Pokédex Nacional. Consejo: la Zona Safari de Johto permite capturar especies de otras regiones sin salir del juego. Fuente: WikiDex «Pokédex»; WikiDex «Edificio Azulona»; WikiDex «Parque Compi»; WikiDex «Zona Safari (Johto)».","phase":6,"order":615},{"id":"pokemon-243","label":"Registrar a Raikou en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":243,"auto":null,"how":"Cuándo: Durante la historia, tras la escena del sótano de la Torre Quemada (Ciudad Iris). Dónde: errante por la región (nivel 40). Cómo: Raikou vaga por las rutas de Johto: síguelo con el mapa del Pokégear y usa Mal de Ojo o la Master Ball. Consejo: Raikou nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Durante la historia, tras la escena de la Torre Quemada. Dónde: errante por la región (nivel 40). Cómo: Entei vaga por las rutas de Johto: síguelo con el mapa del Pokégear. Consejo: Entei nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":141},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras la Torre Quemada aparece varias veces; ya en Kanto, combate por fin en el Cabo Celeste (Ruta 25). Dónde: Ruta 25 (nivel 40); Torre Quemada (nivel 40). Cómo: Sigue las apariciones de Suicune con Eusine por Johto y Kanto hasta la Ruta 25, al norte de Ciudad Celeste. Consejo: Suicune nivel 40; no huye en ese combate. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-249","label":"Registrar a Lugia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":249,"auto":null,"how":"Cuándo: Durante la historia, tras recibir el Ala Plateada y la Campana Oleaje (Torre Radio). Dónde: Islas Remolino (nivel 45). Cómo: Islas Remolino: Lugia espera en la sala más profunda. Consejo: Lugia nivel 45: es obligatorio en la historia; si lo debilitas, vuelve tras el Alto Mando. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":185},{"id":"pokemon-250","label":"Registrar a Ho-Oh en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":250,"auto":null,"how":"Cuándo: Ya en Kanto (posliga): el anciano de Ciudad Plateada te da el Ala Arcoíris. Dónde: Torre Campana (nivel 70). Cómo: Cima de la Torre Campana de Ciudad Iris. Consejo: Ho-Oh nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Ya en Kanto, con Surf y Fuerza. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20), en la parte más profunda. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":225},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: En Kanto, después de conseguir las 8 medallas de Kanto. Dónde: Ruta 10 (nivel 50). Cómo: Ruta 10, en la puerta de la Central de Energía (Surf). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":226},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Con las 16 medallas (acceso al Monte Plateado). Dónde: Cueva M Plateado (nivel 50). Cómo: Cueva Monte Plateado (Monte Plateado). Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Con las 16 medallas. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (al noroeste de Ciudad Celeste). Si se debilita o huyes, reaparece tras vencer de nuevo al Alto Mando. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Con las 8 medallas de Kanto, tras vencer a Rojo y recibir el inicial de Kanto: el Señor Pokémon (Ruta 30) te da la Esfera Roja. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Roja, ve a la Torre Oculta (Paso Acantilado de Ciudad Orquídea y Ruta 47). Consejo: Groudon nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Tras capturar a Kyogre y Groudon (el de la otra edición, intercambiado) y enseñárselos al profesor Oak en Pueblo Paleta: te da la Esfera Verde. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Verde, vuelve a la Torre Oculta (Paso Acantilado, Ciudad Orquídea / Ruta 47). Consejo: Rayquaza nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Con la Pokédex Nacional, tras hablar con Máximo al salir del Club de Fans de Pokémon de Ciudad Carmín. Dónde: errante por la región (nivel 35). Cómo: Latios vaga por las rutas de Kanto: síguelo con el mapa del Pokégear. Consejo: Latios nivel 35. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"orb-red-blue","label":"Conseguir la esfera de la Torre Oculta tras Rojo y el inicial de Oak","category":"Objetos clave","tier":0,"species":null,"auto":null,"how":"Cuándo: después de vencer a Rojo en la cima del Monte Plateado (requiere las 16 medallas) y de recibir del profesor Oak un inicial de Kanto. Dónde: Monte Plateado, Pueblo Paleta, casa del Sr. Pokémon (Ruta 30) y Torre Oculta (Ruta 47). Paso a paso: 1) Con las 16 medallas, sube al Monte Plateado y vence a Rojo. 2) Ve a Pueblo Paleta y recoge el inicial de Kanto que te ofrece el profesor Oak (Bulbasaur, Charmander o Squirtle). 3) Visita al Sr. Pokémon en su casa de la Ruta 30: en Oro HeartGold te da la esfera azul y en Plata SoulSilver la esfera roja. 4) Ve de Ciudad Orquídea al Paso Acantilado y a la Ruta 47, entra en la Cueva Acantilado y, con Surf y Treparrocas, llega a la Torre Oculta. 5) Te espera Kyogre (Oro HeartGold) o Groudon (Plata SoulSilver) a nivel 50. Consejo: si reúnes en la misma partida un Groudon y un Kyogre de Oro HeartGold o Plata SoulSilver (uno por intercambio) y hablas con el profesor Oak, te dará la esfera verde, que abre el encuentro con Rayquaza. Fuente: WikiDex «Torre Oculta»; WikiDex «Esfera roja».","phase":1,"order":190},{"id":"red-battle","label":"Derrotar a Rojo en Monte Plateado","category":"Combates","tier":0,"species":null,"auto":null,"how":"El jefe definitivo: con las 16 medallas, Oak te da permiso para la Ruta 28 y el Monte Plateado. Sube hasta la cima y vence a Rojo (equipo de nivel 80-88). Lleva Antídotos para el granizo y muchas Revivir.","phase":3,"order":320},{"id":"unown","label":"Resolver 4 cámaras secretas y registrar los 28 Unown","category":"Puzles","tier":1,"species":null,"auto":null,"how":"Ruinas Alfa (al oeste de Ciudad Malva). 1) Resuelve los cuatro puzles de piedra: Kabuto (sobre el centro de investigación), Omanyte y Ho-Oh (por la Cueva Unión con Surf y Fuerza) y Aerodactyl (bajo el centro, cruzando el lago con Surf); cada uno abre la sala de abajo y libera un grupo de letras. 2) Abre las cuatro cámaras secretas con la palabra grabada al fondo de cada sala: en la de Kabuto usa una Cuerda Huida, en la de Aerodactyl usa Destello, en la de Omanyte usa una Piedra Agua y en la de Ho-Oh entra con Ho-Oh en el equipo (posliga). 3) Habla con el investigador para que te dé el Bloc Unown y captura las 26 letras en las salas interiores. 4) Con las 26, la pared dorada revela dos formas más: captura «!» y «?» en la entrada de las ruinas, antes de bajar la escalera. Fuente: WikiDex «Ruinas Alfa». Con Pokekeep: si no tienes a Ho-Oh para la última cámara, crea uno legal con la Librería o «Legalizar automáticamente» y ponlo primero del equipo.","phase":2,"order":290},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Batir los récords de las 10 pruebas Pokéathlon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por batir los récords de las 10 pruebas del Pokéathlon (Cúpula Pokéathlon, Ruta 35): consigue una puntuación récord en cada prueba, con Pokémon de buenas estadísticas de rendimiento.","phase":6,"order":620},{"id":"card-3","label":"Coronar Pokémon con cinco hojas doradas","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por enseñar a tu vecino (Eco o Lira) un Pokémon con cinco hojas doradas: con el Pokémon acompañándote, habla con él en la hierba alta de ciertas rutas de Johto y Kanto; cada ruta da como mucho una hoja y las rutas que comparten hoja son excluyentes (dependen de la naturaleza del Pokémon; tabla en WikiDex «Hoja brillante»). Te da la Corona Dorada y el diploma.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"event-0","label":"Celebi: evento histórico; en Cristal puede depender de edición/servicio","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Celebi solo llegó por eventos (en Cristal japonés, con el GS Ball del servicio móvil; en HGSS an en el 21 y el 49. 5) Ruleta Batalla: Delila en el 21 y el 49. 6) Sala Batalla: Argenta en el combate 50 y en el 170 de la racha. 7) Vencer a cada As la primera vez da su estampa de plata y la segunda, la estampa de color (de oro); si pierdes, la racha vuelve a cero. Consejo: prepara equipos pensados para nivel 50; en la Fábrica usarás Pokémon de préstamo y en la Ruleta los efectos aleatorios pueden ayudarte o perjudicarte. Fuente: WikiDex «As del Frente Batalla»; WikiDex «Frente Batalla (Sinnoh)»; WikiDex «Acceso al Frente».","phase":3,"order":330},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta de oro: te llama por tu nombre y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tu ficha de entrenador tenga cuatro estrellas o más. Dónde: cualquier Centro Pokémon de Johto o Kanto. Paso a paso: 1) Consigue estrellas cumpliendo las hazañas de la ficha: completar la Liga Pokémon, completar la Pokédex Nacional, obtener 100 victorias consecutivas en la Torre Batalla, enseñar a Eco o Lira un Pokémon con 5 hojas doradas y superar los récords del Pokéathlon; la ficha cambia de color con cada estrella. 2) Comprueba en la ficha que ya tiene cuatro estrellas. 3) Entra en un Centro Pokémon y habla con la enfermera. 4) La primera vez te reconocerá por la ficha y te llamará por tu nombre al ofrecerte curar a tus Pokémon; desde entonces te saluda siempre por tu nombre. Consejo: revisa en la propia ficha qué hazañas te faltan antes de ponerte con las más largas. Fuente: WikiDex «Ficha de entrenador»; pokeheartgold (script de la enfermera del Centro Pokémon).","phase":6,"order":690}],"BLACK":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, personajes y nuevas zonas de Teselia","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Negro/Blanco: tras la Liga se abre el este de Teselia (Ciudad Caolín y rutas 14-18), con Cintia, los Espadachines y Kyurem. Negro 2/Blanco 2: tras la Liga, Torre Duodraco, Ruinas Subterráneas (Regis), Nexárbol y Cintia en Pueblo Arenisca.","phase":2,"order":200},{"id":"battle0","label":"Superar Metro Batalla y sus rangos importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Metro Batalla (Ciudad Mayólica): líneas Individual, Doble y Múltiple. Los Jefes de Metro (Fero y Caril) aparecen en la victoria 21 de las líneas normales; ganarles abre la línea Súper, donde vuelven en la victoria 49.","phase":3,"order":300},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Teselia (director del juego, oficinas de Game Freak, Calle Porcelana de Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto completes la Pokédex de Teselia (diploma regional) y, tras la Liga, la Nacional (segundo diploma). Dónde: Torre de Game Freak, primer edificio a la derecha de la Calle Porcelana de Ciudad Porcelana; las oficinas están en el piso 21 (así figura en la versión española). Paso a paso: 1) Captura todos los Pokémon de la Pokédex de Teselia; para los diplomas no hace falta tener los singulares. 2) Sube en ascensor a las oficinas y habla con el director del juego: te da el diploma de Teselia. 3) Repite con la Pokédex Nacional capturada (sin los singulares) para el segundo diploma. 4) Los diplomas aparecen en tu habitación de Pueblo Arcilla, junto a la televisión. Consejo: en la misma planta está Morimoto, que acepta un combate al día tras vencer al Alto Mando; en Negro 2/Blanco 2 también Nishino. Fuente: WikiDex «Game Freak», «Torre de Game Freak», «Pokédex» y «Pueblo Arcilla».","phase":6,"order":612},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), habla con el director del juego en el Game Freak de Ciudad Porcelana.","phase":6,"order":605},{"id":"final-boss-cynthia","label":"Vencer a Cintia en su casa de Pueblo Arenisca tras la Liga (primavera y verano)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de terminar la historia y entrar en el Hall de la Fama. Ella dice que pasa en Teselia la primavera y el verano y el resto del año está en Sinnoh; Serebii limita la revancha a la primavera, así que si en verano no está, vuelve en primavera. Dónde: su casa de Pueblo Arenisca (la de Catleya, a la izquierda del Centro Pokémon). Paso a paso: 1) Termina la historia. 2) Ve a Pueblo Arenisca en primavera y entra en la casa. 3) Habla con Cintia y acepta el combate individual seis contra seis. Su equipo: Spiritomb, Milotic, Eelektross, Braviary y Lucario a nivel 75 y Garchomp a nivel 77. 4) Puedes repetir el combate una vez al día. Consejo: su Spiritomb usa Doble Equipo; derríbalo rápido con ataques fuertes que no fallen, y lleva algo de tipo Hielo o Dragón para Garchomp. Fuente: WikiDex «Cintia» y «Pueblo Arenisca»; Serebii «Sinnoh Champion Cynthia & Designer Morimoto».","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Porcelana (tras el Alto Mando)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: solo después de vencer al Alto Mando, es decir, al terminar la historia. Dónde: Torre de Game Freak, primer edificio a la derecha de la Calle Porcelana de Ciudad Porcelana; las oficinas están en el piso 21 (así figura en la versión española). Paso a paso: 1) Termina la historia principal. 2) Ve a Ciudad Porcelana, entra en la Torre de Game Freak y sube en ascensor a las oficinas. 3) Habla con Morimoto (inspirado en Shigeki Morimoto, de Game Freak) y acepta su combate. Su equipo incluye Liepard, Simipour, Simisear, Simisage y Swoobat a nivel 76. 4) Puedes volver a combatir con él una vez al día. Consejo: en la misma planta está el director del juego, que entrega los diplomas de la Pokédex; aprovecha la visita. Fuente: WikiDex «Game Freak» y «Torre de Game Freak»; Serebii «Sinnoh Champion Cynthia & Designer Morimoto».","phase":3,"order":390},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Después del Hall de la Fama; es el primero de los tres Espadachines Místicos. Dónde: Estancia Orientación (nivel 42). Cómo: Estancia Orientación, dentro de la Cueva Loza (Surf y Fuerza). Consejo: Cobalion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion. Dónde: Cámara de Pruebas (nivel 42). Cómo: Cámara de Pruebas, en la Calle Victoria. Consejo: Terrakion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion y a Terrakion. Dónde: Claro Filosofía (nivel 42). Cómo: Claro Filosofía, en el Bosque Azulejo. Consejo: Virizion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Boquete Gigante (nivel 75). Cómo: Boquete Gigante (Ruta 22, con Surf): cruza el bosque interior hasta la cueva del fondo. Consejo: Kyurem nivel 75: el más fuerte de la edición. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-643","label":"Registrar a Reshiram en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":643,"auto":null,"how":"Cuándo: Final de la historia, en el Castillo de N. Dónde: Palacio de N (nivel 50); Torre Duodraco (nivel 50). Cómo: Antes del combate contra N en su palacio, el Orbe Claro (te lo da Aloe en Ciudad Esmalte tras el Castillo Ancestral) despierta a Reshiram: hay que capturarlo para seguir. Si tienes el equipo y las cajas llenos, aparece después en la Torre Duodraco. Consejo: Reshiram nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Vencer a Ghechis y Equipo Plasma","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Ghechis y al Equipo Plasma en el Castillo de N: llega al terminar la historia.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Todos los complementos del Musical Pokémon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: desde que llegas a Ciudad Mayólica y entras por primera vez en el Teatro Musical; los últimos complementos llegan tras muchas actuaciones. Dónde: el Teatro Musical de Ciudad Mayólica, además de la Ruta 5 y Ciudad Caolín. Paso a paso: 1) Entra en el teatro: el dueño te regala el Neceser, donde se guardan los complementos. 2) Actúa con un Pokémon vestido; al acabar, habla con el público que te espera en la recepción: te regalan complementos, más cuanto mejor actúes, y algunos solo tras ciertos tipos de musical. 3) El dueño, arriba, da la Corona al ganar 5 musicales, el Cinturón Campeón al ganar 10, la Tiara al actuar con un amigo y la Tarta de Plástico el día de tu cumpleaños. 4) Vence al Cantautor Marcio de la Ruta 5 por la Guitarra Eléctrica, y en la casa oeste de Ciudad Caolín un hombre da, uno por día, Gorro Rojo, Bolsa Grande, Barba Tupida y Caja de Regalo. 5) Sigue hasta reunir los 100. Consejo: viste al Pokémon con complementos del estilo del musical elegido. Lo que dependía de musicales del Pokémon Global Link, ya cerrado, se consigue hoy con Pokekeep. Fuente: WikiDex «Complemento» y «Musical Pokémon».","phase":6,"order":620},{"id":"card-3","label":"Todos los poderes regalo del Nexárbol (Zona Nexo)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Cuándo: desde que tienes el C-Gear; es un objetivo largo. Dónde: la Zona Nexo, a la que se entra con el C-Gear. Paso a paso: 1) En Negro/Blanco las misiones del Nexárbol se hacen en el mundo de otro jugador, conectado por comunicación inalámbrica: combates, esconder objetos, ayudar curando o vender un objeto. 2) Cada misión cumplida sube en 1 el nivel negro del Nexárbol en Pokémon Negro o el nivel blanco en Pokémon Blanco; según WikiDex, al completar las seis misiones sube 6 el otro nivel. 3) Cada nivel desbloquea poderes regalo nuevos, que se usan gastando regalosferas. 4) Son 33 poderes en Negro/Blanco; para tenerlos todos el Nexárbol necesita nivel 30 tanto en el nivel negro como en el blanco (por ejemplo, Captura +++ pide los dos a 30). Consejo: completar las seis misiones de cada tanda ayuda a subir también el otro nivel; necesitarás a alguien con otra consola para entrar en su mundo. Fuente: WikiDex «Nexárbol» y «Ficha de entrenador»; Serebii «Entralink - Pass Powers».","phase":6,"order":630},{"id":"card-4","label":"Derrotar a Fero y Caril en Súper Individual y Súper Doble del Metro Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Fero y Caril (Jefes de Metro) en el Súper Individual y en el Súper Doble del Metro Batalla, en sus rachas de 49 victorias.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: tras el final de la historia, cuando la ficha de entrenador alcanza su último nivel (no tiene estrellas: cambia de color; en Negro/Blanco empieza en verde y en Negro 2/Blanco 2 en azul). Dónde: cualquier Centro Pokémon de Teselia. Paso a paso: 1) Cumple los cinco logros de la ficha. En Negro/Blanco: superar la Liga Pokémon, completar la Pokédex Nacional (sin los singulares), reunir todos los complementos del Musical, lograr 49 victorias seguidas en el Super Metro Individual y en el Super Metro Doble del Metro Batalla y llevar el Nexárbol a nivel 30 tanto en el nivel negro como en el blanco. En Negro 2/Blanco 2: superar la Liga, completar la Pokédex Nacional (sin los singulares), completar todas las películas de los Estudios Cinematográficos Pokéwood, completar el Torneo Campeones del Pokémon World Tournament y el mismo nivel 30 del Nexárbol. 2) Con la ficha al máximo, pide a la Enfermera Joy que cure a tu equipo. 3) Lo curará sin decir nada, salvo si detecta Pokérus. Consejo: consulta la ficha desde el menú para ver su color actual. Fuente: WikiDex «Ficha de entrenador»; Serebii «The Trainer Card».","phase":6,"order":690},{"id":"event-0","label":"Victini, Keldeo, Meloetta y Genesect: eventos o distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Victini (Isla Libertad, con el Pase Libertad), Keldeo, Meloetta y Genesect solo llegaron por eventos (Meloetta y Genesect con historia propia en Negro 2/Blanco 2). Con Pokekeep: Añade el Pase Libertad (objeto clave) para jugar el evento de Victini, o los singulares legales desde la Librería.","phase":7,"order":700},{"id":"pokemon-642","label":"Registrar a Thundurus en la Pokédex de esta partida (exclusivo de Blanco: por intercambio)","category":"Legendarios","tier":1,"species":642,"auto":null,"how":"Cuándo: Exclusivo de Blanco. Cómo: Solo por intercambio desde Blanco (o desde Negro 2/Blanco 2 vía el RAdar Pokémon). Consejo: Hace falta para Landorus. Con Pokekeep: Añádelo legal desde la Librería (origen de la otra edición). Se acredita con el registro en la Pokédex de la partida.","phase":7,"order":720},{"id":"pokemon-641","label":"Registrar a Tornadus en la Pokédex de esta partida (vaga por Teselia en Negro)","category":"Legendarios","tier":1,"species":641,"auto":null,"how":"Cuándo: Con las 8 medallas: la recepcionista del acceso a la Ruta 10 avisa de un clima extraño en la Ruta 7. Dónde: errante por la región (nivel 40). Cómo: Ve a la casa de la anciana de la Ruta 7; Tornadus aparece y empieza a vagar por Teselia. Síguelo con el mapa del Navegador C-Gear y usa Mal de Ojo o la Master Ball. Consejo: Tornadus nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-645","label":"Registrar a Landorus en la Pokédex de esta partida (en el Santuario Abundancia con Tornadus y Thundurus en el equipo)","category":"Legendarios","tier":1,"species":645,"auto":null,"how":"Cuándo: Con Tornadus y Thundurus en el equipo (uno de ellos intercambiado desde la otra edición). Dónde: Santuario Abundancia (nivel 70). Cómo: Santuario Abundancia (Ruta 14). Consejo: Landorus nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260}],"WHITE":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, personajes y nuevas zonas de Teselia","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Negro/Blanco: tras la Liga se abre el este de Teselia (Ciudad Caolín y rutas 14-18), con Cintia, los Espadachines y Kyurem. Negro 2/Blanco 2: tras la Liga, Torre Duodraco, Ruinas Subterráneas (Regis), Nexárbol y Cintia en Pueblo Arenisca.","phase":2,"order":200},{"id":"battle0","label":"Superar Metro Batalla y sus rangos importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Metro Batalla (Ciudad Mayólica): líneas Individual, Doble y Múltiple. Los Jefes de Metro (Fero y Caril) aparecen en la victoria 21 de las líneas normales; ganarles abre la línea Súper, donde vuelven en la victoria 49.","phase":3,"order":300},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª g
