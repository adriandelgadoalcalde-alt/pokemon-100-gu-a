:"base"},{"title":"Ciudad Porcelana y Equipo Plasma","steps":["Cruza Puente Saeta o avanza desde Ciudad Porcelana según edición; investiga al Equipo Plasma.","Confirma continuidad de historia y accesos urbanos."],"caution":"En BN2 aparecen Team Plasma reformado y dos líderes diferentes.","id":"BLACK-03","section":"Historia","verified":"base"},{"title":"Desierto y Ciudad Mayólica","steps":["Explora Zona Desierto, participa en las instalaciones disponibles y vence a Camila.","Obtén la medalla y acceso al siguiente puente o ruta."],"caution":"Algunos objetos de desierto se liberan en postgame.","id":"BLACK-04","section":"Historia","verified":"base"},{"title":"Ciudad Fayenza","steps":["Resuelve incidente del equipo, vence a Yakón y alcanza el siguiente tramo.","Verifica la quinta medalla."],"caution":"En BN2 hay torneo Pokémon World Tournament cercano.","id":"BLACK-05","section":"Historia","verified":"base"},{"title":"Ciudad Loza y Monte Tuerca","steps":["Explora Torre de los Cielos o Cueva Electrorroca según punto de historia y derrota a Gerania.","Confirma sexta medalla y nuevas rutas abiertas."],"caution":"El itinerario en BN2 utiliza rutas distintas.","id":"BLACK-06","section":"Historia","verified":"base"},{"title":"Ciudad Teja y legendarios dragón","steps":["Recorre tramo oriental, alcanza Teja y participa en la revelación del Pokémon legendario.","Obtén séptima medalla y activa progreso del equipo."],"caution":"Iris y Lirio cambian entre ediciones.","id":"BLACK-07","section":"Historia","verified":"base"},{"title":"Octava medalla: Ciudad Caolín","steps":["Completa los incidentes de Torre Duodraco y Castillo Ancestral y avanza por Ciudad Teja hacia Ciudad Caolín. Supera su gimnasio de tipo Dragón frente a Lirio.","Comprueba las ocho medallas y prepara el acceso a Ruta 10 y Calle Victoria; el desenlace de N y Ghechis ocurre después del primer Alto Mando."],"caution":"El orden de Negro/Blanco es distinto del de sus secuelas. Esta medalla no resuelve todavía la historia del Equipo Plasma.","id":"BLACK-08","section":"Historia","verified":"revisión guiada","source":"https://www.serebii.net/blackwhite/gyms.shtml","contentRevision":"edition-routes-2026-11-09"},{"title":"Primer Alto Mando, N y Ghechis","steps":["Cruza Calle Victoria y derrota a los cuatro miembros del Alto Mando. En esta primera visita la historia continúa en el castillo de N; no hay combate por el título contra Mirto.","En el castillo afronta el encuentro con Reshiram, después N y Ghechis. Tras los créditos, vuelve a preparar una Liga completa para enfrentarte a Mirto en el postgame."],"caution":"Los créditos del primer desenlace y vencer al Campeón Mirto son hitos separados. Un indicador de Liga no reconstruye por sí solo todos estos combates.","id":"BLACK-09","section":"Historia","verified":"revisión guiada","source":"https://www.serebii.net/blackwhite/plasma.shtml","contentRevision":"edition-routes-2026-11-09"},{"title":"Teselia postgame","steps":["Explora zonas orientales, capturas especiales, villas, torres y entrenadores veteranos.","Revisa nuevos encuentros y objetos únicos."],"caution":"En BN2 hay Estudios Cinematográficos Pokéwood, PWT, Calle Victoria distinta y Bosque Blanco/Ciudad Negra.","id":"BLACK-10","section":"Postgame y 100%","verified":"base"},{"title":"Tarjeta, Musical y Metro Batalla","steps":["Desglosa los requisitos de tarjeta de Negro/Blanco: final principal, Pokédex Nacional con sus exclusiones, accesorios del Musical y poderes del Nexo. Revisa cada colección por separado.","Para el requisito del Metro Batalla, alcanza las rachas de 49 victorias en Súper Individual y Súper Doble. Contrasta las mejoras de la tarjeta en el propio juego; las casillas solo registran tu revisión."],"caution":"Negro/Blanco no tienen el medallero de 255 logros de las secuelas. La conectividad requerida para algunos poderes o colecciones debe revisarse aparte.","id":"BLACK-11","section":"Postgame y 100%","verified":"revisión guiada","source":"https://www.serebii.net/b ruza la Ruta 20 y llega a Ciudad Hormigón.","Visita el Complejo Hormigón para entrenar y reunir objetos antes del gimnasio.","Derrota a Hiedra (tipo Veneno) y recibe la Medalla Ponzoña.","Completa la introducción de Estudios Cinematográficos Pokéwood y avanza la secuencia del Equipo Plasma para acceder al barco hacia Porcelana."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-02","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Porcelana: cloacas y Camus","steps":["Desembarca en Ciudad Porcelana y busca a tu rival.","Entra con él en las Cloacas Porcelana para investigar al Equipo Plasma.","Regresa al gimnasio y vence a Camus (tipo Bicho).","Confirma la Medalla Élitro y continúa por la Ruta 4 hacia Mayólica."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-03","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Avenida Unión, desierto y Mayólica","steps":["En la Ruta 4 encuentra a Acromo y activa el paso hacia el norte.","Cruza Avenida Unión y decide si explorar de forma opcional el Desierto y Castillo Ancestral.","En Ciudad Mayólica completa el acceso al nuevo gimnasio y vence a Camila (tipo Eléctrico).","Comprueba la Medalla Voltio y avanza por la Ruta 5."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-04","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Fayenza y Torneo Mundial","steps":["Cruza el Puente de Fayenza y visita la ciudad.","Vence a Yakón en el gimnasio de tipo Tierra y confirma la Medalla Temblor.","Completa el torneo inicial obligatorio del Pokémon World Tournament.","Investiga el Fragata Plasma con tu rival y después dirígete hacia la Ruta 6."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-05","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Cueva Electrorroca y Ciudad Loza","steps":["En la Ruta 6 obtiene Surf de Cheren durante la historia.","Cruza la Cueva Electrorroca, recogiendo objetos y evitando confundir desvíos con la ruta obligatoria.","En Ciudad Loza visita la Torre de los Cielos cuando corresponda a la historia.","Derrota a Gerania en el gimnasio de tipo Volador y recibe la Medalla Jet."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-06","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Pueblo Chamota, Montaña Reversia y Pueblo Arenisca","steps":["Tras la medalla de Loza, viaja en avión con Gerania a Pueblo Chamota.","Cruza Montaña Reversia con Bel hacia Pueblo Arenisca.","Sigue por la Ruta 13, Pueblo Ladrillo, Rutas 12 y 11, y Puente Villa hasta Ciudad Caolín.","Si tomas desvíos a zonas antiguas de Teselia, comprueba que no son todavía obligatorios."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-07","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Ciudad Caolín, Ciudad Marga y Fragata Plasma","steps":["Vence a Lirio en Ciudad Caolín (tipo Dragón) y consigue la Medalla Leyenda.","Resuelve el ataque del Equipo Plasma a Ciudad Caolín y la trama de los Punta ADN.","Viaja mediante el Túnel Submarino hacia Ciudad Marga y derrota a Ciprián (tipo Agua) para la Medalla Ola.","Recorre las Rutas 22 y 21, la Cueva Costera y la Fragata Plasma; resuelve el episodio de Kyurem en el Boquete Gigante antes de la Liga."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-08","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Calle Victoria, Alto Mando y Campeona Iris","steps":["Cruza la Ruta 23 y la Calle Victoria; prepara un equipo versátil.","Derrota al Alto Mando: Anís, Lotto, Catleya y Aza; puedes escoger el orden.","Vence a la campeona Iris y entra en el Hall de la Fama.","Tras los créditos, comprueba los nuevos accesos del postgame."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-09","section":"Historia","verified":"referencia","source":"https://bulbapedia.bulbagarden.net/wiki/Appendix:Black_2_and_White_2_walkthrough"},{"title":"Postgame de Teselia: regiones y encuentros","steps":["Explora la parte oriental de Teselia y las rutas que se abren tras la Liga.","Visita el Castillo de N y las zonas de regreso a Teselia original.","Revisa las Caverna Abisal, rutas opcionales, cuevas y sus objetos únicos.","Identifica qué legendarios son exclusivos de Negro 2 o Blanco 2 y cuáles requieren intercambio."],"caution":"Ruta comprobada para Negro 2/Blanco 2; no utilizar el recorrido de Negro/Blanco original. Los desvíos opcionales deben verificarse por separado.","id":"BLACK2-10","section":"Postgame y 100%","verified":"referencia", ª.","phase":3,"order":300},{"id":"battle1","label":"Concursos Pokémon y sus recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (diseñador del juego, Motel Aguacala de Ciudad Calagua, tras la Liga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"El diseñador comprueba que tengas capturados los 200 de la Pokédex de Hoenn, sin Jirachi ni Deoxys (HasAllHoennMons, pokeemerald/pokeruby). Fuente: WikiDex «Pokédex», apartado «Completar la Pokédex» y «Game Freak»."},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacio imer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Resolver los encuentros legendarios y el contenido posterior a la Liga","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras el Hall de la Fama: Rayquaza en el Pilar Celeste, Latios/Latias errante, los Regis (Cámara Sellada) y, en Esmeralda, Kyogre/Groudon por el Instituto Meteorológico y el Frente Batalla. En Rubí Omega/Zafiro Alfa, el Episodio Delta (Rayquaza y Deoxys) y los parajes espejismo.","phase":2,"order":200},{"id":"battle0","label":"Completar las instalaciones de combate de esta edición","category":"Combates","tier":1,"species":null,"auto":null,"how":"Rubí/Zafiro: Torre Batalla (en barco desde Portual tras la Liga) — 50 victorias seguidas para la estrella. Esmeralda: Frente Batalla, con sus 7 instalaciones y los símbolos de plata y oro de cada As. Rubí Omega/Zafiro Alfa: Mansión Batalla (Resort Batalla), donde la estrella pide vencer a una Dama del Combate en la 50.ª.","phase":3,"order":300},{"id":"battle1","label":"Concursos Pokémon y sus recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (diseñador del juego, Motel Aguacala de Ciudad Calagua, tras la Liga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"El diseñador comprueba que tengas capturados los 200 de la Pokédex de Hoenn, sin Jirachi ni Deoxys (HasAllHoennMons, pokeemerald/pokeruby). Fuente: WikiDex «Pokédex», apartado «Completar la Pokédex» y «Game Freak»."},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Esmeralda pide todas las especies salvo Mew, Lugia, Ho-Oh, Celebi, Jirachi y Deoxys (HasAllMons, pokeemerald). Lugia y Ho-Oh solo llegan por intercambio desde Colosseum/XD o Rojo Fuego/Verde Hoja."},{"id":"final-boss","label":"Vencer a Máximo en la Cascada Meteoro tras la Liga (el rival más fuerte de Esmeralda)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras el Hall de la Fama, Máximo espera al fondo de la Cascada Meteoro (Surf y Cascada) con un equipo de nivel 76-78. La partida lo registra con FLAG_DEFEATED_METEOR_FALLS_STEVEN (pokeemerald). Fuente: WikiDex «Máximo Peñas»."},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo (MO08, de Máximo en Algaria); se puede antes o después de la Liga. Dónde: Ruinas Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) con Wailord y Relicanth en el equipo (en Esmeralda, Relicanth primero y Wailord último). Luego, en las Ruinas del Desierto (Ruta 111), sigue las instrucciones en braille de la pared. Consejo: Regirock nivel 40: lleva Pokémon para debilitarlo y muchas Ultra Balls. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada (igual que Regirock). Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105). En Rubí/Zafiro rodea la sala pegado a la pared; en Esmeralda espera dos minutos dentro sin moverte. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada y tener Vuelo. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): colócate en el centro de la sala y usa Vuelo (MO02). Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Durante la historia, tras calmar a Groudon y Kyogre en Arrecípolis (antes de la octava medalla o en cualquier momento después). Dónde: Pilar Celeste (nivel 70). Cómo: Vuelve a la cima del Pilar Celeste (Ruta 131) con la Bici Carrera para los suelos frágiles. Consejo: Rayquaza nivel 70: captúralo antes de los eventos de Kyogre y Groudon de la posliga, que lo piden. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":175},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Después del Hall de la Fama y de capturar o vencer a Rayquaza. Dónde: Cueva Marina (nivel 70). Cómo: En el Instituto Meteorológico (Ruta 119) un científico avisa de lluvias intensas: busca la ruta con lluvia y bucea hasta la Cueva Marina (rutas 105-108 y 124-129). Consejo: Kyogre nivel 70. La cueva cambia de sitio cada día. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Después del Hall de la Fama y de capturar o vencer a Rayquaza. Dónde: Cueva Terrena (nivel 70). Cómo: El Instituto Meteorológico avisa de una sequía: busca la ruta soleada y la Cueva Terrena (rutas 114-120). Consejo: Groudon nivel 70. La cueva cambia de sitio cada día. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Después del Hall de la Fama (el que no elegiste con tu madre, solo con el Ticket Eón). Dónde: errante por la región (nivel 40); Isla del Sur (nivel 50). Cómo: Respuesta roja a tu madre = Latias errante. Si elegiste azul, Latias solo está en la Isla del Sur con el Ticket Eón (evento). Consejo: Nivel 40 errante o 50 en la Isla del Sur. Con Pokekeep: Si el de la Isla del Sur es el que te falta, añade el Ticket Eón y activa su bandera de evento; o añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Después del Hall de la Fama: tu madre pregunta de qué color era el Pokémon de la tele. Dónde: errante por la región (nivel 40); Isla del Sur (nivel 50). Cómo: Si respondes azul vaga Latios; si respondes rojo, Latias. El elegido es errante y huye: síguelo con la Pokédex. Consejo: Nivel 40. El otro de los dos solo con el Ticket Eón (Isla del Sur, nivel 50). Con Pokekeep: Si el de la Isla del Sur es el que te falta, añade el Ticket Eón y activa su bandera de evento; o añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Hoenn (excluidos Jirachi y Deoxys)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex de Hoenn completa (sin Jirachi ni Deoxys): la misma condición que el diploma del Motel Aguacala.","phase":6,"order":610},{"id":"card-2","label":"Cinco cuadros de concursos rango Maestro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por los cinco cuadros de rango Maestro: gana el Concurso Maestro en las cinco categorías.","phase":6,"order":620},{"id":"card-3","label":"Todos los símbolos de oro del Frente Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por los siete símbolos de oro del Frente Batalla: vence por segunda vez a cada As (Torre, Fábrica, Palacio, Cúpula, Pirámide, Sala y Tubo) en sus rachas.","phase":6,"order":630},{"id":"event-0","label":"Mew, Deoxys o Jirachi mediant ería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Kanto (diseñador del juego, Mansión Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con los 150 de Kanto capturados (Mew no hace falta), habla con el diseñador del juego en la 3.ª planta de la Mansión Azulona (Ciudad Azulona).","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (el mismo diseñador, con la Nacional capturada)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Pide todas las especies salvo Mew, Lugia, Ho-Oh, Celebi, Jirachi y Deoxys (HasAllMons, pokefirered)."},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Durante la historia, en cuanto tengas Surf y Fuerza. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20): mueve rocas con Fuerza para frenar las corrientes hasta el sótano más profundo. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: Durante la historia, con Surf. Dónde: Central Energía (nivel 50). Cómo: Central de Energía: entra surfeando por la Ruta 10 (al norte de Pueblo Lavanda). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":155},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Tras la medalla de Isla Canela, al viajar a Archi7 (Isla Prima). Dónde: Mt. Ascuas (nivel 50). Cómo: Monte Ascuas en Isla Prima: sube a la cima con Fuerza y Golpe Roca. Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":170},{"  revancha (tras las 8 medallas de Kanto)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Con las 16 medallas, el Alto Mando y Lance usan equipos más fuertes al volver a la Liga. Comprobado en pokeheartgold (scr_seq_0824_T10R0601): el juego elige a Lance 2 por una variable de progreso y, al ganar, solo pasa al Salón de la Fama; no queda bandera de esa revancha (las banderas de entrenador del Alto Mando se reinician y están a 0 en las partidas del propietario). Se marca a mano. Fuente: WikiDex «Liga Pokémon (Johto)». En Oro, Plata y Cristal no hay revancha de la Liga. Combate repetible: la partida no guarda registro de la victoria; la guía solo puede confirmar que aún no es posible (historia sin acabar). Márcalo a mano cuando lo hagas."},{"id":"battle1","label":"Desafío de Torre Batalla o Frente Batalla según la edición","category":"Combates","tier":1,"species":null,"auto":null,"how":"Frente Batalla (Ruta 40, tras la Liga): Torre, Fábrica, Arcade, Castillo y Sala Batalla. Vence dos veces a cada As para sus símbolos de oro; la Torre Batalla cuenta además para la estrella de la tarjeta (100 seguidas).","phase":3,"order":300},{"id":"items0","label":"Acceso al Monte Plateado, billetes y objetos de historia de ambas regiones","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"En la historia: Ticket Barco del profesor Elm tras la Liga (S.S. Aqua a Kanto) y el Pase del Tren Magnético, que te da Imitadora en Ciudad Azafrán al devolverle el objeto perdido que encuentras en el Club de Fans de Ciudad Carmín (tras arreglar la Central Energía) y, para el Monte Plateado, las 16 medallas: con ellas el profesor Oak te deja pasar por la Ruta 28.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex Nacional aplicable a esta edición","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición (251, los singulares por evento aparte). Las exclusivas y los iniciales que no elegiste, por intercambio. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Johto (director del juego, Mansión Azulona 3.ª planta)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"El equipo de Game Freak está en la 3.ª planta de la Mansión Azulona y da un diploma regional y otro nacional (WikiDex «Pokédex» y «Game Freak»)."},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Mansión Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Se entrega al completar la Pokédex Nacional sin contar los singulares (WikiDex «Pokédex»)."},{"id":"pokemon-243","label":"Registrar a Raikou en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":243,"auto":null,"how":"Cuándo: Durante la historia, tras la escena del sótano de la Torre Quemada (Ciudad Iris). Dónde: errante por la región (nivel 40). Cómo: Raikou vaga por las rutas de Johto: síguelo con el mapa del Pokégear y usa Mal de Ojo o la Master Ball. Consejo: Raikou nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Durante la historia, tras la escena de la Torre Quemada. Dónde: errante por la región (nivel 40). Cómo: Entei vaga por las rutas de Johto: síguelo con el mapa del Pokégear. Consejo: Entei nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":141},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras la Torre Quemada aparece varias veces; ya en Kanto, combate por fin en el Cabo Celeste (Ruta 25). Dónde: Ruta 25 (nivel 40); Torre Quemada (nivel 40). Cómo: Sigue las apariciones de Suicune con Eusine por Johto y Kanto hasta la Ruta 25, al norte de Ciudad Celeste. Consejo: Suicune nivel 40; no huye en ese combate. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-249","label":"Registrar a Lugia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":249,"auto":null,"how":"Cuándo: Ya en Kanto (posliga): el anciano de Ciudad Plateada te da el Ala Plateada. Dónde: Islas Remolino (nivel 70). Cómo: Islas Remolino (Surf, Torbellino y Cascada), en la sala más profunda. Consejo: Lugia nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-250","label":"Registrar a Ho-Oh en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":250,"auto":null,"how":"Cuándo: Durante la historia, tras recibir el Ala Arcoíris y la Campana Clara (Torre Radio). Dónde: Torre Campana (nivel 45). Cómo: Sube a la cima de la Torre Campana de Ciudad Iris. Consejo: Ho-Oh nivel 45: es obligatorio en la historia; si lo debilitas, vuelve tras el Alto Mando. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":185},{"id":"pokemon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Ya en Kanto, con Surf y Fuerza. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20), en la parte más profunda. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":225},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: En Kanto, después de conseguir las 8 medallas de Kanto. Dónde: Ruta 10 (nivel 50). Cómo: Ruta 10, en la puerta de la Central de Energía (Surf). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":226},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Con las 16 medallas (acceso al Monte Plateado). Dónde: Cueva M Plateado (nivel 50). Cómo: Cueva Monte Plateado (Monte Plateado). Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Con las 16 medallas. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (al noroeste de Ciudad Celeste). Si se debilita o huyes, reaparece tras vencer de nuevo al Alto Mando. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Con las 8 medallas de Kanto, tras vencer a Rojo en el Monte Plateado y recibir el inicial de Kanto del profesor Oak: el Señor Pokémon (Ruta 30) te da la Esfera Azul. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Azul, ve a la Torre Oculta: entra por el Paso Acantilado de Ciudad Orquídea y sigue por la Ruta 47. Consejo: Kyogre nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Tras capturar a Kyogre y Groudon (el de la otra edición, intercambiado) y enseñárselos al profesor Oak en Pueblo Paleta: te da la Esfera Verde. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Verde, vuelve a la Torre Oculta (Paso Acantilado, Ciudad Orquídea / Ruta 47). Consejo: Rayquaza nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Con la Pokédex Nacional, tras hablar con Máximo al salir del Club de Fans de Pokémon de Ciudad Carmín. Dónde: errante por la región (nivel 35). Cómo: Latias vaga por las rutas de Kanto: síguelo con el mapa del Pokégear. Consejo: Latias nivel 35. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"orb-red-blue","label":"Conseguir Orbe de la Torre Oculta tras Rojo y el inicial de Oak","category":"Objetos clave","tier":0,"species":null,"auto":null,"how":"Orden: 16 medallas → Rojo → inicial de Kanto de Oak → Sr. Pokémon → Orbe. Es exclusivo de versión y desbloquea Groudon o Kyogre."},{"id":"red-battle","label":"Derrotar a Rojo en Monte Plateado","category":"Combates","tier":0,"species":null,"auto":null,"how":"El jefe definitivo: con las 16 medallas, Oak te da permiso para la Ruta 28 y el Monte Plateado. Sube hasta la cima y vence a Rojo (equipo de nivel 80-88). Lleva Antídotos para el granizo y muchas Revivir.","phase":3,"order":320},{"id":"unown","label":"Resolver 4 cámaras secretas y registrar los 28 Unown","category":"Puzles","tier":2,"species":null,"auto":null,"how":"Las salas de Cuerda Huida, Destello, Piedra Agua y Ho-Oh tienen indicadores específicos de evento."},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Batir los récords de las 10 pruebas Pokéathlon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por batir los récords de las 10 pruebas del Pokéathlon (Cúpula Pokéathlon, Ruta 35): consigue una puntuación récord en cada prueba, con Pokémon de buenas estadísticas de rendimiento.","phase":6,"order":620},{"id":"card-3","label":"Coronar Pokémon con cinco hojas doradas","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por enseñar a tu vecino (Eco o Lira) un Pokémon con cinco hojas doradas: con el Pokémon acompañándote, habla con él en la hierba alta de ciertas rutas de Johto y Kanto; cada ruta da como mucho una hoja y las rutas que comparten hoja son excluyentes (dependen de la naturaleza del Pokémon; tabla en WikiDex «Hoja brillante»). Te da la Corona Dorada y el diploma.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"event-0","label":"Celebi: evento histórico; en Cristal puede depender de edición/servicio","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Celebi solo llegó por eventos (en Cristal japonés, con el GS Ball del servicio móvil; en HGSS, llevando un Celebi de evento al santuario del Encinar se juega la historia con Giovanni). Con Pokekeep: Añade el Celebi de evento legal desde la Librería. En Cristal, también puedes activar el evento del GS Ball (bandera del GS Ball en la partida) y llevar el GS Ball al santuario del Encinar.","phase":7,"order":700},{"id":"event-1","label":"En HGSS: Giovanni con Celebi y Ruinas Sinjoh con Arceus","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Dos historias que solo se juegan con un singular de evento: llevar un Celebi de evento al santuario del Encinar (viaje artida.","phase":2,"order":225},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: En Kanto, después de conseguir las 8 medallas de Kanto. Dónde: Ruta 10 (nivel 50). Cómo: Ruta 10, en la puerta de la Central de Energía (Surf). Consejo: Zapdos nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":226},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Con las 16 medallas (acceso al Monte Plateado). Dónde: Cueva M Plateado (nivel 50). Cómo: Cueva Monte Plateado (Monte Plateado). Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Con las 16 medallas. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (al noroeste de Ciudad Celeste). Si se debilita o huyes, reaparece tras vencer de nuevo al Alto Mando. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-383","label":"Registrar a Groudon en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":383,"auto":null,"how":"Cuándo: Con las 8 medallas de Kanto, tras vencer a Rojo y recibir el inicial de Kanto: el Señor Pokémon (Ruta 30) te da la Esfera Roja. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Roja, ve a la Torre Oculta (Paso Acantilado de Ciudad Orquídea y Ruta 47). Consejo: Groudon nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Tras capturar a Kyogre y Groudon (el de la otra edición, intercambiado) y enseñárselos al profesor Oak en Pueblo Paleta: te da la Esfera Verde. Dónde: Torre Oculta (nivel 50). Cómo: Con la Esfera Verde, vuelve a la Torre Oculta (Paso Acantilado, Ciudad Orquídea / Ruta 47). Consejo: Rayquaza nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"pokemon-381","label":"Registrar a Latios en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":381,"auto":null,"how":"Cuándo: Con la Pokédex Nacional, tras hablar con Máximo al salir del Club de Fans de Pokémon de Ciudad Carmín. Dónde: errante por la región (nivel 35). Cómo: Latios vaga por las rutas de Kanto: síguelo con el mapa del Pokégear. Consejo: Latios nivel 35. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"orb-red-blue","label":"Conseguir Orbe de la Torre Oculta tras Rojo y el inicial de Oak","category":"Objetos clave","tier":0,"species":null,"auto":null,"how":"Orden: 16 medallas → Rojo → inicial de Kanto de Oak → Sr. Pokémon → Orbe. Es exclusivo de versión y desbloquea Groudon o Kyogre."},{"id":"red-battle","label":"Derrotar a Rojo en Monte Plateado","category":"Combates","tier":0,"species":null,"auto":null,"how":"El jefe definitivo: con las 16 medallas, Oak te da permiso para la Ruta 28 y el Monte Plateado. Sube hasta la cima y vence a Rojo (equipo de nivel 80-88). Lleva Antídotos para el granizo y muchas Revivir.","phase":3,"order":320},{"id":"unown","label":"Resolver 4 cámaras secretas y registrar los 28 Unown","category":"Puzles","tier":2,"species":null,"auto":null,"how":"Las salas de Cuerda Huida, Destello, Piedra Agua y Ho-Oh tienen indicadores específicos de evento."},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Batir los récords de las 10 pruebas Pokéathlon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por batir los récords de las 10 pruebas del Pokéathlon (Cúpula Pokéathlon, Ruta 35): consigue una puntuación récord en cada prueba, con Pokémon de buenas estadísticas de rendimiento.","phase":6,"order":620},{"id":"card-3","label":"Coronar Pokémon con cinco hojas doradas","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por enseñar a tu vecino (Eco o Lira) un Pokémon con cinco hojas doradas: con el Pokémon acompañándote, habla con él en la hierba alta de ciertas rutas de Johto y Kanto; cada ruta da como mucho una hoja y las rutas que comparten hoja son excluyentes (dependen de la naturaleza del Pokémon; tabla en WikiDex «Hoja brillante»). Te da la Corona Dorada y el diploma.","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"event-0","label":"Celebi: evento histórico; en Cristal puede depender de edición/servicio","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Celebi solo llegó por eventos (en Cristal japonés, con el GS Ball del servicio móvil; en HGSS, llevando un Celebi de evento al santuario del Encinar se juega la historia con Giovanni). Con Pokekeep: Añade el Celebi de evento legal desde la Librería. En Cristal, también puedes activar el evento del GS Ball (bandera del GS Ball en la partida) y llevar el GS Ball al santuario del Encinar.","phase":7,"order":700},{"id":"event-1","label":"En HGSS: Giovanni con Celebi y Ruinas Sinjoh con Arceus","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Dos historias que solo se juegan con un singular de evento: llevar un Celebi de evento al santuario del Encinar (viaje en el tiempo con Giovanni) y llevar un Arceus de evento a las Ruinas Alfa (Ruinas Sinjoh, donde eliges Dialga, Palkia o Giratina). Con Pokekeep: Añade el Celebi o el Arceus de evento legal desde la Librería y llévalo en el equipo; luego sigue la historia en el juego.","phase":7,"order":710},{"id":"collect-unown","label":"Registrar las 28 formas de Unown (Ruinas Alfa)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Resuelve los cuatro puzles de las Ruinas Alfa (Kabuto, Omanyte, Aerodactyl y Ho-Oh) y las salas que abren (con Destello, Fuerza y el Ala Arcoíris/Plateada según la sala). Los Unown aparecen en las cámaras; «!» y «?» salen tras registrar los otros 26.","phase":4,"order":410},{"id":"frontier-prints","label":"Huellas de oro de los cinco Ases del Frente Batalla («Frontier Brains»)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Torre, Fábrica, Sala, Castillo y Ruleta Batalla: cada As da una huella de plata y otra de oro al vencerlo en sus combates especiales. Fuente: Serebii (Battle Frontier)."},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta de oro: te llama por tu nombre y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con 4 estrellas o más en la tarjeta la enfermera te reconoce y cura sin preguntar; la primera vez queda FLAG_NURSE_NOTICED_CARD (pokeheartgold scr_seq_0003)."}],"BLACK":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, personajes y nuevas zonas de Teselia","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Negro/Blanco: tras la Liga se abre el este de Teselia (Ciudad Caolín y rutas 14-18), con Cintia, los Espadachines y Kyurem. Negro 2/Blanco 2: tras la Liga, Torre Duodraco, Ruinas Subterráneas (Regis), Nexárbol y Cintia en Pueblo Arenisca.","phase":2,"order":200},{"id":"battle0","label":"Superar Metro Batalla y sus rangos importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Metro Batalla (Ciudad Mayólica): líneas Individual, Doble y Múltiple. Los Jefes de Metro (Fero y Caril) aparecen en la victoria 21 de las líneas normales; ganarles abre la línea Súper, donde vuelven en la victoria 49.","phase":3,"order":300},{"id":"pokedex","label":"Completar Pokédex Nacional según exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional de la edición; los singulares de evento no cuentan para el diploma. Muchas especies llegan por el Parque Compi (4.ª gen.) o el Pokétransfer (5.ª gen.) desde ediciones anteriores, o por intercambio. Con Pokekeep: Lo que te falte de otras ediciones, añádelo legal desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Teselia (director del juego, oficinas de Game Freak, Calle Porcelana de Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Las oficinas de Game Freak están a la derecha de la Calle Porcelana; el director da un diploma por la Pokédex de Teselia y otro por la Nacional (WikiDex «Game Freak» y «Pokédex»)."},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (mismo director, Ciudad Porcelana)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), habla con el director del juego en el Game Freak de Ciudad Porcelana.","phase":6,"order":605},{"id":"final-boss-cynthia","label":"Vencer a Cintia en su casa de Pueblo Arenisca tras la Liga (primavera y verano)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cintia está en Teselia solo en primavera y verano (en otoño e invierno vuelve a Sinnoh) y acepta un combate en su casa de Pueblo Arenisca, con Spiritomb y Garchomp entre otros. Fuente: WikiDex «Cintia». Comprobado en el script de la ROM (a/0/5/7, archivo 834): tras TrainerBattle 0x237 (TRID_DPCHAMPION_01) solo se escribe TMFLG_T04R0401_SHIRONA_BTL (0xAC7), una bandera diaria; la bandera de entrenador sigue a 0 en las partidas del propietario. El juego no guarda la victoria de forma permanente. Se marca a mano. Combate repetible: la partida no guarda registro de la victoria; la guía solo puede confirmar que aún no es posible (historia sin acabar). Márcalo a mano cuando lo hagas."},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Porcelana (tras el Alto Mando)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Shigeki Morimoto, programador de Game Freak, acepta un combate al día después de vencer al Alto Mando (WikiDex «Game Freak»). Comprobado en el script de la ROM (a/0/5/7, archivo 96): tras TrainerBattle 0x21E solo se escribe TMFLG_C03R0402_BATTLE (0xAB7), una bandera diaria. El juego no guarda la victoria de forma permanente. Se marca a mano. Combate repetible: la partida no guarda registro de la victoria; la guía solo puede confirmar que aún no es posible (historia sin acabar). Márcalo a mano cuando lo hagas."},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Después del Hall de la Fama; es el primero de los tres Espadachines Místicos. Dónde: Estancia Orientación (nivel 42). Cómo: Estancia Orientación, dentro de la Cueva Loza (Surf y Fuerza). Consejo: Cobalion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion. Dónde: Cámara de Pruebas (nivel 42). Cómo: Cámara de Pruebas, en la Calle Victoria. Consejo: Terrakion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Después del Hall de la Fama, tras haber visto a Cobalion y a Terrakion. Dónde: Claro Filosofía (nivel 42). Cómo: Claro Filosofía, en el Bosque Azulejo. Consejo: Virizion nivel 42. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Boquete Gigante (nivel 75). Cómo: Boquete Gigante (Ruta 22, con Surf): cruza el bosque interior hasta la cueva del fondo. Consejo: Kyurem nivel 75: el más fuerte de la edición. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-643","label":"Registrar a Reshiram en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":643,"auto":null,"how":"Cuándo: Final de la historia, en el Castillo de N. Dónde: Palacio de N (nivel 50); Torre Duodraco (nivel 50). Cómo: Antes del combate contra N en su palacio, el Orbe Claro (te lo da Aloe en Ciudad Esmalte tras el Castillo Ancestral) despierta a Reshiram: hay que capturarlo para seguir. Si tienes el equipo y las cajas llenos, aparece después en la Torre Duodraco. Consejo: Reshiram nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Vencer a Ghechis y Equipo Plasma","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Ghechis y al Equipo Plasma en el Castillo de N: llega al terminar la historia.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Todos los complementos del Musical Pokémon","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Los fans los regalan tras las actuaciones y otros se consiguen por el juego. Fuentes: Serebii (Trainer Card) y PokéWiki (Trainerpass); WikiDex atribuye el Nexárbol a nivel 30 también a Negro/Blanco, pero las otras dos fuentes lo limitan a Negro 2/Blanco 2."},{"id":"card-3","label":"Todos los poderes regalo del Nexárbol (Zona Nexo)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Se desbloquean subiendo de nivel el Nexárbol con misiones de la Zona Nexo. Fuentes: Serebii (Trainer Card) y PokéWiki (Trainerpass); WikiDex atribuye el Nexárbol a nivel 30 también a Negro/Blanco, pero las otras dos fuentes lo limitan a Negro 2/Blanco 2."},{"id":"card-4","label":"Derrotar a Fero y Caril en Súper Individual y Súper Doble del Metro Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a Fero y Caril (Jefes de Metro) en el Súper Individual y en el Súper Doble del Met us recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"final-boss","label":"Vencer a Máximo con su equipo reforzado al volver a la Liga de Hoenn","category":"Combates","tier":1,"species":null,"auto":null,"how":"Máximo sigue siendo el campeón en ROZA; desde la segunda vez que se desafía la Liga usa su equipo más fuerte (todos sus Pokémon tienen al menos una inmunidad). Fuente: WikiDex «Máximo Peñas». La partida marca la victoria con la bandera de entrenador del campeón de revancha (TRID_CHAMPION_P_01/_P_02, FlagsEditorEXPlugin); el primer combate queda en TRID_CHAMPION_01."},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (equipo ». La partida marca la victoria con la bandera de entrenador del campeón de revancha (TRID_CHAMPION_P_01/_P_02, FlagsEditorEXPlugin); el primer combate queda en TRID_CHAMPION_01."},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (equipo de Game Freak, Motel Aguacala de Ciudad Calagua)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Hoenn completa, habla con el equipo de Game Freak en el Motel Aguacala (Ciudad Calagua).","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (Motel Aguacala)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin los singulares de evento; Deoxys sí cuenta), habla con el equipo de Game Freak en el Motel Aguacala de Ciudad Calagua.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: ver toda la Pokédex de Hoenn (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Lo entrega el Profesor Abedul tras VER todos los de Hoenn salvo Jirachi y Deoxys (WikiDex «Amuleto Oval»)."},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada, Deoxys incluido (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (Deoxys incluido, sin el resto de singulares de evento), el profesor Abedul te da el Amuleto Iris en su laboratorio de Villa Raíz.","phase":6,"order":610},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo; antes o después de la Liga. Dónde: Ruinas del Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) y lee el braille. Regirock está en las Ruinas del Desierto (Ruta 111): usa Golpe Roca en el centro de la sala. Consejo: Regirock nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":205},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105): espera dentro sin moverte hasta que se abra la puerta. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":206},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): ponte en el centro y usa Vuelo. Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":207},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Durante el Episodio Delta (posliga). Dónde: Pilar Celeste (nivel 70). Cómo: En la cima del Pilar Celeste, tras despertarlo con Zinnia. Es obligatorio para seguir el episodio. Consejo: Rayquaza nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Durante la historia, antes de la octava medalla. Dónde: Cueva Ancestral (nivel 45). Cómo: Cueva Ancestral de Arrecípolis: tras la regresión primigenia de Kyogre, enfréntate a él al fondo. Consejo: Kyogre nivel 45; si lo debilitas, vuelve tras la Liga. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-386","label":"Registrar a Deoxys en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":386,"auto":null,"how":"Cuándo: Al terminar el Episodio Delta. Dónde: Pilar Celeste (nivel 80). Cómo: Vuelve con Rayquaza (megaevolucionado) al espacio y de nuevo a la cima del Pilar Celeste: Deoxys te espera. Consejo: Deoxys nivel 80. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Durante la historia, al cruzar el mar de la Ruta 118. Dónde: Isla del Sur (nivel 30). Cómo: El otro Pokémon eón te lleva a la Isla del Sur; tras vencer al equipo villano, este se une a tu equipo (regalo). Después te da la Flauta Eón para volar. Consejo: Nivel 30, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entren contar singulares (WikiDex «Amuleto Iris» y «Game Freak»)."},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Kantai: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras la Liga se puede combatir una vez al día; la primera victoria da el Amuleto Oval (WikiDex «Amuleto Oval» y «Shigeki Morimoto»)."},{"id":"pokemon-785","label":"Registrar a Tapu Koko en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":785,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Guerra (nivel 60). Cómo: Entra en las Ruinas de la Guerra (Melemele) y acércate al altar del fondo. Consejo: Tapu Koko nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-786","label":"Registrar a Tapu Lele en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":786,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Vida (nivel 60). Cómo: Entra en las Ruinas de la Vida (Akala) y acércate al altar del fondo. Consejo: Tapu Lele nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-787","label":"Registrar a Tapu Bulu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":787,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Cosecha (nivel 60). Cómo: Entra en las Ruinas de la Cosecha (Ula-Ula) y acércate al altar del fondo. Consejo: Tapu Bulu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-788","label":"Registrar a Tapu Fini en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":788,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas del Tránsito (nivel 60). Cómo: Entra en las Ruinas del Tránsito (Poni) y acércate al altar del fondo. Consejo: Tapu Fini nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-789","label":"Registrar a Cosmog en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":789,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: De noche, cruza la fisura dimensional del Altar del Sol con Solgaleo y llega al Lago Corosol: un Cosmog se une a tu equipo. Consejo: Cosmog nivel 5, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-800","label":"Registrar a Necrozma en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":800,"auto":null,"how":"Cuándo: Después de ser campeón y de completar la quinta misión de los ultraentes (con Handsome y Anabel). Dónde: Colina Dequilate (Caldera Remota) (nivel 75). Cómo: Colina Dequilate, en la Caldera Remota (la zona más alejada, con Machamp Empuje). Consejo: Necrozma nivel 75. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-791","label":"Registrar a Solgaleo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":791,"auto":null,"how":"Cuándo: Final de la historia, en el Altar del Sol/de la Luna (Poni). Dónde: Altar del Sol (nivel 55); Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: Tras la evolución de Nebulilla, el legendario te espera en el altar: hay que capturarlo para seguir. Consejo: Nivel 55. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Sello 1: Entrenador Pokémon oficial","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello que se consigue al empezar la aventura, cuando el profesor Kukui te inscribe como entrenador oficial y recibes la tarjeta. No hay que hacer nada.","phase":6,"order":600},{"id":"card-1","label":"Sello 2: Gran Prueba de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Melemele: tras superar la prueba del capitán, el kahuna de la isla te espera en Pueblo Lilii para la gran prueba. Ganarla da el sello y el Cristal Z de tipo Lucha.","phase":6,"order":601},{"id":"card-2","label":"Sello 3: Gran Prueba de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Akala: supera las tres pruebas de la isla (agua, fuego y planta) y vence a la kahuna en Ciudad Konikoni. Da el sello y el Cristal Z de tipo Roca.","phase":6,"order":602},{"id":"card-3","label":"Sello 4: Gran Prueba de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Ula-Ula: supera las pruebas de la isla y vence al kahuna, que está en Pueblo Po. Da el sello y el Cristal Z de tipo Siniestro.","phase":6,"order":603},{"id":"card-4","label":"Sello 5: Gran Prueba de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Poni: supera la última prueba y vence a la kahuna de la isla. Da el sello y el Cristal Z de tipo Tierra; con ella termina el recorrido insular.","phase":6,"order":604},{"id":"card-5","label":"Sello 6: Recorrido Insular completado y Liga","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Termina el recorrido insular y conviértete en campeón de la Liga de Alola.","phase":6,"order":605},{"id":"card-6","label":"Sello 7: Pokédex de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Melemele de la Pokédex de Alola. Casi todas salen durante la historia; algunas solo de noche, con el tiempo o por evolución. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":606},{"id":"card-7","label":"Sello 8: Pokédex de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Akala. Algunas solo aparecen tras la Liga o por evolución por intercambio. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":607},{"id":"card-8","label":"Sello 9: Pokédex de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Ula-Ula. Varias son exclusivas de una edición (intercambio) o aparecen tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / r 608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Doble; lleva un equipo pensado para dobles.","phase":6,"order":612},{"id":"card-13","label":"Sello 14: Pokévisor Pro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Consigue la última mejora del Pokévisor (Pokévisor Pro) haciendo fotos en los puntos de foto hasta llegar al máximo de valoraciones.","phase":6,"order":613},{"id":"card-14","label":"Sello 15: 50 victorias seguidas múltiples en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: 50 victorias seguidas en el Árbol de Combate, Múltiple (con un compañero).","phase":6,"order":614},{"id":"event-0","label":"Magearna y otros singulares: QR, entregas/eventos y requisitos de edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Magearna: se recibía tras ser campeón escaneando su código QR oficial (evento) con el escáner QR. Con Pokekeep: Añade Magearna legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Marshadow y Zeraora: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 60); Antiguo Paso de Poni (nivel 60). Cómo: Zyra te lo da en el Antiguo Paso de Poni. Consejo: Código Cero nivel 60, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Después de ser campeón (no hay células repartidas por Alola). Dónde: Ruta 16 (nivel 63); Ruta 16 (nivel 50); Gruta Desenlace (nivel 60). Cómo: Dexio te da un Zygarde al 10 % y el Arca (Ruta 16); hay otro al 50 % en la Gruta Desenlace. Con las 100 células del Arca, forma completa en el laboratorio Æther de la Ruta 16. Consejo: Zygarde 50 % nivel 63 en la Gruta Desenlace. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"zygarde-cells","label":"Reunir las 100 células y núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En Ultrasol y Ultraluna no hay células repartidas por Alola: el Arca de Zygarde (laboratorio Æther de la Ruta 16, tras la Liga) ya trae 40 células y núcleos, Dexio te da un Zygarde al 10 % y en la Gruta Desenlace hay uno al 50 % (WikiDex «Arca de Zygarde»). Con las 100 se sintetiza Zygarde completo. La partida lleva la cuenta en la variable 169 de EventWork7 (la que PKHeX llama ZygardeCellCount)."},{"id":"zygarde-cores","label":"Reunir los 5 núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En USUL los cinco núcleos vienen dentro del Arca de Zygarde que te dan en la Ruta 16 tras la Liga (WikiDex «Arca de Zygarde»): no hay que buscarlos por Alola.","phase":4,"order":410},{"id":"mantine-surf","label":"Completar los cuatro recorridos de «Mantine Surf»","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Playas de Melemele, Akala (Kantai), Ula-Ula y Poni; cada isla tiene un recorrido más largo y con más obstáculos. Fuente: Serebii (Mantine Surf). Se acredita cuando la partida guarda una mejor puntuación en los cuatro recorridos (Misc7.GetSurfScore de PKHeX)."}],"ULTRAMOON":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, incluido Rainbow Rocket cuando corresponda","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: defensa del título en la Liga, tapus en sus ruinas, Necrozma y Código Cero. En Sol/Luna, las misiones de los ultraentes con Handsome y Anabel; en Ultrasol/Ultraluna, el Episodio RR (Team Rainbow Rocket) en el Paraíso Æther y el Ultraviaje.","phase":2,"order":200},{"id":"battle0","label":"Superar el Árbol de Combate y derrotar entrenadores importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Árbol de Combate (al final de la Pendiente de Poni, tras la Liga): combates Individual, Doble y Múltiple contra entrenadores y leyendas invitadas (Rojo, Azul...). Hay sellos por 50 victorias seguidas en cada modalidad.","phase":3,"order":300},{"id":"battle1","label":"Defender el título de campeón de Alola en la Liga del Monte Lanakila","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras ser campeón, cada vez que vuelvas a vencer al Alto Mando un retador intenta quitarte el título (el primero, Tilo; luego entrenadores de la aventura, y Gladio un mes después de Necrozma). La partida cuenta las defensas (récord «Champion Title Defense» de PKHeX). Fuente: WikiDex «Liga Pokémon (Alola)»."},{"id":"items0","label":"Cristales Z, Zygarde o recursos únicos según edición","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cristales Z: uno por cada prueba y gran prueba del recorrido insular (los de tipo, en orden de la historia) y los exclusivos de Pokémon concretos por la posliga. Arca de Zygarde: Ruta 16 (Akala).","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex regional de Alola","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Alola (las cuatro islas). Cada vez que completes la sección de una isla, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala) para que selle tu pasaporte; con la de Alola completa (sin singulares) te da el diploma y el Amuleto Iris. Con Pokekeep: Las especies exclusivas de la otra edición, añádelas legales desde la Librería si no puedes intercambiarlas.","phase":5,"order":500},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Alola completa (director del juego, Iwao, oficinas de Game Freak ","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 60); Antiguo Paso de Poni (nivel 60). Cómo: Zyra te lo da en el Antiguo Paso de Poni. Consejo: Código Cero nivel 60, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Después de ser campeón (no hay células repartidas por Alola). Dónde: Ruta 16 (nivel 63); Ruta 16 (nivel 50); Gruta Desenlace (nivel 60). Cómo: Dexio te da un Zygarde al 10 % y el Arca (Ruta 16); hay otro al 50 % en la Gruta Desenlace. Con las 100 células del Arca, forma completa en el laboratorio Æther de la Ruta 16. Consejo: Zygarde 50 % nivel 63 en la Gruta Desenlace. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"zygarde-cells","label":"Reunir las 100 células y núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En Ultrasol y Ultraluna no hay células repartidas por Alola: el Arca de Zygarde (laboratorio Æther de la Ruta 16, tras la Liga) ya trae 40 células y núcleos, Dexio te da un Zygarde al 10 % y en la Gruta Desenlace hay uno al 50 % (WikiDex «Arca de Zygarde»). Con las 100 se sintetiza Zygarde completo. La partida lleva la cuenta en la variable 169 de EventWork7 (la que PKHeX llama ZygardeCellCount)."},{"id":"zygarde-cores","label":"Reunir los 5 núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"En USUL los cinco núcleos vienen dentro del Arca de Zygarde que te dan en la Ruta 16 tras la Liga (WikiDex «Arca de Zygarde»): no hay que buscarlos por Alola.","phase":4,"order":410},{"id":"mantine-surf","label":"Completar los cuatro recorridos de «Mantine Surf»","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Playas de Melemele, Akala (Kantai), Ula-Ula y Poni; cada isla tiene un recorrido más largo y con más obstáculos. Fuente: Serebii (Mantine Surf). Se acredita cuando la partida guarda una mejor puntuación en los cuatro recorridos (Misc7.GetSurfScore de PKHeX)."}],"LETGOP":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Vencer a la Liga de Kanto en la revancha (equipos nuevos del Alto Mando y del campeón)","category":"Postgame","tier":0,"species":null,"auto":null,"how":"En la revancha cambian los Pokémon del Alto Mando y del campeón (WikiDex «Liga Pokémon (Kanto)»). El juego no guarda esa victoria por separado: se marca a mano. El guardado no distingue la revancha superada: los scripts de la Liga (script_amx.gfpak descompilado) solo escriben WK_SCENE_CHAMPION_REMATCH = 10, el mismo valor que deja la primera victoria, y las banderas FE_*_WIN se borran al salir. Márcalo a mano. Combate repetible: la partida no guarda registro de la victoria; la guía solo puede confirmar que aún no es posible (historia sin acabar). Márcalo a mano cuando lo hagas."},{"id":"battle0","label":"Vencer a los entrenadores Maestros Pokémon disponibles","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras ser campeón aparecen
