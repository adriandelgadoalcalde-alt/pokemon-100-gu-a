nsejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"medal-type","label":"Título de Gran Maestro: vencer a todos los entrenadores maestros (habla con la señora de las oficinas de GAME FREAK en Ciudad Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: después de convertirte en campeón de la Liga Pokémon de Kanto. Dónde: los entrenadores maestros están repartidos por todo Kanto (ropa roja y bocadillo con su Pokémon); el título final se recoge en las oficinas de GAME FREAK del Edificio Azulona (Ciudad Azulona). Paso a paso: 1) Busca a cada entrenador maestro: hay 153, uno por cada especie de la Pokédex de Kanto (incluidos Meltan y Melmetal). 2) La mayoría te reta a un combate de uno contra uno: solo puedes usar un Pokémon de su misma especie y nadie puede usar objetos. Al ganar recibes su título. 3) Los de legendarios, de Mew, Meltan, Melmetal y de Ditto no combaten: piden que les enseñes un ejemplar de su especie con un mínimo de PC (de 4000 a 9000 según la especie). 4) Con los 153 títulos, habla con la señora de las oficinas de GAME FREAK y te da el título de gran maestro; con ella también puedes cambiar el título que muestras. Consejo: sube los PC con caramelos antes de cada combate. Fuente: WikiDex «Entrenador maestro»; Serebii «Master Trainers».","phase":6,"order":620},{"id":"event-0","label":"Mew: regalo/distribución externa; Meltan y Melmetal mediante Pokémon GO cuando sea posible","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew llegó con la Poké Ball Plus; Meltan y Melmetal, por Pokémon GO. Con Pokekeep: Añade Mew legal desde la Librería.","phase":7,"order":700}],"SWORD":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Resolver crisis posliga con los héroes de Galar y terminar los DLC adquiridos","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: episodio de Tizonio y Dargo (Zacian/Zamazenta), Torre Batalla de Puntera y, con los DLC, la Isla de la Armadura y las Nieves de la Corona.","phase":2,"order":200},{"id":"battle0","label":"Superar Torre Batalla y Torneo Estrellas de Galar si tienes DLC","category":"Combates","tier":1,"species":null,"auto":null,"how":"Torre Batalla (Puntera): sube de rango Poké Ball hasta Master Ball. El Torneo Estrellas de Galar (Nieves de la Corona) se juega en el estadio de Puntera.","phase":3,"order":300},{"id":"items0","label":"Objetos para incursiones, formas y expansión del Pokédex","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Muñequera Dinamax (historia), Gigamaxificación por la sopa máxima (Isla de la Armadura), Riendas Unión (Nieves de la Corona) y la Espada/Escudo oxidados (posliga).","phase":1,"order":120},{"id":"pokedex","label":"Completar Pokédex de Galar y de cada DLC adquirido","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Galar (400) y, con los DLC, las de la Isla de la Armadura y las Nieves de la Corona. El director del juego está en el Hotel Jonia de Pueblo Auriga (última habitación de la izquierda): primero te da el Amuleto Captura y, con la Pokédex de Galar capturada, el diploma y el Amuleto Iris. Con Pokekeep: Las exclusivas de la otra edición, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diplomas de las Pokédex de Galar, Isla de la Armadura y Nieves de la Corona (director del juego, Hotel Jonia de Pueblo Auriga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: el primer amuleto, desde que puedes entrar en Pueblo Auriga; el diploma de Galar, al completar su Pokédex; los de la Isla de la Armadura y las Nieves de la Corona, al completar cada una (requieren el Pase de expansión). Dónde: Hotel Jonia, en la rotonda del centro de Pueblo Auriga; el director del juego está en la habitación más al oeste. Paso a paso: 1) Habla con el director la primera vez: te da el Amuleto Captura. 2) Registra como capturadas todas las especies de la Pokédex de Galar y vuelve a hablarle: entrega el Amuleto Iris, el diploma de Pokédex completa y una marca en la tarjeta de liga. 3) Completa la Pokédex Armadura para su diploma; además, la doctora de la Estación Armadura, en el Prado Reverencia, te da el Amuleto Emblema. 4) Completa la Pokédex Corona para el tercer diploma. Consejo: para las especies exclusivas de la otra versión, usa intercambios en línea. Fuente: WikiDex «Hotel Jonia», «Diploma» y «Amuleto Emblema».","phase":6,"order":612},{"id":"final-boss","label":"Vencer a Morimoto en el Hotel Jonia de Pueblo Auriga: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ganar la Liga y convertirte en campeón de Galar. Dónde: Hotel Jonia, en Pueblo Auriga; Morimoto, vestido de policía, está en la habitación contigua a la del director del juego. Paso a paso: 1) Termina la historia principal y entra en el hotel. 2) Habla con Morimoto: propone un combate doble. 3) Prepara un equipo de nivel alto: el suyo es de nivel 65 (Cursola, Grapploct, Dragapult, Coalossal, Stonjourner y Snorlax) y dinamaxiza a su Snorlax, así que guarda tu Dinamax para responder. 4) Gánale la primera vez: te entrega el Amuleto Oval, que aumenta la probabilidad de encontrar huevos. 5) Puedes repetir el combate una vez al día. Consejo: en combate doble, Protección ayuda a esperar a que termine el Dinamax de Snorlax. Fuente: WikiDex «Hotel Jonia», «Shigeki Morimoto» y «Amuleto Oval».","phase":3,"order":390},{"id":"pokemon-890","label":"Registrar a Eternatus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":890,"auto":null,"how":"Cuándo: Final de la historia, tras el combate contra el presidente Rose en la Planta Eléctrica. Dónde: Corona de la Torre (nivel 60). Cómo: En la Corona de la Torre: debilítalo en forma normal y captúralo en el combate Dinamax infinito (captura asegurada). Consejo: Eternatus nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":195},{"id":"pokemon-888","label":"Registrar a Zacian en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":888,"auto":null,"how":"Cuándo: Después de ser campeón, al terminar el episodio de Tizonio y Dargo. Dónde: Corona de la Torre (nivel 70). Cómo: Tras perseguir a Tizonio y Dargo por los estadios de Galar, el episodio termina en la Corona de la Torre de la Planta Eléctrica, donde el legendario de tu edición se deja capturar. Consejo: Nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"medal-type","label":"Amuleto Iris al completar la Pokédex de Galar (Pueblo Auriga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tengas registradas como capturadas todas las especies de la Pokédex de Galar (normalmente después de la Liga). Dónde: Hotel Jonia, en Pueblo Auriga. Paso a paso: 1) Abre la Pokédex de Galar y comprueba que las 400 especies figuran como capturadas, no solo vistas. 2) Las exclusivas de la otra versión (Espada o Escudo) consíguelas por intercambio en línea o en las incursiones Dinamax. 3) Evoluciona lo que haga falta, incluidas las evoluciones por intercambio. 4) Ve al Hotel Jonia y habla con el director del juego en la habitación más al oeste (antes tiene que haberte dado el Amuleto Captura): entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor, junto con el diploma. Las Pokédex Armadura y Corona de los DLC van aparte y tienen sus propios diplomas. Consejo: en el mismo hotel, Morimoto da el Amuleto Oval; aprovecha la visita. Fuente: WikiDex «Hotel Jonia» y «Amuleto Iris».","phase":6,"order":617},{"id":"event-0","label":"Zarude y otros singulares: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Zarude y otros singulares solo llegaron por distribución. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"DLC: capturas de Calyrex, Galarian birds y Regis; elecciones mutuamente excluyentes","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Elecciones excluyentes del DLC: Glastrier o Spectrier, Regieleki o Regidrago, Urshifu brusco o fluido. Solo se puede obtener uno de cada pareja por partida. Con Pokekeep: Añade el que no elegiste legal desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Torre Batalla (nivel 50, regalo). Cómo: Una empleada de la Torre Batalla (Puntera) te lo da. Consejo: Código Cero nivel 50, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-803","label":"Registrar a Poipole en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":803,"auto":null,"how":"Cuándo: Nieves de la Corona: tras completar 5 Aventuras Dinamax contra ultraentes. Dónde: Supernido Dinamax (nivel 20, regalo). Cómo: Un científico del Supernido Dinamax te da a Poipole. Consejo: Poipole nivel 20, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":280},{"id":"pokemon-891","label":"Registrar a Kubfu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":891,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): tras superar las tres pruebas de Mostaza. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Mostaza te da a Kubfu en el Dojo Maestro. Consejo: Kubfu nivel 10, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-892","label":"Registrar a Urshifu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":892,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): con Kubfu de amigo. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Supera la Torre de las Sombras (estilo brusco) o la Torre de las Aguas (estilo fluido) con Kubfu y examina el manuscrito: evoluciona a Urshifu. Consejo: El estilo es excluyente: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-898","label":"Registrar a Calyrex en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":898,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), siendo ya campeón. Dónde: Templo Corona (Nieves de la Corona) (nivel 80). Cómo: Sigue la historia de Calyrex: planta la zanahoria (Glastrier o Spectrier), atrapa al corcel y lleva a Calyrex al Templo Corona. Consejo: Calyrex nivel 80, montado en el corcel elegido. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-896","label":"Registrar a Glastrier en la Pokédex de esta partida (Glastrier y Spectrier son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":896,"auto":null,"how":"Cuándo: Nieves de la Corona: si plantas la zanahoria en el Desfiladero Nevado. Dónde: Templo Corona (Nieves de la Corona) (nivel 75). Cómo: Capturas a Calyrex jinete glacial; sepáralos con las Riendas Unión. Consejo: Glastrier y Spectrier son excluyentes: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-897","label":"Registrar a Spectrier en la Pokédex de esta partida (Glastrier y Spectrier son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":897,"auto":null,"how":"Cuándo: Nieves de la Corona: si plantas la zanahoria en el Viejo Cementerio. Dónde: Templo Corona (Nieves de la Corona) (nivel 75). Cómo: Capturas a Calyrex jinete espectral; sepáralos con las Riendas Unión. Consejo: Excluyente con Glastrier: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-894","label":"Registrar a Regieleki en la Pokédex de esta partida (Regieleki y Regidrago son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":894,"auto":null,"how":"Cuándo: Nieves de la Corona: tras la segunda pista legendaria de Peony. Dónde: Ruinas del Dilema (nivel 70). Cómo: Ruinas del Dilema: elige Regieleki (huellas eléctricas). Es excluyente con Regidrago. Consejo: Regieleki nivel 70; el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-895","label":"Registrar a Regidrago en la Pokédex de esta partida (Regieleki y Regidrago son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":895,"auto":null,"how":"Cuándo: Nieves de la Corona: tras la segunda pista legendaria de Peony. Dónde: Ruinas del Dilema (nivel 70). Cómo: Ruinas del Dilema: elige Regidrago. Es excluyente con Regieleki. Consejo: Regidrago nivel 70; el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Pico Roca (nivel 70). Cómo: Ruinas Pico Roca: abre la puerta resolviendo la inscripción. Consejo: Regirock nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":251},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Iceberg (nivel 70). Cómo: Ruinas Iceberg. Consejo: Regice nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":252},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Hierro (nivel 70). Cómo: Ruinas Hierro. Consejo: Registeel nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":253},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice, Registeel, Regieleki y Regidrago en el equipo. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 100). Cómo: Nido Dinamax rodeado de cuatro piedras en el Lecho del Gigante: incursión especial. Consejo: Regigigas nivel 100. Con Pokekeep: El Regi que no elegiste en las Ruinas del Dilema, añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Mar Gélido (Nieves de la Corona) (nivel 70). Cómo: Encuentra 50 huellas de Cobalion por la Corona; después te espera en el Mar Gélido. Consejo: Cobalion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Gruta del Lago (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Terrakion; luego, en la Gruta del Lago. Consejo: Terrakion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":271},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Virizion; luego, en el Lecho del Gigante. Consejo: Virizion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":272},{"id":"pokemon-647","label":"Registrar a Keldeo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":647,"auto":null,"how":"Cuándo: Con Cobalion, Terrakion y Virizion en el equipo. Dónde: Lago Bolaguna (Nieves de la Corona) (nivel 65). Cómo: Lago Bolaguna: prepara un curri en la isla de la olla y Keldeo aparece. Consejo: Keldeo nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"league-card-stars","label":"Siete estrellas en la Tarjeta de Liga","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: a lo largo de toda la partida; las dos últimas estrellas, al terminar las historias de los dos DLC del Pase de expansión. Dónde: la tarjeta de liga se consulta en el menú y se rehace en la Rotomi de cualquier Centro Pokémon. Paso a paso: 1) Empieza la aventura: primera estrella. 2) Consigue la Medalla Agua. 3) Consigue la Medalla Lucha en Espada o la Medalla Fantasma en Escudo. 4) Consigue la Medalla Siniestro. 5) Supera la Liga Pokémon (Copa de Campeones, en el Estadio de Puntera). 6) Completa la historia del DLC «La isla de la armadura». 7) Completa la historia del DLC «Las nieves de la corona»: séptima estrella. Consejo: a diferencia de las fichas de entrenador antiguas, la tarjeta de liga no cambia de color con las estrellas; si falta alguna, revisa qué paso de la lista no has cumplido. Fuente: WikiDex «Ficha de entrenador» (apartado de Espada y Escudo); Serebii «League Card».","phase":6,"order":620},{"id":"alolan-diglett","label":"Encontrar los 150 Diglett de Alola (Isla de la Armadura)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto llegas a la Isla de la Armadura (DLC «La isla de la armadura» del Pase de expansión). Dónde: toda la Isla de la Armadura; al llegar conoces a un hombre con un Diglett de Alola que ha perdido los suyos. Paso a paso: 1) Habla con él: tenía más de 150 Diglett de Alola y se le han escapado por la isla. 2) Recorre la isla buscando las cabecitas que asoman del suelo y examínalas. 3) Vuelve a hablarle al llegar a cada hito; los regalos son en su mayoría Pokémon de Alola: con 5, Meowth; 10, Slowpoke; 20, Vulpix; 30, Sandshrew; 40, Raichu; 50, Marowak; 75, Exeggutor; con 100, el inicial de Alola que corresponde al tuyo (Grookey: Rowlet; Scorbunny: Litten; Sobble: Popplio). 4) Con los 150 te da un Diglett de Alola. Consejo: el Humedal Frescor (20), el Prado Reverencia (18) y el Llano Entrenamiento (15) son las zonas con más; usa un mapa por zonas. Fuente: Serebii «Diglett Hunting»; WikiDex «Prado Reverencia» y «Diglett de Alola».","fact":"collection.swsh.alolanDiglett","phase":4,"order":400},{"id":"footprints","label":"Huellas de Cobalion, Terrakion y Virizion al 100 % (Nieves de la Corona)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «Las nieves de la corona», al empezar en Villa Helada. Dónde: Nieves de la Corona; Sonia te lo explica junto a una casa de Villa Helada. Paso a paso: 1) Habla con Sonia en Villa Helada para empezar el estudio de huellas. 2) Examina huellas: cada una suma un 2 % y hacen falta 50 de cada especie. Las de Cobalion (azules) están en el Mar Gélido, las Grutas Sonamar y la Encrucijada Tresvías; las de Terrakion (marrones), en la Gruta del Lago, el Lago Bolaguna y la Colina del Maxiárbol; las de Virizion (verdes), en el Campo Bajocero, el Lecho del Gigante y el Viejo Cementerio. 3) Al llegar al 100 %, Sonia te indica dónde está: Cobalion en el Mar Gélido, Terrakion en la Gruta del Lago y Virizion en el Lecho del Gigante (nivel 70). 4) Con los tres capturados y tras contárselo a Sonia, llévalos a la islita del Lago Bolaguna donde hay una olla y prepara un curri: aparece Keldeo. Consejo: hay más de 50 huellas de cada especie y reaparecen, así que no hace falta encontrarlas todas. Fuente: Serebii «Footprints»; WikiDex, nombres de lugares.","fact":"collection.swsh.footprints","phase":4,"order":410},{"id":"dojo-watts","label":"Mejorar el Dojo Maestro al máximo con las donaciones de vatios","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar las pruebas de Mostaz en el Dojo Maestro (DLC «La isla de la armadura» del Pase de expansión). Dónde: Dojo Maestro, en la Isla de la Armadura; habla con Tania, la patrona. Paso a paso: 1) Reúne vatios en el Área Silvestre (guaridas Dinamax, combates de incursión). 2) Habla con Tania y dona vatios; cada mejora se desbloquea al llegar a su cifra: 5.000 (peluquera), 10.000 y 20.000 (Rotomi y su arreglo), 30.000 a 50.000 (máquina de bebidas), 100.000 (ingredientes en la nevera), 200.000 a 400.000 (máquina de vitaminas), 500.000 y 800.000 (fondos para la tarjeta de liga). 3) Con 1.000.000 recibes la tarjeta de liga de Tania y combates contra ella. 4) La última, con 3.280.000 vatios, es un paseo con Tania por la isla en el que te da su tarjeta de liga rara. Son 14 mejoras en total. Consejo: las incursiones en línea agilizan mucho la recogida de vatios. Fuente: WikiDex «Dojo Maestro»; Serebii «Master Dojo Upgrades».","fact":"collection.swsh.dojoWatts","phase":4,"order":405},{"id":"restricted-sparring","label":"Superar los combates restringidos del Dojo Maestro con los 18 tipos","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras superar las pruebas de Mostaz del DLC «La isla de la armadura» (Pase de expansión). Dónde: Dojo Maestro, en la Isla de la Armadura. Paso a paso: 1) Termina las pruebas de Mostaz para desbloquear la prueba ceñida en el dojo. 2) Elige un tipo y tres Pokémon distintos de ese tipo, sin repetir objetos; todos combaten a nivel 50. 3) Gana cinco combates individuales seguidos; los daños y los PP se arrastran de un combate a otro, solo puedes curar dos veces y una derrota termina el intento. 4) Cada victoria da 3 PB y completar los cinco, 30 PB; la primera vez que superas un tipo recibes 30 PB más. 5) Repite con los 18 tipos: al completarlos todos recibes una camiseta especial de Mostaz. Consejo: los rivales llevan Pokémon pensados para contrarrestar el tipo elegido; cubre las debilidades de tu tipo con movimientos y objetos de apoyo, y aprovecha las dos curas. Fuente: WikiDex «Dojo Maestro» (prueba ceñida); Serebii «Restricted Sparring».","fact":"battle.swsh.restrictedSparring","phase":3,"order":315}],"SHIELD":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Resolver crisis posliga con los héroes de Galar y terminar los DLC adquiridos","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: episodio de Tizonio y Dargo (Zacian/Zamazenta), Torre Batalla de Puntera y, con los DLC, la Isla de la Armadura y las Nieves de la Corona.","phase":2,"order":200},{"id":"battle0","label":"Superar Torre Batalla y Torneo Estrellas de Galar si tienes DLC","category":"Combates","tier":1,"species":null,"auto":null,"how":"Torre Batalla (Puntera): sube de rango Poké Ball hasta Master Ball. El Torneo Estrellas de Galar (Nieves de la Corona) se juega en el estadio de Puntera.","phase":3,"order":300},{"id":"items0","label":"Objetos para incursiones, formas y expansión del Pokédex","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Muñequera Dinamax (historia), Gigamaxificación por la sopa máxima (Isla de la Armadura), Riendas Unión (Nieves de la Corona) y la Espada/Escudo oxidados (posliga).","phase":1,"order":120},{"id":"pokedex","label":"Completar Pokédex de Galar y de cada DLC adquirido","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Galar (400) y, con los DLC, las de la Isla de la Armadura y las Nieves de la Corona. El director del juego está en el Hotel Jonia de Pueblo Auriga (última habitación de la izquierda): primero te da el Amuleto Captura y, con la Pokédex de Galar capturada, el diploma y el Amuleto Iris. Con Pokekeep: Las exclusivas de la otra edición, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diplomas de las Pokédex de Galar, Isla de la Armadura y Nieves de la Corona (director del juego, Hotel Jonia de Pueblo Auriga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: el primer amuleto, desde que puedes entrar en Pueblo Auriga; el diploma de Galar, al completar su Pokédex; los de la Isla de la Armadura y las Nieves de la Corona, al completar cada una (requieren el Pase de expansión). Dónde: Hotel Jonia, en la rotonda del centro de Pueblo Auriga; el director del juego está en la habitación más al oeste. Paso a paso: 1) Habla con el director la primera vez: te da el Amuleto Captura. 2) Registra como capturadas todas las especies de la Pokédex de Galar y vuelve a hablarle: entrega el Amuleto Iris, el diploma de Pokédex completa y una marca en la tarjeta de liga. 3) Completa la Pokédex Armadura para su diploma; además, la doctora de la Estación Armadura, en el Prado Reverencia, te da el Amuleto Emblema. 4) Completa la Pokédex Corona para el tercer diploma. Consejo: para las especies exclusivas de la otra versión, usa intercambios en línea. Fuente: WikiDex «Hotel Jonia», «Diploma» y «Amuleto Emblema».","phase":6,"order":612},{"id":"final-boss","label":"Vencer a Morimoto en el Hotel Jonia de Pueblo Auriga: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de ganar la Liga y convertirte en campeón de Galar. Dónde: Hotel Jonia, en Pueblo Auriga; Morimoto, vestido de policía, está en la habitación contigua a la del director del juego. Paso a paso: 1) Termina la historia principal y entra en el hotel. 2) Habla con Morimoto: propone un combate doble. 3) Prepara un equipo de nivel alto: el suyo es de nivel 65 (Cursola, Grapploct, Dragapult, Coalossal, Stonjourner y Snorlax) y dinamaxiza a su Snorlax, así que guarda tu Dinamax para responder. 4) Gánale la primera vez: te entrega el Amuleto Oval, que aumenta la probabilidad de encontrar huevos. 5) Puedes repetir el combate una vez al día. Consejo: en combate doble, Protección ayuda a esperar a que termine el Dinamax de Snorlax. Fuente: WikiDex «Hotel Jonia», «Shigeki Morimoto» y «Amuleto Oval».","phase":3,"order":390},{"id":"pokemon-890","label":"Registrar a Eternatus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":890,"auto":null,"how":"Cuándo: Final de la historia, tras el combate contra el presidente Rose en la Planta Eléctrica. Dónde: Corona de la Torre (nivel 60). Cómo: En la Corona de la Torre: debilítalo en forma normal y captúralo en el combate Dinamax infinito (captura asegurada). Consejo: Eternatus nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":195},{"id":"pokemon-889","label":"Registrar a Zamazenta en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":889,"auto":null,"how":"Cuándo: Después de ser campeón, al terminar el episodio de Tizonio y Dargo. Dónde: Corona de la Torre (nivel 70). Cómo: Tras perseguir a Tizonio y Dargo por los estadios de Galar, el episodio termina en la Corona de la Torre de la Planta Eléctrica, donde el legendario de tu edición se deja capturar. Consejo: Nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"medal-type","label":"Amuleto Iris al completar la Pokédex de Galar (Pueblo Auriga)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto tengas registradas como capturadas todas las especies de la Pokédex de Galar (normalmente después de la Liga). Dónde: Hotel Jonia, en Pueblo Auriga. Paso a paso: 1) Abre la Pokédex de Galar y comprueba que las 400 especies figuran como capturadas, no solo vistas. 2) Las exclusivas de la otra versión (Espada o Escudo) consíguelas por intercambio en línea o en las incursiones Dinamax. 3) Evoluciona lo que haga falta, incluidas las evoluciones por intercambio. 4) Ve al Hotel Jonia y habla con el director del juego en la habitación más al oeste (antes tiene que haberte dado el Amuleto Captura): entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor, junto con el diploma. Las Pokédex Armadura y Corona de los DLC van aparte y tienen sus propios diplomas. Consejo: en el mismo hotel, Morimoto da el Amuleto Oval; aprovecha la visita. Fuente: WikiDex «Hotel Jonia» y «Amuleto Iris».","phase":6,"order":617},{"id":"event-0","label":"Zarude y otros singulares: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Zarude y otros singulares solo llegaron por distribución. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"DLC: capturas de Calyrex, Galarian birds y Regis; elecciones mutuamente excluyentes","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Elecciones excluyentes del DLC: Glastrier o Spectrier, Regieleki o Regidrago, Urshifu brusco o fluido. Solo se puede obtener uno de cada pareja por partida. Con Pokekeep: Añade el que no elegiste legal desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Torre Batalla (nivel 50, regalo). Cómo: Una empleada de la Torre Batalla (Puntera) te lo da. Consejo: Código Cero nivel 50, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-803","label":"Registrar a Poipole en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":803,"auto":null,"how":"Cuándo: Nieves de la Corona: tras completar 5 Aventuras Dinamax contra ultraentes. Dónde: Supernido Dinamax (nivel 20, regalo). Cómo: Un científico del Supernido Dinamax te da a Poipole. Consejo: Poipole nivel 20, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":280},{"id":"pokemon-891","label":"Registrar a Kubfu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":891,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): tras superar las tres pruebas de Mostaza. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Mostaza te da a Kubfu en el Dojo Maestro. Consejo: Kubfu nivel 10, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-892","label":"Registrar a Urshifu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":892,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): con Kubfu de amigo. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Supera la Torre de las Sombras (estilo brusco) o la Torre de las Aguas (estilo fluido) con Kubfu y examina el manuscrito: evoluciona a Urshifu. Consejo: El estilo es excluyente: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-898","label":"Registrar a Calyrex en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":898,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), siendo ya campeón. Dónde: Templo Corona (Nieves de la Corona) (nivel 80). Cómo: Sigue la historia de Calyrex: planta la zanahoria (Glastrier o Spectrier), atrapa al corcel y lleva a Calyrex al Templo Corona. Consejo: Calyrex nivel 80, montado en el corcel elegido. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-896","label":"Registrar a Glastrier en la Pokédex de esta partida (Glastrier y Spectrier son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":896,"auto":null,"how":"Cuándo: Nieves de la Corona: si plantas la zanahoria en el Desfiladero Nevado. Dónde: Templo Corona (Nieves de la Corona) (nivel 75). Cómo: Capturas a Calyrex jinete glacial; sepáralos con las Riendas Unión. Consejo: Glastrier y Spectrier son excluyentes: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-897","label":"Registrar a Spectrier en la Pokédex de esta partida (Glastrier y Spectrier son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":897,"auto":null,"how":"Cuándo: Nieves de la Corona: si plantas la zanahoria en el Viejo Cementerio. Dónde: Templo Corona (Nieves de la Corona) (nivel 75). Cómo: Capturas a Calyrex jinete espectral; sepáralos con las Riendas Unión. Consejo: Excluyente con Glastrier: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":241},{"id":"pokemon-894","label":"Registrar a Regieleki en la Pokédex de esta partida (Regieleki y Regidrago son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":894,"auto":null,"how":"Cuándo: Nieves de la Corona: tras la segunda pista legendaria de Peony. Dónde: Ruinas del Dilema (nivel 70). Cómo: Ruinas del Dilema: elige Regieleki (huellas eléctricas). Es excluyente con Regidrago. Consejo: Regieleki nivel 70; el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-895","label":"Registrar a Regidrago en la Pokédex de esta partida (Regieleki y Regidrago son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":895,"auto":null,"how":"Cuándo: Nieves de la Corona: tras la segunda pista legendaria de Peony. Dónde: Ruinas del Dilema (nivel 70). Cómo: Ruinas del Dilema: elige Regidrago. Es excluyente con Regieleki. Consejo: Regidrago nivel 70; el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Pico Roca (nivel 70). Cómo: Ruinas Pico Roca: abre la puerta resolviendo la inscripción. Consejo: Regirock nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":251},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Iceberg (nivel 70). Cómo: Ruinas Iceberg. Consejo: Regice nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":252},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Hierro (nivel 70). Cómo: Ruinas Hierro. Consejo: Registeel nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":253},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice, Registeel, Regieleki y Regidrago en el equipo. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 100). Cómo: Nido Dinamax rodeado de cuatro piedras en el Lecho del Gigante: incursión especial. Consejo: Regigigas nivel 100. Con Pokekeep: El Regi que no elegiste en las Ruinas del Dilema, añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Mar Gélido (Nieves de la Corona) (nivel 70). Cómo: Encuentra 50 huellas de Cobalion por la Corona; después te espera en el Mar Gélido. Consejo: Cobalion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Gruta del Lago (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Terrakion; luego, en la Gruta del Lago. Consejo: Terrakion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":271},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Virizion; luego, en el Lecho del Gigante. Consejo: Virizion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":272},{"id":"pokemon-647","label":"Registrar a Keldeo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":647,"auto":null,"how":"Cuándo: Con Cobalion, Terrakion y Virizion en el equipo. Dónde: Lago Bolaguna (Nieves de la Corona) (nivel 65). Cómo: Lago Bolaguna: prepara un curri en la isla de la olla y Keldeo aparece. Consejo: Keldeo nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"league-card-stars","label":"Siete estrellas en la Tarjeta de Liga","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: a lo largo de toda la partida; las dos últimas estrellas, al terminar las historias de los dos DLC del Pase de expansión. Dónde: la tarjeta de liga se consulta en el menú y se rehace en la Rotomi de cualquier Centro Pokémon. Paso a paso: 1) Empieza la aventura: primera estrella. 2) Consigue la Medalla Agua. 3) Consigue la Medalla Lucha en Espada o la Medalla Fantasma en Escudo. 4) Consigue la Medalla Siniestro. 5) Supera la Liga Pokémon (Copa de Campeones, en el Estadio de Puntera). 6) Completa la historia del DLC «La isla de la armadura». 7) Completa la historia del DLC «Las nieves de la corona»: séptima estrella. Consejo: a diferencia de las fichas de entrenador antiguas, la tarjeta de liga no cambia de color con las estrellas; si falta alguna, revisa qué paso de la lista no has cumplido. Fuente: WikiDex «Ficha de entrenador» (apartado de Espada y Escudo); Serebii «League Card».","phase":6,"order":620},{"id":"alolan-diglett","label":"Encontrar los 150 Diglett de Alola (Isla de la Armadura)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto llegas a la Isla de la Armadura (DLC «La isla de la armadura» del Pase de expansión). Dónde: toda la Isla de la Armadura; al llegar conoces a un hombre con un Diglett de Alola que ha perdido los suyos. Paso a paso: 1) Habla con él: tenía más de 150 Diglett de Alola y se le han escapado por la isla. 2) Recorre la isla buscando las cabecitas que asoman del suelo y examínalas. 3) Vuelve a hablarle al llegar a cada hito; los regalos son en su mayoría Pokémon de Alola: con 5, Meowth; 10, Slowpoke; 20, Vulpix; 30, Sandshrew; 40, Raichu; 50, Marowak; 75, Exeggutor; con 100, el inicial de Alola que corresponde al tuyo (Grookey: Rowlet; Scorbunny: Litten; Sobble: Popplio). 4) Con los 150 te da un Diglett de Alola. Consejo: el Humedal Frescor (20), el Prado Reverencia (18) y el Llano Entrenamiento (15) son las zonas con más; usa un mapa por zonas. Fuente: Serebii «Diglett Hunting»; WikiDex «Prado Reverencia» y «Diglett de Alola».","fact":"collection.swsh.alolanDiglett","phase":4,"order":400},{"id":"footprints","label":"Huellas de Cobalion, Terrakion y Virizion al 100 % (Nieves de la Corona)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: durante la historia del DLC «Las nieves de la corona», al empezar en Villa Helada. Dónde: Nieves de la Corona; Sonia te lo explica junto a una casa de Villa Helada. Paso a paso: 1) Habla con Sonia en Villa Helada para empezar el estudio de huellas. 2) Examina huellas: cada una suma un 2 % y hacen falta 50 de cada especie. Las de Cobalion (azules) están en el Mar Gélido, las Grutas Sonamar y la Encrucijada Tresvías; las de Terrakion (marrones), en la Gruta del Lago, el Lago Bolaguna y la Colina del Maxiárbol; las de Virizion (verdes), en el Campo Bajocero, el Lecho del Gigante y el Viejo Cementerio. 3) Al llegar al 100 %, Sonia te indica dónde está: Cobalion en el Mar Gélido, Terrakion en la Gruta del Lago y Virizion en el Lecho del Gigante (nivel 70). 4) Con los tres capturados y tras contárselo a Sonia, llévalos a la islita del Lago Bolaguna donde hay una olla y prepara un curri: aparece Keldeo. Consejo: hay más de 50 huellas de cada especie y reaparecen, así que no hace falta encontrarlas todas. Fuente: Serebii «Footprints»; WikiDex, nombres de lugares.","fact":"collection.swsh.footprints","phase":4,"order":410},{"id":"dojo-watts","label":"Mejorar el Dojo Maestro al máximo con las donaciones de vatios","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar las pruebas de Mostaz en el Dojo Maestro (DLC «La isla de la armadura» del Pase de expansión). Dónde: Dojo Maestro, en la Isla de la Armadura; habla con Tania, la patrona. Paso a paso: 1) Reúne vatios en el Área Silvestre (guaridas Dinamax, combates de incursión). 2) Habla con Tania y dona vatios; cada mejora se desbloquea al llegar a su cifra: 5.000 (peluquera), 10.000 y 20.000 (Rotomi y su arreglo), 30.000 a 50.000 (máquina de bebidas), 100.000 (ingredientes en la nevera), 200.000 a 400.000 (máquina de vitaminas), 500.000 y 800.000 (fondos para la tarjeta de liga). 3) Con 1.000.000 recibes la tarjeta de liga de Tania y combates contra ella. 4) La última, con 3.280.000 vatios, es un paseo con Tania por la isla en el que te da su tarjeta de liga rara. Son 14 mejoras en total. Consejo: las incursiones en línea agilizan mucho la recogida de vatios. Fuente: WikiDex «Dojo Maestro»; Serebii «Master Dojo Upgrades».","fact":"collection.swsh.dojoWatts","phase":4,"order":405},{"id":"restricted-sparring","label":"Superar los combates restringidos del Dojo Maestro con los 18 tipos","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: tras superar las pruebas de Mostaz del DLC «La isla de la armadura» (Pase de expansión). Dónde: Dojo Maestro, en la Isla de la Armadura. Paso a paso: 1) Termina las pruebas de Mostaz para desbloquear la prueba ceñida en el dojo. 2) Elige un tipo y tres Pokémon distintos de ese tipo, sin repetir objetos; todos combaten a nivel 50. 3) Gana cinco combates individuales seguidos; los daños y los PP se arrastran de un combate a otro, solo puedes curar dos veces y una derrota termina el intento. 4) Cada victoria da 3 PB y completar los cinco, 30 PB; la primera vez que superas un tipo recibes 30 PB más. 5) Repite con los 18 tipos: al completarlos todos recibes una camiseta especial de Mostaz. Consejo: los rivales llevan Pokémon pensados para contrarrestar el tipo elegido; cubre las debilidades de tu tipo con movimientos y objetos de apoyo, y aprovecha las dos curas. Fuente: WikiDex «Dojo Maestro» (prueba ceñida); Serebii «Restricted Sparring».","fact":"battle.swsh.restrictedSparring","phase":3,"order":315}],"BD":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Desbloquear Parque Hansa, áreas posliga y encuentros legendarios","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga: Pokédex Nacional, Parque Hansa (Ruta 221) con los legendarios de otras regiones, Zona de Combate, Heatran, Giratina, Cresselia y Regigigas.","phase":2,"order":200},{"id":"battle0","label":"Vencer al As de la Torre Batalla en la Zona de Combate","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de entrar en el Hall de la Fama, cuando se abre la Zona Combate. Dónde: Torre Batalla, en la Zona Combate. Paso a paso: 1) Prepara tres Pokémon (los que pasen de nivel 50 bajan a 50 durante el combate) y entra en la Clase Normal de combates individuales. 2) Gana 20 combates seguidos: en el 21 te reta el Amo Torre Jericor. 3) Derrótale para ganar Puntos de Batalla. 4) Sigue la racha: en el combate 49 Jericor vuelve con un equipo más fuerte; ganar 49 seguidos abre la Clase Experto, donde también puedes enfrentarte a él. 5) Para la estrella de la ficha de entrenador hacen falta 100 victorias seguidas. Las rachas individual y doble se cuentan por separado. Consejo: su segundo equipo incluye Pokémon legendarios (Heatran, Regigigas, Cresselia); lleva Pokémon capaces de plantarles cara. Fuente: WikiDex «Torre Batalla (Sinnoh/Johto)» y «Jericor».","phase":3,"order":300},{"id":"items0","label":"Losas del Parque Hansa: activar los pedestales de las 11 salas de legendarios (la última da la Griseosfera)","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon y conseguir la Pokédex Nacional. Dónde: Parque Hansa, en la Ruta 221 (exclusivo de Diamante Brillante y Perla Reluciente); los fragmentos para las losas se excavan en las Grutas del Subsuelo. Paso a paso: 1) Excava en las Grutas del Subsuelo para reunir Fragmentos Extraños: cada losa cuesta 3 de tamaño S o 1 de tamaño L. 2) Canjéalos por losas en el Parque Hansa; se desbloquean en orden, empezando por la Sala del Inicio (Regirock, Regice y Registeel). 3) Coloca cada losa en el pedestal de su sala: Kanto, Genética, Johto, Arcoíris, Tormenta, Inicio, Empatía, Mar, Tierra, Cielo y Distorsión; aparece el legendario correspondiente. Algunas salas dependen de la versión. 4) Para la Sala de la Distorsión, captura antes a Regirock, Regice, Registeel y al Giratina de la Cueva Retorno, y canjea la Losa Distorsión. 5) Vence al Giratina forma origen oscuro de nivel 100 que aparece (no se puede capturar): te da la Griseosfera. Consejo: guarda antes de colocar cada losa por si quieres reintentar la captura. Fuente: WikiDex «Parque Hansa», «Losa Distorsión» y «Sala de la Distorsión»; Serebii «Ramanas Park».","phase":1,"order":150},{"id":"pokedex","label":"Completar Pokédex Nacional con exclusiones del juego","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional del juego. Muchas especies están en el Gran Subsuelo (grutas Pokémon) y en el Parque Hansa. Con Pokekeep: Las exclusivas o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Sinnoh (director del juego, Hotel Gran Lago, Orilla Valor)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Sinnoh completa, el director del juego en el Hotel Gran Lago (Orilla Valor) te da el diploma.","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), el mismo director del Hotel Gran Lago.","phase":6,"order":605},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (sin singulares), el director del Hotel Gran Lago te da el Amuleto Iris.","phase":6,"order":610},{"id":"final-boss-cynthia","label":"Vencer a Cintia en las revanchas de la Liga de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de entrar en el Hall de la Fama. Dónde: Liga Pokémon de Sinnoh. Paso a paso: 1) Consigue la Pokédex Nacional: el Alto Mando sube de nivel y Cintia pasa a usar su equipo de revancha (niveles 74 a 78, con Garchomp a 78). 2) Vuelve a la Liga, vence a los cuatro miembros del Alto Mando y luego a Cintia. 3) Para sus equipos más fuertes, vence esa revancha y captura a Heatran: a partir de entonces las revanchas suben de nivel (Cintia, 84 a 88) y añaden Pokémon de la Pokédex Nacional. 4) Vuelve a la Liga y gana de nuevo a todos, Cintia incluida. Consejo: su Garchomp es el núcleo del equipo; lleva ataques de tipo Hielo o Hada y algo que resista Terremoto. Fuente: WikiDex «Cintia» y «Liga Pokémon (Sinnoh)»; Serebii «Elite Four» de Diamante Brillante y Perla Reluciente.","phase":3,"order":380},{"id":"final-boss","label":"Vencer a Morimoto en la piscina del Hotel Gran Lago: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon. Dónde: piscina del Hotel Gran Lago, entre la Ruta 213 y la Orilla Valor. Paso a paso: 1) Termina la Liga Pokémon. 2) Ve al Hotel Gran Lago y entra en la zona de la piscina: allí está Morimoto. 3) Háblale para combatir; su equipo es de nivel 63 a 65: Spiritomb, Ambipom, Hippowdon, Vaporeon, Jolteon y Flareon. 4) La primera victoria te da el Amuleto Oval, que aumenta la probabilidad de encontrar huevos en la guardería. 5) Puedes repetir el combate una vez al día. Consejo: Spiritomb lleva Baya Zidra y Mismo Destino; un Pokémon de tipo Hada fuerte encaja bien contra él, y conviene no dejarlo para el final con tu último Pokémon. Fuente: WikiDex «Shigeki Morimoto», «Amuleto Oval» y «Hotel Gran Lago».","phase":3,"order":390},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza (fin de la historia del Equipo Galaxia). Dónde: Lago Agudeza (Caverna Agudeza) (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza (al norte de Ciudad Puntaneva). Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza: visita la Caverna Veraz del Lago Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj y usa Mal de Ojo o la Master Ball. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza. Dónde: Lago Valor (Caverna Valor) (nivel 50). Cómo: Caverna Valor, en el Lago Valor (Surf). Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en la Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (4) (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (03) (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (6) (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-483","label":"Registrar a Dialga en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":483,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columnas Lanza (nivel 47). Cómo: Columnas Lanza: tras vencer a los comandantes y a Helio, Dialga aparece. Consejo: Dialga nivel 47. Si lo debilitas, vuelve tras la Liga; guarda antes. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Un Superconcurso rango Maestro (sin categoría especial)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por ganar un Superconcurso de rango Maestro en cualquier categoría (Sala de Concursos de Ciudad Corazón).","phase":6,"order":620},{"id":"card-3","label":"100 variantes de estatua en Gran Subsuelo","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por colocar 100 variantes de estatua en tu base secreta del Gran Subsuelo (las estatuas se excavan en las paredes del Subsuelo).","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: después de la Liga, cuando la ficha de entrenador llega a sus cinco estrellas (color negro). Dónde: cualquier Centro Pokémon de Sinnoh. Paso a paso: 1) Sube estrellas en la ficha de entrenador; cada una se gana con un logro y en cualquier orden: completar la Liga Pokémon, ganar una Gala Superconcurso de nivel experto de cualquier categoría, completar la Pokédex Nacional (482 Pokémon, sin contar los singulares y algunos legendarios), conseguir 100 victorias en la Torre Batalla y conseguir 100 estatuas diferentes en las Grutas del Subsuelo. 2) Consulta la ficha de entrenador: cambia a bronce, plata, oro y negro con las estrellas. 3) Con las cinco, entra en un Centro Pokémon: la enfermera Joy se sorprende al ver tu ficha y desde entonces cura a tu equipo sin decir nada (salvo si detecta Pokérus). Consejo: la Torre Batalla y las estatuas del Subsuelo son lo más largo; empieza por ellas tras la Liga. Fuente: WikiDex «Ficha de entrenador».","phase":6,"order":690},{"id":"event-0","label":"Darkrai, Shaymin y Arceus: eventos/objetos y partidas compatibles según requisitos","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Darkrai (Isla Lunanueva, Carné Socio), Shaymin (Paraíso Flor, Carta de Oak) y Arceus (Columnas Lanza, Flauta Azur) piden objetos de evento o tener partidas de Espada/Escudo y Leyendas Arceus en la consola. Con Pokekeep: Añade el objeto clave del evento (Carné Socio, Carta de Oak o Flauta Azur) para jugarlo, o el singular legal desde la Librería.","phase":7,"order":700}],"SP":[{"id":"story
