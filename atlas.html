emon-144","label":"Registrar a Articuno en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":144,"auto":null,"how":"Cuándo: Durante la historia, con Surfeo Marino y Empuje Fuerte. Dónde: Islas Espuma (nivel 50). Cómo: Islas Espuma (Ruta 20): baja hasta la zona inferior. Consejo: Articuno nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-145","label":"Registrar a Zapdos en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":145,"auto":null,"how":"Cuándo: Durante la historia, cuando puedas surfear (Surfeo Marino). Dónde: Central de Energía (nivel 50). Cómo: Central de Energía (Ruta 10): Zapdos espera al fondo. Consejo: Zapdos nivel 50; es un combate largo con captura, como los legendarios del juego. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":150},{"id":"pokemon-146","label":"Registrar a Moltres en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":146,"auto":null,"how":"Cuándo: Durante la historia, camino de la Liga. Dónde: Calle Victoria (nivel 50). Cómo: Calle Victoria: Moltres está en el interior de la cueva. Consejo: Moltres nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":170},{"id":"pokemon-150","label":"Registrar a Mewtwo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":150,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Cueva Celeste (nivel 70). Cómo: Cueva Celeste (Ciudad Celeste): baja hasta el fondo. Consejo: Mewtwo nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":250},{"id":"medal-type","label":"Título de Gran Maestro: todos los títulos de Entrenador Experto (habla con la señora de las oficinas de GAME FREAK en Ciudad Azulona)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cada Entrenador Experto te reta a un combate de uno contra uno con su misma especie, sin , regalo). Cómo: Un científico del Supernido Dinamax te da a Poipole. Consejo: Poipole nivel 20, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":280},{"id":"pokemon-891","label":"Registrar a Kubfu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":891,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): tras superar las tres pruebas de Mostaza. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Mostaza te da a Kubfu en el Dojo Maestro. Consejo: Kubfu nivel 10, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-892","label":"Registrar a Urshifu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":892,"auto":null,"how":"Cuándo: Isla de la Armadura (DLC): con Kubfu de amigo. Dónde: Dojo Maestro (nivel 10, regalo). Cómo: Supera la Torre de las Sombras (estilo brusco) o la Torre de las Aguas (estilo fluido) con Kubfu y examina el manuscrito: evoluciona a Urshifu. Consejo: El estilo es excluyente: el otro, desde la Librería con Pokekeep. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":231},{"id":"pokemon-898","label":"Registrar a Calyrex en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":898,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), siendo ya campeón. Dónde: Templo Corona (Nieves de la Corona) (nivel 80). Cómo: Sigue la historia de Calyrex: planta la zanahoria (Glastrier o Spectrier), atrapa al corcel y lleva a Calyrex al Templo Corona. Consejo: Calyrex nivel 80, montado en el corcel elegido. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-896","label":"Registrar a Glastrier en la Pokédex de esta partida (Glastrier y Spectrier son excluyentes: el otro llega por intercambio)","category":"Legendarios","tier":1,"species":896,"auto":null,"how":"Cuándo: Nieves de la Corona: si plantas la zanahoria en el Desfiladero Nevado. Dónde: Templo C uto":null,"how":"Cuándo: Nieves de la Corona, segunda pista de Peony. Dónde: Ruinas Hierro (nivel 70). Cómo: Ruinas Hierro. Consejo: Registeel nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":253},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice, Registeel, Regieleki y Regidrago en el equipo. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 100). Cómo: Nido Dinamax rodeado de cuatro piedras en el Lecho del Gigante: incursión especial. Consejo: Regigigas nivel 100. Con Pokekeep: El Regi que no elegiste en las Ruinas del Dilema, añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-638","label":"Registrar a Cobalion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":638,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Mar Gélido (Nieves de la Corona) (nivel 70). Cómo: Encuentra 50 huellas de Cobalion por la Corona; después te espera en el Mar Gélido. Consejo: Cobalion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":270},{"id":"pokemon-639","label":"Registrar a Terrakion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":639,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Gruta del Lago (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Terrakion; luego, en la Gruta del Lago. Consejo: Terrakion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":271},{"id":"pokemon-640","label":"Registrar a Virizion en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":640,"auto":null,"how":"Cuándo: Nieves de la Corona (DLC), en cualquier momento de la expedición. Dónde: Lecho del Gigante (Nieves de la Corona) (nivel 70). Cómo: 50 huellas de Virizion; luego, en el Lecho del Gigante. Consejo: Virizion nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":272},{"id":"pokemon-647","label":"Registrar a Keldeo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":647,"auto":null,"how":"Cuándo: Con Cobalion, Terrakion y Virizion en el equipo. Dónde: Lago Bolaguna (Nieves de la Corona) (nivel 65). Cómo: Lago Bolaguna: prepara un curri en la isla de la olla y Keldeo aparece. Consejo: Keldeo nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":275},{"id":"league-card-stars","label":"Siete estrellas en la Tarjeta de Liga","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Empezar la aventura; medallas Agua, Lucha (Espada) o Fantasma (Escudo) y Siniestro; ganar la Liga; terminar La isla de la armadura y Las nieves de la corona. Fuente: WikiDex (Ficha de entrenador). Se acredita con el fin de la historia y de los dos DLC que guarda la partida (FSYS_GAME_CLEAR, FSYS_R1_GAME_CLEAR y FSYS_R2_GAME_CLEAR); las medallas van implícitas en ganar la Liga."},{"id":"alolan-diglett","label":"Encontrar los 150 Diglett de Alola (Isla de la Armadura)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Premios a los 5, 10, 20… y 150 Diglett. El guardado lo registra (KAlolanDiglettFound). Fuente: Serebii (Diglett Hunting).","fact":"collection.swsh.alolanDiglett"},{"id":"footprints","label":"Huellas de Cobalion, Terrakion y Virizion al 100 % (Nieves de la Corona)","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cada huella da un 2 %: 50 por especie. Después Sonia indica dónde está cada uno y aparece Keldeo. El guardado lo registra (KFootprintPercentage). Fuente: Serebii (Footprint Hunting).","fact":"collection.swsh.footprints"},{"id":"dojo-watts","label":"Mejorar el Dojo Maestro con las 15 donaciones de vatios","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"El guardado lleva la cuenta (KDojoWattDonationProgress; 15 = completo). Fuente: Serebii (Master Dojo Upgrades).","fact":"collection.swsh.dojoWatts"},{"id":"restricted-sparring","label":"Superar los combates restringidos del Dojo («Restricted Sparring») con los 18 tipos","category":"Combates","tier":1,"species":null,"auto":null,"how":"El guardado registra los tipos superados (KRecordSparringTypesCleared). Fuente: Serebii (Restricted Sparring).","fact":"battle.swsh.restrictedSparring"}],"BD":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Desbloquear Parque Hansa, áreas posliga y encuentros legendarios","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras la Liga: Pokédex Nacional, Parque Hansa (Ruta 221) con los legendarios de otras regiones, Zona de Combate, Heatran, Giratina, Cresselia y Regigigas.","phase":2,"order":200},{"id":"battle0","label":"Vencer al As de la Torre Batalla en el Zona de Combate","category":"Combates","tier":1,"species":null,"auto":null,"how":"En la Torre Batalla, el As aparece en las rachas 21 y 49 de la modalidad individual. La partida marca la victoria con FE_TOWER_MASTER_WINED (índice 1426 de EvWork.FLAG_INDEX, uDPR). La estrella de la tarjeta pide además 100 victorias seguidas."},{"id":"items0","label":"Losas del Parque Hansa: activar los pedestales de las 11 salas de legendarios (la última da la Griseosfera)","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"En el Gran Subsuelo, tras la Liga, cada sala del Parque Hansa (Kanto, Genética, Johto, Arcoíris, Tormenta, Inicio, Empatía, Mar, Tierra, Cielo y Distorsión) tiene pedestales donde se colocan losas para que aparezca un legendario. Vencer a Giratina en la Sala de la Distorsión da la Griseosfera, que se acredita si está en la bolsa. Fuente: WikiDex «Parque Hansa»."},{"id":"pokedex","label":"Completar Pokédex Nacional con exclusiones del juego","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex Nacional del juego. Muchas especies están en el Gran Subsuelo (grutas Pokémon) y en el Parque Hansa. Con Pokekeep: Las exclusivas o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Sinnoh (director del juego, Hotel Gran Lago, Orilla Valor)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Sinnoh completa, el director del juego en el Hotel Gran Lago (Orilla Valor) te da el diploma.","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin singulares de evento), el mismo director del Hotel Gran Lago.","phase":6,"order":605},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada sin singulares (director del juego, Hotel Gran Lago)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (sin singulares), el director del Hotel Gran Lago te da el Amuleto Iris.","phase":6,"order":610},{"id":"final-boss-cynthia","label":"Vencer a Cintia en las revanchas de la Liga de Sinnoh","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras el Hall de la Fama, al volver a la Liga Cintia usa un equipo de revancha y otro aún más fuerte en las sucesivas; también aparece en la Torre Batalla. Fuente: WikiDex «Cintia». La partida guarda la victoria de la revancha con FE_C10R0111_LEAGUE2_CHAMP_WIN (índice 1713 de EvWork.FLAG_INDEX, uDPR)."},{"id":"final-boss","label":"Vencer a Morimoto en la piscina del Hotel Gran Lago: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras ser campeón; la primera victoria da el Amuleto Oval (WikiDex «Amuleto Oval» y «Shigeki Morimoto»)."},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza (fin de la historia del Equipo Galaxia). Dónde: Lago Agudeza (Caverna Agudeza) (nivel 50). Cómo: Caverna Agudeza, en el Lago Agudeza (al norte de Ciudad Puntaneva). Consejo: Uxie nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":481,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza: visita la Caverna Veraz del Lago Veraz. Dónde: errante por la región (nivel 50). Cómo: Mesprit huye y vaga por Sinnoh: síguelo con el marcamapa del Pokéreloj y usa Mal de Ojo o la Master Ball. Consejo: Mesprit nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":192},{"id":"pokemon-482","label":"Registrar a Azelf en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":482,"auto":null,"how":"Cuándo: Tras el combate de la Columna Lanza. Dónde: Lago Valor (Caverna Valor) (nivel 50). Cómo: Caverna Valor, en el Lago Valor (Surf). Consejo: Azelf nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":191},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Posliga, en el Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (4) (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (03) (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (6) (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-483","label":"Registrar a Dialga en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":483,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columnas Lanza (nivel 47). Cómo: Columnas Lanza: tras vencer a los comandantes y a Helio, Dialga aparece. Consejo: Dialga nivel 47. Si lo debilitas, vuel null,"how":"Cuándo: Posliga, en el Zona de Combate (requiere la Pokédex Nacional). Dónde: Montaña Dura (4) (nivel 70). Cómo: Acompaña a Bulgur por la Montaña Dura hasta el fondo; al terminar su exploración, Heatran aparece. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Con la Pokédex Nacional. Dónde: Cueva Retorno (03) (nivel 70). Cómo: Cueva Retorno, al final del Sendero Primavera (Ruta 214): Giratina aparece al llegar a la última sala. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Posliga: tras el sueño del hijo del marinero de Ciudad Canal. Dónde: errante por la región (nivel 50). Cómo: Viaja a la Isla Plenilunio; Cresselia huye y vaga por Sinnoh. Síguelo con el marcamapa. Consejo: Cresselia nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Con Regirock, Regice y Registeel en el equipo (traídos al Parque Compi). Dónde: Templo Puntaneva (6) (nivel 70). Cómo: Templo Puntaneva, en Ciudad Puntaneva: baja hasta la última sala con los tres Regis. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-484","label":"Registrar a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Final de la historia del Equipo Galaxia, en la cima del Monte Corona. Dónde: Columnas Lanza (2) (nivel 47). Cómo: Columna Lanza: tras vencer a los comandantes y a Helio, Palkia aparece. Consejo: Palkia nivel 47. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Pokédex Nacional según exclusiones","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por la Pokédex Nacional completa (sin singulares de evento): la misma condición que el diploma Nacional del juego.","phase":6,"order":610},{"id":"card-2","label":"Un Superconcurso rango Maestro (sin categoría especial)","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por ganar un Superconcurso de rango Maestro en cualquier categoría (Sala de Concursos de Ciudad Corazón).","phase":6,"order":620},{"id":"card-3","label":"100 variantes de estatua en Gran Subsuelo","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por colocar 100 variantes de estatua en tu base secreta del Gran Subsuelo (las estatuas se excavan en las paredes del Subsuelo).","phase":6,"order":630},{"id":"card-4","label":"100 rivales consecutivos en Torre Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por 100 victorias seguidas en la Torre Batalla (tras la Liga), en cualquier modalidad; el As de la Torre aparece en las rachas 21 y 49.","phase":6,"order":640},{"id":"nurse-gold","label":"La enfermera del Centro Pokémon te reconoce por la tarjeta al máximo y cura sin preguntar","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la ficha de entrenador al máximo, la enfermera cura sin preguntar. La partida guarda la primera vez con FE_PC_GOLD (índice 68 de EvWork.FLAG_INDEX, uDPR). Fuente: WikiDex «Ficha de entrenador»."},{"id":"event-0","label":"Darkrai, Shaymin y Arceus: eventos/objetos y partidas compatibles según requisitos","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Darkrai (Isla Lunanueva, Carné Socio), Shaymin (Paraíso Flor, Carta de Oak) y Arceus (Columnas Lanza, Flauta Azur) piden objetos de evento o tener partidas de Espada/Escudo y Leyendas Arceus en la consola. Con Pokekeep: Añade el objeto clave del evento (Carné Socio, Carta de Oak o Flauta Azur) para jugarlo, o el singular legal desde la Librería.","phase":7,"order":700}],"ARCEUS":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar solicitudes y la investigación final del Pokémon Alfa","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras los créditos: encomiendas de las tablas (Heatran, Cresselia, Regigigas…), peticiones finales (Giratina, avatares de Hisui con Enamorus) e investigación de Arceus.","phase":2,"order":200},{"id":"battle0","label":"Derrotar a Volus y superar desafíos de combate posteriores","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras los créditos, la encomienda final con Volus en el Templo de Sinnoh: véncelo a él y a Giratina.","phase":3,"order":300},{"id":"items0","label":"Tabla de Arceus y objetos únicos del conflicto Dialga/Palkia","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Las tablas de Arceus se consiguen en las encomiendas posteriores a los créditos; las placas de cada señor y los objetos de Dialga/Palkia, durante la historia.","phase":1,"order":120},{"id":"pokedex","label":"Completar la Pokédex de Hisui y alcanzar las condiciones de Arceus","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Registra todas las especies de la Pokédex de Hisui y completa sus tareas de investigación; con todo capturado, Arceus te espera en el Templo de Sinnoh.","phase":5,"order":500},{"id":"pokemon-483","label":"Registrar a Dialga en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":483,"auto":null,"how":"Cuándo: Encomienda 17 de la historia (si apoyas al Clan Diamante) o la 18. Dónde: Templo de Sinnoh (nivel 65). Cómo: Templo de Sinnoh, en el Monte Corona. Consejo: Dialga nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"pokemon-484","label":"Registrar a Palkia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":484,"auto":null,"how":"Cuándo: Encomienda 17 de la historia (si apoyas al Clan Perla) o la 18. Dónde: Templo de Sinnoh (nivel 65). Cómo: Templo de Sinnoh, en el Monte Corona. Consejo: Palkia nivel 65. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":180},{"id":"pokemon-487","label":"Registrar a Giratina en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":487,"auto":null,"how":"Cuándo: Tras los créditos: petición 91. Dónde: Cueva Retorno (nivel 70). Cómo: Cueva Retorno, en la Ladera Corona. Consejo: Giratina nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Tras los créditos: encomienda «La tabla de la isla escupefuego». Dónde: Altar Domo Lava (nivel 70). Cómo: Altar Domo Lava, en el Litoral Cobalto. Consejo: Heatran nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: Tras los créditos: encomienda 24. Dónde: Templo Puntaneva (nivel 70). Cómo: Templo Puntaneva, en la Tundra Alba. Consejo: Regigigas nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":222},{"id":"pokemon-488","label":"Registrar a Cresselia en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":488,"auto":null,"how":"Cuándo: Tras los créditos: encomienda «La tabla de la Arena de la Luna». Dónde: Arena de la Luna (nivel 70); Ladera Corona (nivel 70). Cómo: Arena de la Luna, en la Ladera Corona. Consejo: Cresselia nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":221},{"id":"pokemon-905","label":"Registrar a Enamorus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":905,"auto":null,"how":"Cuándo: Tras capturar a Tornadus, Thundurus y Landorus (petición 94: Los avatares de Hisui). Dónde: Ciénaga Bermeja (nivel 70); Pantanal Carmesí (nivel 70); Ladera Derrumbe (nivel 70). Cómo: Ciénaga Bermeja, en el Pantanal Carmesí. Consejo: Enamorus nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":235},{"id":"pokemon-493","label":"Registrar a Arceus en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":493,"auto":null,"how":"Cuándo: Con todas las especies de la Pokédex de Hisui capturadas. Dónde: Templo de Sinnoh (nivel 75). Cómo: Templo de Sinnoh: combate contra Arceus en la encomienda final. Consejo: Arceus nivel 75. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":290},{"id":"medal-type","label":"Rango 10★ de investigación (60.000 puntos)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Lavender evalúa los puntos en los campamentos y Selena sube el rango en Villa Jubileo. 10★ es el rango máximo (Serebii, Pokédex Ranks)."},{"id":"recognition-2","label":"Amuleto Iris al completar la Pokédex de Hisui (Villa Jubileo)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con todas las especies de la Pokédex de Hisui capturadas y sus entradas al menos al nivel 10 de investigación (Phione, Manaphy y Arceus incluidos; Darkrai y Shaymin no cuentan), el profesor Lavender te da el Amuleto Iris en la Sede Galaxia de Villa Jubileo.","phase":6,"order":610},{"id":"event-0","label":"Manaphy, Phione, Shaymin y Darkrai: requisitos particulares y datos de otras partidas cuando corresponda","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Manaphy y Phione están en el juego; Shaymin y Darkrai piden tener partidas guardadas de Espada/Escudo y de Diamante Brillante/Perla Reluciente en la consola. Con Pokekeep: Añade Shaymin o Darkrai legales desde la Librería si no tienes esas partidas.","phase":7,"order":700},{"id":"wisps","label":"Reunir los 107 fuegos fatuos de Spiritomb","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Vessa da premios cada 10; con los 107, de noche en las Ruinas de la Niebla del Pantanal Carmesí aparece Spiritomb. El guardado los cuenta por zona (KWispsFoundArea). Fuente: Serebii (Spiritomb Wisp Locations).","fact":"collection.la.wisps"},{"id":"unown","label":"Capturar las 28 formas de Unown","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Encuentra los 28 Unown repartidos por Hisui (petición «Unown misteriosos»): cada uno en un lugar concreto, algunos de noche o con Poké Ride.","phase":4,"order":410},{"id":"requests","label":"Completar las 122 peticiones de Hisui (94 del juego base y 28 del Despertar de la versión 1.1)","category":"Postgame","tier":1,"species":null,"auto":null,"how":"Las peticiones se recogen en el tablón de la Sede del Equipo Galaxia y por los pueblos; las 95-122 llegan con la actualización gratuita 1.1 («El despertar de Hisui»). La partida guarda cada una (sub_NNN = 255 completada). Fuente: WikiDex «Petición» y la tabla questlist_sub de la ROM."},{"id":"ingo","label":"Superar las 15 vías solitarias de Fero en el Dojo de Villa Jubileo (peticiones 108-122)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Tras la actualización 1.1, Garret pide afrontar la vía solitaria de Fero con un único Pokémon concreto en el equipo (Bidoof, Eevee, Wormadam, Abra, Blissey, Sneasel, Rotom, Bastiodon, Roselia, Magikarp, Roserade, Kleavor, Lilligant, Wurmple y Kricketot); se habla con Fero para combatir. Fuente: WikiDex «Petición». Se acredita con «todas las peticiones», que las incluye."}],"SCARLET":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar Área Cero, revanchas y el contenido de las dos expansiones","category":"Postgame","tier":0,"species":null,"auto":null,"how":"La historia de Paldea acaba en el Área Cero (Travesía de la victoria, Senda legendaria y Vía Stardust deben estar hechas; la última historia, Camino a casa, baja al Área Cero). Después: Gran Pugna Académica (repetible), revanchas de líderes y, con los DLC, La máscara turquesa (Noroteo) y El disco índigo (Academia Arándano), en ese orden, más el epílogo de Pecharunt.","phase":2,"order":200},{"id":"battle0","label":"Ganar el Gran Pugna Académica (se desbloquea tras la historia de Paldea)","category":"Combates","tier":1,"species":null,"auto":null,"how":"Torneo en el estadio de la Academia con Nemesia, los profesores, los líderes y el Alto Mando. Ninguna bandera con nombre (PKHeX ni los scripts del juego) registra la victoria: la guía solo confirma que aún no es posible (historia de Paldea sin acabar). Márcalo a mano cuando lo ganes."},{"id":"items0","label":"Recuperar las máscaras Cimiento, Fuente y Horno de Ogerpon (La máscara turquesa)","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Las tres máscaras se recuperan de los Leales durante la historia del primer DLC. Se acredita si están las tres en la mochila (Máscara Cimiento 2406, Fuente 2407 y Horno 2408 de PKHeX) o si la historia del DLC consta acabada (FSYS_SCENARIO_GAME_CLEAR_SU1), porque Ogerpon puede llevar una equipada."},{"id":"pokedex","label":"Completar Pokédex de Paldea, Noroteo y Arándano cuando corresponda","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Paldea (y, con los DLC, la de Noroteo y la de Arándano). Con la de Paldea completa, el director Clavel te da el diploma en la Academia; las de los DLC tienen el suyo. Con Pokekeep: Las exclusivas de la otra edición, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"pokemon-1001","label":"Registrar a Wo-Chien en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1001,"auto":null,"how":"Cuándo: En cualquier momento, idealmente tras la historia. Dónde: Área 1 (Sur) (nivel 60). Cómo: Arranca las 8 estacas del sello morado: Área 3 del sur, Área 4 del sur, tres en el Área 5 del sur, Área 1 del sur y dos en el Área 1 del este. Luego abre el Santuario Mustiarbor (Área 1 del sur). Si lo debilitas o huyes, vuelve dentro y puedes repetirlo. Consejo: Wo-Chien nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-1002","label":"Registrar a Chien-Pao en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":1002,"auto":null,"how":"Cuándo: En cualquier momento  for(const [id,data]of Object.entries(snaps)){
  if(!CATALOG.games.some(g=>g.id===id))continue;
  const ev=compactEvidence({...data,game:data.game||id});
  if(ev&&ev.game!==id)throw Error('La edición del diagnóstico no coincide con su expediente.');
  if(ev)staged.push([id,ev]);
 }
 if(!staged.length)throw Error('El JSON no contiene registros de Pokédex legibles para una edición del Atlas.');
 for(const [,diagnosis]of staged)store=PokemonDiagnosis.apply(store,diagnosis);
 if(staged.length===1){store.game=staged[0][0];genFilter=game(store.game).generation;}
 store.history.unshift({at:new Date().toISOString(),game:store.game,id:'EVIDENCE',step:0,label:'Diagnóstico JSON importado',value:true});
 const stored=save();view='mastery';render();if(stored)alert('Diagnóstico importado. No se ha marcado ninguna misión automáticamente.');
 }catch(e){alert('No se pudo leer el diagnóstico: '+e.message)}}

function setCheck(id,i,val){const k=id+'-'+i;if(val)store.checks[k]=true;else delete store.checks[k]; const m=CATALOG.games.flatMap(g=>g.missions).find(m=>m.id===id);store.history.unshift({at:new Date().toISOString(),game:store.game,id,step:i,label:m?.title||id,value:val});save();render(); const t=document.querySelector('[data-mid="'+id+'"]');if(t)t.open=true;}
function exportData(){const blob=new Blob([JSON.stringify({...store,format:'pokemon-atlas-9-v1'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pokemon-atlas-9-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

function coverage(){
 return `<section class="panel"><h2>Cobertura por edición</h2><p class="muted">El catálogo y el lector avanzan por separado. Las pruebas sintéticas comparan campos con PKHeX; no sustituyen la revisión de rutas completas ni partidas reales de todas las revisiones.</p><div style="overflow-x:auto;margin-top:16px"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Edición</th><th>Guía documentada</th><th>Lectura en navegador</th><th>Validación</th></tr></thead><tbody>${CATALOG.games.map(g=>{const base=g.missions.filter(m=>m.verified==='base'&&!PokemonWalkthrough.get(g.id,m.id)).length,supported=PokemonDiagnosis.supported.includes(g.id),samples=PokemonPublicCoverage[g.id];return `<tr data-coverage-game="${esc(g.id)}"><td style="padding:12px 8px;border-top:1px solid var(--border)"><button class="btn" data-game="${esc(g.id)}">${esc(g.name)}</button><br><small>Generación ${g.generation}</small></td><td>${g.missions.length} objetivos<br><small>${base} de recorrido base · ${PokemonWalkthrough.stats(g.id)} con recorrido ampliado</small></td><td>${supported?'Lector directo ligero':'Motor local ampliado'}<br><small>${supported?'Sin descarga del motor ampliado':'Primera descarga necesaria; según formato'}</small></td><td>${samples?.identified? samples.identified+' muestras públicas de edición':samples?.family?samples.family+' muestras de familia ambigua':'Sin muestra pública de edición'}<br><small>Eventos naturales y todas las revisiones: pendientes</small></td></tr>`}).join('')}</tbody></table></div></section>`;

function missions(){const g=game(store.game);const recommendation=PokemonRoute.nextMission(g,evidenceFor(g),missionDone,m=>evidenceState(m,g)?.status==='capturado');const next=recommendation?.mission;const display=g.missions.filter(m=>(!pending||!missionDone(m))&&(!textFilter||(m.title+' '+m.steps.join(' ')+' '+m.caution).toLowerCase().includes(textFilter.toLowerCase())));return `<div class="grid"><div class="metric"><strong>${g.missions.filter(missionDone).length}/${g.missions.length}</strong><small>Misiones marcadas</small></div><div class="metric"><strong>${count(g)}/${total(g)}</strong><small>Pasos marcados</small></div><div class="metric"><strong>${pct(g)}%</strong><small>Progreso manual</small></div></div><div class="notice"><b>Edición: ${esc(g.name)}</b>${g.variant.length?' · Legendario/elemento distintivo: '+esc(g.variant.join(' · ')):''}<br>${PokemonDiagnosis.supported.includes(g.id)?'Puedes leer el guardado directamente en este Atlas; campos contrastados con muestras públicas y pruebas sintéticas.':'Lector ampliado local: se descarga la primera vez. La edición y los campos disponibles dependen del formato.'} La ruta detallada sigue en revisión. Las tareas no se completan automáticamente por una captura en Pokédex.</div>${evidenceFor(g)?`<div class="notice"><b>Partida importada:</b> ${esc(evidenceFor(g).trainer||'Entrenador sin nombre')} · ${evidenceFor(g).caughtCount} capturados · <a href="#" data-view="diagnostic">Abrir diagnóstico</a>. Las misiones con capturas acreditadas se identificarán, pero no se cerrarán solas.</div>`:''}${next?`<div class="panel"><span class="eyebrow">Siguiente objetivo no confirmado</span><h2>${esc(next.title)}</h2><p class="small muted">${esc(recommendation.reason)}</p><p class="muted">${esc(next.steps[0])}</p><button class="btn primary" data-focus="${next.id}" style="margin-top:12px">Ir a esta misión ↓</button></div>${gen3Panel(g,evidenceFor(g),false)}`:'<div class="panel">No hay otra recomendación con la evidencia actual. Revisa las instrucciones, las recompensas oficiales y los objetivos que aún no tienen lectura suficiente.</div>'}<div class="filters"><input type="search" id="search" value="${esc(textFilter)}" placeholder="Buscar misión, objeto o requisito"><label class="filterline"><input type="checkbox" id="pending" ${pending?'checked':''}> Solo pendientes</label></div><p class="small">${display.length} de ${g.missions.length} misiones visibles. Cada casilla es independiente; abre una misión para ver sus pasos.</p>${display.map(m=>`<details class="card" data-mid="${m.id}" id="${m.id}"><summary><span class="count">${m.steps.filter((_,i)=>checked(m.id,i)).length}/${m.steps.length}</span><span class="t"><strong>${esc(m.title)}</strong><small>${esc(m.section)}${PokemonWalkthrough.get(g.id,m.id)?' · recorrido ampliado':m.verified==='referencia'?' · referencia declarada':m.verified==='revisión guiada'?' · detalles ampliados':' · recorrido introductorio'}${missionDone(m)?' · completada manualmente':''}${evidenceState(m,g)?.status==='capturado'?' · ✓ captura registrada':evidenceState(m,g)?.status==='visto'?' · ◉ visto':''}</small></span></summary><section>${PokemonWalkthrough.render(g.id,m.id,esc)}${m.id===g.id+'-14'?PokemonOrasStones.render(g.id,evidenceFor(g),esc):''}${m.id===g.id+'-E01'&&['BLACK2','WHITE2'].includes(g.id)?PokemonMedalBook.render(evidenceFor(g),esc):''}${m.steps.map((step,i)=>`<div class="step"><input id="${m.id}-${i}" data-check="${m.id}" data-idx="${i}" type="checkbox" ${checked(m.id,i)?'checked':''}><label for="${m.id}-${i}">${esc(step)}</label></div>`).join('')}${evidenceState(m,g)?`<div class="notice"><b>Pokédex: ${esc(evidenceState(m,g).label)}</b> · ${esc(evidenceState(m,g).status)}. Esto no demuestra que el encuentro específico se haya completado en su ubicación.</div>`:''}<div class="warn"><b>Antes de darla por cerrada:</b> ${esc(m.caution)}</div>${m.source?`<p class="small"><a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">Consultar guía de ref function gen3Panel(g,e,full){
 if(!e)return '';
 const a=e.field&&globalThis.PokemonGen3Guide?PokemonGen3Guide.analyze(e.field,g.id,e.caught):globalThis.PokemonEventGuide?.analyze(e,g.id);if(!a){const l=e.location;return l&&l.name?`<section class="panel" id="gen3-where"><span class="eyebrow">Leído del guardado</span><h3>Dónde estás ahora</h3><p><b>${esc(l.name)}</b>${l.detail?` <span class="small muted">(${esc(l.detail)})</span>`:''}${l.precision==='region'?' <span class="small muted">(región; el guardado no indica el lugar exacto)</span>':''}</p><p class="small muted">La historia de esta edición aún no se interpreta desde el guardado; sigue la ruta recomendada de abajo.</p></section>`:'';}
 if(a.mismatch)return '<div class="notice">La lectura de campo pertenece a otra familia de ediciones; no se usa para esta.</div>';
 const loc=a.location,label={completado:'Completado',perdido:'Ya no disponible',"en curso":'En curso',pendiente:'Pendiente',legado:'Evento de legado',calculado:'Calculado'};
 const mon=m=>esc((m.egg?'Huevo':PokemonSpecies.name(m.species)||'Pokémon')+(m.where==='caja'||m.box?' · caja '+m.box+', posición '+m.slot:' · equipo, posición '+m.slot));
 const where=`<section class="panel" id="gen3-where"><span class="eyebrow">Leído del guardado</span><h3>${loc?'Dónde estás ahora':'Situación de la partida'}</h3>${loc?`<p><b>${esc(loc.name||'Zona sin nombre en el mapa')}</b>${loc.detail?` <span class="small muted">(${esc(loc.detail)})</span>`:''}${loc.precision==='region'?' <span class="small muted">(región; el guardado no indica el lugar exacto)</span>':Number.isFinite(loc.x)&&Number.isFinite(loc.y)?` <span class="small muted">(${/^(ZONE|FIELD)_/.test(loc.map||'')?'zona '+esc(String(loc.mapId)):esc(loc.map||'')}, posición ${loc.x}, ${loc.y})</span>`:''}</p>`:'<p class="small muted">La posición del jugador aún no se interpreta en esta edición; el resto procede de sus banderas y variables.</p>'}${a.storyPartial?(a.story.next?'<p>El Salón de la Fama aún no consta; sigue el recorrido de la historia desde tu última medalla.</p>':'<p>El Salón de la Fama consta en el guardado: el recorrido pasa al postgame.</p>'):a.story.next?`<p>Siguiente hito de la historia: <b>${esc(a.story.next.label)}</b>. <a href="#" data-view="mission">Ver el recorrido</a></p>`:a.story.rows.length&&a.story.rows.every(r=>r.state!=='pending')?'<p>La historia principal consta como terminada en las banderas del guardado.</p>':'<p class="small muted">El avance de la historia de esta edición aún no se interpreta desde el guardado; sigue la ruta recomendada.</p>'}<p class="small muted">${a.integrity?`Copia activa ${a.integrity.activeSlot+1} de ${a.integrity.copies}, checksums válidos. `:''}Significado de los datos del guardado: ${esc(a.confidence||'documentado en el código del juego (pret)')}. Aún sin comparación antes/después con partidas propias.</p></section>`;
 if(!full){const open=a.secrets.filter(x=>['pendiente','en curso'].includes(x.status));return where+(open.length?`<div class="notice"><b>Secretos pendientes según el guardado:</b> ${open.map(x=>esc(x.title)).join(' · ')}. <a href="#" data-view="diagnostic">Ver pasos</a></div>`:'');}
 const story=`<section class="panel"><h3>Historia según las banderas</h3>${a.story.rows.map(r=>`<div class="step"><span style="min-width:22px">${r.state==='pending'?'○':'●'}</span><span>${esc(r.label)} <span class="small muted">· ${r.state==='direct'?(r.badgesAtLeast!==undefined?'medallas registradas':'dato activo en el guardado'):r.state==='derived'?'deducido: hay un hito posterior':r.set===null?'sin lectura':'pendiente'}</span></span></div>`).join('')}</section>`;
 const secret=x=>{let body='';
  if(x.mirage){const m=x.mirage;body=`<p>${m.visibleToday.length?'<b>Hoy la isla es visible</b> gracias a: '+m.visibleToday.map(mon).join(', '):m.fromBoxToday.length?'<b>Hoy aparecería</b> si pasas al equipo: '+m.fromBoxToday.map(mon).join(', '):'Hoy no la hace aparecer ningún Pokémon de tu equipo ni de tus cajas.'}</p>${m.upcoming.length?`<p>Próximos días de juego en que algún Pokémon tuyo la hace aparecer:</p><ul>${m.upcoming.map(u=>`<li>Dentro de ${u.day} día${u.day===1?'':'s'}: ${u.mons.map(mon).join(', ')}</li>`).join('')}</ul>`:`<p class="muted">Ningún Pokémon tuyo coincide en los próximos ${m.horizon} días.</p>`}<p class="small muted">El valor cambia una vez por cada día de juego que el reloj procesa al cargar. Cuenta los días desde el último que registró el guardado.</p>`;}
  else body=`<p class="small"><b>Qué acredita el guardado:</b> ${esc(x.meaning||'')}${x.progress?.length?' · '+x.progress.map(p=>(p.set?'✔ ':'○ ')+esc(p.label)).join(' · '):''}${x.lost?.length?' · Ya no se puede repetir en esta partida.':''}${x.species?.some(sp=>sp.caught===true)?' · Pokédex: '+x.species.filter(sp=>sp.caught).map(sp=>esc(PokemonSpecies.name(sp.id))).join(', ')+' registrado.':''}</p>${x.weather?`<p><b>Clima anómalo guardado ahora mismo:</b> ${esc(x.weather)}</p>`:''}`;
  return `<details class="panel" ${['pendiente','en curso','calculado'].includes(x.status)?'open':''}><summary><b>${esc(x.title)}</b> · ${esc(label[x.status]||x.status)} · <span class="muted">${esc(x.place)}</span></summary><p class="small muted">${esc(x.category)}${x.legacy?' · '+esc(x.legacy):''}</p><p><b>Requisitos:</b> ${esc(x.requires)}</p><ol>${x.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${x.mission?`<p><button class="btn" data-goto="${esc(g.id+'-'+x.mission)}">Ver el recorrido completo de la misión</button></p>`:''}${body}</details>`;};
 return where+story+`<section><h3>Secretos y eventos (${a.secrets.filter(x=>x.status==='completado').length}/${a.secrets.filter(x=>x.status!=='calculado').length} completados)</h3>${a.secrets.map(secret).join('')}</section>`;
}
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-goto]');if(!b)return;ev.preventDefault();view='mission';render();const card=document.getElementById(b.dataset.goto);if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}});
function diagnostic(){
 const g=game(store.game),e=evidenceFor(g);
 if(!e)return `<div class="panel"><h2>Importa evidencia de tu partida</h2><p class="muted">Carga tu .sav o main directamente: se analiza en este dispositivo y no se modifica. El lector ligero cubre diez ediciones; para otros formatos de las nueve generaciones el Atlas descarga un motor ampliado local (hasta 45 MiB la primera vez). Consulta la cobertura por edición y sus límites.</p><div class="actions" style="margin-top:14px"><button class="btn primary" data-read-save>Seleccionar guardado</button><button class="btn" id="diag-import-inline">Importar diagnóstico JSON</button></div></div>`;
 const importantItems=['HEARTGOLD','SOULSILVER'].includes(g.id)&&Array.isArray(e.keyItems)?e.keyItems.filter(i=>[532,534,535,536,482,483].includes(i.id)):null;
 const itemNames={532:'Orbe Verde',534:'Orbe Rojo',535:'Orbe Azul',536:'Piedra Enigma',482:'Ala Plateada',483:'Ala Arcoíris'};
 const completion=PokemonCompletion.dexStatus(e);
 const names=Object.entries(LEGEND_NAMES).filter(([id])=>e.caught.includes(+id)||e.seen.includes(+id));
 return `<div class="grid"><div class="metric"><strong>${e.caughtCount}</strong><small>Capturados según Pokédex</small></div><div class="metric"><strong>${e.seenCount}</strong><small>Vistos según Pokédex</small></div><div class="metric"><strong>${e.badgesTotal??'—'}</strong><small>Medallas registradas</small></div></div><div class="panel"><span class="eyebrow">Evidencia importada · ${esc(g.name)}</span><h2>${esc(e.trainer||'Entrenador')} · ${esc(formatTime(e.playtime))}</h2><p class="muted">Liga: ${e.gameClear===true?'registrada':e.gameClear===false?'no registrada':(e.field&&globalThis.PokemonGen3Guide?.analyze(e.field,g.id,e.caught)?.story?.rows?.slice(-1)[0]?.set===true)?'bandera del Salón de la Fama activa (documentada en código)':(e.field&&globalThis.PokemonGen3Guide?.analyze(e.field,g.id,e.caught)?.story?.rows?.slice(-1)[0]?.set===false)?'bandera del Salón de la Fama inactiva':'sin lectura disponible'} · Pokédex Nacional: ${e.nationalDex===true?'desbloqueada':e.nationalDex===false?'no desbloqueada':'sin lectura disponible'} · Formato ${esc(e.format||'sin dato')}</p><p class="muted">Estos datos son registros actuales y no certifican el origen ni la secuencia de captura.</p>${e.editionIdentification==='selected-in-atlas'?'<p class="muted">El archivo identifica una familia: la edición concreta es la que seleccionaste en el Atlas.</p>':''}<div class="actions" style="margin-top:14px"><button class="btn primary" data-read-save>Actualizar guardado</button><button class="btn" id="diag-import-inline">Importar nuevo diagnóstico</button></div></div>${gen3Panel(g,e,true)}${completion?`<section class="panel" id="dex-completion"><h3>Especies exigidas por los reconocimientos de esta edición</h3>${Object.entries(completion).map(([key,dex])=>`<h4>${key==='kanto'?'Kanto':key==='kalos'?'Kalos':key==='hoenn'?'Hoenn':({alola:'Alola',melemele:'Melemele',akala:'Akala',ulaula:'Ula-Ula',poni:'Poni'}[key]||'Nacional')}: ${dex.registered}/${dex.required} ${dex.field==='seen'?'vistas':'registradas'}</h4>${dex.missing.length?`<details><summary>Ver ${dex.missing.length} especies pendientes</summary><p class="small" style="overflow-wrap:anywhere">${dex.missing.map(id=>'#'+String(id).padStart(3,'0')+' '+esc(PokemonSpecies.name(id)||'')).join(' · ')}</p></details>`:'<p>Lista exigida registrada por completo.</p>'}`).join('')}<p class="muted">Se compara la lista exacta del juego; las especies de evento excluidas no sustituyen una que falte. Esto acredita el registro, no sus encuentros originales ni la recogida de premios.</p></section>`:''}<div class="panel"><h3>Legendarios registrados en el diagnóstico</h3>${names.length?names.map(([id,name])=>`<div class="step"><span style="min-width:26px;color:var(--gold)">#${id}</span><label>${esc(name)} — <b>${e.caught.includes(+id)?'capturado':'solo visto'}</b></label></div>`).join(''):'<p class="muted">No constan legendarios entre las especies analizadas.</p>'}</div>${PokemonMedalBook.render(e,esc)}${PokemonOrasStones.render(g.id,e,esc)}${PokemonAlolaInventory.render(e,esc)}${PokemonPassport.render(e,esc)}${e.progressSignals?.length?`<section class="panel"><h3>Señales documentadas de progreso</h3>${e.progressSignals.map(s=>`<p><b>${esc(s.label)}:</b> ${s.value===true?'activo':s.value===false?'inactivo':'sin lectura disponible'}</p>`).join('')}<p class="muted">Proceden de campos documentados del juego. Falta el contraste controlado del evento; no certifican todas las escenas ni una cronología histórica.</p></section>`:''}${(e.unparsed?.length||e.warnings?.length)?`<section class="panel"><h3>Alcance de esta lectura</h3>${[...(e.warnings||[]),...(e.unparsed||[])].map(message=>`<p class="muted">${esc(message)}</p>`).join('')}</section>`:''}${importantItems?`<section class="panel"><h3>Objetos clave relevantes presentes</h3>${importantItems.length?importantItems.map(i=>`<p>${esc(itemNames[i.id])} · ${i.count}</p>`).join(''):'<p class="muted">No constan estos objetos en la bolsa actual.</p>'}<p class="muted">La posesión actual no acredita una entrega histórica ni las escenas anteriores.</p></section>`:''}<div class="notice"><b>Regla de seguridad:</b> haber registrado un legendario en la Pokédex no implica haber completado su ruta original, puzles o evento. La guía evita sugerir capturar de nuevo las especies acreditadas, pero deja abiertas las verificaciones de historia.</div>`;
}
function render(){masteryCache.clear();document.title='Pokémon 100 % · '+game(store.game).name;el.innerHTML=`<div class="layout">${nav()}<main class="main">${topNav()}${store.profileNotice?'<div class="notice">Se ha cambiado el perfil de partida. Las marcas anteriores se conservan por separado y se recuperan al volver a importar su guardado o diagnóstico. La exportación incluye los perfiles archivados.</div>':''}${store.storageWarning?'<div class="notice" role="alert">El navegador no ha podido guardar los últimos cambios. Siguen en memoria: usa «Exportar JSON» antes de cerrar.</div>':''}${store.recoveryWarning?'<div class="notice">No se pudo recuperar todo el progreso anterior. La copia original disponible se conserva en la exportación para recuperarla. Usa «Exportar JSON» antes de continuar.</div>':''}${view==='coverage'?coverage():view==='catalog'?catalog():view==='history'?history():view==='dossier'?dossier():view==='mastery'?mastery():view==='diagnostic'?diagnostic():missions()}<p class="footer">Fuentes generales: Bulbapedia (serie principal y tarjetas), Serebii. Uso local: el progreso queda en este navegador; exporta JSON para cambiar de dispositivo. Los guardados se analizan localmente. El Atlas añade el motor ampliado para otros formatos. <a href="./engine/NOTICE.md">Licencia y fuentes del motor local</a>.</p></main></div><input id="file-import" type="file" hidden accept=".json,application/json"><input id="file-diagnosis" type="file" hidden accept=".json,application/json"><input id="file-save" type="file" hidden multiple>`; wire();}
function wire(){
 PokemonMedalBook.wire(el);
 PokemonOrasStones.wire(el);
 document.querySelectorAll('[data-read-save],#btn-save').forEach(b=>b.onclick=()=>document.getElementById('file-save').click());
 const rawInput=document.getElementById('file-save');if(rawInput)rawInput.onchange=e=>importSaveFiles(e.target.files);

 document.querySelectorAll('[data-master]').forEach(b=>b.onchange=()=>{store.masterChecks=store.masterChecks||{};const k=store.game+':'+b.dataset.master;if(b.checked)store.masterChecks[k]=true;else delete store.masterChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,label:'Maestría: '+(masteryGoals(game(store.game)).find(x=>x.id===b.dataset.master)?.label||k),value:b.checked});save();render();});
 const mNext=document.getElementById('btn-mastery-next');if(mNext)mNext.onclick=()=>{const g=game(store.game);const o=masteryOrdered(masteryGoals(g)).filter(x=>x.tier<=1).find(x=>!masteryProof(x,g)&&!store.masterChecks?.[g.id+':'+x.id]);if(o){const target=document.getElementById('master-'+o.id);target?.scrollIntoView({behavior:'smooth',block:'center'});}else alert('El núcleo prioritario está confirmado; revisa objetivos históricos adicionales y premios en el juego.');};
 const mImport=document.getElementById('mastery-import');if(mImport)mImport.onclick=()=>document.getElementById('file-diagnosis')?.click();
 document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{store.goalChecks=store.goalChecks||{};const k=store.game+':'+b.dataset.goal;if(b.checked)store.goalChecks[k]=true;else delete store.goalChecks[k];store.history.unshift({at:new Date().toISOString(),game:store.game,id:k,step:0,label:'Expediente: '+goalsFor(game(store.game))[Number(b.dataset.goal)][1],value:b.checked});save();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{genFilter=+b.dataset.gen;render()});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{store.game=b.dataset.game;genFilter=game(store.game).generation;view='mission';textFilter='';pending=false;save();render()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const id=b.dataset.check,i=+b.dataset.idx,val=b.checked;setCheck(id,i,val)});$('#btn-export').onclick=exportData;$('#btn-import').onclick=()=>$('#file-import').click();$('#btn-diagnosis').onclick=()=>$('#file-diagnosis').click();const db=$('#diag-import-inline');if(db)db.onclick=()=>$('#file-diagnosis').click();$('#file-diagnosis').onchange=e=>importDiagnosis(e.target.files[0]);$('#file-import').onchange=e=>importData(e.target.files[0]);const search=$('#search');if(search)search.oninput=e=>{textFilter=e.target.value;const pos=e.target.selectionStart;render();let s=$('#search');s.focus();s.setSelectionRange(pos,pos)};const p=$('#pending');if(p)p.onchange=e=>{pending=e.target.checked;render()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const card=document.getElementById(b.dataset.focus);if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'})}});const mobileGen=$('#mobile-gen');if(mobileGen)mobileGen.onchange=e=>{genFilter=+e.target.value;store.game=CATALOG.games.find(g=>g.generation===genFilter).id;save();render()};const mobileGame=$('#mobile-game');if(mobileGame)mobileGame.onchange=e=>{store.game=e.target.value;genFilter=game(store.game).generation;save();render()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
