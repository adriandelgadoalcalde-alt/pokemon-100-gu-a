lla pide vencer a una Dama del Combate en la 50.ª.","phase":3,"order":300},{"id":"battle1","label":"Concursos Pokémon y sus recompensas principales","category":"Combates","tier":1,"species":null,"auto":null,"how":"Gana el rango Maestro en las 5 categorías (Carisma, Belleza, Dulzura, Ingenio y Dureza) con Pokémon de condición alta (Pokécubos). En Rubí/Zafiro los cuadros ganadores se exponen en el Museo de Ciudad Calagua; en Esmeralda, el cuadro aparece en el Museo de Arte de Ciudad Calagua tras cada Maestro.","phase":4,"order":400},{"id":"final-boss","label":"Vencer a Máximo con su equipo reforzado al volver a la Liga de Hoenn","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: la segunda vez (y las siguientes) que desafías la Liga Pokémon, es decir, tras haberte proclamado campeón una vez. Dónde: Liga Pokémon de Hoenn, en Ciudad Colosalia. Paso a paso: 1) Gana la Liga por primera vez. 2) Vuelve a Ciudad Colosalia y desafía de nuevo al Alto Mando. 3) Vence a Máximo con su equipo reforzado: Skarmory, Claydol, Aggron, Carbink y Aerodactyl a nivel 77 y Metagross a nivel 79, que megaevoluciona. Todos sus Pokémon tienen al menos una inmunidad de tipo. 4) Tras derrotarlo por segunda vez te entrega la Metagrossita. Consejo: Mega-Metagross puede barrerte; lleva ataques potentes de tipo Fuego o Tierra y algún Pokémon rápido. Fuente: WikiDex «Steven Stone/Máximo Peñas» y «Metagrossita».","phase":3,"order":390},{"id":"items0","label":"Objetos de acceso a encuentros legendarios, submarino y rutas especiales","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Durante la historia: Bici Carrera o Acrobática (Ciudad Malvalona; para el Pilar Celeste hace falta la Carrera), Buceo (MO08, te lo da Máximo en Algaria tras la séptima medalla), el Escáner del Barco Abandonado y, en Esmeralda, el Pase de Barco para el Frente Batalla. En Rubí Omega/Zafiro Alfa, además, la Flauta Eón para volar.","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex de Hoenn según las exclusiones oficiales","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Hoenn (Jirachi y Deoxys no cuentan). Las exclusivas por intercambio. Con ella completa, el diseñador del juego del Motel Aguacala (Ciudad Calagua) te da el diploma. Con Pokekeep: Las que te falten por intercambio o de evento, añádelas legales desde la Librería.","phase":5,"order":500},{"id":"diploma-regional","label":"Diploma de la Pokédex de Hoenn (equipo de Game Freak, Motel Aguacala de Ciudad Calagua)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex de Hoenn completa, habla con el equipo de Game Freak en el Motel Aguacala (Ciudad Calagua).","phase":6,"order":600},{"id":"diploma-nacional","label":"Diploma de la Pokédex Nacional (Motel Aguacala)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional completa (sin los singulares de evento; Deoxys sí cuenta), habla con el equipo de Game Freak en el Motel Aguacala de Ciudad Calagua.","phase":6,"order":605},{"id":"oval-charm","label":"Amuleto Oval: ver toda la Pokédex de Hoenn (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cuanto hayas visto todos los Pokémon de la Pokédex de Hoenn. Dónde: laboratorio del Profesor Abedul, en Villa Raíz. Paso a paso: 1) Registra como vistos todos los Pokémon de la Pokédex de Hoenn. No hacen falta Jirachi ni Deoxys. 2) Ve a Villa Raíz y habla con el Profesor Abedul en su laboratorio para que evalúe tu Pokédex. 3) Te entrega el Amuleto Oval, que hace más fácil que aparezca un huevo en la guardería. Consejo: basta con verlos: el DexNav, los combates contra entrenadores y los intercambios registran Pokémon como vistos sin necesidad de capturarlos. Fuente: WikiDex «Amuleto Oval» y «Pueblo Raíz Chica/Villa Raíz».","phase":6,"order":613},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex Nacional capturada, Deoxys incluido (Profesor Abedul)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Con la Pokédex Nacional capturada (Deoxys incluido, sin el resto de singulares de evento), el profesor Abedul te da el Amuleto Iris en su laboratorio de Villa Raíz.","phase":6,"order":610},{"id":"pokemon-377","label":"Registrar a Regirock en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":377,"auto":null,"how":"Cuándo: Tras conseguir Buceo; antes o después de la Liga. Dónde: Ruinas del Desierto (nivel 40). Cómo: Abre la Cámara Sellada (bajo el agua en la Ruta 134) y lee el braille. Regirock está en las Ruinas del Desierto (Ruta 111): usa Golpe Roca en el centro de la sala. Consejo: Regirock nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":205},{"id":"pokemon-378","label":"Registrar a Regice en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":378,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Cueva Insular (nivel 40). Cómo: Cueva Insular (Ruta 105): espera dentro sin moverte hasta que se abra la puerta. Consejo: Regice nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":206},{"id":"pokemon-379","label":"Registrar a Registeel en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":379,"auto":null,"how":"Cuándo: Tras abrir la Cámara Sellada. Dónde: Tumba Antigua (nivel 40). Cómo: Tumba Antigua (Ruta 120): ponte en el centro y usa Vuelo. Consejo: Registeel nivel 40. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":207},{"id":"pokemon-384","label":"Registrar a Rayquaza en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":384,"auto":null,"how":"Cuándo: Durante el Episodio Delta (posliga). Dónde: Pilar Celeste (nivel 70). Cómo: En la cima del Pilar Celeste, tras despertarlo con Zinnia. Es obligatorio para seguir el episodio. Consejo: Rayquaza nivel 70. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-382","label":"Registrar a Kyogre en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":382,"auto":null,"how":"Cuándo: Durante la historia, antes de la octava medalla. Dónde: Cueva Ancestral (nivel 45). Cómo: Cueva Ancestral de Arrecípolis: tras la regresión primigenia de Kyogre, enfréntate a él al fondo. Consejo: Kyogre nivel 45; si lo debilitas, vuelve tras la Liga. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":160},{"id":"pokemon-386","label":"Registrar a Deoxys en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":386,"auto":null,"how":"Cuándo: Al terminar el Episodio Delta. Dónde: Pilar Celeste (nivel 80). Cómo: Vuelve con Rayquaza (megaevolucionado) al espacio y de nuevo a la cima del Pilar Celeste: Deoxys te espera. Consejo: Deoxys nivel 80. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-380","label":"Registrar a Latias en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":380,"auto":null,"how":"Cuándo: Durante la historia, al cruzar el mar de la Ruta 118. Dónde: Isla del Sur (nivel 30). Cómo: El otro Pokémon eón te lleva a la Isla del Sur; tras vencer al equipo villano, este se une a tu equipo (regalo). Después te da la Flauta Eón para volar. Consejo: Nivel 30, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":140},{"id":"card-0","label":"Hall de la Fama","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":"gameClear","how":"Estrella o sello por entrar en el Hall de la Fama: se consigue sola al terminar la historia (objetivo «Finalizar la historia principal»). Compruébalo en tu tarjeta de entrenador.","phase":6,"order":600},{"id":"card-1","label":"Ver todas las especies requeridas de la Pokédex de Hoenn","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por haber visto todas las especies de la Pokédex de Hoenn. Las de la otra edición cuentan si las ves en combate o intercambio; el Pokénav (DexNav) ayuda a encontrar las que faltan.","phase":6,"order":610},{"id":"card-2","label":"Derrotar a una Dama del Combate en la 50.ª batalla consecutiva de Mansión Batalla","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Estrella por vencer a una Dama del Combate en la 50.ª batalla consecutiva de la Mansión Batalla.","phase":6,"order":620},{"id":"event-0","label":"Mew, Deoxys o Jirachi mediante distribuciones o islas de evento disponibles según edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Mew (Isla Suprema, Mapa Viejo de Esmeralda), Deoxys (Isla Origen, Ori-Ticket de Rojo Fuego/Verde Hoja y Esmeralda) y Jirachi (disco de bonificación / Pokémon Channel) solo llegaron por eventos. En Rubí Omega/Zafiro Alfa, Deoxys sí está en el juego (Episodio Delta). Con Pokekeep: Añade el objeto de evento (Mapa Viejo o Ori-Ticket) y activa su bandera para jugar el evento, o añade el singular legal desde la Librería.","phase":7,"order":700},{"id":"pokemon-486","label":"Registrar a Regigigas en la Pokédex de esta partida (Cueva Insular de día, con Regirock, Regice y Registeel en el equipo y Regice con mote y un objeto helado)","category":"Legendarios","tier":1,"species":486,"auto":null,"how":"Cuándo: De día, tras capturar o vencer a Groudon/Kyogre y con Regirock, Regice y Registeel en el equipo. Dónde: Cueva Insular (nivel 50). Cómo: Cueva Insular (Ruta 105). Regice debe tener mote y llevar un Porcehelado, una Bola de Nieve o un Antiderretir. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-249","label":"Registrar a Lugia en la Pokédex de esta partida (Malvamar: lleva el escáner del sótano al capitán de Ciudad Portual, que te da el Cascabel Oleaje; tócalo en el sótano submarino)","category":"Legendarios","tier":1,"species":249,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Malvamar (nivel 50). Cómo: Malvamar: lleva el escáner del sótano al capitán de Ciudad Portual, que te da el Cascabel Oleaje; tócalo en el sótano submarino. Necesitas la Campana Oleaje. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":245},{"id":"pokemon-250","label":"Registrar a Ho-Oh en la Pokédex de esta partida (exclusivo de Rubí Omega: por intercambio)","category":"Legendarios","tier":1,"species":250,"auto":null,"how":"Cuándo: Exclusivo de Rubí Omega: por intercambio. Cómo: Solo por intercambio desde la otra edición. Con Pokekeep: Añádelo legal desde la Librería. Se acredita con el registro en la Pokédex de la partida.","phase":7,"order":730},{"id":"pokemon-485","label":"Registrar a Heatran en la Pokédex de esta partida (portal al fondo de la Gruta Solar, después de lo de Groudon/Kyogre primigenios)","category":"Legendarios","tier":1,"species":485,"auto":null,"how":"Cuándo: Después del Hall de la Fama. Dónde: Gruta Solar (nivel 50). Cómo: Portal al fondo de la Gruta Solar, después de lo de Groudon/Kyogre primigenios. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":225},{"id":"pokemon-480","label":"Registrar a Uxie en la Pokédex de esta partida (Cueva Ignota junto a Arrecípolis, con tres Pokémon de amistad máxima; de 20:00 a 21:00)","category":"Legendarios","tier":1,"species":480,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Cueva Ignota (nivel 50). Cómo: Cueva Ignota junto a Arrecípolis, con tres Pokémon de amistad máxima; de 20:00 a 21:00. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"pokemon-481","label":"Registrar a Mesprit en la Pokédex de esta partida (Cueva Ignota junto a Arrecípolis, con tres Pokémon de amistad máxima; de 04:00 a 19:59)","category":"L l 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":252},{"id":"pokemon-644","label":"Registrar a Zekrom en la Pokédex de esta partida (Cueva Incierta junto a Ciudad Malvalona, con un Pokémon de nivel 100 en el equipo)","category":"Legendarios","tier":1,"species":644,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Cueva Incierta (nivel 50). Cómo: Cueva Incierta junto a Ciudad Malvalona, con un Pokémon de nivel 100 en el equipo. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":255},{"id":"pokemon-646","label":"Registrar a Kyurem en la Pokédex de esta partida (Boquete Irregular junto a Pueblo Pardal, con Reshiram y Zekrom en el equipo)","category":"Legendarios","tier":1,"species":646,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Boquete Irregular (nivel 50). Cómo: Boquete Irregular junto a Pueblo Pardal, con Reshiram y Zekrom en el equipo. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":256},{"id":"pokemon-243","label":"Registrar a Raikou en la Pokédex de esta partida (Bosque Virgen junto a Ciudad Férrica, con Lugia o Ho-Oh en el equipo; minutos 00-20 de cada hora)","category":"Legendarios","tier":1,"species":243,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Bosque Virgen (nivel 50). Cómo: Bosque Virgen junto a Ciudad Férrica, con Lugia o Ho-Oh en el equipo; minutos 00-20 de cada hora. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":260},{"id":"pokemon-244","label":"Registrar a Entei en la Pokédex de esta partida (Bosque Virgen, con Lugia o Ho-Oh en el equipo; minutos 20-40 de cada hora)","category":"Legendarios","tier":1,"species":244,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Bosque Virgen (nivel 50). Cómo: Bosque Virgen, con Lugia o Ho-Oh en el equipo; minutos 20-40 de cada hora. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":261},{"id":"pokemon-245","label":"Registrar a Suicune en la Pokédex de esta partida (Bosque Virgen, con Lugia o Ho-Oh en el equipo; minutos 40-00 de cada hora)","category":"Legendarios","tier":1,"species":245,"auto":null,"how":"Cuándo: Tras el Episodio Delta, volando con la Flauta Eón (parajes espejismo). Dónde: Bosque Virgen (nivel 50). Cómo: Bosque Virgen, con Lugia o Ho-Oh en el equipo; minutos 40-00 de cada hora. Consejo: Nivel 50. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":262}],"SUN":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, incluido Rainbow Rocket cuando corresponda","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: defensa del título en la Liga, tapus en sus ruinas, Necrozma y Código Cero. En Sol/Luna, las misiones de los ultraentes con Handsome y Anabel; en Ultrasol/Ultraluna, el Episodio RR (Team Rainbow Rocket) en el Paraíso Æther y el Ultraviaje.","phase":2,"order":200},{"id":"battle0","label":"Superar el Árbol de Combate y derrotar entrenadores importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Árbol de Combate (al final de la Pendiente de Poni, tras la Liga): combates Individual, Doble y Múltiple contra entrenadores y leyendas invitadas (Rojo, Azul...). Hay sellos por 50 victorias seguidas en cada modalidad.","phase":3,"order":300},{"id":"battle1","label":"Defender el título de campeón de Alola en la Liga del Monte Lanakila","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de convertirte en el primer campeón de Alola (tras vencer al Alto Mando y al Profesor Kukui). Dónde: Liga Pokémon del Monte Lanakila (Ula-Ula). Paso a paso: 1) Vuelve a la Liga y vence otra vez a los cuatro miembros del Alto Mando, en el orden que quieras. 2) Al llegar a la sala del campeón aparece un retador que intenta quitarte el título; el primero es siempre Tilo. 3) En las siguientes visitas el retador sale de forma aleatoria entre Tilo, el Profesor Kukui, Gladio, Olano, Chris, Francine, Lario, Hela y José; Fabio solo aparece el primer día de cada mes. 4) Gana el combate para conservar el título: cada victoria suma una defensa. Si pierdes no pasa nada, pero esa visita no cuenta. 5) Repite el ciclo Alto Mando + retador tantas veces como quieras. Consejo: los retadores llevan Pokémon de nivel 63; lleva un equipo de ese nivel o superior y objetos de curación de sobra. Fuente: WikiDex «Liga Pokémon (Alola)».","phase":3,"order":310},{"id":"items0","label":"Cristales Z, Zygarde o recursos únicos según edición","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cristales Z: uno por cada prueba y gran prueba del recorrido insular (los de tipo, en orden de la historia) y los exclusivos de Pokémon concretos por la posliga. Arca de Zygarde: Ruta 16 (Akala).","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex regional de Alola","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Alola (las cuatro islas). Cada vez que completes la sección de una isla, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala) para que selle tu pasaporte; con la de Alola completa (sin singulares) te da el diploma y el Amuleto Iris. Con Pokekeep: Las especies exclusivas de la otra edición, añádelas legales desde la Librería si no puedes intercambiarlas.","phase":5,"order":500},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Alola completa (director del juego, oficinas de Game Freak de Ciudad Kantai)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cualquier momento, aunque en la práctica tras la Liga, cuando ya puedes capturar casi todo. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Registra como capturados los Pokémon de cada Pokédex insular (Melemele, Akala, Ula-Ula y Poni) y de la Pokédex de Alola (302 entradas). 2) No hacen falta los singulares (Magearna y Marshadow). 3) Visita las oficinas de GAME FREAK y habla con el director del juego: sella tu pasaporte por cada Pokédex insular completa. 4) Al completar la de Alola vuelve a sellarlo y te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor. Consejo: los Pokémon exclusivos de la otra edición se consiguen por intercambio. Fuente: WikiDex «Amuleto Iris», «Game Freak» y «Lista de Pokémon según la Pokédex de Alola».","phase":6,"order":616},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Kantai: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Entra en las oficinas de GAME FREAK y busca a Morimoto; en la versión española de Sol y Luna aparece con el nombre de Tirso por un error de traducción. 2) Háblale y acepta su combate; se le puede retar una vez al día. 3) Gánale: la primera victoria te da el Amuleto Oval, que aumenta la probabilidad de que aparezcan huevos en la guardería. 4) En días posteriores puedes repetir el combate. Consejo: lleva seis Pokémon de nivel 62 (Kangaskhan, Jolteon, Flareon, Vaporeon, Machamp y Dragonite); prepara un equipo de ese nivel o superior y objetos de curación. Fuente: WikiDex «Amuleto oval», «Shigeki Morimoto» y «Game Freak».","phase":3,"order":390},{"id":"pokemon-785","label":"Registrar a Tapu Koko en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":785,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Guerra (nivel 60). Cómo: Entra en las Ruinas de la Guerra (Melemele) y acércate al altar del fondo. Consejo: Tapu Koko nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-786","label":"Registrar a Tapu Lele en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":786,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Vida (nivel 60). Cómo: Entra en las Ruinas de la Vida (Akala) y acércate al altar del fondo. Consejo: Tapu Lele nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-787","label":"Registrar a Tapu Bulu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":787,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Cosecha (nivel 60). Cómo: Entra en las Ruinas de la Cosecha (Ula-Ula) y acércate al altar del fondo. Consejo: Tapu Bulu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-788","label":"Registrar a Tapu Fini en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":788,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas del Tránsito (nivel 60). Cómo: Entra en las Ruinas del Tránsito (Poni) y acércate al altar del fondo. Consejo: Tapu Fini nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-789","label":"Registrar a Cosmog en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":789,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: De noche, cruza la fisura dimensional del Altar del Sol con Solgaleo y llega al Lago Corosol: un Cosmog se une a tu equipo. Consejo: Cosmog nivel 5, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-800","label":"Registrar a Necrozma en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":800,"auto":null,"how":"Cuándo: Después de ser campeón y de completar la quinta misión de los ultraentes (con Handsome y Anabel). Dónde: Colina Dequilate (Caldera Remota) (nivel 75). Cómo: Colina Dequilate, en la Caldera Remota (la zona más alejada, con Machamp Empuje). Consejo: Necrozma nivel 75. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-791","label":"Registrar a Solgaleo en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":791,"auto":null,"how":"Cuándo: Final de la historia, en el Altar del Sol/de la Luna (Poni). Dónde: Altar del Sol (nivel 55); Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: Tras la evolución de Nebulilla, el legendario te espera en el altar: hay que capturarlo para seguir. Consejo: Nivel 55. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Sello 1: Entrenador Pokémon oficial","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello que se consigue al empezar la aventura, cuando el profesor Kukui te inscribe como entrenador oficial y recibes la tarjeta. No hay que hacer nada.","phase":6,"order":600},{"id":"card-1","label":"Sello 2: Gran Prueba de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Melemele: tras superar la prueba del capitán, el kahuna de la isla te espera en Pueblo Lilii para la gran prueba. Ganarla da el sello y el Cristal Z de tipo Lucha.","phase":6,"order":601},{"id":"card-2","label":"Sello 3: Gran Prueba de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Akala: supera las tres pruebas de la isla (agua, fuego y planta) y vence a la kahuna en Ciudad Konikoni. Da el sello y el Cristal Z de tipo Roca.","phase":6,"order":602},{"id":"card-3","label":"Sello 4: Gran Prueba de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Ula-Ula: supera las pruebas de la isla y vence al kahuna, que está en Pueblo Po. Da el sello y el Cristal Z de tipo Siniestro.","phase":6,"order":603},{"id":"card-4","label":"Sello 5: Gran Prueba de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Poni: supera la última prueba y vence a la kahuna de la isla. Da el sello y el Cristal Z de tipo Tierra; con ella termina el recorrido insular.","phase":6,"order":604},{"id":"card-5","label":"Sello 6: Recorrido Insular completado y Liga","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Termina el recorrido insular y conviértete en campeón de la Liga de Alola.","phase":6,"order":605},{"id":"card-6","label":"Sello 7: Pokédex de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Melemele de la Pokédex de Alola. Casi todas salen durante la historia; algunas solo de noche, con el tiempo o por evolución. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":606},{"id":"card-7","label":"Sello 8: Pokédex de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Akala. Algunas solo aparecen tras la Liga o por evolución por intercambio. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":607},{"id":"card-8","label":"Sello 9: Pokédex de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Ula-Ula. Varias son exclusivas de una edición (intercambio) o aparecen tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Doble; lleva un equipo pensado para dobles.","phase":6,"order":612},{"id":"card-13","label":"Sello 14: Pokévisor Pro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Consigue la última mejora del Pokévisor (Pokévisor Pro) haciendo fotos en los puntos de foto hasta llegar al máximo de valoraciones.","phase":6,"order":613},{"id":"card-14","label":"Sello 15: 50 victorias seguidas múltiples en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: 50 victorias seguidas en el Árbol de Combate, Múltiple (con un compañero).","phase":6,"order":614},{"id":"event-0","label":"Magearna y otros singulares: QR, entregas/eventos y requisitos de edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Magearna: se recibía tras ser campeón escaneando su código QR oficial (evento) con el escáner QR. Con Pokekeep: Añade Magearna legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Marshadow y Zeraora: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 40). Cómo: Gladio te lo da en la planta 1 del Paraíso Æther. Consejo: Código Cero nivel 40, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Cuando tengas el Arca de Zygarde (te la dan en la Ruta 16) y suficientes células. Dónde: Ruta 16 (nivel 30); Ruta 16 (nivel 50). Cómo: En el laboratorio Æther de la Ruta 16 sintetiza Zygarde al 10 % (10 células) o al 50 % (50 células); con 100 (95 + 5 núcleos), forma completa. Consejo: Las células se cuentan en el objetivo «Reunir las células de Zygarde». Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":230},{"id":"zygarde-cells","label":"Reunir las 95 células de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que recibes el Arca de Zygarde en Akala; algunas células solo son accesibles más adelante (por ejemplo, con ciertas Pokémonturas). Dónde: las cuatro islas de Alola y el Paraíso Æther; el ensamblaje, en el laboratorio Æther de la Ruta 16 (Ula-Ula). Paso a paso: 1) En Ciudad Kantai, tras vencer a Dexio (Sol) o a Sina (Luna), los dos te entregan el Arca de Zygarde. 2) Recorre Alola buscando las células: son destellos verdes y solo se ven cuando ya tienes el Arca. Hay 95: 14 en Melemele, 18 en Akala, 30 en Ula-Ula, 28 en Poni y 5 en el Paraíso Æther. 3) Algunas solo salen de día y otras solo de noche: repasa cada zona en las dos franjas. 4) En la Ruta 16, con 10 células se crea Zygarde al 10 % y con 50, Zygarde al 50 %. 5) Con las 95 células y los 5 núcleos (100 piezas) se obtiene Zygarde con la habilidad Agrupamiento, que pasa a Zygarde completo en combate. Consejo: usa una lista por isla y marca cada célula; las de noche son las que más se olvidan. Fuente: WikiDex «Arca de Zygarde» y «Zygarde»; Serebii «Zygarde Cores & Cells».","phase":4,"order":400},{"id":"zygarde-cores","label":"Reunir los 5 núcleos de Zygarde","category":"Coleccionables","tier":1,"species":null,"auto":null,"how":"Cuándo: desde que tienes el Arca de Zygarde; el último núcleo está en Poni, ya en el tramo final de la aventura. Dónde: casas y edificios de las cuatro islas. Paso a paso: 1) Núcleo 1: en tu casa, en las Afueras de Hauoli (Melemele); enseña Velocidad Extrema. 2) Núcleo 2: en la casa del kahuna Kaudan, en Pueblo Lilii (Melemele); enseña Mil Flechas. 3) Núcleo 3: en la casa de Mayla, en Ciudad Konikoni (Akala); enseña Danza Dragón. 4) Núcleo 4: en la comisaría de Denio, en la Ruta 17 (Ula-Ula); enseña Mil Temblores. 5) Núcleo 5: en la casa de Hela, en el Antiguo Paso de Poni (Poni); enseña Núcleo Castigo. 6) Los núcleos se distinguen de las células por su destello rojo y cuentan como piezas: con las 95 células suman las 100. Consejo: los movimientos de los núcleos se enseñan a Zygarde con el Arca. Fuente: WikiDex «Arca de Zygarde»; Serebii «Zygarde Cores & Cells».","phase":4,"order":410}],"MOON":[{"id":"story","label":"Finalizar la historia principal y obtener su reconocimiento","category":"Historia","tier":0,"species":null,"auto":"gameClear","how":"Es el primer gran objetivo y el que desbloquea casi todo lo demás. Sigue la historia: consigue las medallas o pruebas en orden, vence al equipo villano y supera la Liga (o el final equivalente de la edición) hasta el Hall de la Fama o los créditos. Usa la pestaña «Dónde estás» con tu guardado: te dice la siguiente medalla y la zona a la que ir.","phase":0,"order":999},{"id":"postgame","label":"Completar capítulos posteriores a Liga, incluido Rainbow Rocket cuando corresponda","category":"Postgame","tier":0,"species":null,"auto":null,"how":"Tras ser campeón: defensa del título en la Liga, tapus en sus ruinas, Necrozma y Código Cero. En Sol/Luna, las misiones de los ultraentes con Handsome y Anabel; en Ultrasol/Ultraluna, el Episodio RR (Team Rainbow Rocket) en el Paraíso Æther y el Ultraviaje.","phase":2,"order":200},{"id":"battle0","label":"Superar el Árbol de Combate y derrotar entrenadores importantes","category":"Combates","tier":1,"species":null,"auto":null,"how":"Árbol de Combate (al final de la Pendiente de Poni, tras la Liga): combates Individual, Doble y Múltiple contra entrenadores y leyendas invitadas (Rojo, Azul...). Hay sellos por 50 victorias seguidas en cada modalidad.","phase":3,"order":300},{"id":"battle1","label":"Defender el título de campeón de Alola en la Liga del Monte Lanakila","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de convertirte en el primer campeón de Alola (tras vencer al Alto Mando y al Profesor Kukui). Dónde: Liga Pokémon del Monte Lanakila (Ula-Ula). Paso a paso: 1) Vuelve a la Liga y vence otra vez a los cuatro miembros del Alto Mando, en el orden que quieras. 2) Al llegar a la sala del campeón aparece un retador que intenta quitarte el título; el primero es siempre Tilo. 3) En las siguientes visitas el retador sale de forma aleatoria entre Tilo, el Profesor Kukui, Gladio, Olano, Chris, Francine, Lario, Hela y José; Fabio solo aparece el primer día de cada mes. 4) Gana el combate para conservar el título: cada victoria suma una defensa. Si pierdes no pasa nada, pero esa visita no cuenta. 5) Repite el ciclo Alto Mando + retador tantas veces como quieras. Consejo: los retadores llevan Pokémon de nivel 63; lleva un equipo de ese nivel o superior y objetos de curación de sobra. Fuente: WikiDex «Liga Pokémon (Alola)».","phase":3,"order":310},{"id":"items0","label":"Cristales Z, Zygarde o recursos únicos según edición","category":"Objetos clave","tier":1,"species":null,"auto":null,"how":"Cristales Z: uno por cada prueba y gran prueba del recorrido insular (los de tipo, en orden de la historia) y los exclusivos de Pokémon concretos por la posliga. Arca de Zygarde: Ruta 16 (Akala).","phase":0,"order":500},{"id":"pokedex","label":"Completar Pokédex regional de Alola","category":"Pokédex","tier":1,"species":null,"auto":null,"how":"Completa la Pokédex de Alola (las cuatro islas). Cada vez que completes la sección de una isla, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala) para que selle tu pasaporte; con la de Alola completa (sin singulares) te da el diploma y el Amuleto Iris. Con Pokekeep: Las especies exclusivas de la otra edición, añádelas legales desde la Librería si no puedes intercambiarlas.","phase":5,"order":500},{"id":"shiny-charm","label":"Amuleto Iris: Pokédex de Alola completa (director del juego, oficinas de Game Freak de Ciudad Kantai)","category":"Tarjeta / reconocimiento","tier":1,"species":null,"auto":null,"how":"Cuándo: en cualquier momento, aunque en la práctica tras la Liga, cuando ya puedes capturar casi todo. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Registra como capturados los Pokémon de cada Pokédex insular (Melemele, Akala, Ula-Ula y Poni) y de la Pokédex de Alola (302 entradas). 2) No hacen falta los singulares (Magearna y Marshadow). 3) Visita las oficinas de GAME FREAK y habla con el director del juego: sella tu pasaporte por cada Pokédex insular completa. 4) Al completar la de Alola vuelve a sellarlo y te entrega el Amuleto Iris, que aumenta la probabilidad de encontrar Pokémon variocolor. Consejo: los Pokémon exclusivos de la otra edición se consiguen por intercambio. Fuente: WikiDex «Amuleto Iris», «Game Freak» y «Lista de Pokémon según la Pokédex de Alola».","phase":6,"order":616},{"id":"final-boss","label":"Vencer a Morimoto en las oficinas de Game Freak de Ciudad Kantai: Amuleto Oval","category":"Combates","tier":1,"species":null,"auto":null,"how":"Cuándo: después de superar la Liga Pokémon. Dónde: oficinas de GAME FREAK, en el segundo piso de un edificio de Ciudad Kantai (Akala). Paso a paso: 1) Entra en las oficinas de GAME FREAK y busca a Morimoto; en la versión española de Sol y Luna aparece con el nombre de Tirso por un error de traducción. 2) Háblale y acepta su combate; se le puede retar una vez al día. 3) Gánale: la primera victoria te da el Amuleto Oval, que aumenta la probabilidad de que aparezcan huevos en la guardería. 4) En días posteriores puedes repetir el combate. Consejo: lleva seis Pokémon de nivel 62 (Kangaskhan, Jolteon, Flareon, Vaporeon, Machamp y Dragonite); prepara un equipo de ese nivel o superior y objetos de curación. Fuente: WikiDex «Amuleto oval», «Shigeki Morimoto» y «Game Freak».","phase":3,"order":390},{"id":"pokemon-785","label":"Registrar a Tapu Koko en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":785,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Guerra (nivel 60). Cómo: Entra en las Ruinas de la Guerra (Melemele) y acércate al altar del fondo. Consejo: Tapu Koko nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":210},{"id":"pokemon-786","label":"Registrar a Tapu Lele en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":786,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Vida (nivel 60). Cómo: Entra en las Ruinas de la Vida (Akala) y acércate al altar del fondo. Consejo: Tapu Lele nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":211},{"id":"pokemon-787","label":"Registrar a Tapu Bulu en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":787,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas de la Cosecha (nivel 60). Cómo: Entra en las Ruinas de la Cosecha (Ula-Ula) y acércate al altar del fondo. Consejo: Tapu Bulu nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":212},{"id":"pokemon-788","label":"Registrar a Tapu Fini en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":788,"auto":null,"how":"Cuándo: Después de ser campeón de la Liga de Alola. Dónde: Ruinas del Tránsito (nivel 60). Cómo: Entra en las Ruinas del Tránsito (Poni) y acércate al altar del fondo. Consejo: Tapu Fini nivel 60. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":213},{"id":"pokemon-789","label":"Registrar a Cosmog en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":789,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: De noche, cruza la fisura dimensional del Altar del la Luna con Lunala y llega al Lago Coroluna: un Cosmog se une a tu equipo. Consejo: Cosmog nivel 5, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":220},{"id":"pokemon-800","label":"Registrar a Necrozma en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":800,"auto":null,"how":"Cuándo: Después de ser campeón y de completar la quinta misión de los ultraentes (con Handsome y Anabel). Dónde: Colina Dequilate (Caldera Remota) (nivel 75). Cómo: Colina Dequilate, en la Caldera Remota (la zona más alejada, con Machamp Empuje). Consejo: Necrozma nivel 75. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":240},{"id":"pokemon-792","label":"Registrar a Lunala en la Pokédex de esta partida","category":"Legendarios","tier":1,"species":792,"auto":null,"how":"Cuándo: Final de la historia, en el Altar del Sol/de la Luna (Poni). Dónde: Altar de la Luna (nivel 55); Lago Corosol (nivel 5); Lago Coroluna (nivel 5). Cómo: Tras la evolución de Nebulilla, el legendario te espera en el altar: hay que capturarlo para seguir. Consejo: Nivel 55. Se acredita con el registro en la Pokédex de la partida.","phase":0,"order":190},{"id":"card-0","label":"Sello 1: Entrenador Pokémon oficial","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello que se consigue al empezar la aventura, cuando el profesor Kukui te inscribe como entrenador oficial y recibes la tarjeta. No hay que hacer nada.","phase":6,"order":600},{"id":"card-1","label":"Sello 2: Gran Prueba de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Melemele: tras superar la prueba del capitán, el kahuna de la isla te espera en Pueblo Lilii para la gran prueba. Ganarla da el sello y el Cristal Z de tipo Lucha.","phase":6,"order":601},{"id":"card-2","label":"Sello 3: Gran Prueba de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Akala: supera las tres pruebas de la isla (agua, fuego y planta) y vence a la kahuna en Ciudad Konikoni. Da el sello y el Cristal Z de tipo Roca.","phase":6,"order":602},{"id":"card-3","label":"Sello 4: Gran Prueba de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Ula-Ula: supera las pruebas de la isla y vence al kahuna, que está en Pueblo Po. Da el sello y el Cristal Z de tipo Siniestro.","phase":6,"order":603},{"id":"card-4","label":"Sello 5: Gran Prueba de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Durante la historia, en Poni: supera la última prueba y vence a la kahuna de la isla. Da el sello y el Cristal Z de tipo Tierra; con ella termina el recorrido insular.","phase":6,"order":604},{"id":"card-5","label":"Sello 6: Recorrido Insular completado y Liga","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Termina el recorrido insular y conviértete en campeón de la Liga de Alola.","phase":6,"order":605},{"id":"card-6","label":"Sello 7: Pokédex de Melemele","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Melemele de la Pokédex de Alola. Casi todas salen durante la historia; algunas solo de noche, con el tiempo o por evolución. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":606},{"id":"card-7","label":"Sello 8: Pokédex de Akala","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Akala. Algunas solo aparecen tras la Liga o por evolución por intercambio. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":607},{"id":"card-8","label":"Sello 9: Pokédex de Ula-Ula","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Ula-Ula. Varias son exclusivas de una edición (intercambio) o aparecen tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":608},{"id":"card-9","label":"Sello 10: Pokédex de Poni","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Captura todas las especies de la sección de Poni. Muchas están en el Gran Cañón de Poni y en zonas que se abren tras la Liga. Después, enséñasela al director del juego en las oficinas de Game Freak de Ciudad Kantai (Akala): él sella el pasaporte.","phase":6,"order":609},{"id":"card-10","label":"Sello 11: Pokédex de Alola","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Completa la Pokédex de Alola entera (las cuatro islas, sin contar a los singulares de evento). El sello te lo pone el director del juego en las oficinas de Game Freak de Ciudad Kantai, junto con el diploma y el Amuleto Iris.","phase":6,"order":610},{"id":"card-11","label":"Sello 12: 50 victorias seguidas individuales en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Individual (a partir de la 20.ª entran los rivales fuertes).","phase":6,"order":611},{"id":"card-12","label":"Sello 13: 50 victorias seguidas dobles en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Tras la Liga, en el Árbol de Combate (al final de la Pendiente de Poni): gana 50 combates seguidos en la modalidad Doble; lleva un equipo pensado para dobles.","phase":6,"order":612},{"id":"card-13","label":"Sello 14: Pokévisor Pro","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: Consigue la última mejora del Pokévisor (Pokévisor Pro) haciendo fotos en los puntos de foto hasta llegar al máximo de valoraciones.","phase":6,"order":613},{"id":"card-14","label":"Sello 15: 50 victorias seguidas múltiples en Árbol de Combate","category":"Tarjeta / reconocimiento","tier":0,"species":null,"auto":null,"how":"Sello de la tarjeta: 50 victorias seguidas en el Árbol de Combate, Múltiple (con un compañero).","phase":6,"order":614},{"id":"event-0","label":"Magearna y otros singulares: QR, entregas/eventos y requisitos de edición","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Magearna: se recibía tras ser campeón escaneando su código QR oficial (evento) con el escáner QR. Con Pokekeep: Añade Magearna legal desde la Librería.","phase":7,"order":700},{"id":"event-1","label":"Marshadow y Zeraora: distribuciones históricas","category":"Evento histórico","tier":2,"species":null,"auto":null,"how":"Marshadow y Zeraora solo llegaron por distribuciones. Con Pokekeep: Añádelos legales desde la Librería.","phase":7,"order":710},{"id":"pokemon-772","label":"Registrar a Código Cero en la Pokédex de esta partida (regalo del postgame)","category":"Legendarios","tier":1,"species":772,"auto":null,"how":"Cuándo: Después de ser campeón. Dónde: Paraíso Æther (nivel 40). Cómo: Gladio te lo da en la planta 1 del Paraíso Æther. Consejo: Código Cero nivel 40, regalo. Se acredita con el registro en la Pokédex de la partida.","phase":2,"order":215},{"id":"pokemon-718","label":"Registrar a Zygarde en la Pokédex de esta partida (reuniendo células y núcleos)","category":"Legendarios","tier":1,"species":718,"auto":null,"how":"Cuándo: Cuando tengas el Arca de Zygarde (te la dan en la Ruta 16) y suficientes células. Dónde: Ruta 16 (nivel 30); Ruta 16 (nivel 50). Cómo: En el laboratorio Æther de la Ruta 16 sintetiza Zygarde al 10 %
