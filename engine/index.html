<!doctype html><html lang="es"><head><meta charset="utf-8"><base href="./"><title>Lectura local de guardados</title></head><body>
<script src="_framework/blazor.webassembly.w3qd1tpl0e.js" autostart="false"></script>
<script>
'use strict';
let notifyAssembly;
const assemblyReady=new Promise(resolve=>{notifyAssembly=resolve;});
window.pokemonLocalAssemblyReady=()=>notifyAssembly();
const ready=Promise.all([Blazor.start({loadBootResource:(type,name,uri)=>name==='dotnet.js'?'_framework/dotnet.u6khp0mple.js':uri}),assemblyReady]);
let busy=false;
addEventListener('message',async event=>{
 if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='pokemon-local-analyze'||typeof event.data.id!=='string')return;
 const {id,bytes}=event.data;
 if(busy||!(bytes instanceof ArrayBuffer)||bytes.byteLength===0||bytes.byteLength>8*1024*1024){parent.postMessage({type:'pokemon-local-result',id,ok:false,error:'No se puede leer este archivo en este momento.'},location.origin);return;}
 busy=true;
 // Si el motor no arranca, se avisa con startup:true para que la página recargue el marco y lo reintente.
 try{await Promise.race([ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('arranque')),180000))]);}catch{parent.postMessage({type:'pokemon-local-result',id,ok:false,startup:true,error:'No se ha podido iniciar el lector local. Comprueba la conexión en su primer uso.'},location.origin);busy=false;return;}
 try{
  const data=new Uint8Array(bytes);let binary='';
  for(let offset=0;offset<data.length;offset+=0x8000)binary+=String.fromCharCode(...data.subarray(offset,offset+0x8000));
  const result=JSON.parse(await DotNet.invokeMethodAsync('Pokemon.LocalReader','Analyze',btoa(binary)));
  parent.postMessage({type:'pokemon-local-result',id,...result},location.origin);
 }catch{parent.postMessage({type:'pokemon-local-result',id,ok:false,error:'No se ha podido interpretar el guardado. No se ha cambiado el progreso.'},location.origin);}
 finally{busy=false;}
});
window.engineReady=ready;
</script></body></html>
